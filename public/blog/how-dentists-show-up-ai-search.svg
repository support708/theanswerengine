<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgHDSA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d3b1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="panelHDSA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.06);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.02);stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barFillHDSA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF6A00;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="scoreRingHDSA" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc5500;stop-opacity:0.6" />
    </linearGradient>
    <filter id="glowHDSA" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blurHDSA"/>
      <feMerge><feMergeNode in="blurHDSA"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlowHDSA" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="bigBlurHDSA"/>
      <feMerge><feMergeNode in="bigBlurHDSA"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlowHDSA" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="tgHDSA"/>
      <feMerge><feMergeNode in="tgHDSA"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgHDSA)"/>

  <!-- Grid lines at 0.05 opacity -->
  <g opacity="0.05">
    <line x1="0" y1="90" x2="1200" y2="90" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="0" y1="450" x2="1200" y2="450" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#FF6A00" stroke-width="0.5"/>
  </g>

  <!-- Corner tint glow (green medical) -->
  <circle cx="0" cy="0" r="300" fill="#0d3b1a" opacity="0.3" filter="url(#bigGlowHDSA)"/>

  <!-- LEFT SIDE: Category + Title + Subtitle -->
  <!-- Category pill -->
  <rect x="40" y="55" width="155" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.35)" stroke-width="1"/>
  <text x="117" y="77" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#FF6A00" text-anchor="middle" letter-spacing="1.5">INDUSTRY GUIDES</text>

  <!-- Title: 3 lines, last line orange with glow -->
  <text x="50" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">How Dentists Can</text>
  <text x="50" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">Show Up on</text>
  <text x="50" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#FF6A00" filter="url(#textGlowHDSA)">AI Search</text>

  <!-- Subtitle -->
  <text x="50" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="rgba(255,255,255,0.45)">AI platforms now drive patient discovery.</text>
  <text x="50" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="rgba(255,255,255,0.35)">Is your practice showing up?</text>

  <!-- Decorative tooth silhouette -->
  <g opacity="0.04" transform="translate(140, 430)">
    <path d="M60 0 C80 0 95 15 95 35 C95 55 85 80 80 100 C75 115 70 125 65 125 C60 125 58 110 55 100 C53 93 50 93 48 100 C45 110 43 125 38 125 C33 125 28 115 23 100 C18 80 8 55 8 35 C8 15 23 0 43 0 Z" stroke="white" stroke-width="2.5" fill="none"/>
  </g>

  <!-- RIGHT PANEL: Scoring Dashboard -->
  <g transform="translate(660,45)">
    <!-- Panel background -->
    <rect x="0" y="0" width="470" height="470" rx="16" fill="url(#panelHDSA)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <!-- Panel header -->
    <rect x="0" y="0" width="470" height="44" rx="16" fill="rgba(255,255,255,0.04)"/>
    <rect x="0" y="28" width="470" height="16" fill="rgba(255,255,255,0.04)"/>
    <circle cx="20" cy="22" r="5" fill="rgba(255,80,80,0.5)"/>
    <circle cx="38" cy="22" r="5" fill="rgba(255,200,50,0.5)"/>
    <circle cx="56" cy="22" r="5" fill="rgba(80,200,80,0.5)"/>
    <text x="235" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)" text-anchor="middle" letter-spacing="1">DENTAL PRACTICE AI READINESS</text>

    <!-- Central score circle -->
    <circle cx="115" cy="115" r="50" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="6" transform="translate(0,50)"/>
    <circle cx="115" cy="115" r="50" fill="none" stroke="url(#scoreRingHDSA)" stroke-width="6" stroke-dasharray="200 314" stroke-linecap="round" transform="translate(0,50) rotate(-90 115 115)"/>
    <text x="115" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="0.5">AI READY SCORE</text>
    <text x="115" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="white" text-anchor="middle">64</text>
    <text x="115" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="0.5">OUT OF 100</text>
    <text x="115" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#FF6A00" text-anchor="middle">NEEDS WORK</text>

    <!-- 5 Signal bars -->
    <g transform="translate(240, 62)">
      <!-- Reviews -->
      <text x="0" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.55)">Reviews</text>
      <rect x="0" y="18" width="190" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
      <rect x="0" y="18" width="133" height="6" rx="3" fill="url(#barFillHDSA)"/>
      <text x="196" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#FF6A00">70%</text>

      <!-- Schema -->
      <text x="0" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.55)">Schema</text>
      <rect x="0" y="52" width="190" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
      <rect x="0" y="52" width="57" height="6" rx="3" fill="url(#barFillHDSA)"/>
      <text x="196" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#FF6A00">30%</text>

      <!-- NAP -->
      <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.55)">NAP Consistency</text>
      <rect x="0" y="86" width="190" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
      <rect x="0" y="86" width="114" height="6" rx="3" fill="url(#barFillHDSA)"/>
      <text x="196" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#FF6A00">60%</text>

      <!-- Content -->
      <text x="0" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.55)">Content Depth</text>
      <rect x="0" y="120" width="190" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
      <rect x="0" y="120" width="95" height="6" rx="3" fill="url(#barFillHDSA)"/>
      <text x="196" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#FF6A00">50%</text>

      <!-- Authority -->
      <text x="0" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.55)">Authority</text>
      <rect x="0" y="154" width="190" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
      <rect x="0" y="154" width="152" height="6" rx="3" fill="url(#barFillHDSA)"/>
      <text x="196" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#FF6A00">80%</text>
    </g>

    <!-- Divider -->
    <line x1="20" y1="240" x2="450" y2="240" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Checklist -->
    <g transform="translate(28, 255)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.35)" letter-spacing="1" font-weight="600">OPTIMIZATION CHECKLIST</text>

      <!-- Item 1: Check -->
      <rect x="0" y="14" width="16" height="16" rx="3" fill="rgba(255,106,0,0.2)" stroke="#FF6A00" stroke-width="0.8"/>
      <text x="8" y="27" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle">&#x2713;</text>
      <text x="24" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">DDS/DMD credentials on all pages</text>

      <!-- Item 2: Check -->
      <rect x="0" y="38" width="16" height="16" rx="3" fill="rgba(255,106,0,0.2)" stroke="#FF6A00" stroke-width="0.8"/>
      <text x="8" y="51" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle">&#x2713;</text>
      <text x="24" y="51" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Healthgrades + Zocdoc profiles active</text>

      <!-- Item 3: Check -->
      <rect x="0" y="62" width="16" height="16" rx="3" fill="rgba(255,106,0,0.2)" stroke="#FF6A00" stroke-width="0.8"/>
      <text x="8" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle">&#x2713;</text>
      <text x="24" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Plain-text patient testimonials on site</text>

      <!-- Item 4: Empty -->
      <rect x="0" y="86" width="16" height="16" rx="3" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
      <text x="8" y="99" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.2)" text-anchor="middle">&#x2717;</text>
      <text x="24" y="99" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)">Dedicated page per dental procedure</text>

      <!-- Item 5: Empty -->
      <rect x="0" y="110" width="16" height="16" rx="3" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
      <text x="8" y="123" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.2)" text-anchor="middle">&#x2717;</text>
      <text x="24" y="123" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)">Dentist + FAQPage schema markup</text>

      <!-- Item 6: Empty -->
      <rect x="0" y="134" width="16" height="16" rx="3" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
      <text x="8" y="147" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.2)" text-anchor="middle">&#x2717;</text>
      <text x="24" y="147" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)">Server-side rendering (no JS gates)</text>

      <!-- Item 7: Empty -->
      <rect x="0" y="158" width="16" height="16" rx="3" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
      <text x="8" y="171" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.2)" text-anchor="middle">&#x2717;</text>
      <text x="24" y="171" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)">Insurance plans as structured content</text>
    </g>

    <!-- Insight box with orange border -->
    <g transform="translate(255, 255)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.35)" letter-spacing="1" font-weight="600">CRAWLABILITY</text>

      <!-- Mini stat boxes -->
      <rect x="0" y="14" width="90" height="50" rx="6" fill="rgba(255,106,0,0.06)" stroke="rgba(255,106,0,0.15)" stroke-width="0.8"/>
      <text x="45" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#FF6A00" text-anchor="middle">87%</text>
      <text x="45" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="rgba(255,255,255,0.35)" text-anchor="middle">JS Invisible</text>

      <rect x="100" y="14" width="90" height="50" rx="6" fill="rgba(255,106,0,0.06)" stroke="rgba(255,106,0,0.15)" stroke-width="0.8"/>
      <text x="145" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#FF6A00" text-anchor="middle">3.2x</text>
      <text x="145" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="rgba(255,255,255,0.35)" text-anchor="middle">AI Conv. Rate</text>

      <!-- Insight box -->
      <rect x="0" y="78" width="190" height="96" rx="8" fill="rgba(255,106,0,0.04)" stroke="rgba(255,106,0,0.25)" stroke-width="1"/>
      <text x="10" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#FF6A00" font-weight="600" letter-spacing="0.5">INSIGHT</text>
      <text x="10" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Most dental websites use</text>
      <text x="10" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">JS rendering that blocks</text>
      <text x="10" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">AI crawlers from reading</text>
      <text x="10" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">practice information.</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="600" y="575" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="rgba(255,255,255,0.2)" text-anchor="middle" letter-spacing="3" font-weight="600">THE ANSWER ENGINE</text>

  <!-- AE circle bottom-right -->
  <circle cx="1150" cy="585" r="22" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="1150" y="591" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FF6A00" text-anchor="middle">AE</text>
</svg>
