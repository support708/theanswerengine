<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b2e0d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d3b3b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow13"><feGaussianBlur stdDeviation="6" result="blur13"/><feMerge><feMergeNode in="blur13"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoft13"><feGaussianBlur stdDeviation="12" result="blur13s"/><feMerge><feMergeNode in="blur13s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg13)"/>
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <!-- Split comparison table -->
  <g transform="translate(660, 45)">
    <rect x="0" y="0" width="470" height="475" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <!-- Headers -->
    <rect x="140" y="8" width="150" height="30" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="215" y="28" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-weight="700">SEO</text>
    <rect x="300" y="8" width="155" height="30" rx="6" fill="rgba(255,106,0,0.15)" stroke="#FF6A00" stroke-width="1.5" filter="url(#glow13)"/>
    <text x="377" y="28" font-family="system-ui, sans-serif" font-size="12" fill="#FF6A00" text-anchor="middle" font-weight="700">AEO</text>
    <!-- Rows -->
    <text x="20" y="62" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">GOAL</text>
    <text x="215" y="62" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">Rank on page 1</text>
    <text x="377" y="62" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" text-anchor="middle">Get cited by AI</text>
    <line x1="20" y1="72" x2="450" y2="72" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <text x="20" y="92" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">TRAFFIC</text>
    <text x="215" y="92" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">Click-through</text>
    <text x="377" y="92" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" text-anchor="middle">Direct answer</text>
    <line x1="20" y1="102" x2="450" y2="102" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <text x="20" y="122" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">CONTENT</text>
    <text x="215" y="122" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">Keyword-driven</text>
    <text x="377" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" text-anchor="middle">Authority-driven</text>
    <line x1="20" y1="132" x2="450" y2="132" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <text x="20" y="152" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">STRUCTURE</text>
    <text x="215" y="152" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">Meta tags, H1-H6</text>
    <text x="377" y="152" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" text-anchor="middle">Schema + JSON-LD</text>
    <line x1="20" y1="162" x2="450" y2="162" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <text x="20" y="182" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">TRUST</text>
    <text x="215" y="182" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">Backlinks</text>
    <text x="377" y="182" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" text-anchor="middle">Citations + NAP</text>
    <line x1="20" y1="192" x2="450" y2="192" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <text x="20" y="212" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">SPEED</text>
    <text x="215" y="212" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">Important</text>
    <text x="377" y="212" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" text-anchor="middle">Critical (&lt;5s)</text>
    <line x1="20" y1="222" x2="450" y2="222" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <text x="20" y="242" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">RESULTS</text>
    <text x="215" y="242" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">3-6 months</text>
    <text x="377" y="242" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" text-anchor="middle">2-4 months</text>
    <line x1="20" y1="252" x2="450" y2="252" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <!-- Trend comparison -->
    <text x="20" y="280" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">SEARCH VOLUME TREND</text>
    <!-- SEO trend (declining) -->
    <text x="20" y="305" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">SEO</text>
    <line x1="60" y1="300" x2="120" y2="305" stroke="rgba(255,80,80,0.6)" stroke-width="2.5"/>
    <line x1="120" y1="305" x2="180" y2="315" stroke="rgba(255,80,80,0.6)" stroke-width="2.5"/>
    <line x1="180" y1="315" x2="240" y2="330" stroke="rgba(255,80,80,0.6)" stroke-width="2.5"/>
    <text x="250" y="335" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.8)">&#x2193; -23%</text>
    <!-- AEO trend (rising) -->
    <text x="20" y="355" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">AEO</text>
    <line x1="60" y1="360" x2="120" y2="350" stroke="rgba(100,220,100,0.7)" stroke-width="2.5"/>
    <line x1="120" y1="350" x2="180" y2="335" stroke="rgba(100,220,100,0.7)" stroke-width="2.5"/>
    <line x1="180" y1="335" x2="240" y2="310" stroke="rgba(100,220,100,0.7)" stroke-width="2.5"/>
    <text x="250" y="315" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.8)">&#x2191; +340%</text>
    <!-- Verdict -->
    <rect x="20" y="390" width="430" height="70" rx="8" fill="rgba(255,106,0,0.08)" stroke="#FF6A00" stroke-width="1.5" stroke-opacity="0.5" filter="url(#glow13)"/>
    <text x="235" y="415" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-weight="600">THE VERDICT</text>
    <text x="235" y="435" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle" font-weight="600">SEO is the foundation. AEO is the future.</text>
    <text x="235" y="450" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.45)" text-anchor="middle">Smart businesses invest in both, but prioritize AEO now.</text>
  </g>
  <circle cx="100" cy="130" r="60" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <rect x="40" y="40" width="180" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="130" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">Strategy Comparison</text>
  <text x="80" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">AEO vs SEO</text>
  <text x="80" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glow13)">Compared</text>
  <text x="80" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">What Changed and What Didn't</text>
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>