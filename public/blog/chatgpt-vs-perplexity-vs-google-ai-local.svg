<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgCVPG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d3b1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0d3b;stop-opacity:1" />
    </linearGradient>
    <filter id="glowCVPG"><feGaussianBlur stdDeviation="6" result="blurCVPG"/><feMerge><feMergeNode in="blurCVPG"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="barChatGPTCVPG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10A37F;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#10A37F;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="barPerplexityCVPG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#20B2AA;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#20B2AA;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="barGoogleCVPG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4285F4;stop-opacity:0.5" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgCVPG)"/>
  <!-- Grid lines -->
  <line x1="0" y1="90" x2="1200" y2="90" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="180" x2="1200" y2="180" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="270" x2="1200" y2="270" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="360" x2="1200" y2="360" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="540" x2="1200" y2="540" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <!-- Decorative circle -->
  <circle cx="120" cy="150" r="70" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <!-- Category pill -->
  <rect x="40" y="40" width="190" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="135" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">COMPARISONS</text>
  <!-- Title -->
  <text x="60" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white">ChatGPT vs Perplexity</text>
  <text x="60" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white">vs Google AI</text>
  <text x="60" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#FF6A00" filter="url(#glowCVPG)">for Local Business</text>
  <!-- Subtitle -->
  <text x="60" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="rgba(255,255,255,0.45)">Which AI Platform Sends You the Most Customers?</text>
  <!-- Right panel: Comparison Table -->
  <g transform="translate(660, 45)">
    <rect x="0" y="0" width="470" height="470" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="235" y="28" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600" letter-spacing="1">AI PLATFORM COMPARISON</text>
    <!-- Column headers -->
    <rect x="15" y="42" width="100" height="32" rx="6" fill="rgba(255,255,255,0.04)"/>
    <text x="65" y="63" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600">FACTOR</text>
    <rect x="123" y="42" width="108" height="32" rx="6" fill="rgba(16,163,127,0.1)" stroke="rgba(16,163,127,0.4)" stroke-width="1"/>
    <text x="177" y="63" font-family="system-ui, sans-serif" font-size="9" fill="rgba(16,163,127,0.95)" text-anchor="middle" font-weight="600">CHATGPT</text>
    <rect x="239" y="42" width="108" height="32" rx="6" fill="rgba(32,178,170,0.1)" stroke="rgba(32,178,170,0.4)" stroke-width="1"/>
    <text x="293" y="63" font-family="system-ui, sans-serif" font-size="9" fill="rgba(32,178,170,0.95)" text-anchor="middle" font-weight="600">PERPLEXITY</text>
    <rect x="355" y="42" width="100" height="32" rx="6" fill="rgba(66,133,244,0.1)" stroke="rgba(66,133,244,0.4)" stroke-width="1"/>
    <text x="405" y="63" font-family="system-ui, sans-serif" font-size="9" fill="rgba(66,133,244,0.95)" text-anchor="middle" font-weight="600">GOOGLE AI</text>
    <!-- Row 1: Users -->
    <text x="65" y="102" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)" text-anchor="middle">Monthly Users</text>
    <text x="177" y="102" font-family="system-ui, sans-serif" font-size="10" fill="rgba(16,163,127,0.9)" text-anchor="middle" font-weight="700">800M+</text>
    <text x="293" y="102" font-family="system-ui, sans-serif" font-size="10" fill="rgba(32,178,170,0.9)" text-anchor="middle" font-weight="700">45M</text>
    <text x="405" y="102" font-family="system-ui, sans-serif" font-size="10" fill="rgba(66,133,244,0.9)" text-anchor="middle" font-weight="700">2B+</text>
    <line x1="15" y1="112" x2="455" y2="112" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
    <!-- Row 2: Data Source -->
    <text x="65" y="135" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)" text-anchor="middle">Data Source</text>
    <text x="177" y="135" font-family="system-ui, sans-serif" font-size="9" fill="rgba(16,163,127,0.85)" text-anchor="middle" font-weight="600">Bing + Web</text>
    <text x="293" y="135" font-family="system-ui, sans-serif" font-size="9" fill="rgba(32,178,170,0.85)" text-anchor="middle" font-weight="600">Live Index</text>
    <text x="405" y="135" font-family="system-ui, sans-serif" font-size="9" fill="rgba(66,133,244,0.85)" text-anchor="middle" font-weight="600">Google Index</text>
    <line x1="15" y1="145" x2="455" y2="145" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
    <!-- Row 3: Citations -->
    <text x="65" y="168" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)" text-anchor="middle">Source Citations</text>
    <text x="177" y="168" font-family="system-ui, sans-serif" font-size="10" fill="rgba(16,163,127,0.9)" text-anchor="middle" font-weight="700">Sometimes</text>
    <text x="293" y="168" font-family="system-ui, sans-serif" font-size="10" fill="rgba(32,178,170,0.9)" text-anchor="middle" font-weight="700">Always</text>
    <text x="405" y="168" font-family="system-ui, sans-serif" font-size="10" fill="rgba(66,133,244,0.9)" text-anchor="middle" font-weight="700">Inline</text>
    <line x1="15" y1="178" x2="455" y2="178" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
    <!-- Row 4: Local Strength -->
    <text x="65" y="201" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)" text-anchor="middle">Local Strength</text>
    <text x="177" y="201" font-family="system-ui, sans-serif" font-size="10" fill="rgba(16,163,127,0.9)" text-anchor="middle" font-weight="700">Medium</text>
    <text x="293" y="201" font-family="system-ui, sans-serif" font-size="10" fill="rgba(32,178,170,0.9)" text-anchor="middle" font-weight="700">Growing</text>
    <text x="405" y="201" font-family="system-ui, sans-serif" font-size="10" fill="rgba(66,133,244,0.9)" text-anchor="middle" font-weight="700">Strongest</text>
    <line x1="15" y1="211" x2="455" y2="211" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
    <!-- Row 5: Cost -->
    <text x="65" y="234" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)" text-anchor="middle">Cost</text>
    <text x="177" y="234" font-family="system-ui, sans-serif" font-size="10" fill="rgba(16,163,127,0.9)" text-anchor="middle" font-weight="700">Free / $20</text>
    <text x="293" y="234" font-family="system-ui, sans-serif" font-size="10" fill="rgba(32,178,170,0.9)" text-anchor="middle" font-weight="700">Free / $20</text>
    <text x="405" y="234" font-family="system-ui, sans-serif" font-size="10" fill="rgba(66,133,244,0.9)" text-anchor="middle" font-weight="700">Free</text>
    <line x1="15" y1="248" x2="455" y2="248" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <!-- Conversion bar comparison -->
    <text x="15" y="272" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">CONVERSION RATE BY PLATFORM</text>
    <text x="15" y="298" font-family="system-ui, sans-serif" font-size="9" fill="rgba(16,163,127,0.9)">ChatGPT</text>
    <rect x="90" y="287" width="350" height="15" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="90" y="287" width="280" height="15" rx="3" fill="url(#barChatGPTCVPG)"/>
    <text x="380" y="299" font-family="system-ui, sans-serif" font-size="9" fill="rgba(16,163,127,0.95)" font-weight="700">15.9%</text>
    <text x="15" y="322" font-family="system-ui, sans-serif" font-size="9" fill="rgba(32,178,170,0.9)">Perplexity</text>
    <rect x="90" y="311" width="350" height="15" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="90" y="311" width="185" height="15" rx="3" fill="url(#barPerplexityCVPG)"/>
    <text x="285" y="323" font-family="system-ui, sans-serif" font-size="9" fill="rgba(32,178,170,0.95)" font-weight="700">10.5%</text>
    <text x="15" y="346" font-family="system-ui, sans-serif" font-size="9" fill="rgba(66,133,244,0.9)">Google AI</text>
    <rect x="90" y="335" width="350" height="15" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="90" y="335" width="52" height="15" rx="3" fill="url(#barGoogleCVPG)"/>
    <text x="152" y="347" font-family="system-ui, sans-serif" font-size="9" fill="rgba(66,133,244,0.95)" font-weight="700">3.0%</text>
    <text x="15" y="370" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.35)">Google Organic</text>
    <rect x="90" y="359" width="350" height="15" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="90" y="359" width="31" height="15" rx="3" fill="rgba(255,255,255,0.2)"/>
    <text x="131" y="371" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)" font-weight="700">1.8%</text>
    <!-- Verdict row -->
    <rect x="15" y="392" width="440" height="62" rx="8" fill="rgba(255,106,0,0.08)" stroke="#FF6A00" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="235" y="416" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-weight="600">VERDICT FOR LOCAL BUSINESSES</text>
    <text x="235" y="440" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle" font-weight="700">You need all three. Each drives different customers.</text>
  </g>
  <!-- Footer -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <!-- AE circle -->
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="596" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="rgba(255,255,255,0.4)" text-anchor="middle">AE</text>
</svg>