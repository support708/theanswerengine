<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="60%" stop-color="#131313"/>
      <stop offset="100%" stop-color="#1a0d05"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FF6A00" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FF6A00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orangeLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF6A00" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF6A00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF6A00" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FF6A00" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="880" cy="190" r="340" fill="url(#glow)"/>

  <!-- Grid -->
  <g opacity="0.16" stroke="#FF6A00" stroke-width="1" fill="none">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>

  <!-- Five client workspace nodes (left column) feeding one portfolio roll-up -->
  <g stroke="#FF6A00" stroke-width="1.5" fill="url(#panelGrad)" opacity="0.85">
    <rect x="150" y="120" width="120" height="48" rx="2"/>
    <rect x="150" y="180" width="120" height="48" rx="2"/>
    <rect x="150" y="240" width="120" height="48" rx="2"/>
    <rect x="150" y="300" width="120" height="48" rx="2"/>
    <rect x="150" y="360" width="120" height="48" rx="2"/>
  </g>
  <g stroke="#FF6A00" stroke-width="1" opacity="0.4" fill="none">
    <line x1="166" y1="138" x2="254" y2="138"/>
    <line x1="166" y1="152" x2="230" y2="152"/>
    <line x1="166" y1="198" x2="254" y2="198"/>
    <line x1="166" y1="212" x2="230" y2="212"/>
    <line x1="166" y1="258" x2="254" y2="258"/>
    <line x1="166" y1="272" x2="230" y2="272"/>
    <line x1="166" y1="318" x2="254" y2="318"/>
    <line x1="166" y1="332" x2="230" y2="332"/>
    <line x1="166" y1="378" x2="254" y2="378"/>
    <line x1="166" y1="392" x2="230" y2="392"/>
  </g>

  <!-- Connector lines client nodes -> portfolio hub -->
  <g stroke="#FF6A00" stroke-width="1.25" opacity="0.55" fill="none">
    <path d="M 270 144 C 380 144 430 264 540 264"/>
    <path d="M 270 204 C 380 204 430 264 540 264"/>
    <path d="M 270 264 L 540 264"/>
    <path d="M 270 324 C 380 324 430 264 540 264"/>
    <path d="M 270 384 C 380 384 430 264 540 264"/>
  </g>
  <g fill="#FF6A00">
    <circle cx="270" cy="144" r="3"/>
    <circle cx="270" cy="204" r="3"/>
    <circle cx="270" cy="264" r="3"/>
    <circle cx="270" cy="324" r="3"/>
    <circle cx="270" cy="384" r="3"/>
  </g>

  <!-- Portfolio Ledger roll-up panel (right) -->
  <g stroke="#FF6A00" stroke-width="2" fill="url(#hubGrad)">
    <rect x="540" y="150" width="470" height="230" rx="3"/>
  </g>
  <g stroke="#FF6A00" stroke-width="1" opacity="0.5" fill="none">
    <line x1="570" y1="186" x2="980" y2="186"/>
    <rect x="570" y="300" width="48" height="50" fill="#FF6A00" fill-opacity="0.30"/>
    <rect x="640" y="270" width="48" height="80" fill="#FF6A00" fill-opacity="0.45"/>
    <rect x="710" y="240" width="48" height="110" fill="#FF6A00" fill-opacity="0.55"/>
    <rect x="780" y="215" width="48" height="135" fill="#FF6A00" fill-opacity="0.65"/>
    <rect x="850" y="195" width="48" height="155" fill="#FF6A00" fill-opacity="0.8"/>
    <polyline points="570,300 640,270 710,240 780,215 850,195 940,180" stroke-width="2.5" opacity="0.9"/>
  </g>
  <text x="570" y="178" font-family="Courier New, monospace" font-size="15" font-weight="400" fill="#FF6A00" letter-spacing="2">PORTFOLIO LEDGER &#183; CITATION ROLL-UP</text>

  <line x1="120" y1="430" x2="1080" y2="430" stroke="url(#orangeLine)" stroke-width="2"/>

  <text x="120" y="495" font-family="Space Grotesk, Arial, sans-serif" font-size="58" font-weight="900" fill="#FFFFFF" letter-spacing="-2">
    AEO SOFTWARE FOR AGENCIES
  </text>
  <text x="120" y="540" font-family="Space Grotesk, Arial, sans-serif" font-size="28" font-weight="700" fill="#FF6A00" letter-spacing="-1">
    MULTI-CLIENT · WHITE-LABEL · 2026
  </text>
  <text x="120" y="585" font-family="Courier New, monospace" font-size="14" font-weight="400" fill="#888888" letter-spacing="2">
    THE ANSWER ENGINE · THEANSWERENGINE.AI
  </text>
</svg>
