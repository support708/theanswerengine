<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1117"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.07" stroke="#FF6A00" stroke-width="0.5">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>
  <!-- Finance accent circles -->
  <circle cx="980" cy="200" r="120" fill="none" stroke="#FF6A00" stroke-width="1" opacity="0.08"/>
  <circle cx="980" cy="200" r="80" fill="none" stroke="#FF6A00" stroke-width="1" opacity="0.06"/>
  <circle cx="980" cy="200" r="40" fill="#FF6A00" opacity="0.08"/>
  <!-- Category pill -->
  <rect x="60" y="60" width="170" height="32" rx="16" fill="#FF6A00" opacity="0.2"/>
  <rect x="60" y="60" width="170" height="32" rx="16" fill="none" stroke="#FF6A00" stroke-width="1" opacity="0.6"/>
  <text x="145" y="81" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#FF6A00" text-anchor="middle" letter-spacing="1">INDUSTRY GUIDES</text>
  <!-- Title -->
  <text x="60" y="200" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="800" fill="white">Do Mortgage Brokers</text>
  <text x="60" y="268" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="800" fill="#FF6A00">Show Up on ChatGPT?</text>
  <!-- Subtitle -->
  <text x="60" y="340" font-family="Inter,Arial,sans-serif" font-size="22" fill="#9CA3AF">Why AI skips most brokers and what to do about it</text>
  <!-- Watermark -->
  <text x="600" y="590" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#374151" text-anchor="middle" letter-spacing="2">THE ANSWER ENGINE</text>
  <!-- AE circle -->
  <circle cx="1130" cy="590" r="26" fill="#FF6A00" opacity="0.15"/>
  <circle cx="1130" cy="590" r="26" fill="none" stroke="#FF6A00" stroke-width="1.5" opacity="0.5"/>
  <text x="1130" y="596" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#FF6A00" text-anchor="middle">AE</text>
</svg>
