<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg18" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b0d1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e0d3b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow18"><feGaussianBlur stdDeviation="6" result="blur18"/><feMerge><feMergeNode in="blur18"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg18)"/>
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <!-- Two panels: INVISIBLE vs VISIBLE -->
  <g transform="translate(660, 45)">
    <rect x="0" y="0" width="470" height="470" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Google Business Profile panel (faded, blocked) -->
    <rect x="20" y="15" width="200" height="200" rx="10" fill="rgba(255,80,80,0.04)" stroke="rgba(255,80,80,0.2)" stroke-width="1"/>
    <text x="120" y="38" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,80,80,0.6)" text-anchor="middle" font-weight="600">GOOGLE BUSINESS</text>
    <!-- Google-like card -->
    <rect x="35" y="50" width="170" height="30" rx="6" fill="rgba(255,255,255,0.03)"/>
    <circle cx="52" cy="65" r="8" fill="rgba(100,150,255,0.15)"/>
    <text x="52" y="69" font-family="system-ui, sans-serif" font-size="8" fill="rgba(100,150,255,0.5)" text-anchor="middle">G</text>
    <text x="70" y="62" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.3)">Your Business</text>
    <text x="70" y="74" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,200,50,0.4)">&#x2605;&#x2605;&#x2605;&#x2605;&#x2606; 4.5</text>
    <rect x="35" y="88" width="170" height="5" rx="2" fill="rgba(255,255,255,0.04)"/>
    <rect x="35" y="98" width="130" height="5" rx="2" fill="rgba(255,255,255,0.03)"/>
    <rect x="35" y="108" width="150" height="5" rx="2" fill="rgba(255,255,255,0.03)"/>
    <text x="35" y="132" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.2)">Photos, reviews, hours...</text>
    <!-- Blocked X -->
    <line x1="35" y1="140" x2="190" y2="200" stroke="rgba(255,80,80,0.3)" stroke-width="2"/>
    <line x1="190" y1="140" x2="35" y2="200" stroke="rgba(255,80,80,0.3)" stroke-width="2"/>
    <rect x="65" y="158" width="100" height="24" rx="4" fill="rgba(255,80,80,0.15)" stroke="rgba(255,80,80,0.4)" stroke-width="1"/>
    <text x="115" y="174" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.8)" text-anchor="middle" font-weight="700">WALLED GARDEN</text>
    <!-- Blocked arrow -->
    <text x="235" y="110" font-family="system-ui, sans-serif" font-size="20" fill="rgba(255,80,80,0.4)">&#x2717;</text>
    <line x1="220" y1="100" x2="260" y2="100" stroke="rgba(255,80,80,0.3)" stroke-width="2" stroke-dasharray="4,4"/>
    <!-- ChatGPT panel -->
    <rect x="260" y="15" width="190" height="200" rx="10" fill="rgba(255,106,0,0.05)" stroke="#FF6A00" stroke-width="1.5" filter="url(#glow18)"/>
    <text x="355" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" text-anchor="middle" font-weight="600">CHATGPT</text>
    <rect x="275" y="50" width="160" height="25" rx="6" fill="rgba(255,255,255,0.03)"/>
    <text x="355" y="67" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.35)" text-anchor="middle">"Best plumber near me?"</text>
    <rect x="275" y="85" width="160" height="40" rx="6" fill="rgba(255,80,80,0.05)" stroke="rgba(255,80,80,0.15)" stroke-width="1"/>
    <text x="355" y="102" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,80,80,0.6)" text-anchor="middle">Cannot access GBP data</text>
    <text x="355" y="118" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,80,80,0.5)" text-anchor="middle">No Google API access</text>
    <text x="280" y="150" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.3)">Data sources used:</text>
    <text x="280" y="165" font-family="system-ui, sans-serif" font-size="8" fill="rgba(100,150,255,0.5)">&#x2713; Bing Places</text>
    <text x="280" y="178" font-family="system-ui, sans-serif" font-size="8" fill="rgba(100,220,100,0.5)">&#x2713; Your Website</text>
    <text x="280" y="191" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,200,50,0.5)">&#x2713; Directory Listings</text>
    <text x="280" y="204" font-family="system-ui, sans-serif" font-size="8" fill="rgba(200,150,255,0.5)">&#x2713; Review Aggregators</text>
    <!-- What ChatGPT actually uses -->
    <line x1="20" y1="230" x2="450" y2="230" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
    <text x="235" y="255" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600">WHAT CHATGPT ACTUALLY SEES</text>
    <!-- Data source cards -->
    <rect x="20" y="268" width="135" height="80" rx="6" fill="rgba(100,150,255,0.06)" stroke="rgba(100,150,255,0.2)" stroke-width="1"/>
    <text x="87" y="288" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,150,255,0.7)" text-anchor="middle" font-weight="600">Bing Places</text>
    <text x="87" y="308" font-family="system-ui, sans-serif" font-size="22" fill="rgba(100,150,255,0.6)" text-anchor="middle" font-weight="700">#1</text>
    <text x="87" y="338" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.2)" text-anchor="middle">Primary source</text>
    <rect x="165" y="268" width="135" height="80" rx="6" fill="rgba(100,220,100,0.06)" stroke="rgba(100,220,100,0.2)" stroke-width="1"/>
    <text x="232" y="288" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.7)" text-anchor="middle" font-weight="600">Your Website</text>
    <text x="232" y="308" font-family="system-ui, sans-serif" font-size="22" fill="rgba(100,220,100,0.6)" text-anchor="middle" font-weight="700">#2</text>
    <text x="232" y="338" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.2)" text-anchor="middle">Schema + content</text>
    <rect x="310" y="268" width="140" height="80" rx="6" fill="rgba(255,200,50,0.06)" stroke="rgba(255,200,50,0.2)" stroke-width="1"/>
    <text x="380" y="288" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,200,50,0.7)" text-anchor="middle" font-weight="600">Directories</text>
    <text x="380" y="308" font-family="system-ui, sans-serif" font-size="22" fill="rgba(255,200,50,0.6)" text-anchor="middle" font-weight="700">#3</text>
    <text x="380" y="338" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.2)" text-anchor="middle">Yelp, BBB, etc.</text>
    <!-- Bottom alert -->
    <rect x="20" y="365" width="430" height="90" rx="8" fill="rgba(255,80,80,0.06)" stroke="rgba(255,80,80,0.2)" stroke-width="1"/>
    <text x="235" y="390" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,80,80,0.7)" text-anchor="middle" font-weight="600">&#x26A0; CRITICAL INSIGHT</text>
    <text x="235" y="412" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">Your Google Business Profile is INVISIBLE to ChatGPT.</text>
    <text x="235" y="430" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.3)" text-anchor="middle">Google keeps this data locked behind its own ecosystem.</text>
    <text x="235" y="445" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.6)" text-anchor="middle">You need SEPARATE optimization for AI platforms.</text>
  </g>
  <circle cx="100" cy="130" r="60" stroke="rgba(255,106,0,0.05)" stroke-width="0.5" fill="none"/>
  <rect x="40" y="40" width="200" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="140" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">ChatGPT Citation Series</text>
  <text x="80" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">ChatGPT Can't See</text>
  <text x="80" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Your Google</text>
  <text x="80" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glow18)">Business Profile</text>
  <text x="80" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">The Walled Garden Problem</text>
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>