    <rect x="10" y="84" width="450" height="42" rx="4" fill="rgba(255,255,255,0.02)"/>
    <text x="30" y="110" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" font-weight="500">Visibility</text>
    <text x="210" y="103" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.7)">Rented placement</text>
    <text x="210" y="117" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.7)">Disappears when off</text>
    <text x="360" y="103" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.85)">Earned citation</text>
    <text x="360" y="117" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.85)">Compounds over time</text>
    <!-- X and Check marks -->
    <text x="185" y="110" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,80,80,0.8)">&#x2717;</text>
    <text x="340" y="110" font-family="system-ui, sans-serif" font-size="14" fill="rgba(100,220,100,0.9)">&#x2713;</text>
    <!-- Row 2: Cost -->
    <text x="30" y="148" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" font-weight="500">Cost</text>
    <text x="210" y="141" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.7)">$5.26 per click avg</text>
    <text x="210" y="155" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.7)">$70+ per lead</text>
    <text x="360" y="141" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.85)">Content investment</text>
    <text x="360" y="155" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.85)">Decreasing cost/lead</text>
    <text x="185" y="148" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,80,80,0.8)">&#x2717;</text>
    <text x="340" y="148" font-family="system-ui, sans-serif" font-size="14" fill="rgba(100,220,100,0.9)">&#x2713;</text>
    <line x1="20" y1="166" x2="450" y2="166" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
