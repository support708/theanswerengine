    <text x="210" y="68" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,80,80,0.8)" font-weight="600">GOOGLE ADS</text>
    <text x="360" y="68" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" font-weight="600">AI OPTIMIZATION</text>
    <line x1="20" y1="78" x2="450" y2="78" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
