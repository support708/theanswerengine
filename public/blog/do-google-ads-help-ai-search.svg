    <text x="30" y="350" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">AI CITATION IMPACT</text>
    <rect x="180" y="335" width="100" height="24" rx="4" fill="rgba(255,80,80,0.12)" stroke="rgba(255,80,80,0.3)" stroke-width="1"/>
    <text x="230" y="351" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,80,80,0.9)" text-anchor="middle" font-weight="700">ZERO</text>
    <rect x="330" y="335" width="120" height="24" rx="4" fill="rgba(255,106,0,0.12)" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="390" y="351" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle" font-weight="700">DIRECT</text>
    <!-- Verdict box -->
    <rect x="20" y="375" width="430" height="80" rx="10" fill="rgba(255,106,0,0.08)" stroke="#FF6A00" stroke-width="1.5" stroke-opacity="0.4" filter="url(#glowDGAA)"/>
    <text x="235" y="400" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600" letter-spacing="2">VERDICT</text>
    <text x="235" y="422" font-family="system-ui, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="700">Google Ads = $0 AI Influence</text>
    <text x="235" y="442" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle" font-weight="600">AI Optimization = Compounding Authority</text>
