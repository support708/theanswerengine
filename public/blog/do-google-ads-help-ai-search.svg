  <text x="50" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="white">Does Paying for</text>
  <text x="50" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="white">Google Ads Help</text>
  <text x="50" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#FF6A00" filter="url(#glowDGAA)">AI Find You?</text>
  <!-- Subtitle -->
  <text x="50" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="rgba(255,255,255,0.45)">The $0 Connection Between Ads and AI Citations</text>
  <!-- Right panel: Comparison table -->
  <g transform="translate(660, 45)">
    <rect x="0" y="0" width="470" height="470" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="235" y="30" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600" letter-spacing="2">GOOGLE ADS vs AI OPTIMIZATION</text>
