    <text x="30" y="198" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" font-weight="500">Trust</text>
    <text x="210" y="191" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.7)">Users skip 70-80%</text>
    <text x="210" y="205" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.7)">Labeled as sponsored</text>
    <text x="360" y="191" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.85)">Implicit endorsement</text>
    <text x="360" y="205" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.85)">High trust signal</text>
    <text x="185" y="198" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,80,80,0.8)">&#x2717;</text>
    <text x="340" y="198" font-family="system-ui, sans-serif" font-size="14" fill="rgba(100,220,100,0.9)">&#x2713;</text>
    <!-- Row 4: Duration -->
    <text x="30" y="238" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" font-weight="500">Duration</text>
    <text x="210" y="231" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.7)">Stops when budget</text>
    <text x="210" y="245" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.7)">runs out</text>
    <text x="360" y="231" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.85)">Builds permanently</text>
    <text x="360" y="245" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.85)">Authority grows</text>
    <text x="185" y="238" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,80,80,0.8)">&#x2717;</text>
    <text x="340" y="238" font-family="system-ui, sans-serif" font-size="14" fill="rgba(100,220,100,0.9)">&#x2713;</text>
    <line x1="20" y1="256" x2="450" y2="256" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
    <!-- Row 5: ROI -->
    <rect x="10" y="262" width="450" height="42" rx="4" fill="rgba(255,255,255,0.02)"/>
    <text x="30" y="288" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" font-weight="500">ROI</text>
    <text x="210" y="281" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.7)">Linear returns</text>
    <text x="210" y="295" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.7)">Diminishing over time</text>
    <text x="360" y="281" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.85)">Compounding returns</text>
    <text x="360" y="295" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.85)">Growing over time</text>
    <text x="185" y="288" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,80,80,0.8)">&#x2717;</text>
    <text x="340" y="288" font-family="system-ui, sans-serif" font-size="14" fill="rgba(100,220,100,0.9)">&#x2713;</text>
    <!-- Separator before verdict -->
    <line x1="20" y1="320" x2="450" y2="320" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
