<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <filter id="glowT"><feGaussianBlur stdDeviation="6" result="blurT"/><feMerge><feMergeNode in="blurT"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoftT"><feGaussianBlur stdDeviation="12" result="blurTs"/><feMerge><feMergeNode in="blurTs"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgT)"/>
  <!-- Grid lines -->
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>

  <!-- 3 Realtor Tie Comparison Panel -->
  <g transform="translate(660, 60)">
    <rect x="0" y="0" width="480" height="510" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <!-- Header -->
    <text x="240" y="32" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="700" letter-spacing="2">3 REALTORS — SAME GBP SCORE</text>
    <line x1="20" y1="46" x2="460" y2="46" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>

    <!-- Realtor cards -->
    <g transform="translate(20, 60)">
      <!-- Realtor A -->
      <rect x="0" y="0" width="135" height="100" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="67" y="22" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-weight="600">REALTOR A</text>
      <text x="67" y="48" font-family="system-ui, sans-serif" font-size="26" fill="white" text-anchor="middle" font-weight="700">4.9★</text>
      <text x="67" y="68" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.45)" text-anchor="middle">GBP: 287 reviews</text>
      <text x="67" y="88" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.7)" text-anchor="middle">Schema: 0</text>

      <!-- Realtor B -->
      <rect x="150" y="0" width="135" height="100" rx="8" fill="rgba(255,106,0,0.10)" stroke="#FF6A00" stroke-width="1.5" filter="url(#glowT)"/>
      <text x="217" y="22" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle" font-weight="700">REALTOR B</text>
      <text x="217" y="48" font-family="system-ui, sans-serif" font-size="26" fill="#FF6A00" text-anchor="middle" font-weight="700">4.9★</text>
      <text x="217" y="68" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.45)" text-anchor="middle">GBP: 287 reviews</text>
      <text x="217" y="88" font-family="system-ui, sans-serif" font-size="9" fill="#FF6A00" text-anchor="middle" font-weight="600">Schema: FULL STACK</text>

      <!-- Realtor C -->
      <rect x="300" y="0" width="135" height="100" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="367" y="22" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-weight="600">REALTOR C</text>
      <text x="367" y="48" font-family="system-ui, sans-serif" font-size="26" fill="white" text-anchor="middle" font-weight="700">4.9★</text>
      <text x="367" y="68" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.45)" text-anchor="middle">GBP: 287 reviews</text>
      <text x="367" y="88" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.7)" text-anchor="middle">Schema: partial</text>
    </g>

    <!-- AI Decision arrow -->
    <text x="240" y="200" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600" letter-spacing="2">AI RUNS FALLBACK STACK ↓</text>

    <!-- Six-signal stack -->
    <g transform="translate(20, 215)">
      <rect x="0" y="0" width="435" height="170" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="217" y="22" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.55)" text-anchor="middle" font-weight="700">THE 6-SIGNAL TIE-BREAKER STACK</text>

      <text x="20" y="50" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">1. Schema density</text>
      <text x="415" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="end" font-weight="600">2.1x lift</text>

      <text x="20" y="72" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">2. Named-author trust (sameAs)</text>
      <text x="415" y="72" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="end" font-weight="600">1.9x trust</text>

      <text x="20" y="94" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">3. Third-party co-citation</text>
      <text x="415" y="94" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="end" font-weight="600">required</text>

      <text x="20" y="116" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">4. Content freshness (≤60d)</text>
      <text x="415" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="end" font-weight="600">73% win</text>

      <text x="20" y="138" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">5. Citation velocity (LLM)</text>
      <text x="415" y="138" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="end" font-weight="600">trend</text>

      <text x="20" y="160" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">6. Answer extractability (80-180w)</text>
      <text x="415" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="end" font-weight="600">+43%</text>
    </g>

    <!-- Verdict -->
    <rect x="20" y="408" width="435" height="80" rx="8" fill="rgba(255,106,0,0.08)" stroke="#FF6A00" stroke-width="1.5" stroke-opacity="0.5" filter="url(#glowT)"/>
    <text x="237" y="432" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-weight="600">AI PICKS</text>
    <text x="237" y="455" font-family="system-ui, sans-serif" font-size="16" fill="#FF6A00" text-anchor="middle" font-weight="700">Realtor B</text>
    <text x="237" y="475" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">GBP tied. Full schema stack broke the tie.</text>
  </g>

  <!-- Left content -->
  <circle cx="100" cy="130" r="60" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <rect x="40" y="40" width="220" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="150" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#FF6A00" text-anchor="middle">Realtor AEO Tie-Break</text>

  <text x="80" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white">Same GBP Score.</text>
  <text x="80" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white">Different Citation.</text>
  <text x="80" y="304" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#FF6A00" filter="url(#glowT)">AI Breaks Ties.</text>

  <text x="80" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="rgba(255,255,255,0.55)">The 6-signal fallback stack that decides</text>
  <text x="80" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="rgba(255,255,255,0.55)">which realtor ChatGPT, Perplexity,</text>
  <text x="80" y="406" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="rgba(255,255,255,0.55)">Claude &amp; Gemini cite.</text>

  <!-- Footer brand -->
  <text x="600" y="595" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="rgba(255,255,255,0.45)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE · theanswerengine.ai</text>
  <circle cx="1130" cy="585" r="28" fill="rgba(255,106,0,0.15)" stroke="#FF6A00" stroke-width="1"/>
  <text x="1130" y="592" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#FF6A00" text-anchor="middle">AE</text>
</svg>
