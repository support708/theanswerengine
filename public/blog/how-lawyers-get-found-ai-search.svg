  <!-- Footer branding -->
  <text x="600" y="585" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>

  <!-- AE circle bottom-right -->
  <circle cx="1130" cy="590" r="28" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="1130" y="597" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>