<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgHLFA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2e3b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="panelHLFA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.06);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.02);stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barFillHLFA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF6A00;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="scoreRingHLFA" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc5500;stop-opacity:0.6" />
    </linearGradient>
    <filter id="glowHLFA" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blurHLFA"/>
      <feMerge><feMergeNode in="blurHLFA"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlowHLFA" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="bigBlurHLFA"/>
      <feMerge><feMergeNode in="bigBlurHLFA"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlowHLFA" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="tgHLFA"/>
      <feMerge><feMergeNode in="tgHLFA"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgHLFA)"/>

  <!-- Grid lines at 0.05 opacity -->
  <g opacity="0.05">
    <line x1="0" y1="90" x2="1200" y2="90" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="0" y1="450" x2="1200" y2="450" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="170" y1="0" x2="170" y2="630" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="340" y1="0" x2="340" y2="630" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="510" y1="0" x2="510" y2="630" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="680" y1="0" x2="680" y2="630" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="850" y1="0" x2="850" y2="630" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="1020" y1="0" x2="1020" y2="630" stroke="#FF6A00" stroke-width="0.5"/>
  </g>

  <!-- Corner tint glow -->
  <circle cx="0" cy="0" r="300" fill="#0d2e3b" opacity="0.3" filter="url(#bigGlowHLFA)"/>

  <!-- LEFT SIDE: Category + Title + Subtitle -->
