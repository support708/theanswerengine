      <!-- E-E-A-T Score -->
      <text x="0" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.55)">E-E-A-T Score</text>
      <rect x="0" y="18" width="190" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
