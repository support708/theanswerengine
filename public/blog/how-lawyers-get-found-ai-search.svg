  <rect x="40" y="55" width="155" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.35)" stroke-width="1"/>
  <text x="117" y="77" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#FF6A00" text-anchor="middle" letter-spacing="1.5">INDUSTRY GUIDES</text>

  <!-- Title: 3 lines, last line orange with glow -->
  <text x="50" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">How Lawyers</text>
  <text x="50" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">Can Get Found on</text>
  <text x="50" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#FF6A00" filter="url(#textGlowHLFA)">AI Search</text>

  <!-- Subtitle -->
  <text x="50" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="rgba(255,255,255,0.45)">Why 78% of legal queries now trigger AI Overviews</text>
  <text x="50" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="rgba(255,255,255,0.35)">and what your firm can do about it</text>

  <!-- Decorative scales of justice silhouette -->
  <g opacity="0.04" transform="translate(120, 420)">
    <line x1="100" y1="0" x2="100" y2="80" stroke="white" stroke-width="3"/>
    <line x1="40" y1="10" x2="160" y2="10" stroke="white" stroke-width="3"/>
    <circle cx="40" cy="40" r="25" stroke="white" stroke-width="2" fill="none"/>
    <circle cx="160" cy="40" r="25" stroke="white" stroke-width="2" fill="none"/>
    <rect x="85" y="80" width="30" height="8" rx="2" fill="white"/>
  </g>

  <!-- RIGHT PANEL: Scoring Dashboard -->
  <g transform="translate(660,45)">
    <!-- Panel background -->
    <rect x="0" y="0" width="470" height="470" rx="16" fill="url(#panelHLFA)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <!-- Panel header -->
    <rect x="0" y="0" width="470" height="44" rx="16" fill="rgba(255,255,255,0.04)"/>
    <rect x="0" y="28" width="470" height="16" fill="rgba(255,255,255,0.04)"/>
    <circle cx="20" cy="22" r="5" fill="rgba(255,80,80,0.5)"/>
    <circle cx="38" cy="22" r="5" fill="rgba(255,200,50,0.5)"/>
    <circle cx="56" cy="22" r="5" fill="rgba(80,200,80,0.5)"/>
    <text x="235" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)" text-anchor="middle" letter-spacing="1">LAW FIRM AI READINESS</text>

    <!-- Central score circle -->
    <circle cx="115" cy="115" r="50" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="6" transform="translate(0,50)"/>
    <circle cx="115" cy="115" r="50" fill="none" stroke="url(#scoreRingHLFA)" stroke-width="6" stroke-dasharray="230 314" stroke-linecap="round" transform="translate(0,50) rotate(-90 115 115)"/>
    <text x="115" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="white" text-anchor="middle">73</text>
    <text x="115" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="0.5">AI READINESS</text>
    <text x="115" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#FF6A00" text-anchor="middle">GOOD</text>

