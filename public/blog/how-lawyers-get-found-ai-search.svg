      <!-- Item 1: Check -->
      <rect x="0" y="14" width="16" height="16" rx="3" fill="rgba(255,106,0,0.2)" stroke="#FF6A00" stroke-width="0.8"/>
      <text x="8" y="27" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle">&#x2713;</text>
      <text x="24" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Attorney bio with bar number + JD</text>

      <!-- Item 2: Check -->
      <rect x="0" y="38" width="16" height="16" rx="3" fill="rgba(255,106,0,0.2)" stroke="#FF6A00" stroke-width="0.8"/>
      <text x="8" y="51" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle">&#x2713;</text>
      <text x="24" y="51" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Practice area pages with FAQ schema</text>

      <!-- Item 3: Check -->
      <rect x="0" y="62" width="16" height="16" rx="3" fill="rgba(255,106,0,0.2)" stroke="#FF6A00" stroke-width="0.8"/>
      <text x="8" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle">&#x2713;</text>
      <text x="24" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Case results as structured content</text>

      <!-- Item 4: Empty -->
      <rect x="0" y="86" width="16" height="16" rx="3" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
      <text x="24" y="99" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)">Client testimonials (plain text on site)</text>

      <!-- Item 5: Empty -->
      <rect x="0" y="110" width="16" height="16" rx="3" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
      <text x="24" y="123" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)">LegalServiceSchema on all pages</text>

      <!-- Item 6: Empty -->
      <rect x="0" y="134" width="16" height="16" rx="3" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
      <text x="24" y="147" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)">Directory listings (Avvo, Justia, FindLaw)</text>

      <!-- Item 7: Empty -->
      <rect x="0" y="158" width="16" height="16" rx="3" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
      <text x="24" y="171" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)">Content refresh cadence (monthly+)</text>
    </g>

    <!-- Score breakdown labels -->
    <g transform="translate(255, 255)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.35)" letter-spacing="1" font-weight="600">YMYL COMPLIANCE</text>

      <!-- Mini stat boxes -->
      <rect x="0" y="14" width="90" height="50" rx="6" fill="rgba(255,106,0,0.06)" stroke="rgba(255,106,0,0.15)" stroke-width="0.8"/>
      <text x="45" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#FF6A00" text-anchor="middle">78%</text>
      <text x="45" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="rgba(255,255,255,0.35)" text-anchor="middle">AI Overviews</text>

      <rect x="100" y="14" width="90" height="50" rx="6" fill="rgba(255,106,0,0.06)" stroke="rgba(255,106,0,0.15)" stroke-width="0.8"/>
      <text x="145" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">55%</text>
      <text x="145" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="rgba(255,255,255,0.35)" text-anchor="middle">Use AI Tools</text>

      <rect x="0" y="74" width="90" height="50" rx="6" fill="rgba(255,106,0,0.06)" stroke="rgba(255,106,0,0.15)" stroke-width="0.8"/>
      <text x="45" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">$120K</text>
      <text x="45" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="rgba(255,255,255,0.35)" text-anchor="middle">Avg SEO Spend</text>

      <rect x="100" y="74" width="90" height="50" rx="6" fill="rgba(255,106,0,0.06)" stroke="rgba(255,106,0,0.15)" stroke-width="0.8"/>
      <text x="145" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">9.7%</text>
      <text x="145" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="rgba(255,255,255,0.35)" text-anchor="middle">Tech Spend Up</text>
    </g>
