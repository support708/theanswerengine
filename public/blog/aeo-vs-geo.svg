<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGeo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1305;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c1f1f;stop-opacity:1" />
    </linearGradient>
    <filter id="glowGeo"><feGaussianBlur stdDeviation="6" result="blurG"/><feMerge><feMergeNode in="blurG"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoftGeo"><feGaussianBlur stdDeviation="14" result="blurGs"/><feMerge><feMergeNode in="blurGs"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGeo)"/>

  <!-- subtle grid -->
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>

  <!-- Left panel: title and tagline -->
  <g transform="translate(70, 65)">
    <rect x="0" y="0" width="200" height="26" rx="4" fill="rgba(255,106,0,0.12)" stroke="#FF6A00" stroke-width="1"/>
    <text x="100" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle" font-weight="700" letter-spacing="2">AEO FOUNDATIONS</text>

    <text x="0" y="100" font-family="system-ui, sans-serif" font-size="76" fill="#ffffff" font-weight="900" letter-spacing="-3">AEO</text>
    <text x="180" y="100" font-family="system-ui, sans-serif" font-size="44" fill="rgba(255,255,255,0.45)" font-weight="600">vs</text>
    <text x="265" y="100" font-family="system-ui, sans-serif" font-size="76" fill="#FF6A00" font-weight="900" letter-spacing="-3" filter="url(#glowGeo)">GEO</text>

    <text x="0" y="155" font-family="system-ui, sans-serif" font-size="22" fill="rgba(255,255,255,0.85)" font-weight="700">What is the Difference?</text>

    <text x="0" y="220" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.65)" font-weight="400">Practitioner term. Academic term.</text>
    <text x="0" y="244" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.65)" font-weight="400">Same scoring mechanism. Different scope.</text>

    <!-- Pills -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="120" height="32" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="60" y="21" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)" text-anchor="middle" font-weight="600">8 SURFACES</text>

      <rect x="132" y="0" width="120" height="32" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="192" y="21" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)" text-anchor="middle" font-weight="600">1 RAG STACK</text>

      <rect x="264" y="0" width="180" height="32" rx="6" fill="rgba(255,106,0,0.15)" stroke="#FF6A00" stroke-width="1"/>
      <text x="354" y="21" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle" font-weight="700">DUAL-FRAME PROTOCOL</text>
    </g>

    <text x="0" y="370" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.45)" font-weight="500" letter-spacing="1">THEANSWERENGINE.AI</text>
  </g>

  <!-- Right panel: comparison card -->
  <g transform="translate(660, 65)">
    <rect x="0" y="0" width="470" height="500" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <!-- header row -->
    <rect x="20" y="20" width="200" height="32" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <text x="120" y="42" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)" text-anchor="middle" font-weight="700">AEO</text>

    <rect x="240" y="20" width="200" height="32" rx="6" fill="rgba(255,106,0,0.15)" stroke="#FF6A00" stroke-width="1.5" filter="url(#glowGeo)"/>
    <text x="340" y="42" font-family="system-ui, sans-serif" font-size="13" fill="#FF6A00" text-anchor="middle" font-weight="700">GEO</text>

    <!-- Rows -->
    <g transform="translate(20, 80)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.45)" font-weight="600" letter-spacing="1">ORIGIN</text>
      <text x="100" y="0" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.85)" text-anchor="middle">Practitioner (2019)</text>
      <text x="320" y="0" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.85)" text-anchor="middle">Academic (KDD 2024)</text>
      <line x1="0" y1="14" x2="430" y2="14" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    </g>

    <g transform="translate(20, 130)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.45)" font-weight="600" letter-spacing="1">SURFACES</text>
      <text x="100" y="0" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.85)" text-anchor="middle">8 (LLMs + voice + snippets)</text>
      <text x="320" y="0" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.85)" text-anchor="middle">4 LLMs only</text>
      <line x1="0" y1="14" x2="430" y2="14" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    </g>

    <g transform="translate(20, 180)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.45)" font-weight="600" letter-spacing="1">PIPELINE</text>
      <text x="100" y="0" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.85)" text-anchor="middle">RAG</text>
      <text x="320" y="0" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.85)" text-anchor="middle">RAG</text>
      <line x1="0" y1="14" x2="430" y2="14" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    </g>

    <g transform="translate(20, 230)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.45)" font-weight="600" letter-spacing="1">VOCAB</text>
      <text x="100" y="0" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.85)" text-anchor="middle">Brand mention rate</text>
      <text x="320" y="0" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.85)" text-anchor="middle">Source-format extract.</text>
      <line x1="0" y1="14" x2="430" y2="14" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    </g>

    <g transform="translate(20, 280)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.45)" font-weight="600" letter-spacing="1">ADOPTERS</text>
      <text x="100" y="0" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.85)" text-anchor="middle">Operators, agencies</text>
      <text x="320" y="0" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.85)" text-anchor="middle">Researchers</text>
      <line x1="0" y1="14" x2="430" y2="14" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    </g>

    <g transform="translate(20, 330)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.45)" font-weight="600" letter-spacing="1">TACTICS</text>
      <text x="100" y="0" font-family="system-ui, sans-serif" font-size="12" fill="#FF6A00" text-anchor="middle" font-weight="600">Same playbook</text>
      <text x="320" y="0" font-family="system-ui, sans-serif" font-size="12" fill="#FF6A00" text-anchor="middle" font-weight="600">Same playbook</text>
    </g>

    <!-- Bottom verdict -->
    <rect x="20" y="380" width="430" height="100" rx="8" fill="rgba(255,106,0,0.06)" stroke="rgba(255,106,0,0.4)" stroke-width="1"/>
    <text x="235" y="410" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle" font-weight="700" letter-spacing="2">THE VERDICT</text>
    <text x="235" y="438" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.95)" text-anchor="middle" font-weight="600">Every GEO win is an AEO win.</text>
    <text x="235" y="460" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.7)" text-anchor="middle">Not every AEO surface is a GEO surface.</text>
  </g>
</svg>
