    <text x="170" y="70" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" font-weight="600">AI IMPACT</text>
    <text x="340" y="70" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" font-weight="600">LEVEL</text>
    <line x1="20" y1="80" x2="450" y2="80" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
    <!-- Row 1: LinkedIn - HIGH -->
    <rect x="10" y="88" width="450" height="48" rx="4" fill="rgba(255,255,255,0.02)"/>
    <circle cx="30" cy="112" r="8" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.4)" stroke-width="0.5"/>
    <text x="30" y="116" font-family="system-ui, sans-serif" font-size="8" fill="rgba(34,197,94,0.9)" text-anchor="middle" font-weight="700">in</text>
    <text x="50" y="116" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)" font-weight="600">LinkedIn</text>
    <rect x="170" y="104" width="150" height="14" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="170" y="104" width="150" height="14" rx="3" fill="url(#barGreenDSMH)"/>
    <text x="340" y="116" font-family="system-ui, sans-serif" font-size="11" fill="rgba(34,197,94,0.9)" font-weight="700">HIGH</text>
    <!-- Row 2: Reddit - HIGH -->
    <text x="50" y="162" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)" font-weight="600">Reddit</text>
    <circle cx="30" cy="158" r="8" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.4)" stroke-width="0.5"/>
    <text x="30" y="162" font-family="system-ui, sans-serif" font-size="9" fill="#FF6A00" text-anchor="middle" font-weight="700">r/</text>
    <rect x="170" y="150" width="150" height="14" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="170" y="150" width="140" height="14" rx="3" fill="url(#barGreenDSMH)"/>
    <text x="340" y="162" font-family="system-ui, sans-serif" font-size="11" fill="rgba(34,197,94,0.9)" font-weight="700">HIGH</text>
    <line x1="20" y1="178" x2="450" y2="178" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
    <!-- Row 3: YouTube - MEDIUM -->
    <rect x="10" y="184" width="450" height="48" rx="4" fill="rgba(255,255,255,0.02)"/>
    <circle cx="30" cy="208" r="8" fill="rgba(234,179,8,0.15)" stroke="rgba(234,179,8,0.4)" stroke-width="0.5"/>
    <text x="30" y="211" font-family="system-ui, sans-serif" font-size="8" fill="rgba(234,179,8,0.9)" text-anchor="middle" font-weight="700">YT</text>
    <text x="50" y="212" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)" font-weight="600">YouTube</text>
    <rect x="170" y="200" width="150" height="14" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="170" y="200" width="90" height="14" rx="3" fill="url(#barYellowDSMH)"/>
    <text x="340" y="212" font-family="system-ui, sans-serif" font-size="11" fill="rgba(234,179,8,0.9)" font-weight="700">MEDIUM</text>
    <!-- Row 4: Facebook - LOW -->
    <text x="50" y="258" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)" font-weight="600">Facebook</text>
    <circle cx="30" cy="254" r="8" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.4)" stroke-width="0.5"/>
    <text x="30" y="258" font-family="system-ui, sans-serif" font-size="8" fill="rgba(239,68,68,0.9)" text-anchor="middle" font-weight="700">f</text>
    <rect x="170" y="246" width="150" height="14" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="170" y="246" width="30" height="14" rx="3" fill="url(#barRedDSMH)"/>
    <text x="340" y="258" font-family="system-ui, sans-serif" font-size="11" fill="rgba(239,68,68,0.9)" font-weight="700">LOW</text>
    <line x1="20" y1="274" x2="450" y2="274" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
    <!-- Row 5: Instagram - NONE -->
    <rect x="10" y="280" width="450" height="48" rx="4" fill="rgba(255,255,255,0.02)"/>
    <circle cx="30" cy="304" r="8" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.4)" stroke-width="0.5"/>
    <text x="30" y="308" font-family="system-ui, sans-serif" font-size="8" fill="rgba(239,68,68,0.9)" text-anchor="middle" font-weight="700">IG</text>
    <text x="50" y="308" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)" font-weight="600">Instagram</text>
    <rect x="170" y="296" width="150" height="14" rx="3" fill="rgba(255,255,255,0.06)"/>
    <text x="190" y="308" font-family="system-ui, sans-serif" font-size="14" fill="rgba(239,68,68,0.9)">&#x2717;</text>
    <text x="340" y="308" font-family="system-ui, sans-serif" font-size="11" fill="rgba(239,68,68,0.9)" font-weight="700">NONE</text>
    <!-- Row 6: TikTok - LOW -->
    <text x="50" y="354" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)" font-weight="600">TikTok</text>
    <circle cx="30" cy="350" r="8" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.4)" stroke-width="0.5"/>
    <text x="30" y="354" font-family="system-ui, sans-serif" font-size="8" fill="rgba(239,68,68,0.9)" text-anchor="middle" font-weight="700">TT</text>
    <rect x="170" y="342" width="150" height="14" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="170" y="342" width="15" height="14" rx="3" fill="url(#barRedDSMH)"/>
    <text x="340" y="354" font-family="system-ui, sans-serif" font-size="11" fill="rgba(239,68,68,0.9)" font-weight="700">LOW</text>
    <line x1="20" y1="374" x2="450" y2="374" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
    <!-- Insight box -->
    <rect x="20" y="390" width="430" height="55" rx="8" fill="rgba(255,106,0,0.08)" stroke="rgba(255,106,0,0.2)" stroke-width="0.5"/>
    <text x="235" y="415" font-family="system-ui, sans-serif" font-size="12" fill="#FF6A00" text-anchor="middle" font-weight="600">AI reads text content,</text>
    <text x="235" y="434" font-family="system-ui, sans-serif" font-size="12" fill="#FF6A00" text-anchor="middle" font-weight="600">not engagement metrics</text>
  </g>
  <!-- Footer -->
  <text x="600" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="rgba(255,255,255,0.25)" text-anchor="middle" letter-spacing="3">THE ANSWER ENGINE</text>
  <!-- AE circle bottom-right -->
  <circle cx="1150" cy="585" r="18" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="1150" y="591" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FF6A00" text-anchor="middle">AE</text>
</svg>
