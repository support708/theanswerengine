    <text x="235" y="32" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600" letter-spacing="2">SOCIAL SIGNAL IMPACT</text>
    <line x1="20" y1="44" x2="450" y2="44" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
