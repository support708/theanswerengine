<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgDSMH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b1a0d;stop-opacity:1" />
    </linearGradient>
    <filter id="glowDSMH"><feGaussianBlur stdDeviation="6" result="blurDSMH"/><feMerge><feMergeNode in="blurDSMH"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="barGreenDSMH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="barYellowDSMH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#eab308;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#eab308;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="barRedDSMH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0.4" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgDSMH)"/>
  <!-- Grid lines -->
  <line x1="0" y1="90" x2="1200" y2="90" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="180" x2="1200" y2="180" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="315" x2="1200" y2="315" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="540" x2="1200" y2="540" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <!-- Decorative circles -->
  <circle cx="130" cy="480" r="60" stroke="rgba(255,106,0,0.04)" stroke-width="0.5" fill="none"/>
  <circle cx="500" cy="150" r="35" stroke="rgba(255,106,0,0.03)" stroke-width="0.5" fill="none"/>
  <!-- Category pill -->
  <rect x="40" y="40" width="150" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="115" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FF6A00" text-anchor="middle">MYTH BUSTERS</text>
  <!-- Title - 3 lines -->
  <text x="50" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white">Does Social Media</text>
  <text x="50" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white">Help AI</text>
  <text x="50" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#FF6A00" filter="url(#glowDSMH)">Recommend You?</text>
  <!-- Subtitle -->
  <text x="50" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="rgba(255,255,255,0.45)">Which Social Signals AI Reads vs. Ignores</text>
  <!-- Right panel: Social Signal Impact -->
