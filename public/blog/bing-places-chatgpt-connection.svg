<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b4e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0d3b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow16"><feGaussianBlur stdDeviation="6" result="blur16"/><feMerge><feMergeNode in="blur16"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoft16"><feGaussianBlur stdDeviation="12" result="blur16s"/><feMerge><feMergeNode in="blur16s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg16)"/>
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <!-- Connection diagram: Bing Places -> ChatGPT -->
  <g transform="translate(660, 45)">
    <rect x="0" y="0" width="470" height="470" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="235" y="28" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600">DATA PIPELINE</text>
    <!-- Bing Places node -->
    <rect x="20" y="50" width="180" height="120" rx="10" fill="rgba(100,150,255,0.08)" stroke="rgba(100,150,255,0.5)" stroke-width="1.5"/>
    <rect x="50" y="65" width="40" height="40" rx="8" fill="rgba(100,150,255,0.2)"/>
    <text x="70" y="91" font-family="system-ui, sans-serif" font-size="16" fill="rgba(100,150,255,0.9)" text-anchor="middle" font-weight="700">B</text>
    <text x="110" y="82" font-family="system-ui, sans-serif" font-size="12" fill="rgba(100,150,255,0.9)" font-weight="700">Bing Places</text>
    <text x="110" y="98" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">Your Listing</text>
    <text x="35" y="128" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.45)">&#x2022; Business name</text>
    <text x="35" y="142" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.45)">&#x2022; Address, phone</text>
    <text x="35" y="156" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.45)">&#x2022; Categories, hours</text>
    <!-- Arrow 1 -->
    <line x1="200" y1="110" x2="260" y2="110" stroke="rgba(255,106,0,0.6)" stroke-width="2.5"/>
    <polygon points="255,104 268,110 255,116" fill="rgba(255,106,0,0.6)"/>
    <!-- Bing Index node -->
    <rect x="265" y="70" width="180" height="80" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="355" y="98" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle" font-weight="600">Bing Search Index</text>
    <text x="355" y="118" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)" text-anchor="middle">Structured knowledge graph</text>
    <text x="355" y="138" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,150,255,0.8)" text-anchor="middle">Entities + Relationships</text>
    <!-- Arrow 2 (big, glowing) -->
    <line x1="355" y1="150" x2="355" y2="210" stroke="#FF6A00" stroke-width="3" filter="url(#glow16)"/>
    <polygon points="345,205 355,220 365,205" fill="#FF6A00"/>
    <text x="395" y="195" font-family="system-ui, sans-serif" font-size="9" fill="#FF6A00" font-weight="700">FEEDS INTO</text>
    <!-- ChatGPT node -->
    <rect x="140" y="225" width="310" height="130" rx="10" fill="rgba(255,106,0,0.1)" stroke="#FF6A00" stroke-width="2" filter="url(#glow16)" stroke-opacity="0.7"/>
    <rect x="160" y="240" width="40" height="40" rx="10" fill="rgba(255,106,0,0.2)"/>
    <text x="180" y="266" font-family="system-ui, sans-serif" font-size="16" fill="#FF6A00" text-anchor="middle" font-weight="700">AI</text>
    <text x="220" y="258" font-family="system-ui, sans-serif" font-size="14" fill="#FF6A00" font-weight="700">ChatGPT</text>
    <text x="220" y="276" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">Powered by Bing Search API</text>
    <text x="160" y="305" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; Uses Bing data for local queries</text>
    <text x="160" y="322" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; Cites businesses from Bing Places</text>
    <text x="160" y="339" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; Real-time data, not just training data</text>
    <!-- Impact box -->
    <rect x="20" y="375" width="430" height="80" rx="8" fill="rgba(255,106,0,0.08)" stroke="#FF6A00" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="235" y="398" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-weight="600">WHY THIS MATTERS</text>
    <text x="235" y="420" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle" font-weight="600">No Bing Places listing = Invisible to ChatGPT</text>
    <text x="235" y="440" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)" text-anchor="middle">Most businesses optimize Google but ignore Bing entirely.</text>
    <text x="235" y="452" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.45)" text-anchor="middle">That's like having a storefront but no address in the phone book.</text>
  </g>
  <circle cx="100" cy="130" r="60" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <rect x="40" y="40" width="200" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="140" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">ChatGPT Citation Series</text>
  <text x="80" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">The Bing Places</text>
  <text x="80" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">to ChatGPT</text>
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glow16)">Connection</text>
  <text x="80" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">The Hidden Data Pipeline</text>
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>