<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d3b3b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a2e35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative downward trending chart (rankings declining) -->
  <polyline points="880,120 940,140 1000,170 1040,230 1070,310 1090,410 1100,480" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Data points on the line -->
  <circle cx="880" cy="120" r="4" fill="rgba(255,255,255,0.12)"/>
  <circle cx="940" cy="140" r="4" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1000" cy="170" r="4" fill="rgba(255,255,255,0.08)"/>
  <circle cx="1040" cy="230" r="4" fill="rgba(255,255,255,0.07)"/>
  <circle cx="1070" cy="310" r="4" fill="rgba(255,255,255,0.06)"/>
  <circle cx="1090" cy="410" r="3" fill="rgba(255,255,255,0.05)"/>
  <!-- Strikethrough line motif -->
  <line x1="860" y1="300" x2="1160" y2="300" stroke="rgba(255,106,0,0.1)" stroke-width="2" stroke-dasharray="12 8"/>
  <!-- Faded "SEO" text being crossed out -->
  <text x="1020" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="700" fill="rgba(255,255,255,0.03)" text-anchor="middle">SEO</text>
  <line x1="950" y1="155" x2="1090" y2="155" stroke="rgba(255,106,0,0.06)" stroke-width="3"/>
  <!-- Subtle corner accent -->
  <rect x="40" y="500" width="80" height="3" rx="1.5" fill="rgba(255,106,0,0.1)"/>
  <rect x="40" y="510" width="50" height="3" rx="1.5" fill="rgba(255,106,0,0.07)"/>
  <!-- Category badge -->
  <rect x="40" y="40" width="230" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="155" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">Answer Engine Optimization</text>
  <!-- Title lines -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">Why Google Rankings</text>
  <text x="80" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#FF6A00">Don't Matter Anymore</text>
  <!-- Brand footer -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>