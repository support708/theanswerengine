<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d3b3b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2e35;stop-opacity:1" />
    </linearGradient>
    <filter id="glow6"><feGaussianBlur stdDeviation="6" result="blur6"/><feMerge><feMergeNode in="blur6"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoft6"><feGaussianBlur stdDeviation="12" result="blur6s"/><feMerge><feMergeNode in="blur6s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg6)"/>
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <!-- Google search results fading, AI answer glowing -->
  <g transform="translate(680, 55)">
    <!-- AI Answer box (glowing, on top) -->
    <rect x="30" y="0" width="400" height="130" rx="10" fill="rgba(255,106,0,0.1)" stroke="#FF6A00" stroke-width="2" filter="url(#glow6)" stroke-opacity="0.7"/>
    <rect x="50" y="12" width="60" height="18" rx="9" fill="rgba(255,106,0,0.25)"/>
    <text x="80" y="25" font-family="system-ui, sans-serif" font-size="8" fill="#FF6A00" text-anchor="middle" font-weight="700">AI ANSWER</text>
    <rect x="50" y="40" width="340" height="7" rx="3" fill="rgba(255,106,0,0.3)"/>
    <rect x="50" y="55" width="300" height="6" rx="3" fill="rgba(255,106,0,0.22)"/>
    <rect x="50" y="69" width="320" height="6" rx="3" fill="rgba(255,106,0,0.18)"/>
    <rect x="50" y="90" width="160" height="24" rx="6" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.5)" stroke-width="1.5"/>
    <text x="130" y="106" font-family="system-ui, sans-serif" font-size="9" fill="#FF6A00" text-anchor="middle" font-weight="600">Cited: Your Business &#x2713;</text>
    <!-- Separator with "replaces" arrow -->
    <text x="230" y="155" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-weight="600">&#x25BC; REPLACES &#x25BC;</text>
    <!-- Old Google results (faded, crossed out) -->
    <rect x="30" y="170" width="400" height="280" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="55" y="195" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.3)" font-weight="600">Search Results</text>
    <!-- Crossed out line over results -->
    <line x1="30" y1="170" x2="430" y2="450" stroke="rgba(255,80,80,0.3)" stroke-width="2.5"/>
    <line x1="430" y1="170" x2="30" y2="450" stroke="rgba(255,80,80,0.3)" stroke-width="2.5"/>
    <!-- Result 1 (faded) -->
    <rect x="50" y="210" width="350" height="50" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <text x="65" y="228" font-family="system-ui, sans-serif" font-size="10" fill="rgba(100,150,255,0.35)">www.example.com/services</text>
    <rect x="65" y="235" width="250" height="5" rx="2" fill="rgba(255,255,255,0.06)"/>
    <rect x="65" y="245" width="200" height="5" rx="2" fill="rgba(255,255,255,0.05)"/>
    <!-- Result 2 -->
    <rect x="50" y="270" width="350" height="50" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
    <text x="65" y="288" font-family="system-ui, sans-serif" font-size="10" fill="rgba(100,150,255,0.3)">www.competitor.com/page</text>
    <rect x="65" y="295" width="230" height="5" rx="2" fill="rgba(255,255,255,0.05)"/>
    <rect x="65" y="305" width="180" height="5" rx="2" fill="rgba(255,255,255,0.04)"/>
    <!-- Result 3 -->
    <rect x="50" y="330" width="350" height="50" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
    <text x="65" y="348" font-family="system-ui, sans-serif" font-size="10" fill="rgba(100,150,255,0.25)">www.another.com/info</text>
    <rect x="65" y="355" width="260" height="5" rx="2" fill="rgba(255,255,255,0.04)"/>
    <rect x="65" y="365" width="190" height="5" rx="2" fill="rgba(255,255,255,0.03)"/>
    <!-- #1 ranking badge (faded, irrelevant) -->
    <rect x="340" y="190" width="50" height="22" rx="4" fill="rgba(255,80,80,0.12)" stroke="rgba(255,80,80,0.3)" stroke-width="1"/>
    <text x="365" y="205" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.7)" text-anchor="middle" font-weight="600">#1 &#x2717;</text>
  </g>
  <circle cx="100" cy="140" r="60" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <rect x="40" y="40" width="230" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="155" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">Answer Engine Optimization</text>
  <text x="80" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Why Google Rankings</text>
  <text x="80" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Don't Matter</text>
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glow6)">Anymore</text>
  <text x="80" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">The Shift to AI-Powered Discovery</text>
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>