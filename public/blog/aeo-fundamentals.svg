<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8533;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative elements -->
  <circle cx="150" cy="150" r="100" stroke="#FF6A00" stroke-width="1" fill="none" opacity="0.15"/>
  <circle cx="150" cy="150" r="65" stroke="#FF6A00" stroke-width="1" fill="none" opacity="0.2"/>
  <circle cx="150" cy="150" r="35" stroke="#FF6A00" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- AI Platform nodes -->
  <circle cx="950" cy="200" r="70" stroke="#FF6A00" stroke-width="1.5" fill="none" opacity="0.3"/>
  <text x="950" y="210" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FF6A00" text-anchor="middle" opacity="0.8">ChatGPT</text>

  <circle cx="1050" cy="350" r="70" stroke="#FF6A00" stroke-width="1.5" fill="none" opacity="0.2"/>
  <text x="1050" y="360" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FF6A00" text-anchor="middle" opacity="0.6">Perplexity</text>

  <circle cx="900" cy="480" r="70" stroke="#FF6A00" stroke-width="1.5" fill="none" opacity="0.2"/>
  <text x="900" y="490" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FF6A00" text-anchor="middle" opacity="0.6">Google AI</text>

  <!-- Connection lines -->
  <path d="M 250 250 Q 600 200 880 180" stroke="#FF6A00" stroke-width="1.5" fill="none" opacity="0.2" stroke-dasharray="8,4"/>
  <path d="M 250 315 Q 600 330 980 350" stroke="#FF6A00" stroke-width="1.5" fill="none" opacity="0.2" stroke-dasharray="8,4"/>
  <path d="M 250 380 Q 600 430 830 460" stroke="#FF6A00" stroke-width="1.5" fill="none" opacity="0.2" stroke-dasharray="8,4"/>

  <!-- Schema/Data visualization -->
  <rect x="320" y="100" width="140" height="40" rx="6" stroke="#FF6A00" stroke-width="1" fill="none" opacity="0.3"/>
  <text x="390" y="128" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#FF6A00" text-anchor="middle" opacity="0.7">Schema Markup</text>

  <rect x="320" y="170" width="140" height="40" rx="6" stroke="#FF6A00" stroke-width="1" fill="none" opacity="0.3"/>
  <text x="390" y="198" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#FF6A00" text-anchor="middle" opacity="0.7">NAP Consistency</text>

  <rect x="320" y="240" width="140" height="40" rx="6" stroke="#FF6A00" stroke-width="1" fill="none" opacity="0.3"/>
  <text x="390" y="268" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#FF6A00" text-anchor="middle" opacity="0.7">E-E-A-T Signals</text>

  <rect x="320" y="310" width="140" height="40" rx="6" stroke="#FF6A00" stroke-width="1" fill="none" opacity="0.3"/>
  <text x="390" y="338" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#FF6A00" text-anchor="middle" opacity="0.7">Citations</text>

  <rect x="320" y="380" width="140" height="40" rx="6" stroke="#FF6A00" stroke-width="1" fill="none" opacity="0.3"/>
  <text x="390" y="408" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#FF6A00" text-anchor="middle" opacity="0.7">Unique Content</text>

  <!-- Main title -->
  <text x="600" y="480" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="52" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-1">
    AEO Fundamentals
  </text>

  <text x="600" y="540" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="28" font-weight="600" fill="#FF6A00" text-anchor="middle">
    Master AI Search Visibility
  </text>

  <!-- Footer accent -->
  <rect x="0" y="590" width="1200" height="40" fill="url(#accentGradient)" opacity="0.1"/>
  <line x1="0" y1="590" x2="1200" y2="590" stroke="#FF6A00" stroke-width="2" opacity="0.3"/>
</svg>
