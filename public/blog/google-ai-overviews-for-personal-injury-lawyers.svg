<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Google AI Overviews for Personal Injury Lawyers — The Answer Engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131313"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F27D24"/>
      <stop offset="100%" stop-color="#cc5500"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F27D24" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#F27D24" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#F27D24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient glow -->
  <ellipse cx="950" cy="180" rx="520" ry="340" fill="url(#glow)"/>
  <ellipse cx="180" cy="520" rx="380" ry="240" fill="url(#glow)" opacity="0.6"/>

  <!-- Mock Google AI Overview panel (right side) -->
  <g transform="translate(720,90)" opacity="0.96">
    <!-- Panel container -->
    <rect x="0" y="0" width="420" height="450" rx="14" fill="#0f0f10" stroke="#F27D24" stroke-width="1.5" stroke-opacity="0.65"/>

    <!-- AI Overview label bar -->
    <rect x="0" y="0" width="420" height="38" rx="14" fill="#F27D24" fill-opacity="0.12"/>
    <rect x="0" y="22" width="420" height="16" fill="#F27D24" fill-opacity="0.12"/>
    <circle cx="22" cy="19" r="6" fill="#F27D24"/>
    <text x="38" y="24" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#F27D24" letter-spacing="1.5">AI OVERVIEW</text>
    <text x="394" y="24" font-family="Courier New, monospace" font-size="9" font-weight="700" fill="#F27D24" fill-opacity="0.55" text-anchor="end" letter-spacing="1">GENERATED</text>

    <!-- Synthesized answer body (faux lines) -->
    <g>
      <rect x="24" y="64" width="372" height="9" rx="2" fill="#e5e2e1" fill-opacity="0.78"/>
      <rect x="24" y="80" width="340" height="9" rx="2" fill="#e5e2e1" fill-opacity="0.68"/>
      <rect x="24" y="96" width="356" height="9" rx="2" fill="#e5e2e1" fill-opacity="0.68"/>
      <rect x="24" y="112" width="280" height="9" rx="2" fill="#e5e2e1" fill-opacity="0.6"/>
      <rect x="24" y="138" width="372" height="9" rx="2" fill="#e5e2e1" fill-opacity="0.6"/>
      <rect x="24" y="154" width="320" height="9" rx="2" fill="#e5e2e1" fill-opacity="0.5"/>
    </g>

    <!-- Divider -->
    <line x1="24" y1="195" x2="396" y2="195" stroke="#F27D24" stroke-width="1" stroke-opacity="0.35"/>

    <!-- Cited sources header -->
    <text x="24" y="220" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#F27D24" letter-spacing="1.5">CITED SOURCES</text>
    <text x="396" y="220" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#F27D24" fill-opacity="0.55" text-anchor="end">3 / 5</text>

    <!-- Source 1 (highlighted - TAE/PI Firm slot) -->
    <g transform="translate(24,240)">
      <rect x="0" y="0" width="372" height="48" rx="6" fill="#F27D24" fill-opacity="0.1" stroke="#F27D24" stroke-width="1.5"/>
      <rect x="10" y="10" width="28" height="28" rx="4" fill="#F27D24"/>
      <text x="24" y="29" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="900" fill="#0a0a0a" text-anchor="middle">PI</text>
      <rect x="48" y="14" width="180" height="8" rx="2" fill="#e5e2e1" fill-opacity="0.9"/>
      <rect x="48" y="28" width="120" height="6" rx="2" fill="#F27D24" fill-opacity="0.7"/>
      <text x="358" y="30" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#F27D24" text-anchor="end">#1</text>
    </g>

    <!-- Source 2 -->
    <g transform="translate(24,296)">
      <rect x="0" y="0" width="372" height="44" rx="6" fill="#1a1a1a" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12"/>
      <circle cx="22" cy="22" r="11" fill="#1a1a1a" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4"/>
      <rect x="44" y="13" width="160" height="7" rx="2" fill="#e5e2e1" fill-opacity="0.55"/>
      <rect x="44" y="25" width="100" height="6" rx="2" fill="#e5e2e1" fill-opacity="0.3"/>
      <text x="358" y="28" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#e5e2e1" fill-opacity="0.45" text-anchor="end">#2</text>
    </g>

    <!-- Source 3 -->
    <g transform="translate(24,348)">
      <rect x="0" y="0" width="372" height="44" rx="6" fill="#1a1a1a" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12"/>
      <circle cx="22" cy="22" r="11" fill="#1a1a1a" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4"/>
      <rect x="44" y="13" width="140" height="7" rx="2" fill="#e5e2e1" fill-opacity="0.5"/>
      <rect x="44" y="25" width="80" height="6" rx="2" fill="#e5e2e1" fill-opacity="0.28"/>
      <text x="358" y="28" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#e5e2e1" fill-opacity="0.45" text-anchor="end">#3</text>
    </g>

    <!-- Empty slots (4, 5) -->
    <g transform="translate(24,400)">
      <rect x="0" y="0" width="180" height="32" rx="6" fill="none" stroke="#F27D24" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4"/>
      <text x="90" y="21" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#F27D24" fill-opacity="0.5" text-anchor="middle">SLOT #4 OPEN</text>
    </g>
    <g transform="translate(216,400)">
      <rect x="0" y="0" width="180" height="32" rx="6" fill="none" stroke="#F27D24" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4"/>
      <text x="90" y="21" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#F27D24" fill-opacity="0.5" text-anchor="middle">SLOT #5 OPEN</text>
    </g>
  </g>

  <!-- Left-side text -->
  <g transform="translate(60,120)">
    <!-- Eyebrow -->
    <rect x="0" y="0" width="3" height="14" fill="#F27D24"/>
    <text x="14" y="12" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#F27D24" letter-spacing="2.5">INDUSTRY GUIDES / AEO</text>

    <!-- Main headline -->
    <text x="0" y="62" font-family="Space Grotesk, Inter, sans-serif" font-size="46" font-weight="900" fill="#e5e2e1" letter-spacing="-2">GOOGLE AI</text>
    <text x="0" y="112" font-family="Space Grotesk, Inter, sans-serif" font-size="46" font-weight="900" fill="#e5e2e1" letter-spacing="-2">OVERVIEWS FOR</text>
    <text x="0" y="162" font-family="Space Grotesk, Inter, sans-serif" font-size="46" font-weight="900" fill="url(#orange)" letter-spacing="-2">PERSONAL INJURY</text>
    <text x="0" y="212" font-family="Space Grotesk, Inter, sans-serif" font-size="46" font-weight="900" fill="url(#orange)" letter-spacing="-2">LAWYERS</text>

    <!-- Subheadline -->
    <text x="0" y="262" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#e5e2e1" fill-opacity="0.7">3–5 firms get cited. The rest stay invisible.</text>
    <text x="0" y="285" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#e5e2e1" fill-opacity="0.7">The cited-source quintet playbook for PI practices.</text>

    <!-- Stats row -->
    <g transform="translate(0,330)">
      <text x="0" y="0" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="900" fill="#F27D24" letter-spacing="-1">84–91%</text>
      <text x="0" y="22" font-family="Courier New, monospace" font-size="10" fill="#e5e2e1" fill-opacity="0.55" letter-spacing="0.5">PI QUERIES TRIGGERING AIO</text>
    </g>
    <g transform="translate(220,330)">
      <text x="0" y="0" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="900" fill="#F27D24" letter-spacing="-1">3.8x</text>
      <text x="0" y="22" font-family="Courier New, monospace" font-size="10" fill="#e5e2e1" fill-opacity="0.55" letter-spacing="0.5">CTR LIFT FOR CITED SOURCES</text>
    </g>
    <g transform="translate(380,330)">
      <text x="0" y="0" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="900" fill="#F27D24" letter-spacing="-1">3–5</text>
      <text x="0" y="22" font-family="Courier New, monospace" font-size="10" fill="#e5e2e1" fill-opacity="0.55" letter-spacing="0.5">CITED SLOTS PER OVERVIEW</text>
    </g>
  </g>

  <!-- Footer branding -->
  <g transform="translate(60,560)">
    <rect x="0" y="0" width="3" height="36" fill="#F27D24"/>
    <text x="14" y="16" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="900" fill="#e5e2e1" letter-spacing="0.5">THE ANSWER ENGINE</text>
    <text x="14" y="32" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#F27D24" fill-opacity="0.7" letter-spacing="1.5">theanswerengine.ai · GEO/AEO OPERATORS</text>
  </g>
</svg>
