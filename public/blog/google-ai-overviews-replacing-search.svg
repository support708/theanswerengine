<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#172554;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Search icon to AI icon transition -->
  <circle cx="400" cy="280" r="60" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none"/>
  <line x1="440" y1="320" x2="480" y2="360" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- Arrow -->
  <line x1="530" y1="290" x2="650" y2="290" stroke="rgba(255,106,0,0.4)" stroke-width="2"/>
  <polygon points="650,280 670,290 650,300" fill="rgba(255,106,0,0.4)"/>
  <!-- AI brain icon (simplified) -->
  <circle cx="760" cy="280" r="60" stroke="rgba(255,106,0,0.3)" stroke-width="2" fill="rgba(255,106,0,0.05)"/>
  <circle cx="745" cy="270" r="5" fill="rgba(255,106,0,0.5)"/>
  <circle cx="775" cy="270" r="5" fill="rgba(255,106,0,0.5)"/>
  <line x1="745" y1="270" x2="775" y2="270" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <circle cx="760" cy="295" r="4" fill="rgba(255,106,0,0.5)"/>
  <line x1="745" y1="270" x2="760" y2="295" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <line x1="775" y1="270" x2="760" y2="295" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <!-- Category pill -->
  <rect x="40" y="40" width="150" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="115" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">AEO Education</text>
  <!-- Title -->
  <text x="600" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white" text-anchor="middle">Google AI Overviews</text>
  <text x="600" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="#FF6A00" text-anchor="middle">Replacing Traditional Search</text>
  <!-- Footer -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>