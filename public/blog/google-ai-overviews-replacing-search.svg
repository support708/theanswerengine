<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGAOR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e0d3b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1a3b;stop-opacity:1" />
    </linearGradient>
    <filter id="glowGAOR"><feGaussianBlur stdDeviation="6" result="blurGAOR"/><feMerge><feMergeNode in="blurGAOR"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGAOR)"/>
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <!-- Search Evolution Timeline -->
  <g transform="translate(660, 45)">
    <rect x="0" y="0" width="470" height="470" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="235" y="28" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600">SEARCH EVOLUTION</text>
    <!-- Before: Google SERP mockup -->
    <rect x="20" y="42" width="200" height="180" rx="8" fill="rgba(255,80,80,0.06)" stroke="rgba(255,80,80,0.4)" stroke-width="1.5"/>
    <text x="120" y="62" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.9)" text-anchor="middle" font-weight="600">TRADITIONAL SEARCH</text>
    <!-- Fake search results with red X -->
    <rect x="32" y="72" width="175" height="18" rx="3" fill="rgba(255,255,255,0.04)"/>
    <text x="40" y="85" font-family="system-ui, sans-serif" font-size="7" fill="rgba(100,150,255,0.7)">Result 1 - website.com</text>
    <rect x="32" y="95" width="175" height="18" rx="3" fill="rgba(255,255,255,0.04)"/>
    <text x="40" y="108" font-family="system-ui, sans-serif" font-size="7" fill="rgba(100,150,255,0.7)">Result 2 - another.com</text>
    <rect x="32" y="118" width="175" height="18" rx="3" fill="rgba(255,255,255,0.04)"/>
    <text x="40" y="131" font-family="system-ui, sans-serif" font-size="7" fill="rgba(100,150,255,0.7)">Result 3 - site.com</text>
    <rect x="32" y="141" width="175" height="18" rx="3" fill="rgba(255,255,255,0.04)"/>
    <text x="40" y="154" font-family="system-ui, sans-serif" font-size="7" fill="rgba(100,150,255,0.5)">Result 4 - example.com</text>
    <!-- Declining arrow -->
    <text x="120" y="195" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,80,80,0.9)" text-anchor="middle" font-weight="700">&#x2193; -40% CTR</text>
    <!-- Arrow -->
    <text x="235" y="140" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,106,0,0.6)" text-anchor="middle">&#x2192;</text>
    <!-- After: AI Overview mockup -->
    <rect x="250" y="42" width="200" height="180" rx="8" fill="rgba(255,106,0,0.08)" stroke="#FF6A00" stroke-width="1.5" stroke-opacity="0.6" filter="url(#glowGAOR)"/>
    <text x="350" y="62" font-family="system-ui, sans-serif" font-size="9" fill="#FF6A00" text-anchor="middle" font-weight="600">AI OVERVIEW</text>
    <rect x="262" y="72" width="175" height="90" rx="6" fill="rgba(255,106,0,0.06)"/>
    <text x="270" y="88" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.7)">Based on multiple sources,</text>
    <text x="270" y="100" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.7)">the best plumber in Austin is...</text>
    <text x="270" y="118" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.5)">[AI-generated answer with</text>
    <text x="270" y="130" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.5)">cited sources]</text>
    <rect x="262" y="145" width="70" height="14" rx="3" fill="rgba(255,106,0,0.2)"/>
    <text x="297" y="155" font-family="system-ui, sans-serif" font-size="7" fill="#FF6A00" text-anchor="middle" font-weight="600">CITED</text>
    <text x="350" y="195" font-family="system-ui, sans-serif" font-size="10" fill="rgba(100,220,100,0.9)" text-anchor="middle" font-weight="700">&#x2191; 85% of clicks</text>
    <!-- Stats -->
    <text x="20" y="250" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">AI OVERVIEW ADOPTION RATE</text>
    <rect x="20" y="262" width="430" height="45" rx="6" fill="rgba(255,255,255,0.03)"/>
    <text x="35" y="282" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">2024</text>
    <rect x="80" y="272" width="360" height="14" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="80" y="272" width="108" height="14" rx="3" fill="rgba(255,200,50,0.5)"/>
    <text x="198" y="283" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,200,50,0.9)" font-weight="700">30%</text>
    <text x="35" y="300" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">2026</text>
    <rect x="80" y="290" width="360" height="14" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="80" y="290" width="288" height="14" rx="3" fill="rgba(255,106,0,0.5)"/>
    <text x="378" y="301" font-family="system-ui, sans-serif" font-size="8" fill="#FF6A00" font-weight="700">80%</text>
    <!-- Impact metrics -->
    <line x1="20" y1="320" x2="450" y2="320" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <text x="20" y="345" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">IMPACT ON BUSINESSES</text>
    <text x="30" y="370" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.9)">&#x2717; 65% of searches now zero-click</text>
    <text x="30" y="388" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.9)">&#x2717; Organic traffic declining 15% yearly</text>
    <text x="30" y="406" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; AI Overview sources get 3x more clicks</text>
    <text x="30" y="424" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; Schema markup increases AIO inclusion 4x</text>
    <!-- Bottom verdict -->
    <rect x="20" y="438" width="430" height="20" rx="4" fill="rgba(255,106,0,0.1)" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="235" y="453" font-family="system-ui, sans-serif" font-size="9" fill="#FF6A00" text-anchor="middle" font-weight="600">Adapt now or lose 80% of your search traffic</text>
  </g>
  <circle cx="100" cy="130" r="60" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <rect x="40" y="40" width="150" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="115" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">AEO Education</text>
  <text x="80" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Google AI Overviews</text>
  <text x="80" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Are Replacing</text>
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glowGAOR)">Traditional Search</text>
  <text x="80" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">What This Means for Your Business</text>
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>