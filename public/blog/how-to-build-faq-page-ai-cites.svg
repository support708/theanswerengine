<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feMerge><feMergeNode in="blur1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow1b" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1b"/>
      <feMerge><feMergeNode in="blur1b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg1)"/>
  <!-- Subtle background pattern lines -->
  <line x1="0" y1="100" x2="1200" y2="100" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="200" x2="1200" y2="200" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="400" x2="1200" y2="400" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="500" x2="1200" y2="500" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <!-- FAQ Q&A blocks -->
  <!-- Block 1 -->
  <rect x="780" y="120" width="340" height="70" rx="8" stroke="rgba(255,106,0,0.25)" stroke-width="1" fill="rgba(255,106,0,0.05)"/>
  <text x="805" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FF6A00">Q:</text>
  <rect x="822" y="135" width="160" height="8" rx="4" fill="rgba(255,255,255,0.12)"/>
  <text x="805" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.4)">A:</text>
  <rect x="822" y="162" width="270" height="6" rx="3" fill="rgba(255,255,255,0.07)"/>
  <rect x="822" y="174" width="220" height="6" rx="3" fill="rgba(255,255,255,0.05)"/>
  <!-- Block 2 -->
  <rect x="810" y="210" width="340" height="70" rx="8" stroke="rgba(255,106,0,0.2)" stroke-width="1" fill="rgba(255,106,0,0.04)"/>
  <text x="835" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FF6A00">Q:</text>
  <rect x="852" y="225" width="200" height="8" rx="4" fill="rgba(255,255,255,0.12)"/>
  <text x="835" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.4)">A:</text>
  <rect x="852" y="252" width="250" height="6" rx="3" fill="rgba(255,255,255,0.07)"/>
  <rect x="852" y="264" width="180" height="6" rx="3" fill="rgba(255,255,255,0.05)"/>
  <!-- Block 3 -->
  <rect x="780" y="300" width="340" height="70" rx="8" stroke="rgba(255,106,0,0.15)" stroke-width="1" fill="rgba(255,106,0,0.03)"/>
  <text x="805" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FF6A00">Q:</text>
  <rect x="822" y="315" width="180" height="8" rx="4" fill="rgba(255,255,255,0.12)"/>
  <text x="805" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.4)">A:</text>
  <rect x="822" y="342" width="260" height="6" rx="3" fill="rgba(255,255,255,0.07)"/>
  <rect x="822" y="354" width="200" height="6" rx="3" fill="rgba(255,255,255,0.05)"/>
  <!-- Large question mark with glow -->
  <text x="720" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="200" font-weight="700" fill="rgba(255,106,0,0.06)" filter="url(#glow1b)">?</text>
  <!-- Citation arrows -->
  <line x1="760" y1="155" x2="780" y2="155" stroke="#FF6A00" stroke-width="1.5" opacity="0.5" filter="url(#glow1)"/>
  <polygon points="778,151 786,155 778,159" fill="#FF6A00" opacity="0.5"/>
  <line x1="790" y1="245" x2="810" y2="245" stroke="#FF6A00" stroke-width="1.5" opacity="0.4" filter="url(#glow1)"/>
  <polygon points="808,241 816,245 808,249" fill="#FF6A00" opacity="0.4"/>
  <line x1="760" y1="335" x2="780" y2="335" stroke="#FF6A00" stroke-width="1.5" opacity="0.3" filter="url(#glow1)"/>
  <polygon points="778,331 786,335 778,339" fill="#FF6A00" opacity="0.3"/>
  <!-- Citation bracket -->
  <text x="1050" y="165" font-family="monospace" font-size="11" fill="rgba(255,106,0,0.4)" filter="url(#glow1)">[cited]</text>
  <text x="1080" y="255" font-family="monospace" font-size="11" fill="rgba(255,106,0,0.3)">[cited]</text>
  <text x="1050" y="345" font-family="monospace" font-size="11" fill="rgba(255,106,0,0.25)">[cited]</text>
  <!-- Schema markup hint -->
  <text x="830" y="420" font-family="monospace" font-size="10" fill="rgba(255,106,0,0.2)">&lt;FAQPage&gt;</text>
  <text x="850" y="435" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.1)">&lt;Question&gt;...&lt;/Question&gt;</text>
  <text x="850" y="450" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.1)">&lt;Answer&gt;...&lt;/Answer&gt;</text>
  <text x="830" y="465" font-family="monospace" font-size="10" fill="rgba(255,106,0,0.2)">&lt;/FAQPage&gt;</text>
  <!-- Category pill -->
  <rect x="40" y="40" width="130" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="105" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">How-To Guides</text>
  <!-- Title -->
  <text x="80" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">Build FAQ Pages</text>
  <text x="80" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">That</text>
  <text x="205" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#FF6A00" filter="url(#glow1)">AI Cites</text>
  <!-- Subtitle -->
  <text x="80" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="rgba(255,255,255,0.45)">Structure Your Answers for AI Platforms</text>
  <!-- Branding -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>