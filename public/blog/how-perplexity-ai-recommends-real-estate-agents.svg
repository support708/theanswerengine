<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="How Perplexity AI Recommends Real Estate Agents — The Freshness Trick — The Answer Engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131313"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F27D24"/>
      <stop offset="100%" stop-color="#cc5500"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F27D24" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#F27D24" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#F27D24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient glow -->
  <ellipse cx="950" cy="180" rx="520" ry="340" fill="url(#glow)"/>
  <ellipse cx="180" cy="520" rx="380" ry="240" fill="url(#glow)" opacity="0.6"/>

  <!-- Right side: freshness decay panel -->
  <g transform="translate(720,90)" opacity="0.96">
    <!-- Panel container -->
    <rect x="0" y="0" width="420" height="450" rx="14" fill="#0f0f10" stroke="#F27D24" stroke-width="1.5" stroke-opacity="0.65"/>

    <!-- Header bar -->
    <rect x="0" y="0" width="420" height="38" rx="14" fill="#F27D24" fill-opacity="0.12"/>
    <rect x="0" y="22" width="420" height="16" fill="#F27D24" fill-opacity="0.12"/>
    <circle cx="22" cy="19" r="6" fill="#F27D24"/>
    <text x="38" y="24" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#F27D24" letter-spacing="1.5">RECENCY DECAY CURVE</text>
    <text x="394" y="24" font-family="Courier New, monospace" font-size="9" font-weight="700" fill="#F27D24" fill-opacity="0.55" text-anchor="end" letter-spacing="1">PERPLEXITY</text>

    <!-- Decay curve chart background -->
    <g transform="translate(24,58)">
      <!-- Axis -->
      <line x1="0" y1="160" x2="372" y2="160" stroke="#F27D24" stroke-width="1" stroke-opacity="0.35"/>
      <line x1="0" y1="0" x2="0" y2="160" stroke="#F27D24" stroke-width="1" stroke-opacity="0.35"/>

      <!-- Decay curve path: starts high at left (14d), plateaus mid (30-90d), drops at right (180d+) -->
      <path d="M 0 12 C 60 18, 90 80, 140 110 C 200 130, 260 138, 310 148 L 372 158"
            fill="none" stroke="url(#orange)" stroke-width="3" stroke-linecap="round"/>
      <!-- Fill under curve -->
      <path d="M 0 12 C 60 18, 90 80, 140 110 C 200 130, 260 138, 310 148 L 372 158 L 372 160 L 0 160 Z"
            fill="#F27D24" fill-opacity="0.08"/>

      <!-- Markers -->
      <circle cx="0" cy="12" r="5" fill="#F27D24"/>
      <circle cx="100" cy="92" r="4" fill="#F27D24" fill-opacity="0.7"/>
      <circle cx="310" cy="148" r="4" fill="#e5e2e1" fill-opacity="0.5"/>

      <!-- Labels -->
      <text x="0" y="178" font-family="Courier New, monospace" font-size="9" font-weight="700" fill="#F27D24" letter-spacing="1">14D</text>
      <text x="100" y="178" font-family="Courier New, monospace" font-size="9" font-weight="700" fill="#F27D24" fill-opacity="0.7" letter-spacing="1">30D</text>
      <text x="200" y="178" font-family="Courier New, monospace" font-size="9" font-weight="700" fill="#e5e2e1" fill-opacity="0.5" letter-spacing="1">90D</text>
      <text x="310" y="178" font-family="Courier New, monospace" font-size="9" font-weight="700" fill="#e5e2e1" fill-opacity="0.5" letter-spacing="1">180D+</text>

      <text x="-2" y="2" font-family="Courier New, monospace" font-size="9" font-weight="700" fill="#F27D24" letter-spacing="1" text-anchor="end" transform="rotate(-90 -2 2)">CITATION ELIGIBILITY</text>
    </g>

    <!-- Divider -->
    <line x1="24" y1="262" x2="396" y2="262" stroke="#F27D24" stroke-width="1" stroke-opacity="0.35"/>

    <!-- Freshness premium callout -->
    <text x="210" y="290" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#F27D24" letter-spacing="1.5" text-anchor="middle">14-DAY CADENCE LIFT</text>
    <text x="210" y="358" font-family="Space Grotesk, sans-serif" font-size="74" font-weight="900" fill="url(#orange)" text-anchor="middle" letter-spacing="-3">24–38%</text>
    <text x="210" y="384" font-family="Courier New, monospace" font-size="9" font-weight="700" fill="#e5e2e1" fill-opacity="0.55" text-anchor="middle" letter-spacing="1.5">VS PUBLISH-AND-LEAVE</text>

    <!-- Time-to-first-citation ledger -->
    <g transform="translate(24,400)">
      <rect x="0" y="0" width="372" height="34" rx="6" fill="#F27D24" fill-opacity="0.1" stroke="#F27D24" stroke-width="1.5"/>
      <text x="14" y="22" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#F27D24" letter-spacing="1">FIRST-CITATION MEDIAN</text>
      <text x="358" y="23" font-family="Space Grotesk, sans-serif" font-size="16" font-weight="900" fill="#F27D24" text-anchor="end">41 DAYS</text>
    </g>
  </g>

  <!-- Left-side text -->
  <g transform="translate(60,120)">
    <!-- Eyebrow -->
    <rect x="0" y="0" width="3" height="14" fill="#F27D24"/>
    <text x="14" y="12" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#F27D24" letter-spacing="2.5">PERPLEXITY / REAL ESTATE</text>

    <!-- Main headline -->
    <text x="0" y="62" font-family="Space Grotesk, Inter, sans-serif" font-size="46" font-weight="900" fill="#e5e2e1" letter-spacing="-2">HOW PERPLEXITY</text>
    <text x="0" y="112" font-family="Space Grotesk, Inter, sans-serif" font-size="46" font-weight="900" fill="#e5e2e1" letter-spacing="-2">RECOMMENDS</text>
    <text x="0" y="162" font-family="Space Grotesk, Inter, sans-serif" font-size="46" font-weight="900" fill="url(#orange)" letter-spacing="-2">REAL ESTATE AGENTS</text>
    <text x="0" y="212" font-family="Space Grotesk, Inter, sans-serif" font-size="32" font-weight="900" fill="#e5e2e1" letter-spacing="-1.5">+ THE FRESHNESS TRICK</text>

    <!-- Subheadline -->
    <text x="0" y="262" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#e5e2e1" fill-opacity="0.7">The retrieval-layer mechanics behind cited-source slots.</text>
    <text x="0" y="285" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#e5e2e1" fill-opacity="0.7">The 14-day cadence that captures the recency premium.</text>

    <!-- Stats row -->
    <g transform="translate(0,330)">
      <text x="0" y="0" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="900" fill="#F27D24" letter-spacing="-1">14d</text>
      <text x="0" y="22" font-family="Courier New, monospace" font-size="10" fill="#e5e2e1" fill-opacity="0.55" letter-spacing="0.5">OPTIMAL REFRESH CADENCE</text>
    </g>
    <g transform="translate(180,330)">
      <text x="0" y="0" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="900" fill="#F27D24" letter-spacing="-1">68–81%</text>
      <text x="0" y="22" font-family="Courier New, monospace" font-size="10" fill="#e5e2e1" fill-opacity="0.55" letter-spacing="0.5">AUTHORITY STACK LOCK SHARE</text>
    </g>
    <g transform="translate(420,330)">
      <text x="0" y="0" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="900" fill="#F27D24" letter-spacing="-1">4-STAGE</text>
      <text x="0" y="22" font-family="Courier New, monospace" font-size="10" fill="#e5e2e1" fill-opacity="0.55" letter-spacing="0.5">RETRIEVAL PIPELINE</text>
    </g>
  </g>

  <!-- Footer branding -->
  <g transform="translate(60,560)">
    <rect x="0" y="0" width="3" height="36" fill="#F27D24"/>
    <text x="14" y="16" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="900" fill="#e5e2e1" letter-spacing="0.5">THE ANSWER ENGINE</text>
    <text x="14" y="32" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#F27D24" fill-opacity="0.7" letter-spacing="1.5">theanswerengine.ai · GEO/AEO OPERATORS</text>
  </g>
</svg>
