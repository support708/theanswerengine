<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge><feMergeNode in="blur2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2b" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur2b"/>
      <feMerge><feMergeNode in="blur2b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg2)"/>
  <!-- Subtle background pattern lines -->
  <line x1="0" y1="105" x2="1200" y2="105" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="210" x2="1200" y2="210" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="315" x2="1200" y2="315" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="525" x2="1200" y2="525" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <line x1="240" y1="0" x2="240" y2="630" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <line x1="480" y1="0" x2="480" y2="630" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <line x1="720" y1="0" x2="720" y2="630" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <line x1="960" y1="0" x2="960" y2="630" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <!-- Perplexity-style search results panel -->
  <rect x="750" y="100" width="380" height="400" rx="12" stroke="rgba(255,255,255,0.08)" stroke-width="1" fill="rgba(255,255,255,0.03)"/>
  <!-- Search bar -->
  <rect x="775" y="120" width="330" height="36" rx="18" stroke="rgba(255,255,255,0.12)" stroke-width="1" fill="rgba(255,255,255,0.04)"/>
  <circle cx="800" cy="138" r="8" stroke="rgba(255,255,255,0.2)" stroke-width="1" fill="none"/>
  <line x1="806" y1="144" x2="812" y2="150" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <rect x="820" y="133" width="140" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
  <!-- Result 1: Competitor (cited, highlighted) -->
  <rect x="775" y="175" width="330" height="85" rx="6" stroke="rgba(255,106,0,0.35)" stroke-width="1.5" fill="rgba(255,106,0,0.08)" filter="url(#glow2b)"/>
  <circle cx="795" cy="195" r="8" fill="rgba(255,106,0,0.3)"/>
  <text x="795" y="199" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FF6A00" text-anchor="middle">1</text>
  <rect x="812" y="189" width="180" height="10" rx="5" fill="rgba(255,106,0,0.25)"/>
  <text x="1060" y="199" font-family="monospace" font-size="9" fill="#FF6A00" text-anchor="end" filter="url(#glow2)">[cited]</text>
  <rect x="812" y="210" width="260" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
  <rect x="812" y="222" width="230" height="6" rx="3" fill="rgba(255,255,255,0.07)"/>
  <rect x="812" y="234" width="200" height="6" rx="3" fill="rgba(255,255,255,0.05)"/>
  <text x="795" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="rgba(255,106,0,0.5)">competitor-site.com</text>
  <!-- Result 2: Competitor (cited) -->
  <rect x="775" y="275" width="330" height="75" rx="6" stroke="rgba(255,106,0,0.2)" stroke-width="1" fill="rgba(255,106,0,0.04)"/>
  <circle cx="795" cy="295" r="8" fill="rgba(255,106,0,0.2)"/>
  <text x="795" y="299" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="rgba(255,106,0,0.7)" text-anchor="middle">2</text>
  <rect x="812" y="289" width="160" height="10" rx="5" fill="rgba(255,106,0,0.15)"/>
  <text x="1060" y="299" font-family="monospace" font-size="9" fill="rgba(255,106,0,0.5)" text-anchor="end">[cited]</text>
  <rect x="812" y="310" width="240" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="812" y="322" width="210" height="6" rx="3" fill="rgba(255,255,255,0.05)"/>
  <text x="795" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="rgba(255,106,0,0.4)">another-competitor.com</text>
  <!-- Result 3: YOUR business (missing / not cited) -->
  <rect x="775" y="365" width="330" height="60" rx="6" stroke="rgba(255,255,255,0.06)" stroke-width="1" fill="rgba(255,255,255,0.015)" stroke-dasharray="6,4"/>
  <text x="940" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="rgba(255,255,255,0.15)" text-anchor="middle">Your business</text>
  <text x="940" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="rgba(255,80,80,0.4)" text-anchor="middle">not found</text>
  <!-- X mark for missing -->
  <line x1="1070" y1="385" x2="1085" y2="400" stroke="rgba(255,80,80,0.35)" stroke-width="2"/>
  <line x1="1085" y1="385" x2="1070" y2="400" stroke="rgba(255,80,80,0.35)" stroke-width="2"/>
  <!-- "Sources" label -->
  <text x="775" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.2)">Sources: 2 cited, 0 from your domain</text>
  <!-- Category pill -->
  <rect x="40" y="40" width="180" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="130" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">Competitive Analysis</text>
  <!-- Title -->
  <text x="80" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Why Competitors</text>
  <text x="80" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glow2)">Win on Perplexity</text>
  <!-- Subtitle -->
  <text x="80" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="rgba(255,255,255,0.45)">Close the AI Citation Gap</text>
  <!-- Branding -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>