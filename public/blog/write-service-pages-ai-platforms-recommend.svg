<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#064e3b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative document/page outlines -->
  <rect x="920" y="120" width="120" height="160" rx="8" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <line x1="940" y1="155" x2="1020" y2="155" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="940" y1="175" x2="1000" y2="175" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="940" y1="195" x2="1010" y2="195" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="940" y1="215" x2="980" y2="215" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Checkmark -->
  <circle cx="1080" cy="140" r="18" fill="rgba(255,106,0,0.1)" stroke="rgba(255,106,0,0.2)" stroke-width="1.5"/>
  <polyline points="1070,140 1077,148 1092,133" fill="none" stroke="rgba(255,106,0,0.3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Floating brackets -->
  <text x="880" y="420" font-family="monospace" font-size="60" fill="rgba(255,255,255,0.04)">{</text>
  <text x="1100" y="420" font-family="monospace" font-size="60" fill="rgba(255,255,255,0.04)">}</text>
  <!-- Category badge -->
  <rect x="40" y="40" width="140" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="110" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">AEO Education</text>
  <!-- Title -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">Write Service Pages</text>
  <text x="80" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">AI Platforms</text>
  <text x="80" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#FF6A00">Recommend</text>
  <!-- Footer -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>