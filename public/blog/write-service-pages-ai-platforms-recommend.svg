      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3b0d;stop-opacity:1" />
    </linearGradient>
    <filter id="glow20"><feGaussianBlur stdDeviation="6" result="blur20"/><feMerge><feMergeNode in="blur20"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
