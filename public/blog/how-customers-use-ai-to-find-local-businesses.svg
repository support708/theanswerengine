<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgHCAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b4e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1b4e;stop-opacity:1" />
    </linearGradient>
    <filter id="glowHCAI"><feGaussianBlur stdDeviation="6" result="blurHCAI"/><feMerge><feMergeNode in="blurHCAI"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="nodGlowHCAI"><feGaussianBlur stdDeviation="3" result="ngHCAI"/><feMerge><feMergeNode in="ngHCAI"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgHCAI)"/>
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <!-- Right Panel: Data Pipeline -->
  <g transform="translate(645, 48)">
    <rect x="0" y="0" width="485" height="440" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="242" y="28" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600">AI DISCOVERY PIPELINE</text>
    <!-- Node 1: Customer Query -->
    <rect x="30" y="52" width="190" height="65" rx="10" fill="rgba(100,140,255,0.1)" stroke="rgba(100,140,255,0.4)" stroke-width="1.5"/>
    <text x="125" y="75" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-weight="600">STEP 1</text>
    <text x="125" y="95" font-family="system-ui, sans-serif" font-size="13" fill="rgba(100,140,255,0.9)" text-anchor="middle" font-weight="700">Customer Query</text>
    <text x="125" y="110" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">"Best plumber near me"</text>
    <!-- Arrow 1 -->
    <line x1="220" y1="85" x2="260" y2="85" stroke="rgba(255,106,0,0.5)" stroke-width="1.5" marker-end="url(#arrowHCAI)"/>
    <polygon points="258,80 268,85 258,90" fill="rgba(255,106,0,0.6)"/>
    <!-- Node 2: AI Processing -->
    <rect x="268" y="52" width="190" height="65" rx="10" fill="rgba(255,106,0,0.1)" stroke="rgba(255,106,0,0.4)" stroke-width="1.5" filter="url(#nodGlowHCAI)"/>
    <text x="363" y="75" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-weight="600">STEP 2</text>
    <text x="363" y="95" font-family="system-ui, sans-serif" font-size="13" fill="#FF6A00" text-anchor="middle" font-weight="700">AI Processing</text>
    <text x="363" y="110" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">Cross-referencing sources</text>
    <!-- Arrow 2 (down) -->
    <line x1="363" y1="117" x2="363" y2="145" stroke="rgba(255,106,0,0.5)" stroke-width="1.5"/>
    <polygon points="358,143 363,153 368,143" fill="rgba(255,106,0,0.6)"/>
    <!-- Node 3: Sources Analyzed -->
    <rect x="268" y="155" width="190" height="65" rx="10" fill="rgba(100,220,100,0.08)" stroke="rgba(100,220,100,0.4)" stroke-width="1.5"/>
    <text x="363" y="178" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-weight="600">STEP 3</text>
    <text x="363" y="198" font-family="system-ui, sans-serif" font-size="13" fill="rgba(100,220,100,0.9)" text-anchor="middle" font-weight="700">Sources Analyzed</text>
    <text x="363" y="213" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">Reviews, articles, directories</text>
    <!-- Arrow 3 (left and down) -->
    <line x1="268" y1="188" x2="220" y2="188" stroke="rgba(255,106,0,0.5)" stroke-width="1.5"/>
    <line x1="220" y1="188" x2="220" y2="255" stroke="rgba(255,106,0,0.5)" stroke-width="1.5"/>
    <polygon points="215,253 220,263 225,253" fill="rgba(255,106,0,0.6)"/>
    <!-- Node 4: Recommendation -->
    <rect x="125" y="265" width="235" height="65" rx="10" fill="rgba(255,106,0,0.12)" stroke="#FF6A00" stroke-width="2" filter="url(#nodGlowHCAI)"/>
    <text x="242" y="288" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-weight="600">STEP 4</text>
    <text x="242" y="308" font-family="system-ui, sans-serif" font-size="13" fill="#FF6A00" text-anchor="middle" font-weight="700">AI Recommendation</text>
    <text x="242" y="323" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">Curated shortlist delivered to user</text>
    <!-- Stats alongside -->
    <rect x="30" y="145" width="190" height="30" rx="6" fill="rgba(255,255,255,0.04)"/>
    <text x="40" y="165" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">&#x25CF;</text>
    <text x="55" y="165" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">2.5B</text>
    <text x="95" y="165" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.35)">prompts/day</text>
    <rect x="30" y="183" width="190" height="30" rx="6" fill="rgba(255,255,255,0.04)"/>
    <text x="40" y="203" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" font-weight="600">&#x25CF;</text>
    <text x="55" y="203" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">14 min</text>
    <text x="105" y="203" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.35)">avg session</text>
    <rect x="30" y="221" width="190" height="30" rx="6" fill="rgba(255,255,255,0.04)"/>
    <text x="40" y="241" font-family="system-ui, sans-serif" font-size="10" fill="rgba(100,220,100,0.8)" font-weight="600">&#x25CF;</text>
    <text x="55" y="241" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">85%</text>
    <text x="85" y="241" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.35)">third-party sources</text>
    <!-- Bottom Insight Box -->
    <rect x="20" y="355" width="445" height="65" rx="8" fill="rgba(255,106,0,0.08)" stroke="#FF6A00" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="242" y="380" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-weight="600">KEY INSIGHT</text>
    <text x="242" y="405" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle" font-weight="700">AI expands search behavior, it doesn't replace Google</text>
  </g>
  <!-- Decorative circle -->
  <circle cx="100" cy="130" r="60" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <!-- Category pill -->
  <rect x="40" y="40" width="180" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="130" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">How-To Guide</text>
  <!-- Title -->
  <text x="80" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="white">How Customers Actually</text>
  <text x="80" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="white">Use AI to Find</text>
  <text x="80" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#FF6A00" filter="url(#glowHCAI)">Businesses</text>
  <!-- Subtitle -->
  <text x="80" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">The Discovery Journey, Decoded</text>
  <!-- Footer -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>