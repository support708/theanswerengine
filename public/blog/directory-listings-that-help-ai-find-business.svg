    <line x1="170" y1="177" x2="290" y2="195" stroke="rgba(100,220,100,0.25)" stroke-width="1.5"/>
    <line x1="170" y1="232" x2="290" y2="200" stroke="rgba(200,150,255,0.2)" stroke-width="1.5"/>
    <line x1="170" y1="287" x2="290" y2="210" stroke="rgba(255,106,0,0.2)" stroke-width="1.5"/>
