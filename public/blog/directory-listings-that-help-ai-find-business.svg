      <stop offset="0%" style="stop-color:#134e4a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative network/directory nodes -->
  <circle cx="950" cy="180" r="12" fill="none" stroke="rgba(255,106,0,0.12)" stroke-width="1.5"/>
  <circle cx="1060" cy="140" r="10" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <circle cx="1100" cy="240" r="14" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <circle cx="980" cy="300" r="10" fill="none" stroke="rgba(255,106,0,0.08)" stroke-width="1.5"/>
  <circle cx="1050" cy="350" r="8" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <!-- Connecting lines between nodes -->
  <line x1="962" y1="180" x2="1050" y2="145" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="1065" y1="150" x2="1095" y2="228" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="955" y1="190" x2="978" y2="290" stroke="rgba(255,106,0,0.06)" stroke-width="1"/>
