    <text x="95" y="65" font-family="system-ui, sans-serif" font-size="10" fill="rgba(100,150,255,0.7)" text-anchor="middle" font-weight="600">Bing Places</text>
    <text x="95" y="82" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.25)" text-anchor="middle">ChatGPT data source</text>
    <rect x="20" y="100" width="150" height="45" rx="6" fill="rgba(255,200,50,0.06)" stroke="rgba(255,200,50,0.2)" stroke-width="1"/>
    <text x="95" y="120" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,200,50,0.7)" text-anchor="middle" font-weight="600">Yelp</text>
    <text x="95" y="137" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.25)" text-anchor="middle">Reviews + authority</text>
    <rect x="20" y="155" width="150" height="45" rx="6" fill="rgba(100,220,100,0.06)" stroke="rgba(100,220,100,0.2)" stroke-width="1"/>
    <text x="95" y="175" font-family="system-ui, sans-serif" font-size="10" fill="rgba(100,220,100,0.7)" text-anchor="middle" font-weight="600">BBB</text>
    <text x="95" y="192" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.25)" text-anchor="middle">Trust signal</text>
    <rect x="20" y="210" width="150" height="45" rx="6" fill="rgba(200,150,255,0.06)" stroke="rgba(200,150,255,0.2)" stroke-width="1"/>
    <text x="95" y="230" font-family="system-ui, sans-serif" font-size="10" fill="rgba(200,150,255,0.7)" text-anchor="middle" font-weight="600">Apple Maps</text>
    <text x="95" y="247" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.25)" text-anchor="middle">Siri data source</text>
    <rect x="20" y="265" width="150" height="45" rx="6" fill="rgba(255,106,0,0.06)" stroke="rgba(255,106,0,0.15)" stroke-width="1"/>
    <text x="95" y="285" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,106,0,0.7)" text-anchor="middle" font-weight="600">Industry Dirs</text>
