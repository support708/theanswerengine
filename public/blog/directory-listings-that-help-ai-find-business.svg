    <text x="330" y="195" font-family="system-ui, sans-serif" font-size="14" fill="#FF6A00" text-anchor="middle" font-weight="700">AI</text>
    <text x="330" y="212" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle">Citation Engine</text>
    <!-- Output arrow -->
    <line x1="375" y1="200" x2="430" y2="200" stroke="#FF6A00" stroke-width="2"/>
    <polygon points="425,193 440,200 425,207" fill="#FF6A00"/>
    <text x="440" y="195" font-family="system-ui, sans-serif" font-size="8" fill="#FF6A00" font-weight="600">CITE</text>
