  <line x1="1088" y1="245" x2="1055" y2="342" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <!-- Small pin/location markers -->
  <circle cx="950" cy="180" r="4" fill="rgba(255,106,0,0.2)"/>
