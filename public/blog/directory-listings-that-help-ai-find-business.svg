    <rect x="20" y="365" width="430" height="30" rx="4" fill="rgba(255,106,0,0.08)" stroke="rgba(255,106,0,0.2)" stroke-width="1"/>
    <text x="35" y="385" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" font-weight="700">1.</text>
    <text x="55" y="385" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Bing Places</text>
    <text x="440" y="385" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.6)" text-anchor="end">CRITICAL</text>
    <rect x="20" y="400" width="430" height="30" rx="4" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="35" y="420" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,106,0,0.6)" font-weight="700">2.</text>
    <text x="55" y="420" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">Yelp + BBB + Industry</text>
    <text x="440" y="420" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,200,50,0.6)" text-anchor="end">HIGH</text>
    <rect x="20" y="435" width="430" height="30" rx="4" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="35" y="455" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,106,0,0.5)" font-weight="700">3.</text>
    <text x="55" y="455" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.35)">Apple Maps + Data Aggregators</text>
    <text x="440" y="455" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.6)" text-anchor="end">MEDIUM</text>
  </g>
  <circle cx="100" cy="130" r="60" stroke="rgba(255,106,0,0.05)" stroke-width="0.5" fill="none"/>
  <rect x="40" y="40" width="160" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="120" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">Citation Building</text>
  <text x="80" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Directory Listings</text>
  <text x="80" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">That Help AI</text>
  <text x="80" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glow23)">Find You</text>
