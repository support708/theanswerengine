<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow11">
      <feGaussianBlur stdDeviation="6" result="blur11"/>
      <feMerge>
        <feMergeNode in="blur11"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft11">
      <feGaussianBlur stdDeviation="14" result="blur11s"/>
      <feMerge>
        <feMergeNode in="blur11s"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg11)"/>
  <!-- Subtle background pattern lines -->
  <line x1="0" y1="105" x2="1200" y2="105" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="210" x2="1200" y2="210" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="315" x2="1200" y2="315" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="525" x2="1200" y2="525" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="240" y1="0" x2="240" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="480" y1="0" x2="480" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="720" y1="0" x2="720" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="960" y1="0" x2="960" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>

  <!-- Location pins and broken connections (right side visual) -->
  <g transform="translate(700, 60)">
    <!-- Connection lines (broken/dashed to show fragmentation) -->
    <line x1="120" y1="100" x2="280" y2="180" stroke="rgba(255,106,0,0.25)" stroke-width="2" stroke-dasharray="8,8"/>
    <line x1="120" y1="100" x2="80" y2="280" stroke="rgba(255,106,0,0.25)" stroke-width="2" stroke-dasharray="8,8"/>
    <line x1="280" y1="180" x2="350" y2="340" stroke="rgba(255,106,0,0.15)" stroke-width="2" stroke-dasharray="8,8"/>
    <line x1="80" y1="280" x2="220" y2="380" stroke="rgba(255,106,0,0.15)" stroke-width="2" stroke-dasharray="8,8"/>
    <line x1="280" y1="180" x2="80" y2="280" stroke="rgba(255,106,0,0.12)" stroke-width="1.5" stroke-dasharray="6,10"/>
    <line x1="350" y1="340" x2="220" y2="380" stroke="rgba(255,106,0,0.12)" stroke-width="1.5" stroke-dasharray="6,10"/>

    <!-- Break/disconnect markers on lines -->
    <text x="200" y="145" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,80,80,0.6)" text-anchor="middle">&#x2717;</text>
    <text x="95" y="195" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,80,80,0.6)" text-anchor="middle">&#x2717;</text>
    <text x="320" y="265" font-family="system-ui, sans-serif" font-size="16" fill="rgba(255,80,80,0.5)" text-anchor="middle">&#x2717;</text>

    <!-- Location pin 1 (top - main/HQ) -->
    <g transform="translate(120, 65)">
      <ellipse cx="0" cy="40" rx="12" ry="4" fill="rgba(255,106,0,0.2)"/>
      <path d="M0,-20 C-16,-20 -22,-6 -22,6 C-22,22 0,40 0,40 C0,40 22,22 22,6 C22,-6 16,-20 0,-20Z" fill="#FF6A00" filter="url(#glow11)" opacity="0.9"/>
      <circle cx="0" cy="2" r="7" fill="rgba(15,17,23,0.6)"/>
    </g>

    <!-- Location pin 2 (right) -->
    <g transform="translate(280, 148)">
      <ellipse cx="0" cy="36" rx="10" ry="3" fill="rgba(255,106,0,0.15)"/>
      <path d="M0,-16 C-13,-16 -18,-5 -18,5 C-18,18 0,36 0,36 C0,36 18,18 18,5 C18,-5 13,-16 0,-16Z" fill="rgba(255,106,0,0.5)" opacity="0.7"/>
      <circle cx="0" cy="1" r="5.5" fill="rgba(15,17,23,0.5)"/>
    </g>

    <!-- Location pin 3 (left) -->
    <g transform="translate(80, 248)">
      <ellipse cx="0" cy="36" rx="10" ry="3" fill="rgba(255,106,0,0.15)"/>
      <path d="M0,-16 C-13,-16 -18,-5 -18,5 C-18,18 0,36 0,36 C0,36 18,18 18,5 C18,-5 13,-16 0,-16Z" fill="rgba(255,106,0,0.4)" opacity="0.6"/>
      <circle cx="0" cy="1" r="5.5" fill="rgba(15,17,23,0.5)"/>
    </g>

    <!-- Location pin 4 (bottom right) -->
    <g transform="translate(350, 308)">
      <ellipse cx="0" cy="36" rx="10" ry="3" fill="rgba(255,106,0,0.12)"/>
      <path d="M0,-16 C-13,-16 -18,-5 -18,5 C-18,18 0,36 0,36 C0,36 18,18 18,5 C18,-5 13,-16 0,-16Z" fill="rgba(255,106,0,0.3)" opacity="0.5"/>
      <circle cx="0" cy="1" r="5.5" fill="rgba(15,17,23,0.4)"/>
    </g>

    <!-- Location pin 5 (bottom center) -->
    <g transform="translate(220, 350)">
      <ellipse cx="0" cy="32" rx="9" ry="3" fill="rgba(255,106,0,0.1)"/>
      <path d="M0,-14 C-12,-14 -16,-4 -16,4 C-16,16 0,32 0,32 C0,32 16,16 16,4 C16,-4 12,-14 0,-14Z" fill="rgba(255,106,0,0.25)" opacity="0.4"/>
      <circle cx="0" cy="1" r="5" fill="rgba(15,17,23,0.4)"/>
    </g>

    <!-- Signal circles radiating from pins (getting weaker) -->
    <circle cx="120" cy="70" r="30" stroke="rgba(255,106,0,0.15)" stroke-width="0.5" fill="none"/>
    <circle cx="120" cy="70" r="50" stroke="rgba(255,106,0,0.08)" stroke-width="0.5" fill="none"/>
    <circle cx="280" cy="155" r="25" stroke="rgba(255,106,0,0.08)" stroke-width="0.5" fill="none"/>
    <circle cx="80" cy="255" r="25" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  </g>

  <!-- Decorative background elements -->
  <circle cx="650" cy="315" r="200" stroke="rgba(255,106,0,0.04)" stroke-width="0.5" fill="none"/>
  <circle cx="650" cy="315" r="280" stroke="rgba(255,106,0,0.03)" stroke-width="0.5" fill="none"/>

  <!-- Title text (left side) -->
  <text x="80" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Multi-Location</text>
  <text x="80" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glow11)">AI Search</text>
  <text x="80" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Struggles</text>

  <!-- Subtitle -->
  <text x="80" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">Why More Locations Means Less Visibility</text>

  <!-- Footer branding -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>