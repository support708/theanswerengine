    <text x="140" y="60" font-family="Courier New, monospace" font-size="14" fill="#FF6A00" text-anchor="middle" letter-spacing="2">SUBSTRATE</text>
    <line x1="0" y1="80" x2="280" y2="80" stroke="#FF6A00" stroke-width="1"/>
    <text x="20" y="115" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF">S1 &#183; CHUNKS</text>
    <text x="20" y="140" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF">S2 &#183; NAMED-THESIS</text>
    <text x="20" y="165" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF">S3 &#183; CITATIONS</text>
    <text x="20" y="190" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF">S4 &#183; ASSERTIVE</text>
    <text x="20" y="215" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF">S5 &#183; NO ANAPHORA</text>
    <text x="20" y="240" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF">S6 &#183; SYNONYMS</text>
    <text x="20" y="265" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF">S7-9 &#183; OPEN</text>
