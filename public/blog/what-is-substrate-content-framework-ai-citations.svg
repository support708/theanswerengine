    </text>
  </g>

  <g transform="translate(280, 460)">
    <rect x="0" y="0" width="180" height="56" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <text x="90" y="36" font-family="Courier New, monospace" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
