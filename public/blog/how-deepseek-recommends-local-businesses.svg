<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1117;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#111520;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a0d14;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#FF6A00;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#FF6A00;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e55f00;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#FF6A00;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glow behind center -->
  <ellipse cx="600" cy="315" rx="320" ry="200" fill="url(#centerGlow)" filter="url(#softBlur)"/>

  <!-- Grid lines subtle -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Neural network edges (connections) -->
  <g stroke="#FF6A00" stroke-width="1" opacity="0.18">
    <!-- Outer ring to mid ring connections -->
    <line x1="600" y1="315" x2="440" y2="180"/>
    <line x1="600" y1="315" x2="760" y2="180"/>
    <line x1="600" y1="315" x2="830" y2="315"/>
    <line x1="600" y1="315" x2="760" y2="450"/>
    <line x1="600" y1="315" x2="440" y2="450"/>
    <line x1="600" y1="315" x2="370" y2="315"/>
    <!-- Mid to outer -->
    <line x1="440" y1="180" x2="290" y2="120"/>
    <line x1="440" y1="180" x2="350" y2="80"/>
    <line x1="760" y1="180" x2="910" y2="120"/>
    <line x1="760" y1="180" x2="850" y2="80"/>
    <line x1="830" y1="315" x2="970" y2="230"/>
    <line x1="830" y1="315" x2="970" y2="400"/>
    <line x1="760" y1="450" x2="850" y2="550"/>
    <line x1="760" y1="450" x2="910" y2="510"/>
    <line x1="440" y1="450" x2="290" y2="510"/>
    <line x1="440" y1="450" x2="350" y2="550"/>
    <line x1="370" y1="315" x2="230" y2="230"/>
    <line x1="370" y1="315" x2="230" y2="400"/>
    <!-- Cross connections -->
    <line x1="440" y1="180" x2="760" y2="180"/>
    <line x1="440" y1="450" x2="760" y2="450"/>
    <line x1="290" y1="120" x2="350" y2="80"/>
    <line x1="910" y1="120" x2="850" y2="80"/>
  </g>

  <!-- Search ray lines emanating from center -->
  <g stroke="#FF6A00" stroke-width="1.5" opacity="0.3" stroke-dasharray="4,8">
    <line x1="600" y1="315" x2="100" y2="80"/>
    <line x1="600" y1="315" x2="1100" y2="80"/>
    <line x1="600" y1="315" x2="100" y2="550"/>
    <line x1="600" y1="315" x2="1100" y2="550"/>
  </g>

  <!-- Horizontal glow bar -->
  <rect x="0" y="313" width="1200" height="4" fill="url(#glow)" opacity="0.4"/>

  <!-- Outer network nodes (small) -->
  <g fill="#FF6A00" opacity="0.5">
    <circle cx="290" cy="120" r="5"/>
    <circle cx="350" cy="80" r="4"/>
    <circle cx="910" cy="120" r="5"/>
    <circle cx="850" cy="80" r="4"/>
    <circle cx="970" cy="230" r="5"/>
    <circle cx="970" cy="400" r="5"/>
    <circle cx="850" cy="550" r="4"/>
    <circle cx="910" cy="510" r="5"/>
    <circle cx="290" cy="510" r="5"/>
    <circle cx="350" cy="550" r="4"/>
    <circle cx="230" cy="230" r="5"/>
    <circle cx="230" cy="400" r="5"/>
    <circle cx="120" cy="315" r="4"/>
    <circle cx="1080" cy="315" r="4"/>
  </g>

  <!-- Mid ring nodes -->
  <g fill="#FF6A00" opacity="0.75">
    <circle cx="440" cy="180" r="9"/>
    <circle cx="760" cy="180" r="9"/>
    <circle cx="830" cy="315" r="9"/>
    <circle cx="760" cy="450" r="9"/>
    <circle cx="440" cy="450" r="9"/>
    <circle cx="370" cy="315" r="9"/>
  </g>

  <!-- Center node — DeepSeek whale motif (stylized D shape) -->
  <circle cx="600" cy="315" r="52" fill="#FF6A00" opacity="0.12"/>
  <circle cx="600" cy="315" r="38" fill="#FF6A00" opacity="0.22"/>
  <circle cx="600" cy="315" r="26" fill="url(#nodeGrad)"/>
  <!-- Whale-like arc inside center node -->
  <path d="M590 308 Q600 298 610 308 Q616 318 606 324 Q596 330 590 320 Z" fill="#0F1117" opacity="0.8"/>
  <path d="M594 326 Q600 330 605 326" stroke="#0F1117" stroke-width="2" fill="none"/>

  <!-- Section label -->
  <text x="600" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="3" fill="#FF6A00" opacity="0.9">AI ALGORITHM SERIES</text>
  <text x="600" y="136" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" letter-spacing="2" fill="#FF6A00" opacity="0.5">DEEPSEEK &amp; BUSINESS DISCOVERY</text>

  <!-- Main headline -->
  <text x="600" y="222" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#ffffff">How DeepSeek Decides</text>
  <text x="600" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#FF6A00">Which Local Businesses</text>
  <text x="600" y="318" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#ffffff">to Recommend</text>

  <!-- Subtext -->
  <text x="600" y="400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#9ca3af">350M+ monthly visits. Open-weight. Chinese-origin. A different ranking engine.</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#FF6A00" opacity="0.06"/>
  <text x="60" y="611" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#FF6A00" opacity="0.7">theanswerengine.ai</text>
  <text x="1140" y="611" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" opacity="0.7">2026</text>
</svg>
