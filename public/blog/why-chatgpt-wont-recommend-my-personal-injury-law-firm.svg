<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Why ChatGPT Won't Recommend My Personal Injury Law Firm">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131313"/>
      <stop offset="55%" stop-color="#0f0f10"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F27D24" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#F27D24" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#F27D24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F27D24" stop-opacity="0"/>
      <stop offset="60%" stop-color="#F27D24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F27D24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4B266"/>
      <stop offset="50%" stop-color="#D9853A"/>
      <stop offset="100%" stop-color="#7a4a1f"/>
    </linearGradient>
    <linearGradient id="brassDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C97B33"/>
      <stop offset="100%" stop-color="#5c3416"/>
    </linearGradient>
    <pattern id="gridDots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#F27D24" fill-opacity="0.08"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#gridDots)"/>
  <rect width="1200" height="630" fill="url(#orangeGlow)"/>

  <!-- Vertical light beam -->
  <rect x="555" y="0" width="90" height="630" fill="url(#beam)"/>

  <!-- Desk surface -->
  <rect x="0" y="500" width="1200" height="130" fill="#0c0c0d"/>
  <line x1="0" y1="500" x2="1200" y2="500" stroke="rgba(242,125,36,0.18)" stroke-width="1"/>

  <!-- Citation graph nodes (background, behind scales) -->
  <g opacity="0.55">
    <line x1="200" y1="200" x2="320" y2="140" stroke="#F27D24" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="200" y1="200" x2="120" y2="280" stroke="#F27D24" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="320" y1="140" x2="440" y2="200" stroke="#F27D24" stroke-opacity="0.18" stroke-width="1"/>
    <line x1="120" y1="280" x2="200" y2="380" stroke="#F27D24" stroke-opacity="0.18" stroke-width="1"/>
    <line x1="900" y1="180" x2="1020" y2="240" stroke="#F27D24" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="1020" y1="240" x2="980" y2="360" stroke="#F27D24" stroke-opacity="0.2" stroke-width="1"/>
    <line x1="900" y1="180" x2="780" y2="220" stroke="#F27D24" stroke-opacity="0.18" stroke-width="1"/>

    <circle cx="200" cy="200" r="4" fill="#F27D24" fill-opacity="0.7"/>
    <circle cx="320" cy="140" r="3" fill="#F27D24" fill-opacity="0.6"/>
    <circle cx="120" cy="280" r="3" fill="#F27D24" fill-opacity="0.5"/>
    <circle cx="440" cy="200" r="3" fill="#F27D24" fill-opacity="0.5"/>
    <circle cx="200" cy="380" r="3" fill="#F27D24" fill-opacity="0.4"/>
    <circle cx="900" cy="180" r="4" fill="#F27D24" fill-opacity="0.7"/>
    <circle cx="1020" cy="240" r="3" fill="#F27D24" fill-opacity="0.6"/>
    <circle cx="980" cy="360" r="3" fill="#F27D24" fill-opacity="0.4"/>
    <circle cx="780" cy="220" r="3" fill="#F27D24" fill-opacity="0.5"/>
  </g>

  <!-- Scales of justice -->
  <g transform="translate(600,500)" filter="url(#softShadow)">
    <!-- Base -->
    <rect x="-60" y="-10" width="120" height="14" rx="2" fill="url(#brassDark)"/>
    <rect x="-80" y="-4" width="160" height="6" rx="2" fill="#3a2516"/>

    <!-- Column -->
    <rect x="-5" y="-280" width="10" height="270" fill="url(#brass)"/>
    <rect x="-7" y="-285" width="14" height="8" rx="1" fill="url(#brass)"/>

    <!-- Top beam -->
    <rect x="-180" y="-300" width="360" height="6" rx="2" fill="url(#brass)"/>
    <circle cx="0" cy="-297" r="6" fill="#F4B266"/>

    <!-- Chains -->
    <line x1="-160" y1="-294" x2="-160" y2="-220" stroke="#a26226" stroke-width="2"/>
    <line x1="-150" y1="-294" x2="-150" y2="-220" stroke="#a26226" stroke-width="2"/>
    <line x1="-170" y1="-294" x2="-170" y2="-220" stroke="#a26226" stroke-width="2"/>

    <line x1="160" y1="-294" x2="160" y2="-220" stroke="#a26226" stroke-width="2"/>
    <line x1="150" y1="-294" x2="150" y2="-220" stroke="#a26226" stroke-width="2"/>
    <line x1="170" y1="-294" x2="170" y2="-220" stroke="#a26226" stroke-width="2"/>

    <!-- Left pan -->
    <path d="M -220,-220 Q -160,-160 -100,-220 Z" fill="url(#brass)" stroke="#7a4a1f" stroke-width="1"/>
    <ellipse cx="-160" cy="-220" rx="60" ry="8" fill="#F4B266"/>

    <!-- Right pan -->
    <path d="M 100,-220 Q 160,-160 220,-220 Z" fill="url(#brass)" stroke="#7a4a1f" stroke-width="1"/>
    <ellipse cx="160" cy="-220" rx="60" ry="8" fill="#F4B266"/>

    <!-- Reflection on column -->
    <rect x="-1" y="-280" width="2" height="270" fill="#fff" fill-opacity="0.18"/>
  </g>

  <!-- Floating citation tags above the scales (data overlay) -->
  <g font-family="'Courier New', Courier, monospace" font-size="11" fill="#F27D24" fill-opacity="0.7">
    <g transform="translate(360, 240)">
      <rect x="-8" y="-12" width="80" height="18" rx="2" fill="#F27D24" fill-opacity="0.08" stroke="#F27D24" stroke-opacity="0.35" stroke-width="0.7"/>
      <text x="0" y="0" letter-spacing="0.05em">FINDLAW</text>
    </g>
    <g transform="translate(820, 200)">
      <rect x="-8" y="-12" width="64" height="18" rx="2" fill="#F27D24" fill-opacity="0.08" stroke="#F27D24" stroke-opacity="0.35" stroke-width="0.7"/>
      <text x="0" y="0" letter-spacing="0.05em">JUSTIA</text>
    </g>
    <g transform="translate(280, 340)">
      <rect x="-8" y="-12" width="56" height="18" rx="2" fill="#F27D24" fill-opacity="0.08" stroke="#F27D24" stroke-opacity="0.35" stroke-width="0.7"/>
      <text x="0" y="0" letter-spacing="0.05em">AVVO</text>
    </g>
    <g transform="translate(880, 360)">
      <rect x="-8" y="-12" width="120" height="18" rx="2" fill="#F27D24" fill-opacity="0.08" stroke="#F27D24" stroke-opacity="0.35" stroke-width="0.7"/>
      <text x="0" y="0" letter-spacing="0.05em">BAR.GOV/ATTY</text>
    </g>
  </g>

  <!-- Terminal label top-left -->
  <g font-family="'Courier New', Courier, monospace" font-size="13" fill="#F27D24" fill-opacity="0.85">
    <text x="60" y="70" letter-spacing="0.18em">[AEO :: LEGAL/PERSONAL-INJURY]</text>
    <line x1="60" y1="82" x2="200" y2="82" stroke="#F27D24" stroke-opacity="0.6" stroke-width="1.5"/>
  </g>

  <!-- Terminal label top-right -->
  <g font-family="'Courier New', Courier, monospace" font-size="12" fill="rgba(229,226,225,0.45)">
    <text x="1140" y="70" text-anchor="end" letter-spacing="0.12em">THEANSWERENGINE.AI</text>
  </g>

  <!-- Bottom-left cursor / signal -->
  <g font-family="'Courier New', Courier, monospace" font-size="12" fill="rgba(229,226,225,0.55)">
    <text x="60" y="585" letter-spacing="0.1em">&gt; CITATION_SURFACE.SCAN</text>
    <rect x="280" y="575" width="8" height="14" fill="#F27D24" fill-opacity="0.9"/>
  </g>

  <!-- Bottom-right signature -->
  <g font-family="'Courier New', Courier, monospace" font-size="11" fill="rgba(229,226,225,0.4)">
    <text x="1140" y="585" text-anchor="end" letter-spacing="0.1em">// THE ANSWER ENGINE</text>
  </g>

  <!-- Subtle scan line -->
  <line x1="0" y1="318" x2="1200" y2="318" stroke="#F27D24" stroke-opacity="0.06" stroke-width="1"/>
</svg>
