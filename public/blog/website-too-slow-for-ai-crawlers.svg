<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg17" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1b4e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow17"><feGaussianBlur stdDeviation="6" result="blur17"/><feMerge><feMergeNode in="blur17"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoft17"><feGaussianBlur stdDeviation="12" result="blur17s"/><feMerge><feMergeNode in="blur17s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg17)"/>
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <!-- Speed analysis dashboard -->
  <g transform="translate(640, 55)">
    <rect x="0" y="0" width="480" height="440" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Top metrics row -->
    <rect x="20" y="20" width="135" height="70" rx="6" fill="rgba(255,80,80,0.12)" stroke="rgba(255,80,80,0.3)" stroke-width="1"/>
    <text x="35" y="45" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" font-weight="500">LOAD TIME</text>
    <text x="35" y="72" font-family="system-ui, sans-serif" font-size="24" fill="#FF6A00" font-weight="700" filter="url(#glow17)">7.2s</text>
    <text x="105" y="72" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,80,80,0.8)">FAIL</text>
    <rect x="170" y="20" width="135" height="70" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="185" y="45" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" font-weight="500">AI LIMIT</text>
    <text x="185" y="72" font-family="system-ui, sans-serif" font-size="24" fill="white" font-weight="700">5.0s</text>
    <rect x="320" y="20" width="135" height="70" rx="6" fill="rgba(255,80,80,0.08)" stroke="rgba(255,80,80,0.2)" stroke-width="1"/>
    <text x="335" y="45" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" font-weight="500">OVER BY</text>
    <text x="335" y="72" font-family="system-ui, sans-serif" font-size="24" fill="white" font-weight="700">+2.2s</text>
    <text x="400" y="72" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,80,80,0.8)">&#x2191;44%</text>
    <!-- Waterfall chart -->
    <rect x="20" y="110" width="440" height="180" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="35" y="132" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" font-weight="500">RESOURCE WATERFALL</text>
    <!-- Resource bars -->
    <text x="35" y="160" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">HTML</text>
    <rect x="100" y="148" width="80" height="14" rx="3" fill="rgba(100,150,255,0.6)"/>
    <text x="35" y="185" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">CSS</text>
    <rect x="180" y="173" width="100" height="14" rx="3" fill="rgba(100,220,100,0.5)"/>
    <text x="35" y="210" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">JS Bundle</text>
    <rect x="180" y="198" width="200" height="14" rx="3" fill="rgba(255,200,50,0.6)"/>
    <text x="35" y="235" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Images</text>
    <rect x="280" y="223" width="160" height="14" rx="3" fill="rgba(255,80,80,0.6)"/>
    <text x="35" y="260" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Fonts</text>
    <rect x="380" y="248" width="70" height="14" rx="3" fill="rgba(255,80,80,0.5)"/>
    <!-- 5s cutoff line -->
    <line x1="340" y1="140" x2="340" y2="275" stroke="#FF6A00" stroke-width="2" stroke-dasharray="6,4" filter="url(#glow17)"/>
    <rect x="310" y="276" width="60" height="16" rx="8" fill="rgba(255,106,0,0.3)"/>
    <text x="340" y="288" font-family="system-ui, sans-serif" font-size="8" fill="#FF6A00" text-anchor="middle" font-weight="600">5s LIMIT</text>
    <!-- Crawler status panel -->
    <rect x="20" y="305" width="440" height="120" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="35" y="327" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" font-weight="500">CRAWLER STATUS</text>
    <circle cx="38" cy="350" r="5" fill="rgba(255,80,80,0.8)"/>
    <text x="50" y="354" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,80,80,0.9)">GPTBot: TIMEOUT at 5.0s - page abandoned</text>
    <circle cx="38" cy="374" r="5" fill="rgba(255,80,80,0.8)"/>
    <text x="50" y="378" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,80,80,0.9)">PerplexityBot: TIMEOUT - incomplete crawl</text>
    <circle cx="38" cy="398" r="5" fill="rgba(255,200,50,0.8)"/>
    <text x="50" y="402" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,200,50,0.8)">GoogleBot: PARTIAL - degraded rendering</text>
  </g>
  <circle cx="100" cy="150" r="60" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <circle cx="100" cy="150" r="90" stroke="rgba(255,106,0,0.04)" stroke-width="0.5" fill="none"/>
  <text x="80" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Your Website Is</text>
  <text x="80" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Too Slow for</text>
  <text x="80" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glow17)">AI Crawlers</text>
  <text x="80" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">Why Page Speed Kills AI Visibility</text>
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>