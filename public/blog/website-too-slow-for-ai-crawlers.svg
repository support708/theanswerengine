<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4c1d95;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#312e81;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative speed lines -->
  <line x1="850" y1="150" x2="1100" y2="150" stroke="rgba(255,106,0,0.1)" stroke-width="2" stroke-dasharray="8,12"/>
  <line x1="900" y1="190" x2="1150" y2="190" stroke="rgba(255,106,0,0.07)" stroke-width="2" stroke-dasharray="8,12"/>
  <line x1="870" y1="230" x2="1120" y2="230" stroke="rgba(255,106,0,0.05)" stroke-width="2" stroke-dasharray="8,12"/>
  <!-- Decorative loading spinner arc -->
  <circle cx="1050" cy="400" r="50" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="3"/>
  <path d="M 1050 350 A 50 50 0 0 1 1100 400" fill="none" stroke="rgba(255,106,0,0.15)" stroke-width="3" stroke-linecap="round"/>
  <!-- Small clock icon -->
  <circle cx="1050" cy="400" r="20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <line x1="1050" y1="388" x2="1050" y2="400" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="1050" y1="400" x2="1060" y2="406" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <!-- Category badge -->
  <rect x="40" y="40" width="140" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="110" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">AEO Education</text>
  <!-- Title -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">Your Website Is Too Slow</text>
  <text x="80" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">for</text>
  <text x="80" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#FF6A00">AI Crawlers</text>
  <!-- Footer -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>