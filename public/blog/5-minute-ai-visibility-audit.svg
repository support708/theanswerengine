<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#0F1117"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="bigGlow3">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg3)"/>

  <!-- Radial grid -->
  <g opacity="0.05">
    <circle cx="600" cy="280" r="100" stroke="#FF6A00" stroke-width="0.5"/>
    <circle cx="600" cy="280" r="200" stroke="#FF6A00" stroke-width="0.5"/>
    <circle cx="600" cy="280" r="300" stroke="#FF6A00" stroke-width="0.5"/>
    <circle cx="600" cy="280" r="400" stroke="#FF6A00" stroke-width="0.5"/>
  </g>

  <!-- Central glow -->
  <circle cx="600" cy="260" r="120" fill="#FF6A00" opacity="0.04" filter="url(#bigGlow3)"/>

  <!-- Clipboard / Audit Board -->
  <g transform="translate(480, 80)">
    <!-- Clipboard body -->
    <rect x="0" y="20" width="240" height="320" rx="14" fill="#0a1628" stroke="#FF6A00" stroke-width="1.5" opacity="0.8"/>
    <!-- Clip -->
    <rect x="80" y="5" width="80" height="30" rx="8" fill="#1a2744" stroke="#FF6A00" stroke-width="1.2" opacity="0.7"/>
    <rect x="100" y="0" width="40" height="12" rx="4" fill="#FF6A00" opacity="0.5"/>

    <!-- Checklist items -->
    <!-- Item 1 - Checked -->
    <rect x="25" y="60" width="20" height="20" rx="4" fill="#FF6A00" opacity="0.2" stroke="#FF6A00" stroke-width="1"/>
    <path d="M30,70 L34,75 L42,64" stroke="#FF6A00" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <rect x="55" y="63" width="140" height="8" rx="3" fill="#FF6A00" opacity="0.2"/>
    <rect x="55" y="75" width="90" height="6" rx="3" fill="#FF6A00" opacity="0.1"/>

    <!-- Item 2 - Checked -->
    <rect x="25" y="105" width="20" height="20" rx="4" fill="#FF6A00" opacity="0.2" stroke="#FF6A00" stroke-width="1"/>
    <path d="M30,115 L34,120 L42,109" stroke="#FF6A00" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <rect x="55" y="108" width="120" height="8" rx="3" fill="#FF6A00" opacity="0.2"/>
    <rect x="55" y="120" width="100" height="6" rx="3" fill="#FF6A00" opacity="0.1"/>

    <!-- Item 3 - Checked -->
    <rect x="25" y="150" width="20" height="20" rx="4" fill="#FF6A00" opacity="0.2" stroke="#FF6A00" stroke-width="1"/>
    <path d="M30,160 L34,165 L42,154" stroke="#FF6A00" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <rect x="55" y="153" width="155" height="8" rx="3" fill="#FF6A00" opacity="0.2"/>
    <rect x="55" y="165" width="80" height="6" rx="3" fill="#FF6A00" opacity="0.1"/>

    <!-- Item 4 - In Progress -->
    <rect x="25" y="195" width="20" height="20" rx="4" fill="none" stroke="#FF6A00" stroke-width="1.2" opacity="0.5"/>
    <rect x="55" y="198" width="130" height="8" rx="3" fill="#FF6A00" opacity="0.15"/>
    <rect x="55" y="210" width="70" height="6" rx="3" fill="#FF6A00" opacity="0.08"/>

    <!-- Item 5 - Unchecked -->
    <rect x="25" y="240" width="20" height="20" rx="4" fill="none" stroke="#FF6A00" stroke-width="1" opacity="0.3"/>
    <rect x="55" y="243" width="110" height="8" rx="3" fill="#FF6A00" opacity="0.1"/>
    <rect x="55" y="255" width="95" height="6" rx="3" fill="#FF6A00" opacity="0.06"/>

    <!-- Progress bar at bottom -->
    <rect x="25" y="295" width="190" height="8" rx="4" fill="#1a2744" stroke="#FF6A00" stroke-width="0.5" opacity="0.5"/>
    <rect x="25" y="295" width="114" height="8" rx="4" fill="#FF6A00" opacity="0.5"/>
    <!-- 60% text -->
    <text x="220" y="302" fill="#FF6A00" font-family="system-ui, sans-serif" font-size="10" font-weight="600" opacity="0.6">60%</text>

    <!-- Score badge -->
    <rect x="25" y="315" width="60" height="22" rx="6" fill="#FF6A00" opacity="0.15" stroke="#FF6A00" stroke-width="0.8"/>
    <text x="55" y="330" text-anchor="middle" fill="#FF6A00" font-family="system-ui, sans-serif" font-size="11" font-weight="700" opacity="0.8">3 / 5</text>
  </g>

  <!-- Magnifying glass scanning (left) -->
  <g transform="translate(220, 200)" filter="url(#glow3)">
    <circle cx="55" cy="55" r="40" fill="none" stroke="#FF6A00" stroke-width="2" opacity="0.4"/>
    <circle cx="55" cy="55" r="35" fill="#FF6A00" opacity="0.03"/>
    <line x1="83" y1="83" x2="110" y2="110" stroke="#FF6A00" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <!-- Scan lines inside glass -->
    <line x1="30" y1="45" x2="80" y2="45" stroke="#FF6A00" stroke-width="1" opacity="0.2"/>
    <line x1="30" y1="55" x2="80" y2="55" stroke="#FF6A00" stroke-width="1" opacity="0.2"/>
    <line x1="30" y1="65" x2="80" y2="65" stroke="#FF6A00" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- Timer / Clock (right) -->
  <g transform="translate(900, 180)">
    <circle cx="60" cy="60" r="50" fill="#0a1628" stroke="#FF6A00" stroke-width="1.5" opacity="0.6"/>
    <circle cx="60" cy="60" r="45" fill="none" stroke="#FF6A00" stroke-width="0.5" opacity="0.3"/>
    <!-- Clock ticks -->
    <line x1="60" y1="18" x2="60" y2="25" stroke="#FF6A00" stroke-width="2" opacity="0.5"/>
    <line x1="60" y1="95" x2="60" y2="102" stroke="#FF6A00" stroke-width="2" opacity="0.5"/>
    <line x1="18" y1="60" x2="25" y2="60" stroke="#FF6A00" stroke-width="2" opacity="0.5"/>
    <line x1="95" y1="60" x2="102" y2="60" stroke="#FF6A00" stroke-width="2" opacity="0.5"/>
    <!-- Clock hands -->
    <line x1="60" y1="60" x2="60" y2="30" stroke="#FF6A00" stroke-width="2.5" opacity="0.7" stroke-linecap="round"/>
    <line x1="60" y1="60" x2="85" y2="50" stroke="#FF6A00" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="4" fill="#FF6A00" opacity="0.6"/>
    <!-- "5 MIN" label -->
    <text x="60" y="140" text-anchor="middle" fill="#FF6A00" font-family="system-ui, sans-serif" font-size="18" font-weight="700" opacity="0.7">5 MIN</text>
  </g>

  <!-- Scan beam from magnifier to clipboard -->
  <line x1="330" y1="260" x2="480" y2="260" stroke="#FF6A00" stroke-width="1" opacity="0.2" stroke-dasharray="4,4"/>

  <!-- Floating data points -->
  <circle cx="150" cy="150" r="2" fill="#FF6A00" opacity="0.3"/>
  <circle cx="400" cy="100" r="1.5" fill="#FF6A00" opacity="0.25"/>
  <circle cx="800" cy="120" r="2" fill="#FF6A00" opacity="0.2"/>
  <circle cx="1050" cy="350" r="1.5" fill="#FF6A00" opacity="0.3"/>
  <circle cx="100" cy="400" r="2" fill="#FF6A00" opacity="0.2"/>
  <circle cx="1100" cy="200" r="1.5" fill="#FF6A00" opacity="0.25"/>

  <!-- Category pill -->
  <rect x="50" y="30" width="105" height="32" rx="16" fill="#FF6A00" opacity="0.9"/>
  <text x="102" y="51" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600">DIY Guide</text>

  <!-- Title -->
  <text x="600" y="510" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="32" font-weight="700">The 5-Minute AI Visibility Audit</text>
  <text x="600" y="550" text-anchor="middle" fill="#FF6A00" font-family="system-ui, sans-serif" font-size="32" font-weight="700">You Can Do Right Now</text>

  <!-- Watermark -->
  <text x="600" y="615" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="11" font-weight="500" opacity="0.3">THE ANSWER ENGINE</text>

  <circle cx="1155" cy="590" r="22" fill="#FF6A00" opacity="0.15" stroke="#FF6A00" stroke-width="1" opacity="0.3"/>
  <text x="1155" y="596" text-anchor="middle" fill="#FF6A00" font-family="system-ui, sans-serif" font-size="14" font-weight="700" opacity="0.5">AE</text>
</svg>