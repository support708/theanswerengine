<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgEEAT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1424;stop-opacity:1"/>
      <stop offset="55%" style="stop-color:#0F1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2a1a08;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="pillarGradE1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#FF6A00;stop-opacity:0.08"/>
    </linearGradient>
    <linearGradient id="pillarGradE2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:0.28"/>
      <stop offset="100%" style="stop-color:#FF6A00;stop-opacity:0.06"/>
    </linearGradient>
    <linearGradient id="pillarGradA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#FF6A00;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="pillarGradT" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:0.16"/>
      <stop offset="100%" style="stop-color:#FF6A00;stop-opacity:0.03"/>
    </linearGradient>
    <filter id="glowEEAT"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoftEEAT"><feGaussianBlur stdDeviation="14" result="bs"/><feMerge><feMergeNode in="bs"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowCitationEEAT"><feGaussianBlur stdDeviation="10" result="bc"/><feMerge><feMergeNode in="bc"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgEEAT)"/>

  <!-- Subtle grid overlay -->
  <g opacity="0.025" stroke="white" stroke-width="0.5">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Orange ambient glow left side -->
  <ellipse cx="220" cy="315" rx="180" ry="260" fill="#FF6A00" opacity="0.04"/>

  <!-- Title block top -->
  <text x="600" y="62" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-0.5">E-E-A-T for AI Search</text>
  <text x="600" y="96" font-family="system-ui, sans-serif" font-size="17" font-weight="500" fill="#FF6A00" text-anchor="middle" letter-spacing="1.5">The 2026 Trust Stack</text>

  <!-- Four stacked pillar layers — centered, E at top (brightest), T at bottom (subtlest) -->
  <!-- Pillar stack starts at x=260, each pillar is 680px wide, heights 76px, stacked with 8px gap -->

  <!-- Layer 1: E — Experience (top, most opaque) -->
  <g transform="translate(260, 122)">
    <rect x="0" y="0" width="680" height="76" rx="10" fill="url(#pillarGradE1)" stroke="rgba(255,106,0,0.55)" stroke-width="1.5"/>
    <!-- Pillar label left -->
    <rect x="14" y="20" width="40" height="36" rx="8" fill="rgba(255,106,0,0.25)" stroke="#FF6A00" stroke-width="1"/>
    <text x="34" y="44" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FF6A00" text-anchor="middle">E</text>
    <!-- Pillar name -->
    <text x="72" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.9)" dominant-baseline="middle">EXPERIENCE</text>
    <!-- Description text -->
    <text x="72" y="56" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.45)">First-hand knowledge · Original data · Practitioner detail · Case studies</text>
    <!-- Right side signal chip -->
    <g filter="url(#glowEEAT)">
      <rect x="540" y="18" width="126" height="24" rx="12" fill="rgba(255,106,0,0.22)" stroke="#FF6A00" stroke-width="1"/>
      <text x="603" y="34" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#FF6A00" text-anchor="middle">Proprietary Data</text>
    </g>
    <g filter="url(#glowEEAT)">
      <rect x="540" y="48" width="126" height="20" rx="10" fill="rgba(255,106,0,0.14)" stroke="rgba(255,106,0,0.5)" stroke-width="1"/>
      <text x="603" y="62" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="rgba(255,106,0,0.85)" text-anchor="middle">+37% citation lift</text>
    </g>
  </g>

  <!-- Layer 2: E — Expertise -->
  <g transform="translate(260, 206)">
    <rect x="0" y="0" width="680" height="76" rx="10" fill="url(#pillarGradE2)" stroke="rgba(255,106,0,0.42)" stroke-width="1.5"/>
    <rect x="14" y="20" width="40" height="36" rx="8" fill="rgba(255,106,0,0.20)" stroke="rgba(255,106,0,0.7)" stroke-width="1"/>
    <text x="34" y="44" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FF6A00" text-anchor="middle">E</text>
    <text x="72" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.82)" dominant-baseline="middle">EXPERTISE</text>
    <text x="72" y="56" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.38)">Named authors · Credentials · Person schema · Author bio pages</text>
    <g filter="url(#glowEEAT)">
      <rect x="540" y="18" width="126" height="24" rx="12" fill="rgba(255,106,0,0.18)" stroke="rgba(255,106,0,0.7)" stroke-width="1"/>
      <text x="603" y="34" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#FF6A00" text-anchor="middle">Named Bylines</text>
    </g>
    <g filter="url(#glowEEAT)">
      <rect x="540" y="48" width="126" height="20" rx="10" fill="rgba(255,106,0,0.10)" stroke="rgba(255,106,0,0.4)" stroke-width="1"/>
      <text x="603" y="62" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="rgba(255,106,0,0.75)" text-anchor="middle">57% higher citation</text>
    </g>
  </g>

  <!-- Layer 3: A — Authoritativeness -->
  <g transform="translate(260, 290)">
    <rect x="0" y="0" width="680" height="76" rx="10" fill="url(#pillarGradA)" stroke="rgba(255,106,0,0.30)" stroke-width="1.5"/>
    <rect x="14" y="20" width="40" height="36" rx="8" fill="rgba(255,106,0,0.14)" stroke="rgba(255,106,0,0.55)" stroke-width="1"/>
    <text x="34" y="44" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FF6A00" text-anchor="middle">A</text>
    <text x="72" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.72)" dominant-baseline="middle">AUTHORITATIVENESS</text>
    <text x="72" y="56" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.32)">Earned media · G2/Capterra/Trustpilot · 4+ platform presence · Press mentions</text>
    <g filter="url(#glowEEAT)">
      <rect x="540" y="18" width="126" height="24" rx="12" fill="rgba(255,106,0,0.14)" stroke="rgba(255,106,0,0.55)" stroke-width="1"/>
      <text x="603" y="34" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#FF6A00" text-anchor="middle">Off-Page Stack</text>
    </g>
    <g filter="url(#glowEEAT)">
      <rect x="540" y="48" width="126" height="20" rx="10" fill="rgba(255,106,0,0.08)" stroke="rgba(255,106,0,0.32)" stroke-width="1"/>
      <text x="603" y="62" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="rgba(255,106,0,0.68)" text-anchor="middle">3x ChatGPT citations</text>
    </g>
  </g>

  <!-- Layer 4: T — Trustworthiness (bottom, most subtle) -->
  <g transform="translate(260, 374)">
    <rect x="0" y="0" width="680" height="76" rx="10" fill="url(#pillarGradT)" stroke="rgba(255,106,0,0.20)" stroke-width="1.5"/>
    <rect x="14" y="20" width="40" height="36" rx="8" fill="rgba(255,106,0,0.10)" stroke="rgba(255,106,0,0.42)" stroke-width="1"/>
    <text x="34" y="44" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FF6A00" text-anchor="middle">T</text>
    <text x="72" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.60)" dominant-baseline="middle">TRUSTWORTHINESS</text>
    <text x="72" y="56" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.26)">Primary source links · Current dates · Accuracy signals · Correction protocols</text>
    <g filter="url(#glowEEAT)">
      <rect x="540" y="18" width="126" height="24" rx="12" fill="rgba(255,106,0,0.10)" stroke="rgba(255,106,0,0.40)" stroke-width="1"/>
      <text x="603" y="34" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#FF6A00" text-anchor="middle">Citation Floor</text>
    </g>
    <g filter="url(#glowEEAT)">
      <rect x="540" y="48" width="126" height="20" rx="10" fill="rgba(255,106,0,0.06)" stroke="rgba(255,106,0,0.24)" stroke-width="1"/>
      <text x="603" y="62" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="rgba(255,106,0,0.58)" text-anchor="middle">Accuracy required</text>
    </g>
  </g>

  <!-- Citation chip glowing on top of the stack — floating above Layer 1 -->
  <g filter="url(#glowCitationEEAT)" transform="translate(600, 102)">
    <rect x="-64" y="-22" width="128" height="32" rx="16" fill="#FF6A00" opacity="0.90"/>
    <text x="0" y="8" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="white" text-anchor="middle" letter-spacing="1">AI CITATION EARNED</text>
  </g>

  <!-- Arrow pointing down from citation chip to top of E layer -->
  <line x1="600" y1="96" x2="600" y2="120" stroke="rgba(255,106,0,0.6)" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="600,122 595,112 605,112" fill="rgba(255,106,0,0.7)"/>

  <!-- Stats strip bottom bar -->
  <g transform="translate(100, 476)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="220" height="68" rx="10" fill="rgba(255,106,0,0.08)" stroke="rgba(255,106,0,0.25)" stroke-width="1"/>
    <text x="110" y="28" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#FF6A00" text-anchor="middle">84%</text>
    <text x="110" y="47" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="500">of AI citations = earned media</text>
    <text x="110" y="60" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.5)" text-anchor="middle">Muck Rack, May 2026</text>
    <!-- Stat 2 -->
    <rect x="240" y="0" width="220" height="68" rx="10" fill="rgba(255,106,0,0.08)" stroke="rgba(255,106,0,0.25)" stroke-width="1"/>
    <text x="350" y="28" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#FF6A00" text-anchor="middle">325%</text>
    <text x="350" y="47" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="500">more citations via multi-pub</text>
    <text x="350" y="60" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.5)" text-anchor="middle">Muck Rack, 2026</text>
    <!-- Stat 3 -->
    <rect x="480" y="0" width="220" height="68" rx="10" fill="rgba(255,106,0,0.08)" stroke="rgba(255,106,0,0.25)" stroke-width="1"/>
    <text x="590" y="28" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#FF6A00" text-anchor="middle">3x</text>
    <text x="590" y="47" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="500">ChatGPT citations with reviews</text>
    <text x="590" y="60" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.5)" text-anchor="middle">AirOps Research</text>
    <!-- Stat 4 -->
    <rect x="720" y="0" width="220" height="68" rx="10" fill="rgba(255,106,0,0.08)" stroke="rgba(255,106,0,0.25)" stroke-width="1"/>
    <text x="830" y="28" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#FF6A00" text-anchor="middle">44.2%</text>
    <text x="830" y="47" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="500">LLM citations from first 30%</text>
    <text x="830" y="60" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.5)" text-anchor="middle">GEO-SFE, 2026</text>
  </g>

  <!-- Bottom strip -->
  <rect x="0" y="600" width="1200" height="30" fill="#FF6A00" opacity="0.08"/>
  <text x="600" y="620" font-family="system-ui, sans-serif" font-size="14" fill="#FF6A00" text-anchor="middle" font-weight="700" letter-spacing="3">THE ANSWER ENGINE — theanswerengine.ai</text>
</svg>
