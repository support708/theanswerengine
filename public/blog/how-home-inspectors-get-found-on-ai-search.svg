<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1d27"/>
      <stop offset="100%" stop-color="#0F1117"/>
    </radialGradient>
    <radialGradient id="glow-left" cx="35%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF6A00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <circle cx="400" cy="350" r="320" fill="url(#glow-left)"/>

  <!-- House cross-section -->
  <!-- Roof -->
  <polygon points="220,110 400,240 580,240" fill="#FF6A00" fill-opacity="0.05" stroke="#FF6A00" stroke-width="2.5" stroke-opacity="0.55" stroke-linejoin="round"/>
  <!-- Walls -->
  <line x1="220" y1="240" x2="220" y2="460" stroke="#FF6A00" stroke-width="2" stroke-opacity="0.45"/>
  <line x1="580" y1="240" x2="580" y2="460" stroke="#FF6A00" stroke-width="2" stroke-opacity="0.45"/>
  <!-- Floor -->
  <line x1="210" y1="460" x2="590" y2="460" stroke="#FF6A00" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Interior fill -->
  <rect x="220" y="240" width="360" height="220" fill="#FF6A00" fill-opacity="0.025"/>
  <!-- Door -->
  <rect x="370" y="375" width="75" height="85" rx="3" fill="none" stroke="#FF6A00" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Window left -->
  <rect x="245" y="285" width="80" height="65" rx="3" fill="none" stroke="#FF6A00" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="285" y1="285" x2="285" y2="350" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="245" y1="317" x2="325" y2="317" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.25"/>
  <!-- Window right -->
  <rect x="475" y="285" width="80" height="65" rx="3" fill="none" stroke="#FF6A00" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="515" y1="285" x2="515" y2="350" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="475" y1="317" x2="555" y2="317" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Inspection checklist panel -->
  <rect x="30" y="210" width="175" height="205" rx="12" fill="#1e2235" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.22"/>
  <text x="48" y="242" fill="#FF6A00" font-size="12" font-family="monospace" opacity="0.85">Inspection Report</text>
  <line x1="48" y1="252" x2="188" y2="252" stroke="#FF6A00" stroke-width="0.5" stroke-opacity="0.2"/>
  <text x="52" y="276" fill="#4ade80" font-size="13" font-family="monospace">&#10003;</text>
  <text x="70" y="276" fill="#ccc" font-size="11" font-family="monospace">Foundation</text>
  <text x="52" y="298" fill="#4ade80" font-size="13" font-family="monospace">&#10003;</text>
  <text x="70" y="298" fill="#ccc" font-size="11" font-family="monospace">Roof / Attic</text>
  <text x="52" y="320" fill="#4ade80" font-size="13" font-family="monospace">&#10003;</text>
  <text x="70" y="320" fill="#ccc" font-size="11" font-family="monospace">Electrical</text>
  <text x="52" y="342" fill="#4ade80" font-size="13" font-family="monospace">&#10003;</text>
  <text x="70" y="342" fill="#ccc" font-size="11" font-family="monospace">HVAC / Plumbing</text>
  <text x="52" y="364" fill="#FF6A00" font-size="13" font-family="monospace">&#9675;</text>
  <text x="70" y="364" fill="#888" font-size="11" font-family="monospace">Sewer Scope</text>
  <text x="52" y="386" fill="#555" font-size="13" font-family="monospace">&#9675;</text>
  <text x="70" y="386" fill="#555" font-size="11" font-family="monospace">Thermal / Mold</text>

  <!-- Arrow checklist to house -->
  <path d="M207,312 Q218,312 218,312" stroke="#FF6A00" stroke-width="1.5" stroke-dasharray="4,3" fill="none" stroke-opacity="0.45"/>
  <polygon points="216,308 224,312 216,316" fill="#FF6A00" fill-opacity="0.45"/>

  <!-- Connection house to AI panel -->
  <path d="M583,345 Q615,345 640,345" stroke="#FF6A00" stroke-width="1.5" stroke-dasharray="4,3" fill="none" stroke-opacity="0.45"/>
  <polygon points="638,341 646,345 638,349" fill="#FF6A00" fill-opacity="0.45"/>

  <!-- AI response panel -->
  <rect x="655" y="185" width="490" height="275" rx="18" fill="#1e2235" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.28"/>
  <text x="680" y="226" fill="#FF6A00" font-size="13" font-family="monospace" opacity="0.9">AI Response</text>
  <line x1="680" y1="238" x2="1120" y2="238" stroke="#FF6A00" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- AI query -->
  <text x="680" y="268" fill="#888" font-size="12" font-family="monospace">"ASHI certified home inspector near me"</text>

  <!-- Result 1 -->
  <circle cx="692" cy="302" r="7" fill="#FF6A00" opacity="0.9"/>
  <text x="710" y="307" fill="#e0e0e0" font-size="13" font-family="monospace" font-weight="bold">Precision Home Inspections</text>
  <text x="710" y="325" fill="#666" font-size="11" font-family="monospace">ASHI certified, same-day report, thermal imaging</text>

  <!-- Result 2 -->
  <circle cx="692" cy="355" r="7" fill="#555" opacity="0.65"/>
  <text x="710" y="360" fill="#666" font-size="13" font-family="monospace">Metro Inspection Co.</text>
  <text x="710" y="378" fill="#444" font-size="11" font-family="monospace">InterNACHI, 24-hour digital report</text>

  <!-- Result 3 -->
  <circle cx="692" cy="408" r="7" fill="#333" opacity="0.45"/>
  <text x="710" y="413" fill="#3a3a3a" font-size="13" font-family="monospace">Generic Inspections LLC</text>

  <!-- Platform labels -->
  <text x="680" y="480" fill="#FF6A00" font-size="11" font-family="monospace" opacity="0.55">ChatGPT</text>
  <text x="770" y="480" fill="#FF6A00" font-size="11" font-family="monospace" opacity="0.55">Gemini</text>
  <text x="848" y="480" fill="#FF6A00" font-size="11" font-family="monospace" opacity="0.55">Claude</text>
  <text x="920" y="480" fill="#FF6A00" font-size="11" font-family="monospace" opacity="0.55">Perplexity</text>

  <!-- Bottom title text -->
  <text x="60" y="560" fill="#FF6A00" font-size="22" font-family="monospace" font-weight="bold" opacity="0.75">How Home Inspectors Get Found on AI Search</text>
  <text x="60" y="590" fill="#666" font-size="14" font-family="monospace">theanswerengine.ai</text>
</svg>
