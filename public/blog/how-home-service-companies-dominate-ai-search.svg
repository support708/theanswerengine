<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F1117"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#CC5500" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF6A00" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.06">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#FF6A00" stroke-width="0.5" transform="translate(100,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" stroke="#FF6A00" stroke-width="0.5" transform="translate(200,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" stroke="#FF6A00" stroke-width="0.5" transform="translate(300,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" stroke="#FF6A00" stroke-width="0.5" transform="translate(400,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" stroke="#FF6A00" stroke-width="0.5" transform="translate(500,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" stroke="#FF6A00" stroke-width="0.5" transform="translate(600,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" stroke="#FF6A00" stroke-width="0.5" transform="translate(700,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" stroke="#FF6A00" stroke-width="0.5" transform="translate(800,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" stroke="#FF6A00" stroke-width="0.5" transform="translate(900,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" stroke="#FF6A00" stroke-width="0.5" transform="translate(1000,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" stroke="#FF6A00" stroke-width="0.5" transform="translate(1100,0)"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#FF6A00" stroke-width="0.5"/>
  </g>

  <!-- Large glowing orb behind house -->
  <circle cx="600" cy="350" r="180" fill="#FF6A00" opacity="0.05" filter="url(#bigGlow)"/>

  <!-- Isometric House -->
  <g transform="translate(500, 200)">
    <!-- House shadow -->
    <ellipse cx="100" cy="280" rx="140" ry="30" fill="#000" opacity="0.3" filter="url(#bigGlow)"/>

    <!-- House left wall -->
    <path d="M0,160 L0,280 L100,320 L100,200 Z" fill="#1a2744" stroke="#FF6A00" stroke-width="1.5" opacity="0.9"/>
    <!-- House right wall -->
    <path d="M100,200 L100,320 L200,280 L200,160 Z" fill="#0f1d36" stroke="#FF6A00" stroke-width="1.5" opacity="0.9"/>
    <!-- House roof left -->
    <path d="M-10,165 L100,100 L100,200 L0,160 Z" fill="#FF6A00" opacity="0.7"/>
    <!-- House roof right -->
    <path d="M100,100 L210,165 L200,160 L100,200 Z" fill="#CC5500" opacity="0.7"/>
    <!-- Roof peak glow -->
    <circle cx="100" cy="100" r="8" fill="#FF6A00" opacity="0.6" filter="url(#softGlow)"/>

    <!-- Door -->
    <path d="M75,250 L75,310 L100,325 L125,310 L125,250 L100,237 Z" fill="#0a1628" stroke="#FF6A00" stroke-width="0.8"/>
    <!-- Door handle -->
    <circle cx="115" cy="280" r="3" fill="#FF6A00" opacity="0.8"/>

    <!-- Window left -->
    <rect x="20" y="195" width="30" height="25" rx="2" fill="#FF6A00" opacity="0.15" stroke="#FF6A00" stroke-width="0.8" transform="skewY(12)"/>
    <!-- Window glow -->
    <rect x="22" y="197" width="26" height="21" rx="1" fill="#FF6A00" opacity="0.08" transform="skewY(12)"/>

    <!-- Window right -->
    <rect x="140" y="185" width="30" height="25" rx="2" fill="#FF6A00" opacity="0.15" stroke="#FF6A00" stroke-width="0.8" transform="skewY(-12)"/>
  </g>

  <!-- AI Brain / Neural Network on the right -->
  <g transform="translate(820, 150)" filter="url(#softGlow)">
    <!-- Brain outline -->
    <ellipse cx="80" cy="90" rx="75" ry="85" fill="none" stroke="#FF6A00" stroke-width="1.5" opacity="0.4"/>
    <!-- Neural connections -->
    <circle cx="50" cy="60" r="6" fill="#FF6A00" opacity="0.6"/>
    <circle cx="110" cy="55" r="6" fill="#FF6A00" opacity="0.6"/>
    <circle cx="80" cy="90" r="8" fill="#FF6A00" opacity="0.8"/>
    <circle cx="45" cy="115" r="5" fill="#FF6A00" opacity="0.5"/>
    <circle cx="115" cy="120" r="5" fill="#FF6A00" opacity="0.5"/>
    <circle cx="80" cy="145" r="6" fill="#FF6A00" opacity="0.6"/>
    <circle cx="65" cy="40" r="4" fill="#FF6A00" opacity="0.4"/>
    <circle cx="95" cy="35" r="4" fill="#FF6A00" opacity="0.4"/>
    <!-- Neural lines -->
    <line x1="50" y1="60" x2="80" y2="90" stroke="#FF6A00" stroke-width="1" opacity="0.3"/>
    <line x1="110" y1="55" x2="80" y2="90" stroke="#FF6A00" stroke-width="1" opacity="0.3"/>
    <line x1="45" y1="115" x2="80" y2="90" stroke="#FF6A00" stroke-width="1" opacity="0.3"/>
    <line x1="115" y1="120" x2="80" y2="90" stroke="#FF6A00" stroke-width="1" opacity="0.3"/>
    <line x1="80" y1="145" x2="80" y2="90" stroke="#FF6A00" stroke-width="1" opacity="0.3"/>
    <line x1="50" y1="60" x2="110" y2="55" stroke="#FF6A00" stroke-width="0.8" opacity="0.2"/>
    <line x1="45" y1="115" x2="115" y2="120" stroke="#FF6A00" stroke-width="0.8" opacity="0.2"/>
    <line x1="50" y1="60" x2="45" y2="115" stroke="#FF6A00" stroke-width="0.8" opacity="0.2"/>
    <line x1="110" y1="55" x2="115" y2="120" stroke="#FF6A00" stroke-width="0.8" opacity="0.2"/>
    <line x1="65" y1="40" x2="50" y2="60" stroke="#FF6A00" stroke-width="0.8" opacity="0.2"/>
    <line x1="95" y1="35" x2="110" y2="55" stroke="#FF6A00" stroke-width="0.8" opacity="0.2"/>
  </g>

  <!-- Connection beam from house to AI -->
  <g opacity="0.4">
    <line x1="700" y1="300" x2="830" y2="240" stroke="#FF6A00" stroke-width="2" stroke-dasharray="8,6"/>
    <!-- Pulse dots along beam -->
    <circle cx="730" cy="290" r="3" fill="#FF6A00" opacity="0.8"/>
    <circle cx="765" cy="275" r="2.5" fill="#FF6A00" opacity="0.6"/>
    <circle cx="800" cy="258" r="2" fill="#FF6A00" opacity="0.4"/>
  </g>

  <!-- Floating tool icons (left side) -->
  <!-- Wrench -->
  <g transform="translate(120, 180) rotate(-30)" opacity="0.5">
    <rect x="0" y="0" width="8" height="40" rx="3" fill="#FF6A00" opacity="0.6"/>
    <circle cx="4" cy="0" r="10" fill="none" stroke="#FF6A00" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Pipe/Plumbing -->
  <g transform="translate(200, 350)" opacity="0.4">
    <path d="M0,0 L30,0 L30,20 L50,20" stroke="#FF6A00" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#FF6A00" opacity="0.3"/>
    <circle cx="50" cy="20" r="5" fill="#FF6A00" opacity="0.3"/>
  </g>

  <!-- Lightning bolt (electrician) -->
  <g transform="translate(150, 420)" opacity="0.45">
    <path d="M15,0 L5,20 L15,20 L8,40" stroke="#FF6A00" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Leaf (landscaping) -->
  <g transform="translate(300, 140)" opacity="0.35">
    <path d="M0,30 Q15,-5 30,10 Q15,25 0,30 Z" fill="#FF6A00" opacity="0.4" stroke="#FF6A00" stroke-width="1"/>
    <line x1="0" y1="30" x2="20" y2="8" stroke="#FF6A00" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Rising chart/arrow (success) -->
  <g transform="translate(950, 380)" opacity="0.5">
    <path d="M0,60 L20,40 L40,50 L60,20 L80,5" stroke="#FF6A00" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="80,5 70,5 80,15" fill="#FF6A00" opacity="0.7"/>
    <!-- Chart base -->
    <line x1="0" y1="65" x2="85" y2="65" stroke="#FF6A00" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="0" x2="0" y2="65" stroke="#FF6A00" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Search/magnifying glass icon -->
  <g transform="translate(350, 430)" opacity="0.35">
    <circle cx="15" cy="15" r="12" fill="none" stroke="#FF6A00" stroke-width="2"/>
    <line x1="23" y1="23" x2="35" y2="35" stroke="#FF6A00" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Floating data particles -->
  <circle cx="400" cy="120" r="2" fill="#FF6A00" opacity="0.4"/>
  <circle cx="450" cy="90" r="1.5" fill="#FF6A00" opacity="0.3"/>
  <circle cx="750" cy="450" r="2" fill="#FF6A00" opacity="0.35"/>
  <circle cx="850" cy="400" r="1.5" fill="#FF6A00" opacity="0.25"/>
  <circle cx="1050" cy="300" r="2" fill="#FF6A00" opacity="0.3"/>
  <circle cx="1100" cy="180" r="1.5" fill="#FF6A00" opacity="0.2"/>
  <circle cx="100" cy="300" r="2" fill="#FF6A00" opacity="0.3"/>
  <circle cx="950" cy="150" r="1.5" fill="#FF6A00" opacity="0.25"/>

  <!-- Category pill -->
  <rect x="50" y="30" width="140" height="32" rx="16" fill="#FF6A00" opacity="0.9"/>
  <text x="120" y="51" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Industry Guides</text>

  <!-- Title -->
  <text x="600" y="530" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700">How Home Service Companies Are</text>
  <text x="600" y="570" text-anchor="middle" fill="#FF6A00" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700">Dominating AI Search Right Now</text>

  <!-- Watermark -->
  <text x="600" y="615" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" opacity="0.3">THE ANSWER ENGINE</text>

  <!-- AE badge -->
  <circle cx="1155" cy="590" r="22" fill="#FF6A00" opacity="0.3" stroke="#FF6A00" stroke-width="1"/>
  <text x="1155" y="596" text-anchor="middle" fill="#FF6A00" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" opacity="0.5">AE</text>
</svg>