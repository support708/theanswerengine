<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d3b1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a350d;stop-opacity:1" />
    </linearGradient>
    <filter id="glow10"><feGaussianBlur stdDeviation="6" result="blur10"/><feMerge><feMergeNode in="blur10"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoft10"><feGaussianBlur stdDeviation="12" result="blur10s"/><feMerge><feMergeNode in="blur10s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg10)"/>
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <!-- ROI Calculator -->
  <g transform="translate(660, 50)">
    <rect x="0" y="0" width="470" height="460" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="235" y="28" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600">ROI CALCULATOR</text>
    <!-- Investment section -->
    <rect x="20" y="42" width="210" height="120" rx="8" fill="rgba(255,80,80,0.08)" stroke="rgba(255,80,80,0.3)" stroke-width="1.5"/>
    <text x="125" y="62" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,80,80,0.8)" text-anchor="middle" font-weight="600">MONTHLY INVESTMENT</text>
    <text x="125" y="100" font-family="system-ui, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="700">$2,997</text>
    <text x="125" y="120" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">Content + Schema + Citations</text>
    <text x="125" y="135" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">Technical + Monitoring</text>
    <text x="125" y="152" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.35)" text-anchor="middle">6-month commitment</text>
    <!-- Returns section -->
    <rect x="240" y="42" width="210" height="120" rx="8" fill="rgba(100,220,100,0.08)" stroke="rgba(100,220,100,0.3)" stroke-width="1.5"/>
    <text x="345" y="62" font-family="system-ui, sans-serif" font-size="10" fill="rgba(100,220,100,0.8)" text-anchor="middle" font-weight="600">MONTHLY RETURN</text>
    <text x="345" y="100" font-family="system-ui, sans-serif" font-size="24" fill="#FF6A00" text-anchor="middle" font-weight="700" filter="url(#glow10)">$12,400</text>
    <text x="345" y="120" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">Avg. new revenue from</text>
    <text x="345" y="135" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">AI-driven leads (month 6)</text>
    <text x="345" y="152" font-family="system-ui, sans-serif" font-size="10" fill="rgba(100,220,100,0.8)" text-anchor="middle" font-weight="600">4.1x ROI</text>
    <!-- Break-even chart -->
    <text x="20" y="190" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">BREAK-EVEN TIMELINE</text>
    <rect x="20" y="200" width="430" height="180" rx="6" fill="rgba(255,255,255,0.03)"/>
    <!-- X axis labels -->
    <text x="55" y="395" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">M1</text>
    <text x="127" y="395" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">M2</text>
    <text x="199" y="395" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">M3</text>
    <text x="271" y="395" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">M4</text>
    <text x="343" y="395" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">M5</text>
    <text x="415" y="395" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">M6</text>
    <!-- Cost line (red) -->
    <line x1="55" y1="350" x2="127" y2="330" stroke="rgba(255,80,80,0.7)" stroke-width="2.5"/>
    <line x1="127" y1="330" x2="199" y2="310" stroke="rgba(255,80,80,0.7)" stroke-width="2.5"/>
    <line x1="199" y1="310" x2="271" y2="290" stroke="rgba(255,80,80,0.7)" stroke-width="2.5"/>
    <line x1="271" y1="290" x2="343" y2="270" stroke="rgba(255,80,80,0.7)" stroke-width="2.5"/>
    <line x1="343" y1="270" x2="415" y2="250" stroke="rgba(255,80,80,0.7)" stroke-width="2.5"/>
    <!-- Revenue line (green, rising) -->
    <line x1="55" y1="370" x2="127" y2="360" stroke="rgba(100,220,100,0.7)" stroke-width="2.5"/>
    <line x1="127" y1="360" x2="199" y2="340" stroke="rgba(100,220,100,0.7)" stroke-width="2.5"/>
    <line x1="199" y1="340" x2="271" y2="300" stroke="rgba(100,220,100,0.7)" stroke-width="2.5"/>
    <line x1="271" y1="300" x2="343" y2="250" stroke="rgba(100,220,100,0.7)" stroke-width="2.5"/>
    <line x1="343" y1="250" x2="415" y2="210" stroke="rgba(100,220,100,0.7)" stroke-width="2.5"/>
    <!-- Break-even marker -->
    <line x1="307" y1="200" x2="307" y2="380" stroke="#FF6A00" stroke-width="2" stroke-dasharray="6,4" filter="url(#glow10)"/>
    <rect x="270" y="200" width="74" height="20" rx="4" fill="rgba(255,106,0,0.25)" stroke="#FF6A00" stroke-width="1.5"/>
    <text x="307" y="214" font-family="system-ui, sans-serif" font-size="9" fill="#FF6A00" text-anchor="middle" font-weight="700">BREAK EVEN</text>
    <!-- Legend -->
    <rect x="20" y="405" width="10" height="10" rx="2" fill="rgba(255,80,80,0.7)"/>
    <text x="35" y="415" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">Cumulative Cost</text>
    <rect x="140" y="405" width="10" height="10" rx="2" fill="rgba(100,220,100,0.7)"/>
    <text x="155" y="415" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">Cumulative Revenue</text>
    <!-- ROI badge -->
    <rect x="280" y="425" width="170" height="28" rx="6" fill="rgba(100,220,100,0.15)" stroke="rgba(100,220,100,0.5)" stroke-width="1.5"/>
    <text x="365" y="444" font-family="system-ui, sans-serif" font-size="12" fill="rgba(100,220,100,0.9)" text-anchor="middle" font-weight="700">12-MONTH ROI: 314%</text>
  </g>
  <circle cx="100" cy="130" r="60" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <rect x="40" y="40" width="140" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="110" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">ROI Analysis</text>
  <text x="80" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Is AEO</text>
  <text x="80" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Actually</text>
  <text x="80" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glow10)">Worth It?</text>
  <text x="80" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">Breaking Down the Numbers</text>
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>