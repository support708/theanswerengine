<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131313"/>
      <stop offset="60%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0f0f10"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#cc5500"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,106,0,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <rect x="0" y="0" width="8" height="630" fill="url(#orange)"/>

  <text x="80" y="100" font-family="Courier New, monospace" font-size="16" fill="#FF6A00" letter-spacing="4">
    AEO OPERATOR SERIES &#183; 2026
  </text>

  <text x="80" y="190" font-family="Arial Black, sans-serif" font-weight="900" font-size="72" fill="#FFFFFF" letter-spacing="-2">
    THE AEO
  </text>
  <text x="80" y="270" font-family="Arial Black, sans-serif" font-weight="900" font-size="72" fill="#FF6A00" letter-spacing="-2">
    CHECKLIST
  </text>
  <text x="80" y="350" font-family="Arial Black, sans-serif" font-weight="900" font-size="72" fill="#FFFFFF" letter-spacing="-2">
    FOR 2026
  </text>

  <g transform="translate(80, 410)">
    <rect x="0" y="0" width="220" height="40" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="20" y="27" font-family="Courier New, monospace" font-size="14" fill="#e5e2e1" letter-spacing="2">
      32 ITEMS &#183; 6 LAYERS &#183; 4 LLMs
    </text>

    <rect x="240" y="0" width="220" height="40" fill="#FF6A00"/>
    <text x="260" y="27" font-family="Arial Black, sans-serif" font-weight="900" font-size="14" fill="#000000" letter-spacing="2">
      COMPLIANCE PREMIUM
    </text>
  </g>

  <g transform="translate(80, 500)" font-family="Arial, sans-serif">
    <text x="0" y="0" font-size="32" font-weight="900" fill="#FF6A00">32</text>
    <text x="0" y="25" font-size="13" fill="rgba(229,226,225,0.65)">CHECKLIST ITEMS</text>

    <text x="180" y="0" font-size="32" font-weight="900" fill="#FF6A00">+57%</text>
    <text x="180" y="25" font-size="13" fill="rgba(229,226,225,0.65)">DEFINITION PREMIUM</text>

    <text x="360" y="0" font-size="32" font-weight="900" fill="#FF6A00">-31%</text>
    <text x="360" y="25" font-size="13" fill="rgba(229,226,225,0.65)">CHUNK CEILING</text>

    <text x="540" y="0" font-size="32" font-weight="900" fill="#FF6A00">1.9x</text>
    <text x="540" y="25" font-size="13" fill="rgba(229,226,225,0.65)">NAMED AUTHOR</text>
  </g>

  <text x="80" y="600" font-family="Courier New, monospace" font-size="14" fill="rgba(229,226,225,0.45)" letter-spacing="3">
    THE ANSWER ENGINE &#183; THEANSWERENGINE.AI
  </text>

  <g transform="translate(1080, 80)" stroke="#FF6A00" stroke-width="2" fill="none">
    <line x1="0" y1="0" x2="40" y2="0"/>
    <line x1="0" y1="0" x2="0" y2="40"/>
  </g>
  <g transform="translate(1120, 550)" stroke="#FF6A00" stroke-width="2" fill="none">
    <line x1="0" y1="0" x2="-40" y2="0"/>
    <line x1="0" y1="0" x2="0" y2="-40"/>
  </g>
</svg>
