<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="hero-grounding-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161820;stop-opacity:1" />
    </linearGradient>

    <!-- Left side glow (Perplexity side) -->
    <radialGradient id="hero-grounding-glow-left" cx="28%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#FF6A00;stop-opacity:0" />
    </radialGradient>

    <!-- Right side glow (ChatGPT side) -->
    <radialGradient id="hero-grounding-glow-right" cx="72%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#4A8EFF;stop-opacity:0.14" />
      <stop offset="100%" style="stop-color:#4A8EFF;stop-opacity:0" />
    </radialGradient>

    <!-- Node glow orange -->
    <radialGradient id="hero-grounding-node-orange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6A00;stop-opacity:0.3" />
    </radialGradient>

    <!-- Node glow blue -->
    <radialGradient id="hero-grounding-node-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4A8EFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A8EFF;stop-opacity:0.3" />
    </radialGradient>

    <!-- Central divider gradient -->
    <linearGradient id="hero-grounding-divider" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#FF6A00;stop-opacity:0.6" />
      <stop offset="70%" style="stop-color:#4A8EFF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#4A8EFF;stop-opacity:0" />
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="hero-grounding-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.3" opacity="0.08"/>
    </pattern>

    <!-- Clip path for left half -->
    <clipPath id="hero-grounding-clip-left">
      <rect x="0" y="0" width="590" height="630"/>
    </clipPath>

    <!-- Clip path for right half -->
    <clipPath id="hero-grounding-clip-right">
      <rect x="610" y="0" width="590" height="630"/>
    </clipPath>

    <!-- Flow arrow marker orange -->
    <marker id="hero-grounding-arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#FF6A00" opacity="0.7"/>
    </marker>

    <!-- Flow arrow marker blue -->
    <marker id="hero-grounding-arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4A8EFF" opacity="0.7"/>
    </marker>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="630" fill="url(#hero-grounding-bg-grad)"/>

  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#hero-grounding-grid)"/>

  <!-- Side glows -->
  <rect width="1200" height="630" fill="url(#hero-grounding-glow-left)"/>
  <rect width="1200" height="630" fill="url(#hero-grounding-glow-right)"/>

  <!-- Central divider line -->
  <line x1="600" y1="30" x2="600" y2="600" stroke="url(#hero-grounding-divider)" stroke-width="1.5"/>

  <!-- ===== LEFT SIDE: PERPLEXITY ARCHITECTURE (RAG-first) ===== -->

  <!-- Web/source cloud nodes (top, representing live retrieval) -->
  <!-- Source node 1 -->
  <rect x="60" y="80" width="80" height="28" rx="6" fill="#FF6A00" opacity="0.15" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="60" y1="89" x2="80" y2="89" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="60" y1="96" x2="75" y2="96" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="55" cy="94" r="6" fill="#FF6A00" opacity="0.3"/>

  <!-- Source node 2 -->
  <rect x="165" y="65" width="80" height="28" rx="6" fill="#FF6A00" opacity="0.12" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="165" y1="74" x2="185" y2="74" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="165" y1="81" x2="180" y2="81" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="160" cy="79" r="6" fill="#FF6A00" opacity="0.25"/>

  <!-- Source node 3 -->
  <rect x="280" y="80" width="80" height="28" rx="6" fill="#FF6A00" opacity="0.15" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="280" y1="89" x2="300" y2="89" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="280" y1="96" x2="295" y2="96" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="275" cy="94" r="6" fill="#FF6A00" opacity="0.3"/>

  <!-- Source node 4 -->
  <rect x="420" y="70" width="80" height="28" rx="6" fill="#FF6A00" opacity="0.10" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.35"/>
  <line x1="420" y1="79" x2="440" y2="79" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="420" y1="86" x2="435" y2="86" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="415" cy="84" r="6" fill="#FF6A00" opacity="0.22"/>

  <!-- Source node 5 (extra breadth indicator) -->
  <rect x="110" y="140" width="70" height="24" rx="5" fill="#FF6A00" opacity="0.08" stroke="#FF6A00" stroke-width="0.8" stroke-opacity="0.3"/>
  <circle cx="105" cy="152" r="5" fill="#FF6A00" opacity="0.2"/>

  <!-- Source node 6 -->
  <rect x="340" y="130" width="70" height="24" rx="5" fill="#FF6A00" opacity="0.08" stroke="#FF6A00" stroke-width="0.8" stroke-opacity="0.3"/>
  <circle cx="335" cy="142" r="5" fill="#FF6A00" opacity="0.2"/>

  <!-- Retrieval funnel lines converging down to center engine -->
  <!-- Flows from each source down to the central RAG processor -->
  <line x1="100" y1="108" x2="250" y2="230" stroke="#FF6A00" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="5,3" marker-end="url(#hero-grounding-arrow-orange)"/>
  <line x1="205" y1="93" x2="265" y2="228" stroke="#FF6A00" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="5,3" marker-end="url(#hero-grounding-arrow-orange)"/>
  <line x1="320" y1="108" x2="288" y2="228" stroke="#FF6A00" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="5,3" marker-end="url(#hero-grounding-arrow-orange)"/>
  <line x1="460" y1="98" x2="310" y2="228" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="5,3" marker-end="url(#hero-grounding-arrow-orange)"/>

  <!-- RAG Processor (central left engine) -->
  <rect x="220" y="230" width="140" height="80" rx="12" fill="#0F1117" stroke="#FF6A00" stroke-width="2" stroke-opacity="0.7"/>
  <!-- Processor internal grid suggesting computation -->
  <line x1="235" y1="250" x2="345" y2="250" stroke="#FF6A00" stroke-width="0.8" stroke-opacity="0.3"/>
  <line x1="235" y1="260" x2="345" y2="260" stroke="#FF6A00" stroke-width="0.8" stroke-opacity="0.2"/>
  <line x1="235" y1="270" x2="345" y2="270" stroke="#FF6A00" stroke-width="0.8" stroke-opacity="0.3"/>
  <line x1="235" y1="280" x2="345" y2="280" stroke="#FF6A00" stroke-width="0.8" stroke-opacity="0.2"/>
  <line x1="255" y1="235" x2="255" y2="305" stroke="#FF6A00" stroke-width="0.8" stroke-opacity="0.2"/>
  <line x1="280" y1="235" x2="280" y2="305" stroke="#FF6A00" stroke-width="0.8" stroke-opacity="0.2"/>
  <line x1="305" y1="235" x2="305" y2="305" stroke="#FF6A00" stroke-width="0.8" stroke-opacity="0.2"/>
  <line x1="330" y1="235" x2="330" y2="305" stroke="#FF6A00" stroke-width="0.8" stroke-opacity="0.2"/>
  <!-- Processor glow dot -->
  <circle cx="290" cy="268" r="12" fill="#FF6A00" opacity="0.15"/>
  <circle cx="290" cy="268" r="6" fill="url(#hero-grounding-node-orange)" opacity="0.8"/>

  <!-- Flow arrow from RAG processor down to answer with citations -->
  <line x1="290" y1="312" x2="290" y2="370" stroke="#FF6A00" stroke-width="1.5" stroke-opacity="0.6" marker-end="url(#hero-grounding-arrow-orange)"/>

  <!-- Answer output block (left) with inline citation markers -->
  <rect x="160" y="375" width="310" height="90" rx="10" fill="#FF6A00" opacity="0.07" stroke="#FF6A00" stroke-width="1.2" stroke-opacity="0.4"/>
  <!-- Citation number bubbles inline -->
  <circle cx="185" cy="395" r="7" fill="#FF6A00" opacity="0.7"/>
  <text x="185" y="399" text-anchor="middle" font-size="9" fill="white" font-family="monospace">1</text>
  <rect x="196" y="390" width="50" height="6" rx="2" fill="#FF6A00" opacity="0.25"/>
  <rect x="196" y="400" width="40" height="6" rx="2" fill="#FF6A00" opacity="0.2"/>

  <circle cx="260" cy="410" r="7" fill="#FF6A00" opacity="0.7"/>
  <text x="260" y="414" text-anchor="middle" font-size="9" fill="white" font-family="monospace">2</text>
  <rect x="271" y="405" width="55" height="6" rx="2" fill="#FF6A00" opacity="0.25"/>
  <rect x="271" y="415" width="45" height="6" rx="2" fill="#FF6A00" opacity="0.2"/>

  <circle cx="340" cy="395" r="7" fill="#FF6A00" opacity="0.7"/>
  <text x="340" y="399" text-anchor="middle" font-size="9" fill="white" font-family="monospace">3</text>
  <rect x="351" y="390" width="45" height="6" rx="2" fill="#FF6A00" opacity="0.25"/>
  <rect x="351" y="400" width="35" height="6" rx="2" fill="#FF6A00" opacity="0.2"/>

  <circle cx="395" cy="425" r="7" fill="#FF6A00" opacity="0.55"/>
  <text x="395" y="429" text-anchor="middle" font-size="9" fill="white" font-family="monospace">4</text>

  <!-- Source list panel (left bottom) -->
  <rect x="200" y="480" width="260" height="100" rx="8" fill="#FF6A00" opacity="0.05" stroke="#FF6A00" stroke-width="0.8" stroke-opacity="0.3"/>
  <!-- Source rows with logos suggestion -->
  <circle cx="220" cy="498" r="5" fill="#FF6A00" opacity="0.5"/>
  <rect x="230" y="494" width="90" height="4" rx="2" fill="#FF6A00" opacity="0.3"/>
  <rect x="230" y="502" width="70" height="3" rx="1" fill="#FF6A00" opacity="0.2"/>

  <circle cx="220" cy="518" r="5" fill="#FF6A00" opacity="0.4"/>
  <rect x="230" y="514" width="100" height="4" rx="2" fill="#FF6A00" opacity="0.3"/>
  <rect x="230" y="522" width="80" height="3" rx="1" fill="#FF6A00" opacity="0.2"/>

  <circle cx="220" cy="538" r="5" fill="#FF6A00" opacity="0.45"/>
  <rect x="230" y="534" width="85" height="4" rx="2" fill="#FF6A00" opacity="0.3"/>
  <rect x="230" y="542" width="65" height="3" rx="1" fill="#FF6A00" opacity="0.2"/>

  <circle cx="220" cy="558" r="5" fill="#FF6A00" opacity="0.35"/>
  <rect x="230" y="554" width="95" height="4" rx="2" fill="#FF6A00" opacity="0.25"/>
  <rect x="230" y="562" width="75" height="3" rx="1" fill="#FF6A00" opacity="0.15"/>

  <!-- ===== RIGHT SIDE: CHATGPT ARCHITECTURE (confidence-first) ===== -->

  <!-- Training corpus cloud (large blob top right representing stored knowledge) -->
  <ellipse cx="860" cy="120" rx="150" ry="75" fill="#4A8EFF" opacity="0.05" stroke="#4A8EFF" stroke-width="1" stroke-opacity="0.25"/>
  <!-- Data nodes inside corpus -->
  <circle cx="790" cy="105" r="4" fill="#4A8EFF" opacity="0.4"/>
  <circle cx="820" cy="88" r="3" fill="#4A8EFF" opacity="0.3"/>
  <circle cx="850" cy="110" r="5" fill="#4A8EFF" opacity="0.45"/>
  <circle cx="880" cy="90" r="3" fill="#4A8EFF" opacity="0.3"/>
  <circle cx="910" cy="115" r="4" fill="#4A8EFF" opacity="0.4"/>
  <circle cx="935" cy="98" r="3" fill="#4A8EFF" opacity="0.3"/>
  <circle cx="860" cy="140" r="4" fill="#4A8EFF" opacity="0.35"/>
  <!-- Connecting lines inside corpus -->
  <line x1="790" y1="105" x2="820" y2="88" stroke="#4A8EFF" stroke-width="0.6" stroke-opacity="0.3"/>
  <line x1="820" y1="88" x2="850" y2="110" stroke="#4A8EFF" stroke-width="0.6" stroke-opacity="0.3"/>
  <line x1="850" y1="110" x2="880" y2="90" stroke="#4A8EFF" stroke-width="0.6" stroke-opacity="0.3"/>
  <line x1="880" y1="90" x2="910" y2="115" stroke="#4A8EFF" stroke-width="0.6" stroke-opacity="0.3"/>
  <line x1="910" y1="115" x2="935" y2="98" stroke="#4A8EFF" stroke-width="0.6" stroke-opacity="0.3"/>
  <line x1="850" y1="110" x2="860" y2="140" stroke="#4A8EFF" stroke-width="0.6" stroke-opacity="0.25"/>

  <!-- Arrow from corpus down to confidence evaluator -->
  <line x1="860" y1="196" x2="860" y2="228" stroke="#4A8EFF" stroke-width="1.5" stroke-opacity="0.5" marker-end="url(#hero-grounding-arrow-blue)"/>

  <!-- Confidence evaluator (decision diamond) -->
  <polygon points="860,230 920,268 860,306 800,268" fill="#0F1117" stroke="#4A8EFF" stroke-width="1.8" stroke-opacity="0.65"/>
  <!-- Internal indicator -->
  <line x1="830" y1="268" x2="890" y2="268" stroke="#4A8EFF" stroke-width="0.8" stroke-opacity="0.3"/>
  <line x1="860" y1="248" x2="860" y2="288" stroke="#4A8EFF" stroke-width="0.8" stroke-opacity="0.3"/>
  <circle cx="860" cy="268" r="8" fill="#4A8EFF" opacity="0.2"/>
  <circle cx="860" cy="268" r="4" fill="url(#hero-grounding-node-blue)" opacity="0.85"/>

  <!-- YES path (retrieval needed): forks right -->
  <path d="M920,268 Q970,268 970,310 L970,350" stroke="#4A8EFF" stroke-width="1.2" stroke-opacity="0.45" fill="none" stroke-dasharray="4,3" marker-end="url(#hero-grounding-arrow-blue)"/>
  <!-- Optional Bing retrieval box (small) -->
  <rect x="930" y="353" width="80" height="38" rx="7" fill="#4A8EFF" opacity="0.08" stroke="#4A8EFF" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="938" y1="364" x2="1002" y2="364" stroke="#4A8EFF" stroke-width="0.8" stroke-opacity="0.35"/>
  <line x1="938" y1="372" x2="990" y2="372" stroke="#4A8EFF" stroke-width="0.8" stroke-opacity="0.25"/>
  <circle cx="948" cy="375" r="4" fill="#4A8EFF" opacity="0.35"/>

  <!-- NO path (no retrieval): goes straight down -->
  <path d="M860,306 L860,375" stroke="#4A8EFF" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4,2" marker-end="url(#hero-grounding-arrow-blue)"/>

  <!-- Arrow from Bing box merging into answer -->
  <path d="M970,392 Q970,430 900,430 L870,430" stroke="#4A8EFF" stroke-width="1" stroke-opacity="0.4" fill="none" stroke-dasharray="3,3" marker-end="url(#hero-grounding-arrow-blue)"/>

  <!-- Answer output block (right) with fewer citation markers -->
  <rect x="680" y="375" width="310" height="90" rx="10" fill="#4A8EFF" opacity="0.06" stroke="#4A8EFF" stroke-width="1.2" stroke-opacity="0.35"/>
  <!-- Fewer citation number bubbles -->
  <circle cx="710" cy="400" r="7" fill="#4A8EFF" opacity="0.65"/>
  <text x="710" y="404" text-anchor="middle" font-size="9" fill="white" font-family="monospace">1</text>
  <rect x="721" y="395" width="70" height="6" rx="2" fill="#4A8EFF" opacity="0.2"/>
  <rect x="721" y="405" width="55" height="6" rx="2" fill="#4A8EFF" opacity="0.15"/>

  <circle cx="820" cy="415" r="7" fill="#4A8EFF" opacity="0.65"/>
  <text x="820" y="419" text-anchor="middle" font-size="9" fill="white" font-family="monospace">2</text>
  <rect x="831" y="410" width="65" height="6" rx="2" fill="#4A8EFF" opacity="0.2"/>
  <rect x="831" y="420" width="50" height="6" rx="2" fill="#4A8EFF" opacity="0.15"/>

  <circle cx="910" cy="400" r="7" fill="#4A8EFF" opacity="0.5"/>
  <text x="910" y="404" text-anchor="middle" font-size="9" fill="white" font-family="monospace">3</text>
  <rect x="921" y="395" width="50" height="6" rx="2" fill="#4A8EFF" opacity="0.18"/>

  <!-- Smaller source list panel (right bottom) — fewer sources than left -->
  <rect x="720" y="480" width="220" height="80" rx="8" fill="#4A8EFF" opacity="0.04" stroke="#4A8EFF" stroke-width="0.8" stroke-opacity="0.25"/>
  <circle cx="738" cy="498" r="5" fill="#4A8EFF" opacity="0.45"/>
  <rect x="748" y="494" width="80" height="4" rx="2" fill="#4A8EFF" opacity="0.25"/>
  <rect x="748" y="502" width="60" height="3" rx="1" fill="#4A8EFF" opacity="0.18"/>

  <circle cx="738" cy="520" r="5" fill="#4A8EFF" opacity="0.38"/>
  <rect x="748" y="516" width="90" height="4" rx="2" fill="#4A8EFF" opacity="0.25"/>
  <rect x="748" y="524" width="70" height="3" rx="1" fill="#4A8EFF" opacity="0.18"/>

  <circle cx="738" cy="542" r="5" fill="#4A8EFF" opacity="0.35"/>
  <rect x="748" y="538" width="75" height="4" rx="2" fill="#4A8EFF" opacity="0.22"/>
  <rect x="748" y="546" width="55" height="3" rx="1" fill="#4A8EFF" opacity="0.15"/>

  <!-- ===== OVERLAP ZONE (center) — minimal intersection ===== -->
  <!-- Small overlap region suggesting the 11% -->
  <ellipse cx="600" cy="430" rx="18" ry="25" fill="#FF6A00" opacity="0.08"/>
  <ellipse cx="600" cy="430" rx="10" ry="14" fill="#4A8EFF" opacity="0.08"/>
  <circle cx="600" cy="430" r="5" fill="white" opacity="0.06"/>

  <!-- Subtle overlap label dots -->
  <circle cx="600" cy="405" r="2" fill="#FF6A00" opacity="0.4"/>
  <circle cx="600" cy="456" r="2" fill="#4A8EFF" opacity="0.4"/>

  <!-- Decorative corner accents -->
  <line x1="30" y1="30" x2="80" y2="30" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="30" y1="30" x2="30" y2="80" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="1170" y1="30" x2="1120" y2="30" stroke="#4A8EFF" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="1170" y1="30" x2="1170" y2="80" stroke="#4A8EFF" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="30" y1="600" x2="80" y2="600" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="30" y1="600" x2="30" y2="550" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="1170" y1="600" x2="1120" y2="600" stroke="#4A8EFF" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="1170" y1="600" x2="1170" y2="550" stroke="#4A8EFF" stroke-width="1" stroke-opacity="0.2"/>
</svg>
