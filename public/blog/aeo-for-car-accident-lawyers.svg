<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="AEO for Car Accident Lawyers — The Answer Engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131313"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F27D24"/>
      <stop offset="100%" stop-color="#cc5500"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F27D24" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#F27D24" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#F27D24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient glow -->
  <ellipse cx="950" cy="200" rx="500" ry="320" fill="url(#glow)"/>
  <ellipse cx="200" cy="500" rx="380" ry="240" fill="url(#glow)" opacity="0.6"/>

  <!-- Abstract intersection lines (motion blur effect) -->
  <g opacity="0.18" stroke="#F27D24" stroke-width="2" fill="none">
    <line x1="0" y1="420" x2="1200" y2="380"/>
    <line x1="0" y1="450" x2="1200" y2="410"/>
    <line x1="0" y1="480" x2="1200" y2="440"/>
  </g>
  <g opacity="0.12" stroke="#ffffff" stroke-width="1" fill="none">
    <line x1="400" y1="0" x2="500" y2="630"/>
    <line x1="430" y1="0" x2="530" y2="630"/>
    <line x1="460" y1="0" x2="560" y2="630"/>
    <line x1="700" y1="0" x2="800" y2="630"/>
    <line x1="730" y1="0" x2="830" y2="630"/>
  </g>

  <!-- Motion streak (orange) -->
  <g opacity="0.55">
    <rect x="0" y="455" width="1200" height="3" fill="url(#orange)"/>
    <rect x="100" y="465" width="900" height="2" fill="#F27D24" opacity="0.4"/>
    <rect x="300" y="475" width="700" height="2" fill="#F27D24" opacity="0.25"/>
  </g>

  <!-- Hexagonal node accent (entity graph motif) -->
  <g transform="translate(950 280)" opacity="0.5">
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="none" stroke="#F27D24" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#F27D24"/>
    <line x1="0" y1="0" x2="60" y2="-50" stroke="#F27D24" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="0" x2="-70" y2="40" stroke="#F27D24" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="0" x2="80" y2="60" stroke="#F27D24" stroke-width="1" opacity="0.6"/>
    <circle cx="60" cy="-50" r="4" fill="#F27D24" opacity="0.7"/>
    <circle cx="-70" cy="40" r="4" fill="#F27D24" opacity="0.7"/>
    <circle cx="80" cy="60" r="4" fill="#F27D24" opacity="0.7"/>
  </g>

  <!-- Category tag -->
  <g transform="translate(80 90)">
    <rect x="0" y="0" width="220" height="32" rx="0" fill="#F27D24" fill-opacity="0.1" stroke="#F27D24" stroke-opacity="0.35" stroke-width="1"/>
    <text x="14" y="22" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#F27D24" letter-spacing="2">INDUSTRY VERTICALS</text>
  </g>

  <!-- Main headline -->
  <g transform="translate(80 180)">
    <text font-family="Space Grotesk, Inter, sans-serif" font-weight="900" font-size="72" fill="#e5e2e1" letter-spacing="-3">
      <tspan x="0" y="0">AEO FOR CAR</tspan>
      <tspan x="0" y="80">ACCIDENT</tspan>
      <tspan x="0" y="160" fill="#F27D24">LAWYERS</tspan>
    </text>
  </g>

  <!-- Subline -->
  <g transform="translate(80 510)">
    <text font-family="Inter, sans-serif" font-size="20" fill="#e5e2e1" fill-opacity="0.6" letter-spacing="0">
      <tspan x="0" y="0">How collision practices get cited by ChatGPT, Perplexity,</tspan>
      <tspan x="0" y="28">and Google AI Overviews — the operator&apos;s playbook.</tspan>
    </text>
  </g>

  <!-- Brand mark -->
  <g transform="translate(1080 580)">
    <text font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#F27D24" letter-spacing="2" text-anchor="end">THEANSWERENGINE.AI</text>
  </g>

  <!-- Corner accent ticks -->
  <g stroke="#F27D24" stroke-width="2" fill="none" opacity="0.5">
    <path d="M 60 60 L 60 80 L 80 80"/>
    <path d="M 1140 60 L 1140 80 L 1120 80"/>
    <path d="M 60 570 L 60 550 L 80 550"/>
    <path d="M 1140 570 L 1140 550 L 1120 550"/>
  </g>
</svg>
