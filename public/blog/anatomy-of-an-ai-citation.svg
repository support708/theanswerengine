<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgCite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1424;stop-opacity:1"/>
      <stop offset="55%" style="stop-color:#0F1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2a1a08;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="52%" r="22%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#FF6A00;stop-opacity:0"/>
    </radialGradient>
    <filter id="glowHard"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="12" result="bs"/><feMerge><feMergeNode in="bs"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="nodeShadow"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF6A00" flood-opacity="0.5"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgCite)"/>
  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Center glow halo -->
  <rect width="1200" height="630" fill="url(#centerGlow)"/>

  <!-- ── TITLE BLOCK (top) ── -->
  <text x="600" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="rgba(255,106,0,0.85)" text-anchor="middle" letter-spacing="4">ALGORITHM ANATOMY</text>
  <text x="600" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" fill="white" text-anchor="middle">Anatomy of an AI Citation</text>
  <text x="600" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="rgba(255,255,255,0.5)" text-anchor="middle">The 7 signals AI uses to pick you — or skip you entirely</text>

  <!-- ── CENTRAL NODE ── -->
  <!-- Outer ring -->
  <circle cx="600" cy="360" r="72" fill="none" stroke="#FF6A00" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.4"/>
  <!-- Middle ring -->
  <circle cx="600" cy="360" r="54" fill="none" stroke="#FF6A00" stroke-width="1" opacity="0.25"/>
  <!-- Core -->
  <circle cx="600" cy="360" r="46" fill="#0F1117" stroke="#FF6A00" stroke-width="2.5" filter="url(#nodeShadow)"/>
  <text x="600" y="354" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="2">AI</text>
  <text x="600" y="368" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="2">CITATION</text>

  <!-- ── SPOKE LINES (center → signal nodes, clipped to not overlap center circle) ── -->
  <!-- Signal 1: Authority — top -->
  <line x1="600" y1="314" x2="600" y2="218" stroke="#FF6A00" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.55"/>
  <!-- Signal 2: Co-Occurrence — top-right -->
  <line x1="641" y1="328" x2="760" y2="255" stroke="#FF6A00" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.55"/>
  <!-- Signal 3: Entity — right -->
  <line x1="646" y1="360" x2="800" y2="360" stroke="#FF6A00" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.55"/>
  <!-- Signal 4: Schema — bottom-right -->
  <line x1="641" y1="392" x2="760" y2="465" stroke="#FF6A00" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.55"/>
  <!-- Signal 5: Sentiment — bottom -->
  <line x1="600" y1="406" x2="600" y2="500" stroke="#FF6A00" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.55"/>
  <!-- Signal 6: Freshness — bottom-left -->
  <line x1="559" y1="392" x2="440" y2="465" stroke="#FF6A00" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.55"/>
  <!-- Signal 7: Consistency — left -->
  <line x1="554" y1="360" x2="400" y2="360" stroke="#FF6A00" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.55"/>

  <!-- ── SIGNAL NODES ── -->

  <!-- S1: Authority — top (600, 200) -->
  <circle cx="600" cy="200" r="28" fill="#0d1424" stroke="#FF6A00" stroke-width="1.8" filter="url(#glowHard)" opacity="0.95"/>
  <text x="600" y="196" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="1">SOURCE</text>
  <text x="600" y="208" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="1">AUTHORITY</text>
  <text x="600" y="172" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.45)" text-anchor="middle">Signal 1</text>

  <!-- S2: Co-Occurrence — top-right (780, 238) -->
  <circle cx="780" cy="238" r="28" fill="#0d1424" stroke="#FF6A00" stroke-width="1.8" filter="url(#glowHard)" opacity="0.9"/>
  <text x="780" y="234" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="0.5">CO-</text>
  <text x="780" y="246" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="0.5">OCCURRENCE</text>
  <text x="780" y="210" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.45)" text-anchor="middle">Signal 2</text>

  <!-- S3: Entity — right (828, 360) -->
  <circle cx="828" cy="360" r="28" fill="#0d1424" stroke="#FF6A00" stroke-width="1.8" filter="url(#glowHard)" opacity="0.9"/>
  <text x="828" y="356" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="0.5">BRAND</text>
  <text x="828" y="368" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="0.5">ENTITY</text>
  <text x="828" y="332" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.45)" text-anchor="middle">Signal 3</text>

  <!-- S4: Schema — bottom-right (780, 482) -->
  <circle cx="780" cy="482" r="28" fill="#0d1424" stroke="#FF6A00" stroke-width="1.8" filter="url(#glowHard)" opacity="0.9"/>
  <text x="780" y="478" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="0.5">SCHEMA</text>
  <text x="780" y="490" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="0.5">TRUST</text>
  <text x="780" y="516" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.45)" text-anchor="middle">Signal 4</text>

  <!-- S5: Sentiment — bottom (600, 518) -->
  <circle cx="600" cy="518" r="28" fill="#0d1424" stroke="#FF6A00" stroke-width="1.8" filter="url(#glowHard)" opacity="0.9"/>
  <text x="600" y="514" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="0.5">SENTIMENT</text>
  <text x="600" y="526" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="0.5">&amp; REVIEWS</text>
  <text x="600" y="550" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.45)" text-anchor="middle">Signal 5</text>

  <!-- S6: Freshness — bottom-left (420, 482) -->
  <circle cx="420" cy="482" r="28" fill="#0d1424" stroke="#FF6A00" stroke-width="1.8" filter="url(#glowHard)" opacity="0.9"/>
  <text x="420" y="478" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="0.5">FRESHNESS</text>
  <text x="420" y="490" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="0.5">&amp; CADENCE</text>
  <text x="420" y="516" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.45)" text-anchor="middle">Signal 6</text>

  <!-- S7: Consistency — left (372, 360) -->
  <circle cx="372" cy="360" r="28" fill="#0d1424" stroke="#FF6A00" stroke-width="1.8" filter="url(#glowHard)" opacity="0.9"/>
  <text x="372" y="356" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="0.5">CROSS-SRC</text>
  <text x="372" y="368" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="0.5">CONSISTENCY</text>
  <text x="372" y="332" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.45)" text-anchor="middle">Signal 7</text>

  <!-- ── BOTTOM STRIP ── -->
  <rect x="0" y="600" width="1200" height="30" fill="#FF6A00" opacity="0.08"/>
  <text x="600" y="620" font-family="system-ui, sans-serif" font-size="13" fill="#FF6A00" text-anchor="middle" font-weight="700" letter-spacing="3">THE ANSWER ENGINE &mdash; theanswerengine.ai</text>
</svg>
