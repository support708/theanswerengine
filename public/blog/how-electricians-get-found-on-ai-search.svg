<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <radialGradient id="hero-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1d27"/>
      <stop offset="100%" stop-color="#0F1117"/>
    </radialGradient>
    <radialGradient id="hero-glow-l" cx="25%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FF6A00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-glow-r" cx="80%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF6A00" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#hero-bg)"/>
  <rect width="1200" height="630" fill="url(#hero-glow-l)"/>
  <rect width="1200" height="630" fill="url(#hero-glow-r)"/>

  <!-- Grid lines subtle -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Lightning bolt — left section -->
  <g filter="url(#glow-filter)">
    <polygon points="260,80 200,290 265,290 195,540 370,260 295,260 375,80"
      fill="#FF6A00" fill-opacity="0.12"
      stroke="#FF6A00" stroke-width="2.5" stroke-opacity="0.7" stroke-linejoin="round"/>
  </g>

  <!-- Circuit dots radiating from bolt -->
  <circle cx="285" cy="200" r="4" fill="#FF6A00" fill-opacity="0.5"/>
  <circle cx="395" cy="180" r="3" fill="#FF6A00" fill-opacity="0.35"/>
  <circle cx="285" cy="400" r="4" fill="#FF6A00" fill-opacity="0.5"/>
  <circle cx="390" cy="430" r="3" fill="#FF6A00" fill-opacity="0.3"/>

  <!-- Connecting lines from bolt to panel -->
  <line x1="388" y1="200" x2="460" y2="200" stroke="#FF6A00" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="6,4"/>
  <line x1="388" y1="310" x2="460" y2="310" stroke="#FF6A00" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="6,4"/>
  <line x1="388" y1="420" x2="460" y2="420" stroke="#FF6A00" stroke-width="1.2" stroke-opacity="0.2" stroke-dasharray="6,4"/>
  <!-- Arrow heads -->
  <polygon points="456,196 464,200 456,204" fill="#FF6A00" fill-opacity="0.4"/>
  <polygon points="456,306 464,310 456,314" fill="#FF6A00" fill-opacity="0.4"/>
  <polygon points="456,416 464,420 456,424" fill="#FF6A00" fill-opacity="0.25"/>

  <!-- Main AI response panel -->
  <rect x="475" y="100" width="580" height="420" rx="20"
    fill="#1e2235" fill-opacity="0.95"
    stroke="#FF6A00" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Panel header bar -->
  <rect x="475" y="100" width="580" height="52" rx="20" fill="#FF6A00" fill-opacity="0.08"/>
  <rect x="475" y="132" width="580" height="20" fill="#FF6A00" fill-opacity="0.08"/>

  <!-- Header dots -->
  <circle cx="505" cy="126" r="6" fill="#FF6A00" fill-opacity="0.5"/>
  <circle cx="523" cy="126" r="6" fill="#FF6A00" fill-opacity="0.25"/>
  <circle cx="541" cy="126" r="6" fill="#FF6A00" fill-opacity="0.15"/>

  <!-- Header label -->
  <text x="565" y="131" fill="#FF6A00" font-size="13" font-family="monospace" opacity="0.85" font-weight="bold">AI Search Response</text>

  <!-- Separator -->
  <line x1="495" y1="160" x2="1035" y2="160" stroke="#FF6A00" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Query text -->
  <text x="500" y="187" fill="#888" font-size="12" font-family="monospace">"find me a licensed electrician near me"</text>

  <!-- Separator line -->
  <line x1="495" y1="198" x2="1035" y2="198" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>

  <!-- Result 1 — YOU (highlighted) -->
  <rect x="488" y="208" width="558" height="88" rx="10" fill="#FF6A00" fill-opacity="0.07" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="515" cy="252" r="8" fill="#FF6A00" fill-opacity="0.9"/>
  <text x="511" y="257" fill="#0F1117" font-size="12" font-family="monospace" font-weight="bold">1</text>
  <text x="534" y="240" fill="#ffffff" font-size="15" font-family="monospace" font-weight="bold">Apex Electric Co. — Licensed Electrician</text>
  <text x="534" y="259" fill="#aaaaaa" font-size="11" font-family="monospace">24/7 emergency service · Panel upgrades · EV chargers · Glendale, CA</text>
  <text x="534" y="276" fill="#FF6A00" font-size="11" font-family="monospace">4.9 stars (287 reviews) · Licensed · Insured · BBB Accredited</text>
  <text x="986" y="253" fill="#FF6A00" font-size="10" font-family="monospace" opacity="0.7">CITED</text>

  <!-- Result 2 -->
  <circle cx="515" cy="330" r="7" fill="#555" fill-opacity="0.7"/>
  <text x="511" y="335" fill="#999" font-size="11" font-family="monospace">2</text>
  <text x="534" y="324" fill="#aaaaaa" font-size="13" font-family="monospace">City Wiring Solutions</text>
  <text x="534" y="342" fill="#666" font-size="10" font-family="monospace">General electrical contractor · Burbank, CA</text>

  <!-- Result 3 -->
  <circle cx="515" cy="382" r="7" fill="#444" fill-opacity="0.5"/>
  <text x="511" y="387" fill="#777" font-size="11" font-family="monospace">3</text>
  <text x="534" y="376" fill="#777" font-size="13" font-family="monospace">Metro Electrical Group</text>
  <text x="534" y="394" fill="#555" font-size="10" font-family="monospace">Serving greater LA area</text>

  <!-- Separator -->
  <line x1="495" y1="410" x2="1035" y2="410" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>

  <!-- Platform tags at bottom of panel -->
  <rect x="500" y="425" width="80" height="22" rx="11" fill="#FF6A00" fill-opacity="0.12" stroke="#FF6A00" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="516" y="440" fill="#FF6A00" font-size="10" font-family="monospace" opacity="0.9">ChatGPT</text>

  <rect x="592" y="425" width="64" height="22" rx="11" fill="#FF6A00" fill-opacity="0.08" stroke="#FF6A00" stroke-width="0.5" stroke-opacity="0.2"/>
  <text x="607" y="440" fill="#FF6A00" font-size="10" font-family="monospace" opacity="0.7">Gemini</text>

  <rect x="668" y="425" width="56" height="22" rx="11" fill="#FF6A00" fill-opacity="0.08" stroke="#FF6A00" stroke-width="0.5" stroke-opacity="0.2"/>
  <text x="682" y="440" fill="#FF6A00" font-size="10" font-family="monospace" opacity="0.7">Claude</text>

  <rect x="736" y="425" width="80" height="22" rx="11" fill="#FF6A00" fill-opacity="0.06" stroke="#FF6A00" stroke-width="0.5" stroke-opacity="0.15"/>
  <text x="749" y="440" fill="#FF6A00" font-size="10" font-family="monospace" opacity="0.55">Perplexity</text>

  <!-- Main headline text -->
  <text x="600" y="580" fill="#ffffff" font-size="22" font-family="sans-serif" font-weight="bold" text-anchor="middle" opacity="0.95">How Electricians Get Found on AI Search</text>
  <text x="600" y="608" fill="#FF6A00" font-size="14" font-family="sans-serif" text-anchor="middle" opacity="0.75">theanswerengine.ai</text>
</svg>
