<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur3"/>
      <feMerge><feMergeNode in="blur3"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow3b" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur3b"/>
      <feMerge><feMergeNode in="blur3b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="chartLine3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ff3333;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="chartFill3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#FF6A00;stop-opacity:0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg3)"/>
  <!-- Subtle background pattern lines -->
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <line x1="200" y1="0" x2="200" y2="630" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <line x1="1000" y1="0" x2="1000" y2="630" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <!-- Chart area -->
  <!-- Y-axis -->
  <line x1="770" y1="120" x2="770" y2="480" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- X-axis -->
  <line x1="770" y1="480" x2="1150" y2="480" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Y-axis labels -->
  <text x="755" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.2)" text-anchor="end">$$$</text>
  <text x="755" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.2)" text-anchor="end">$$</text>
  <text x="755" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.2)" text-anchor="end">$</text>
  <text x="755" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.2)" text-anchor="end">$0</text>
  <!-- Horizontal grid -->
  <line x1="770" y1="200" x2="1150" y2="200" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
  <line x1="770" y1="280" x2="1150" y2="280" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
  <line x1="770" y1="360" x2="1150" y2="360" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
  <!-- X-axis labels (years/quarters) -->
  <text x="810" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.2)" text-anchor="middle">Q1</text>
  <text x="900" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.2)" text-anchor="middle">Q2</text>
  <text x="990" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.2)" text-anchor="middle">Q3</text>
  <text x="1080" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.2)" text-anchor="middle">Q4</text>
  <!-- Declining revenue line -->
  <polyline points="790,160 850,175 900,210 940,270 980,340 1020,390 1060,430 1100,455 1130,465" stroke="url(#chartLine3)" stroke-width="2.5" fill="none" filter="url(#glow3b)"/>
  <!-- Area fill under the line -->
  <polygon points="790,160 850,175 900,210 940,270 980,340 1020,390 1060,430 1100,455 1130,465 1130,480 790,480" fill="url(#chartFill3)"/>
  <!-- Data points -->
  <circle cx="790" cy="160" r="3.5" fill="#FF6A00" filter="url(#glow3)"/>
  <circle cx="900" cy="210" r="3" fill="#FF6A00" opacity="0.8"/>
  <circle cx="980" cy="340" r="3" fill="#ff5555" opacity="0.7"/>
  <circle cx="1060" cy="430" r="3" fill="#ff3333" opacity="0.6"/>
  <circle cx="1130" cy="465" r="3" fill="#ff2222" opacity="0.5"/>
  <!-- Warning indicators -->
  <!-- Warning triangle 1 -->
  <polygon points="960,300 970,318 950,318" stroke="#FF6A00" stroke-width="1.5" fill="none" opacity="0.5" filter="url(#glow3b)"/>
  <text x="960" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FF6A00" text-anchor="middle" opacity="0.5">!</text>
  <!-- Warning triangle 2 -->
  <polygon points="1040,395 1050,413 1030,413" stroke="#ff4444" stroke-width="1.5" fill="none" opacity="0.4" filter="url(#glow3b)"/>
  <text x="1040" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ff4444" text-anchor="middle" opacity="0.4">!</text>
  <!-- Dollar signs floating (declining) -->
  <text x="810" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="rgba(255,106,0,0.2)" filter="url(#glow3b)">$</text>
  <text x="870" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="rgba(255,106,0,0.15)">$</text>
  <text x="1090" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="rgba(255,60,60,0.2)">$</text>
  <!-- Trend arrow pointing down -->
  <line x1="1100" y1="150" x2="1140" y2="200" stroke="rgba(255,80,80,0.3)" stroke-width="2"/>
  <polygon points="1135,198 1145,205 1135,205" fill="rgba(255,80,80,0.3)"/>
  <!-- Chart title -->
  <text x="960" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.2)" text-anchor="middle">Revenue from AI-driven discovery</text>
  <!-- Category pill -->
  <rect x="40" y="40" width="140" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="110" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">Impact Analysis</text>
  <!-- Title -->
  <text x="80" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="white">The Hidden Cost of</text>
  <text x="80" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="white">Ignoring</text>
  <text x="330" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#FF6A00" filter="url(#glow3)">AI Search</text>
  <!-- Subtitle -->
  <text x="80" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="rgba(255,255,255,0.45)">Revenue Impact Analysis 2026</text>
  <!-- Branding -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>