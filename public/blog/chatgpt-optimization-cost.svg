<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#172554;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative grid pattern -->
  <line x1="200" y1="0" x2="200" y2="630" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="1000" y1="0" x2="1000" y2="630" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="150" x2="1200" y2="150" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="315" x2="1200" y2="315" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="480" x2="1200" y2="480" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <!-- Decorative circles -->
  <circle cx="950" cy="120" r="80" fill="none" stroke="rgba(255,106,0,0.08)" stroke-width="1"/>
  <circle cx="950" cy="120" r="120" fill="none" stroke="rgba(255,106,0,0.05)" stroke-width="1"/>
  <circle cx="1050" cy="400" r="60" fill="rgba(255,106,0,0.04)"/>
  <!-- Dollar sign decorative element -->
  <text x="1000" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="120" font-weight="700" fill="rgba(255,106,0,0.06)">$</text>
  <!-- Category badge -->
  <rect x="40" y="40" width="160" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="120" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">Pricing &amp; Services</text>
  <!-- Title lines -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">How Much Does</text>
  <text x="80" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">ChatGPT Optimization</text>
  <text x="80" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#FF6A00">Actually Cost?</text>
  <!-- Brand footer -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>