<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgWV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1424;stop-opacity:1"/>
      <stop offset="55%" style="stop-color:#0F1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2a1a08;stop-opacity:1"/>
    </linearGradient>
    <filter id="glowWV"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoftWV"><feGaussianBlur stdDeviation="14" result="bs"/><feMerge><feMergeNode in="bs"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowNodeWV"><feGaussianBlur stdDeviation="8" result="bn"/><feMerge><feMergeNode in="bn"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgWV)"/>

  <!-- Dot grid -->
  <g opacity="0.04">
    <pattern id="dotGridWV" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="white"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dotGridWV)"/>
  </g>

  <!-- Title block -->
  <text x="600" y="68" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="white" text-anchor="middle">Wedding Venues &amp; Event Vendors</text>
  <text x="600" y="106" font-family="system-ui, sans-serif" font-size="19" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle">Getting Found on AI Search in 2026</text>

  <!-- Central arch / bridal arch silhouette -->
  <g transform="translate(600, 340)" filter="url(#glowSoftWV)">
    <!-- Arch uprights -->
    <rect x="-55" y="-80" width="14" height="130" rx="4" fill="none" stroke="#FF6A00" stroke-width="2" opacity="0.7"/>
    <rect x="41" y="-80" width="14" height="130" rx="4" fill="none" stroke="#FF6A00" stroke-width="2" opacity="0.7"/>
    <!-- Arch curve -->
    <path d="M -55 -80 Q -55 -160 0 -165 Q 55 -160 55 -80" fill="none" stroke="#FF6A00" stroke-width="2.5" opacity="0.9"/>
    <!-- Inner arch highlight -->
    <path d="M -42 -80 Q -42 -145 0 -150 Q 42 -145 42 -80" fill="none" stroke="rgba(255,106,0,0.3)" stroke-width="1.5"/>
    <!-- Ground line / step -->
    <rect x="-70" y="50" width="140" height="8" rx="3" fill="rgba(255,106,0,0.15)" stroke="#FF6A00" stroke-width="1" opacity="0.5"/>
    <!-- Floral accent left -->
    <circle cx="-62" cy="-82" r="6" fill="rgba(255,106,0,0.25)" stroke="#FF6A00" stroke-width="1" opacity="0.7"/>
    <circle cx="-62" cy="-82" r="3" fill="#FF6A00" opacity="0.5"/>
    <!-- Floral accent right -->
    <circle cx="62" cy="-82" r="6" fill="rgba(255,106,0,0.25)" stroke="#FF6A00" stroke-width="1" opacity="0.7"/>
    <circle cx="62" cy="-82" r="3" fill="#FF6A00" opacity="0.5"/>
    <!-- Top bloom -->
    <circle cx="0" cy="-168" r="10" fill="rgba(255,106,0,0.2)" stroke="#FF6A00" stroke-width="1.5" opacity="0.8"/>
    <circle cx="0" cy="-168" r="5" fill="#FF6A00" opacity="0.6"/>
  </g>

  <!-- Four-platform cluster nodes -->
  <!-- The Knot — top left -->
  <g transform="translate(270, 240)" filter="url(#glowNodeWV)">
    <circle cx="0" cy="0" r="52" fill="rgba(255,106,0,0.12)" stroke="#FF6A00" stroke-width="1.5" opacity="0.85"/>
    <!-- Knot icon: stylized ribbon bow -->
    <path d="M -18 0 C -18 -18 0 -22 0 -10 C 0 -22 18 -18 18 0 C 18 18 0 22 0 10 C 0 22 -18 18 -18 0 Z" fill="none" stroke="#FF6A00" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <circle cx="0" cy="0" r="4" fill="#FF6A00" opacity="0.8"/>
    <text x="0" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle" font-weight="700">THE KNOT</text>
    <text x="0" y="52" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.6)" text-anchor="middle">20M searches/mo</text>
  </g>

  <!-- WeddingWire — bottom left -->
  <g transform="translate(270, 430)" filter="url(#glowNodeWV)">
    <circle cx="0" cy="0" r="52" fill="rgba(255,106,0,0.10)" stroke="#FF6A00" stroke-width="1.5" opacity="0.75"/>
    <!-- WW icon: stylized wire/ring -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#FF6A00" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="rgba(255,106,0,0.5)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="#FF6A00" opacity="0.7"/>
    <text x="0" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle" font-weight="700">WEDDINGWIRE</text>
    <text x="0" y="52" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.6)" text-anchor="middle">4x citation weight</text>
  </g>

  <!-- Google Business Profile — top right -->
  <g transform="translate(930, 240)" filter="url(#glowNodeWV)">
    <circle cx="0" cy="0" r="52" fill="rgba(255,106,0,0.12)" stroke="#FF6A00" stroke-width="1.5" opacity="0.85"/>
    <!-- G icon simplified -->
    <path d="M 18 -2 L 6 -2 L 6 6 L 14 6 Q 12 18 0 18 Q -18 18 -18 0 Q -18 -18 0 -18 Q 10 -18 16 -10 L 22 -14 Q 14 -26 0 -26 Q -26 -26 -26 0 Q -26 26 0 26 Q 26 26 26 2 L 26 -2 Z" fill="none" stroke="#FF6A00" stroke-width="2" opacity="0.8"/>
    <text x="0" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle" font-weight="700">GOOGLE BUSINESS</text>
    <text x="0" y="52" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.6)" text-anchor="middle">40% AI Overview rate</text>
  </g>

  <!-- Pinterest — bottom right -->
  <g transform="translate(930, 430)" filter="url(#glowNodeWV)">
    <circle cx="0" cy="0" r="52" fill="rgba(255,106,0,0.10)" stroke="#FF6A00" stroke-width="1.5" opacity="0.75"/>
    <!-- P icon simplified -->
    <circle cx="0" cy="-8" r="18" fill="none" stroke="#FF6A00" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="10" x2="0" y2="28" stroke="#FF6A00" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="-8" y1="18" x2="8" y2="24" stroke="#FF6A00" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <text x="0" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle" font-weight="700">PINTEREST</text>
    <text x="0" y="52" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.6)" text-anchor="middle">Visual citation signal</text>
  </g>

  <!-- Connector lines from nodes to central arch -->
  <!-- The Knot → arch -->
  <line x1="322" y1="265" x2="535" y2="295" stroke="#FF6A00" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.4"/>
  <!-- WeddingWire → arch -->
  <line x1="322" y1="420" x2="535" y2="375" stroke="#FF6A00" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.4"/>
  <!-- GBP → arch -->
  <line x1="878" y1="265" x2="665" y2="295" stroke="#FF6A00" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.4"/>
  <!-- Pinterest → arch -->
  <line x1="878" y1="420" x2="665" y2="375" stroke="#FF6A00" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.4"/>

  <!-- Center label below arch -->
  <text x="600" y="435" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle" font-weight="700" letter-spacing="2">VENDOR TRUST CLUSTER</text>
  <text x="600" y="452" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.55)" text-anchor="middle">4-platform AI citation signal</text>

  <!-- Stat callout left -->
  <rect x="60" y="520" width="240" height="56" rx="8" fill="rgba(255,106,0,0.07)" stroke="rgba(255,106,0,0.25)" stroke-width="1"/>
  <text x="180" y="544" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#FF6A00" text-anchor="middle">54%</text>
  <text x="180" y="562" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.45)" text-anchor="middle">of couples use AI to research vendors</text>

  <!-- Stat callout right -->
  <rect x="900" y="520" width="240" height="56" rx="8" fill="rgba(255,106,0,0.07)" stroke="rgba(255,106,0,0.25)" stroke-width="1"/>
  <text x="1020" y="544" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#FF6A00" text-anchor="middle">12&ndash;14mo</text>
  <text x="1020" y="562" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.45)" text-anchor="middle">average booking window</text>

  <!-- Bottom strip -->
  <rect x="0" y="600" width="1200" height="30" fill="#FF6A00" opacity="0.08"/>
  <text x="600" y="620" font-family="system-ui, sans-serif" font-size="14" fill="#FF6A00" text-anchor="middle" font-weight="700" letter-spacing="3">THE ANSWER ENGINE &mdash; theanswerengine.ai</text>
</svg>
