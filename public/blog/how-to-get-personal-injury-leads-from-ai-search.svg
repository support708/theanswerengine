<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="How to Get Personal Injury Leads from AI Search — The Answer Engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131313"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F27D24"/>
      <stop offset="100%" stop-color="#cc5500"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F27D24" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#F27D24" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#F27D24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient glow -->
  <ellipse cx="950" cy="180" rx="520" ry="340" fill="url(#glow)"/>
  <ellipse cx="180" cy="520" rx="380" ry="240" fill="url(#glow)" opacity="0.6"/>

  <!-- Right side: retainer conversion comparison panel -->
  <g transform="translate(720,90)" opacity="0.96">
    <!-- Panel container -->
    <rect x="0" y="0" width="420" height="450" rx="14" fill="#0f0f10" stroke="#F27D24" stroke-width="1.5" stroke-opacity="0.65"/>

    <!-- Header bar -->
    <rect x="0" y="0" width="420" height="38" rx="14" fill="#F27D24" fill-opacity="0.12"/>
    <rect x="0" y="22" width="420" height="16" fill="#F27D24" fill-opacity="0.12"/>
    <circle cx="22" cy="19" r="6" fill="#F27D24"/>
    <text x="38" y="24" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#F27D24" letter-spacing="1.5">RETAINER CONVERSION</text>
    <text x="394" y="24" font-family="Courier New, monospace" font-size="9" font-weight="700" fill="#F27D24" fill-opacity="0.55" text-anchor="end" letter-spacing="1">14 DAYS</text>

    <!-- AI channel bar (large) -->
    <g transform="translate(24,68)">
      <text x="0" y="0" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#F27D24" letter-spacing="1.5">AI-SOURCED PI LEAD</text>
      <text x="372" y="0" font-family="Space Grotesk, sans-serif" font-size="16" font-weight="900" fill="#F27D24" text-anchor="end">38–52%</text>
      <rect x="0" y="12" width="372" height="22" rx="3" fill="#F27D24" fill-opacity="0.12"/>
      <rect x="0" y="12" width="240" height="22" rx="3" fill="url(#orange)"/>
    </g>

    <!-- Paid lead platform bar (tiny) -->
    <g transform="translate(24,124)">
      <text x="0" y="0" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#e5e2e1" fill-opacity="0.55" letter-spacing="1.5">PAID PI LEAD PLATFORM</text>
      <text x="372" y="0" font-family="Space Grotesk, sans-serif" font-size="16" font-weight="900" fill="#e5e2e1" fill-opacity="0.6" text-anchor="end">6–11%</text>
      <rect x="0" y="12" width="372" height="22" rx="3" fill="#1a1a1a" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12"/>
      <rect x="0" y="12" width="40" height="22" rx="3" fill="#e5e2e1" fill-opacity="0.45"/>
    </g>

    <!-- Divider -->
    <line x1="24" y1="180" x2="396" y2="180" stroke="#F27D24" stroke-width="1" stroke-opacity="0.35"/>

    <!-- Multiplier callout -->
    <text x="210" y="218" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#F27D24" letter-spacing="1.5" text-anchor="middle">CONVERSION MULTIPLIER</text>
    <text x="210" y="288" font-family="Space Grotesk, sans-serif" font-size="92" font-weight="900" fill="url(#orange)" text-anchor="middle" letter-spacing="-3">5x</text>

    <!-- Distribution ledger -->
    <g transform="translate(24,310)">
      <text x="0" y="0" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#F27D24" letter-spacing="1.5">FIRMS RECEIVING THE LEAD</text>
    </g>

    <g transform="translate(24,330)">
      <rect x="0" y="0" width="372" height="40" rx="6" fill="#F27D24" fill-opacity="0.1" stroke="#F27D24" stroke-width="1.5"/>
      <text x="14" y="25" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#F27D24" letter-spacing="1">AI</text>
      <text x="358" y="27" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="900" fill="#F27D24" text-anchor="end">1</text>
    </g>

    <g transform="translate(24,380)">
      <rect x="0" y="0" width="372" height="40" rx="6" fill="#1a1a1a" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12"/>
      <text x="14" y="25" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#e5e2e1" fill-opacity="0.55" letter-spacing="1">PAID LEAD AGGREGATOR</text>
      <text x="358" y="27" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="900" fill="#e5e2e1" fill-opacity="0.6" text-anchor="end">3–7</text>
    </g>
  </g>

  <!-- Left-side text -->
  <g transform="translate(60,120)">
    <!-- Eyebrow -->
    <rect x="0" y="0" width="3" height="14" fill="#F27D24"/>
    <text x="14" y="12" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#F27D24" letter-spacing="2.5">PERSONAL INJURY / AEO</text>

    <!-- Main headline -->
    <text x="0" y="62" font-family="Space Grotesk, Inter, sans-serif" font-size="46" font-weight="900" fill="#e5e2e1" letter-spacing="-2">HOW TO GET</text>
    <text x="0" y="112" font-family="Space Grotesk, Inter, sans-serif" font-size="46" font-weight="900" fill="url(#orange)" letter-spacing="-2">PERSONAL INJURY</text>
    <text x="0" y="162" font-family="Space Grotesk, Inter, sans-serif" font-size="46" font-weight="900" fill="#e5e2e1" letter-spacing="-2">LEADS FROM</text>
    <text x="0" y="212" font-family="Space Grotesk, Inter, sans-serif" font-size="46" font-weight="900" fill="url(#orange)" letter-spacing="-2">AI SEARCH</text>

    <!-- Subheadline -->
    <text x="0" y="262" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#e5e2e1" fill-opacity="0.7">One PI firm cited per jurisdiction. No parallel distribution.</text>
    <text x="0" y="285" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#e5e2e1" fill-opacity="0.7">The retrieval-layer math behind the 5x conversion gap.</text>

    <!-- Stats row -->
    <g transform="translate(0,330)">
      <text x="0" y="0" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="900" fill="#F27D24" letter-spacing="-1">4–9min</text>
      <text x="0" y="22" font-family="Courier New, monospace" font-size="10" fill="#e5e2e1" fill-opacity="0.55" letter-spacing="0.5">CLAIMANT DISCLOSURE</text>
    </g>
    <g transform="translate(220,330)">
      <text x="0" y="0" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="900" fill="#F27D24" letter-spacing="-1">73%</text>
      <text x="0" y="22" font-family="Courier New, monospace" font-size="10" fill="#e5e2e1" fill-opacity="0.55" letter-spacing="0.5">SINGLE-FIRM CITATIONS</text>
    </g>
    <g transform="translate(380,330)">
      <text x="0" y="0" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="900" fill="#F27D24" letter-spacing="-1">45–75d</text>
      <text x="0" y="22" font-family="Courier New, monospace" font-size="10" fill="#e5e2e1" fill-opacity="0.55" letter-spacing="0.5">FIRST CITATION TIMELINE</text>
    </g>
  </g>

  <!-- Footer branding -->
  <g transform="translate(60,560)">
    <rect x="0" y="0" width="3" height="36" fill="#F27D24"/>
    <text x="14" y="16" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="900" fill="#e5e2e1" letter-spacing="0.5">THE ANSWER ENGINE</text>
    <text x="14" y="32" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#F27D24" fill-opacity="0.7" letter-spacing="1.5">theanswerengine.ai · GEO/AEO OPERATORS</text>
  </g>
</svg>
