<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgBM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1424;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2a1a08;stop-opacity:1"/>
    </linearGradient>
    <filter id="glowBM"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoftBM"><feGaussianBlur stdDeviation="14" result="bs"/><feMerge><feMergeNode in="bs"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgBM)"/>
  <!-- Center divider -->
  <line x1="600" y1="60" x2="600" y2="570" stroke="rgba(255,106,0,0.25)" stroke-width="1" stroke-dasharray="4 8"/>
  <!-- Title -->
  <text x="600" y="80" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="white" text-anchor="middle">Backlinks vs Brand Mentions</text>
  <text x="600" y="118" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.55)" text-anchor="middle">What AI actually counts in 2026</text>
  <!-- LEFT: Backlinks (chain) -->
  <g transform="translate(305, 320)">
    <text x="0" y="-140" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.45)" text-anchor="middle" font-weight="700" letter-spacing="3">BACKLINKS</text>
    <text x="0" y="-115" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-weight="500">the old playbook</text>
    <!-- Chain links -->
    <g opacity="0.85" stroke="rgba(255,255,255,0.65)" stroke-width="3.5" fill="none">
      <ellipse cx="-90" cy="0" rx="32" ry="20" transform="rotate(-25 -90 0)"/>
      <ellipse cx="-30" cy="0" rx="32" ry="20" transform="rotate(25 -30 0)"/>
      <ellipse cx="30" cy="0" rx="32" ry="20" transform="rotate(-25 30 0)"/>
      <ellipse cx="90" cy="0" rx="32" ry="20" transform="rotate(25 90 0)"/>
    </g>
    <!-- Score -->
    <g transform="translate(0, 100)">
      <rect x="-100" y="-20" width="200" height="40" rx="20" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="0" y="-2" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-weight="600" letter-spacing="2">CORRELATION</text>
      <text x="0" y="14" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.7)" text-anchor="middle" font-weight="700">r = 0.10</text>
    </g>
  </g>
  <!-- RIGHT: Brand mentions (quote bubbles) -->
  <g transform="translate(895, 320)">
    <text x="0" y="-140" font-family="system-ui, sans-serif" font-size="14" fill="#FF6A00" text-anchor="middle" font-weight="700" letter-spacing="3">BRAND MENTIONS</text>
    <text x="0" y="-115" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.55)" text-anchor="middle" font-weight="500">what AI reads now</text>
    <!-- Floating quote bubbles -->
    <g filter="url(#glowSoftBM)" opacity="0.9">
      <rect x="-110" y="-30" width="80" height="38" rx="10" fill="rgba(255,106,0,0.18)" stroke="#FF6A00" stroke-width="1.5"/>
      <text x="-70" y="-6" font-family="system-ui, sans-serif" font-size="14" fill="#FF6A00" text-anchor="middle" font-weight="700">&#8220;...&#8221;</text>
      <rect x="-30" y="-50" width="80" height="38" rx="10" fill="rgba(255,106,0,0.25)" stroke="#FF6A00" stroke-width="1.5"/>
      <text x="10" y="-26" font-family="system-ui, sans-serif" font-size="14" fill="#FF6A00" text-anchor="middle" font-weight="700">&#8220;...&#8221;</text>
      <rect x="50" y="-20" width="80" height="38" rx="10" fill="rgba(255,106,0,0.15)" stroke="#FF6A00" stroke-width="1.5"/>
      <text x="90" y="4" font-family="system-ui, sans-serif" font-size="14" fill="#FF6A00" text-anchor="middle" font-weight="700">&#8220;...&#8221;</text>
    </g>
    <!-- Score -->
    <g transform="translate(0, 100)">
      <rect x="-100" y="-20" width="200" height="40" rx="20" fill="rgba(255,106,0,0.15)" stroke="#FF6A00" stroke-width="1.5" filter="url(#glowBM)"/>
      <text x="0" y="-2" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,106,0,0.7)" text-anchor="middle" font-weight="600" letter-spacing="2">CORRELATION</text>
      <text x="0" y="14" font-family="system-ui, sans-serif" font-size="14" fill="#FF6A00" text-anchor="middle" font-weight="700">r = 0.664</text>
    </g>
  </g>
  <!-- Bottom strip -->
  <rect x="0" y="600" width="1200" height="30" fill="#FF6A00" opacity="0.08"/>
  <text x="600" y="620" font-family="system-ui, sans-serif" font-size="14" fill="#FF6A00" text-anchor="middle" font-weight="700" letter-spacing="3">THE ANSWER ENGINE</text>
</svg>
