    <text x="20" y="245" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">REVIEW IMPACT ON AI CITATION</text>
    <!-- Impact bars -->
    <text x="20" y="275" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">Star Rating</text>
    <rect x="130" y="264" width="300" height="14" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="130" y="264" width="270" height="14" rx="3" fill="rgba(255,106,0,0.5)"/>
    <text x="440" y="276" font-family="system-ui, sans-serif" font-size="8" fill="#FF6A00" font-weight="700">HIGH</text>
    <text x="20" y="300" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">Volume</text>
    <rect x="130" y="289" width="300" height="14" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="130" y="289" width="225" height="14" rx="3" fill="rgba(255,200,50,0.5)"/>
    <text x="440" y="301" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,200,50,0.9)" font-weight="700">MED+</text>
    <text x="20" y="325" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">Recency</text>
    <rect x="130" y="314" width="300" height="14" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="130" y="314" width="200" height="14" rx="3" fill="rgba(255,200,50,0.45)"/>
    <text x="440" y="326" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,200,50,0.85)" font-weight="700">MED</text>
    <text x="20" y="350" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">Responses</text>
    <rect x="130" y="339" width="300" height="14" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="130" y="339" width="150" height="14" rx="3" fill="rgba(100,150,255,0.45)"/>
    <text x="440" y="351" font-family="system-ui, sans-serif" font-size="8" fill="rgba(100,150,255,0.85)" font-weight="700">LOW+</text>
    <text x="20" y="375" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">Sentiment</text>
    <rect x="130" y="364" width="300" height="14" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="130" y="364" width="240" height="14" rx="3" fill="rgba(100,220,100,0.45)"/>
    <text x="440" y="376" font-family="system-ui, sans-serif" font-size="8" fill="rgba(100,220,100,0.85)" font-weight="700">MED+</text>
    <!-- Key insight -->
    <rect x="20" y="395" width="430" height="60" rx="8" fill="rgba(255,106,0,0.08)" stroke="#FF6A00" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="235" y="418" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-weight="600">KEY INSIGHT</text>
    <text x="235" y="438" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" text-anchor="middle" font-weight="600">Reviews are the #3 signal for AI citations.</text>
    <text x="235" y="452" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)" text-anchor="middle">4.0+ stars with 25+ reviews = citation-ready.</text>
  </g>
  <circle cx="100" cy="130" r="60" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <rect x="40" y="40" width="150" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="115" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">Review Signals</text>
  <text x="80" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Do Google Reviews</text>
  <text x="80" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Affect AI</text>
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glow15)">Recommendations?</text>
  <text x="80" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">The Data Behind Review Signals</text>
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
