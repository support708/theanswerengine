<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b350d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e1a0a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow15"><feGaussianBlur stdDeviation="6" result="blur15"/><feMerge><feMergeNode in="blur15"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoft15"><feGaussianBlur stdDeviation="12" result="blur15s"/><feMerge><feMergeNode in="blur15s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg15)"/>
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <!-- Review card with AI connection -->
  <g transform="translate(660, 45)">
    <rect x="0" y="0" width="470" height="470" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="235" y="28" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600">REVIEW SIGNAL ANALYSIS</text>
    <!-- Review card -->
    <rect x="20" y="42" width="210" height="160" rx="8" fill="rgba(255,200,50,0.08)" stroke="rgba(255,200,50,0.4)" stroke-width="1.5"/>
    <text x="125" y="65" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,200,50,0.9)" text-anchor="middle" font-weight="600">GOOGLE REVIEWS</text>
    <!-- Stars -->
    <text x="60" y="95" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,200,50,0.9)">&#x2605;&#x2605;&#x2605;&#x2605;&#x2606;</text>
    <text x="170" y="97" font-family="system-ui, sans-serif" font-size="24" fill="white" font-weight="700">4.2</text>
    <text x="125" y="115" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)" text-anchor="middle">47 reviews</text>
    <!-- Mini review bars -->
    <text x="35" y="138" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.4)">5&#x2605;</text>
    <rect x="60" y="130" width="120" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="60" y="130" width="80" height="6" rx="3" fill="rgba(255,200,50,0.6)"/>
    <text x="35" y="152" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.4)">4&#x2605;</text>
    <rect x="60" y="144" width="120" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="60" y="144" width="50" height="6" rx="3" fill="rgba(255,200,50,0.5)"/>
    <text x="35" y="166" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.4)">3&#x2605;</text>
    <rect x="60" y="158" width="120" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="60" y="158" width="20" height="6" rx="3" fill="rgba(255,200,50,0.4)"/>
    <text x="35" y="180" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.4)">2&#x2605;</text>
    <rect x="60" y="172" width="120" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="60" y="172" width="8" height="6" rx="3" fill="rgba(255,80,80,0.5)"/>
    <text x="35" y="194" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.4)">1&#x2605;</text>
    <rect x="60" y="186" width="120" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="60" y="186" width="12" height="6" rx="3" fill="rgba(255,80,80,0.5)"/>
    <!-- Connection arrows to AI -->
    <line x1="230" y1="90" x2="260" y2="70" stroke="rgba(255,106,0,0.5)" stroke-width="2" stroke-dasharray="4,3"/>
    <line x1="230" y1="120" x2="260" y2="120" stroke="rgba(255,106,0,0.5)" stroke-width="2" stroke-dasharray="4,3"/>
    <line x1="230" y1="150" x2="260" y2="170" stroke="rgba(255,106,0,0.5)" stroke-width="2" stroke-dasharray="4,3"/>
    <!-- AI processing -->
    <rect x="260" y="42" width="190" height="160" rx="8" fill="rgba(255,106,0,0.08)" stroke="#FF6A00" stroke-width="1.5" stroke-opacity="0.6" filter="url(#glow15)"/>
    <text x="355" y="65" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" text-anchor="middle" font-weight="600">AI SIGNAL EXTRACTION</text>
    <text x="275" y="90" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; Rating: 4.2+ threshold met</text>
    <text x="275" y="110" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; Volume: 47 (25+ needed)</text>
    <text x="275" y="130" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,200,50,0.85)">&#x25CB; Recency: 2 months old</text>
    <text x="275" y="150" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,200,50,0.85)">&#x25CB; Sentiment: Mixed</text>
    <text x="275" y="170" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.85)">&#x2717; Owner responses: 12%</text>
    <rect x="275" y="180" width="160" height="16" rx="4" fill="rgba(255,200,50,0.15)"/>
    <text x="355" y="192" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,200,50,0.9)" text-anchor="middle" font-weight="700">SIGNAL STRENGTH: MODERATE</text>
    <!-- Impact matrix -->
