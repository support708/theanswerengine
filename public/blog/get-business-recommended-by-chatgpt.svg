<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGBRC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d3b1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a350d;stop-opacity:1" />
    </linearGradient>
    <filter id="glowGBRC"><feGaussianBlur stdDeviation="6" result="blurGBRC"/><feMerge><feMergeNode in="blurGBRC"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGBRC)"/>
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <!-- Case study results dashboard -->
  <g transform="translate(660, 45)">
    <rect x="0" y="0" width="470" height="470" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="235" y="28" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600">CASE STUDY RESULTS</text>
    <!-- Top 3 metric cards -->
    <rect x="20" y="42" width="135" height="75" rx="8" fill="rgba(100,220,100,0.08)" stroke="rgba(100,220,100,0.4)" stroke-width="1.5"/>
    <text x="87" y="62" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)" text-anchor="middle" font-weight="600">CLICK GROWTH</text>
    <text x="87" y="95" font-family="system-ui, sans-serif" font-size="24" fill="rgba(100,220,100,0.9)" text-anchor="middle" font-weight="700">+89%</text>
    <text x="87" y="112" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle">in 4 months</text>
    <rect x="167" y="42" width="135" height="75" rx="8" fill="rgba(255,106,0,0.08)" stroke="#FF6A00" stroke-width="1.5" stroke-opacity="0.6" filter="url(#glowGBRC)"/>
    <text x="234" y="62" font-family="system-ui, sans-serif" font-size="9" fill="#FF6A00" text-anchor="middle" font-weight="600">IMPRESSIONS</text>
    <text x="234" y="95" font-family="system-ui, sans-serif" font-size="24" fill="#FF6A00" text-anchor="middle" font-weight="700" filter="url(#glowGBRC)">2.9M</text>
    <text x="234" y="112" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle">total reach</text>
    <rect x="314" y="42" width="135" height="75" rx="8" fill="rgba(100,150,255,0.08)" stroke="rgba(100,150,255,0.4)" stroke-width="1.5"/>
    <text x="381" y="62" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,150,255,0.9)" text-anchor="middle" font-weight="600">DEALS CLOSED</text>
    <text x="381" y="95" font-family="system-ui, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="700">5</text>
    <text x="381" y="112" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle">from AI leads</text>
    <!-- Growth chart -->
    <text x="20" y="145" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">TRAFFIC GROWTH TIMELINE</text>
    <rect x="20" y="155" width="430" height="140" rx="6" fill="rgba(255,255,255,0.03)"/>
    <!-- Rising line -->
    <polyline points="40,270 112,265 184,250 256,225 328,195 400,175 436,165" fill="none" stroke="rgba(100,220,100,0.7)" stroke-width="2.5"/>
    <!-- X labels -->
    <text x="40" y="300" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.3)" text-anchor="middle">M1</text>
    <text x="112" y="300" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.3)" text-anchor="middle">M2</text>
    <text x="184" y="300" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.3)" text-anchor="middle">M3</text>
    <text x="256" y="300" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.3)" text-anchor="middle">M4</text>
    <!-- AEO start marker -->
    <line x1="40" y1="160" x2="40" y2="290" stroke="#FF6A00" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="45" y="170" font-family="system-ui, sans-serif" font-size="7" fill="#FF6A00">AEO Started</text>
    <!-- What we did -->
    <line x1="20" y1="315" x2="450" y2="315" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <text x="20" y="340" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">AEO IMPLEMENTATION</text>
    <text x="30" y="365" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; Schema markup on all service pages</text>
    <text x="30" y="383" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; Authority content for AI citation</text>
    <text x="30" y="401" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; NAP consistency across 40+ directories</text>
    <text x="30" y="419" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; Bing Places optimization for ChatGPT</text>
    <!-- Result badge -->
    <rect x="250" y="435" width="200" height="25" rx="6" fill="rgba(100,220,100,0.15)" stroke="rgba(100,220,100,0.5)" stroke-width="1.5"/>
    <text x="350" y="452" font-family="system-ui, sans-serif" font-size="10" fill="rgba(100,220,100,0.9)" text-anchor="middle" font-weight="700">NOW CITED BY ALL 3 AIs</text>
  </g>
  <circle cx="100" cy="130" r="60" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <rect x="40" y="40" width="140" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="110" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">Case Study</text>
  <text x="80" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">How to Get Your</text>
  <text x="80" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Business on</text>
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glowGBRC)">ChatGPT</text>
  <text x="80" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">From Zero to AI-Recommended</text>
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>