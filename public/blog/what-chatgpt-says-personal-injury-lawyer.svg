<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0b"/>
      <stop offset="100%" stop-color="#131313"/>
    </linearGradient>
    <linearGradient id="orangeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F27D24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F27D24" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F27D24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F27D24" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="rgba(255,255,255,0.025)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Orange glow behind chat panel -->
  <circle cx="850" cy="220" r="280" fill="url(#glow)"/>

  <!-- Top label bar -->
  <rect x="60" y="70" width="14" height="14" fill="#F27D24"/>
  <text x="86" y="82" fill="rgba(255,255,255,0.55)" font-family="'Courier New', monospace" font-size="14" letter-spacing="3" font-weight="600">
    INDUSTRY VERTICALS · LEGAL · RESPONSE ARCHITECTURE
  </text>

  <!-- Main headline -->
  <text x="60" y="190" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="-2">
    WHAT CHATGPT SAYS
  </text>
  <text x="60" y="262" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="-2">
    WHEN ASKED FOR A
  </text>
  <text x="60" y="334" fill="#F27D24" font-family="'Space Grotesk', system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="-2">
    PERSONAL INJURY
  </text>
  <text x="60" y="406" fill="#F27D24" font-family="'Space Grotesk', system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="-2">
    LAWYER
  </text>

  <!-- Divider line -->
  <rect x="60" y="446" width="180" height="3" fill="url(#orangeFade)"/>

  <!-- Subheading -->
  <text x="60" y="488" fill="rgba(229,226,225,0.75)" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400">
    The three-block response skeleton — and the AEO signals
  </text>
  <text x="60" y="514" fill="rgba(229,226,225,0.75)" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400">
    that decide which firm lands in position one.
  </text>

  <!-- Right side: stylized ChatGPT response card -->
  <g transform="translate(680, 100)">
    <!-- Card -->
    <rect x="0" y="0" width="460" height="430" fill="#0f0f10" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#softShadow)"/>

    <!-- Card header -->
    <rect x="0" y="0" width="460" height="40" fill="rgba(255,255,255,0.03)"/>
    <circle cx="20" cy="20" r="5" fill="#F27D24"/>
    <text x="36" y="25" fill="rgba(255,255,255,0.55)" font-family="'Courier New', monospace" font-size="12" letter-spacing="2">
      CHATGPT RESPONSE
    </text>
    <text x="395" y="25" fill="rgba(229,226,225,0.35)" font-family="'Courier New', monospace" font-size="10" letter-spacing="1">
      PI · PHX
    </text>

    <!-- Disclaimer buffer -->
    <text x="20" y="68" fill="rgba(229,226,225,0.45)" font-family="'Courier New', monospace" font-size="9" letter-spacing="2">
      [01] DISCLAIMER BUFFER
    </text>
    <rect x="20" y="76" width="420" height="6" fill="rgba(255,255,255,0.10)"/>
    <rect x="20" y="88" width="360" height="6" fill="rgba(255,255,255,0.10)"/>

    <!-- Named firm block -->
    <text x="20" y="124" fill="rgba(229,226,225,0.45)" font-family="'Courier New', monospace" font-size="9" letter-spacing="2">
      [02] NAMED-FIRM BLOCK
    </text>

    <!-- Position 1 — highlighted -->
    <rect x="20" y="138" width="420" height="60" fill="rgba(242,125,36,0.10)" stroke="#F27D24" stroke-width="1"/>
    <text x="32" y="158" fill="#F27D24" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="900">
      1
    </text>
    <rect x="56" y="148" width="240" height="9" fill="#ffffff"/>
    <rect x="56" y="166" width="370" height="6" fill="rgba(255,255,255,0.45)"/>
    <rect x="56" y="178" width="330" height="6" fill="rgba(255,255,255,0.45)"/>
    <text x="400" y="158" fill="#F27D24" font-family="'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="1">
      47%
    </text>

    <!-- Position 2 -->
    <rect x="20" y="208" width="420" height="50" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="32" y="228" fill="rgba(255,255,255,0.55)" font-family="'Space Grotesk', system-ui, sans-serif" font-size="18" font-weight="900">
      2
    </text>
    <rect x="56" y="218" width="200" height="7" fill="rgba(255,255,255,0.55)"/>
    <rect x="56" y="234" width="320" height="5" fill="rgba(255,255,255,0.25)"/>
    <text x="400" y="228" fill="rgba(255,255,255,0.45)" font-family="'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="1">
      26%
    </text>

    <!-- Position 3 -->
    <rect x="20" y="268" width="420" height="40" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="32" y="288" fill="rgba(255,255,255,0.35)" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="900">
      3
    </text>
    <rect x="56" y="278" width="170" height="6" fill="rgba(255,255,255,0.30)"/>
    <rect x="56" y="290" width="280" height="4" fill="rgba(255,255,255,0.15)"/>
    <text x="400" y="288" fill="rgba(255,255,255,0.30)" font-family="'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="1">
      17%
    </text>

    <!-- Position 4 -->
    <rect x="20" y="318" width="420" height="32" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="32" y="338" fill="rgba(255,255,255,0.25)" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="900">
      4
    </text>
    <rect x="56" y="328" width="140" height="5" fill="rgba(255,255,255,0.20)"/>
    <rect x="56" y="338" width="220" height="4" fill="rgba(255,255,255,0.10)"/>
    <text x="400" y="338" fill="rgba(255,255,255,0.20)" font-family="'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="1">
      10%
    </text>

    <!-- Follow-up block -->
    <text x="20" y="378" fill="rgba(229,226,225,0.45)" font-family="'Courier New', monospace" font-size="9" letter-spacing="2">
      [03] FOLLOW-UP PROMPT
    </text>
    <rect x="20" y="388" width="380" height="6" fill="rgba(255,255,255,0.10)"/>
    <rect x="20" y="400" width="270" height="6" fill="rgba(255,255,255,0.10)"/>
  </g>

  <!-- Footer brand bar -->
  <rect x="0" y="588" width="1200" height="42" fill="rgba(0,0,0,0.4)"/>
  <rect x="60" y="606" width="6" height="6" fill="#F27D24"/>
  <text x="74" y="613" fill="rgba(255,255,255,0.55)" font-family="'Courier New', monospace" font-size="12" letter-spacing="3" font-weight="600">
    THE ANSWER ENGINE
  </text>
  <text x="1140" y="613" fill="rgba(255,255,255,0.55)" font-family="'Courier New', monospace" font-size="12" letter-spacing="2" font-weight="600" text-anchor="end">
    theanswerengine.ai/blindspot
  </text>
</svg>
