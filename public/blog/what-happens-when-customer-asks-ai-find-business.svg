<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F1117"/>
      <stop offset="40%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="bigGlow2">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FF6A00" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF6A00" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg2)"/>

  <!-- Subtle grid -->
  <g opacity="0.04">
    <pattern id="grid2" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="none" stroke="#FF6A00" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid2)"/>
  </g>

  <!-- STEP 1: Person/User (left) -->
  <g transform="translate(100, 180)">
    <!-- Person silhouette -->
    <circle cx="60" cy="40" r="28" fill="#1a2744" stroke="#FF6A00" stroke-width="1.5" opacity="0.8"/>
    <!-- Head -->
    <circle cx="60" cy="30" r="12" fill="none" stroke="#FF6A00" stroke-width="1.5" opacity="0.6"/>
    <!-- Body -->
    <path d="M40,50 Q60,70 80,50" stroke="#FF6A00" stroke-width="1.5" fill="none" opacity="0.5"/>

    <!-- Speech bubble -->
    <rect x="20" y="85" width="120" height="45" rx="10" fill="#1a2744" stroke="#FF6A00" stroke-width="1" opacity="0.7"/>
    <polygon points="55,130 65,130 50,145" fill="#1a2744" stroke="#FF6A00" stroke-width="1" opacity="0.7"/>
    <!-- Text lines in speech bubble -->
    <line x1="35" y1="100" x2="115" y2="100" stroke="#FF6A00" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
    <line x1="35" y1="112" x2="90" y2="112" stroke="#FF6A00" stroke-width="2" opacity="0.3" stroke-linecap="round"/>

    <!-- Label -->
    <text x="60" y="170" text-anchor="middle" fill="#FF6A00" font-family="system-ui, sans-serif" font-size="11" font-weight="600" opacity="0.7">CUSTOMER ASKS</text>
  </g>

  <!-- FLOW ARROW 1 -->
  <g opacity="0.5">
    <line x1="260" y1="245" x2="370" y2="245" stroke="url(#beam)" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="370,245 360,240 360,250" fill="#FF6A00" opacity="0.6"/>
    <!-- Pulse -->
    <circle cx="315" cy="245" r="3" fill="#FF6A00" opacity="0.5"/>
  </g>

  <!-- STEP 2: AI Processing (center-left) -->
  <g transform="translate(380, 170)">
    <!-- AI chip/processor -->
    <rect x="10" y="20" width="100" height="100" rx="12" fill="#0a1628" stroke="#FF6A00" stroke-width="1.5" opacity="0.8"/>
    <!-- Inner circuit -->
    <rect x="30" y="40" width="60" height="60" rx="6" fill="none" stroke="#FF6A00" stroke-width="0.8" opacity="0.4"/>
    <!-- AI brain icon center -->
    <circle cx="60" cy="70" r="15" fill="#FF6A00" opacity="0.1" filter="url(#bigGlow2)"/>
    <circle cx="60" cy="70" r="12" fill="none" stroke="#FF6A00" stroke-width="1" opacity="0.6"/>
    <!-- Neural dots -->
    <circle cx="53" cy="63" r="2" fill="#FF6A00" opacity="0.7"/>
    <circle cx="67" cy="63" r="2" fill="#FF6A00" opacity="0.7"/>
    <circle cx="60" cy="77" r="2" fill="#FF6A00" opacity="0.7"/>
    <line x1="53" y1="63" x2="60" y2="77" stroke="#FF6A00" stroke-width="0.8" opacity="0.4"/>
    <line x1="67" y1="63" x2="60" y2="77" stroke="#FF6A00" stroke-width="0.8" opacity="0.4"/>
    <line x1="53" y1="63" x2="67" y2="63" stroke="#FF6A00" stroke-width="0.8" opacity="0.4"/>

    <!-- Connector pins -->
    <line x1="0" y1="50" x2="10" y2="50" stroke="#FF6A00" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="70" x2="10" y2="70" stroke="#FF6A00" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="90" x2="10" y2="90" stroke="#FF6A00" stroke-width="1.5" opacity="0.4"/>
    <line x1="110" y1="50" x2="120" y2="50" stroke="#FF6A00" stroke-width="1.5" opacity="0.4"/>
    <line x1="110" y1="70" x2="120" y2="70" stroke="#FF6A00" stroke-width="1.5" opacity="0.4"/>
    <line x1="110" y1="90" x2="120" y2="90" stroke="#FF6A00" stroke-width="1.5" opacity="0.4"/>
    <line x1="40" y1="10" x2="40" y2="20" stroke="#FF6A00" stroke-width="1.5" opacity="0.4"/>
    <line x1="60" y1="10" x2="60" y2="20" stroke="#FF6A00" stroke-width="1.5" opacity="0.4"/>
    <line x1="80" y1="10" x2="80" y2="20" stroke="#FF6A00" stroke-width="1.5" opacity="0.4"/>

    <!-- Label -->
    <text x="60" y="150" text-anchor="middle" fill="#FF6A00" font-family="system-ui, sans-serif" font-size="11" font-weight="600" opacity="0.7">AI PROCESSES</text>
  </g>

  <!-- FLOW ARROW 2 -->
  <g opacity="0.5">
    <line x1="520" y1="245" x2="630" y2="245" stroke="url(#beam)" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="630,245 620,240 620,250" fill="#FF6A00" opacity="0.6"/>
    <circle cx="575" cy="245" r="3" fill="#FF6A00" opacity="0.5"/>
  </g>

  <!-- STEP 3: Web Scanning (center-right) -->
  <g transform="translate(640, 165)">
    <!-- Globe/web -->
    <circle cx="60" cy="75" r="45" fill="none" stroke="#FF6A00" stroke-width="1" opacity="0.4"/>
    <ellipse cx="60" cy="75" rx="25" ry="45" fill="none" stroke="#FF6A00" stroke-width="0.7" opacity="0.3"/>
    <line x1="15" y1="55" x2="105" y2="55" stroke="#FF6A00" stroke-width="0.7" opacity="0.25"/>
    <line x1="15" y1="95" x2="105" y2="95" stroke="#FF6A00" stroke-width="0.7" opacity="0.25"/>
    <line x1="60" y1="30" x2="60" y2="120" stroke="#FF6A00" stroke-width="0.7" opacity="0.25"/>

    <!-- Scan rays emanating -->
    <line x1="60" y1="75" x2="20" y2="35" stroke="#FF6A00" stroke-width="0.8" opacity="0.3" stroke-dasharray="3,3"/>
    <line x1="60" y1="75" x2="100" y2="35" stroke="#FF6A00" stroke-width="0.8" opacity="0.3" stroke-dasharray="3,3"/>
    <line x1="60" y1="75" x2="15" y2="95" stroke="#FF6A00" stroke-width="0.8" opacity="0.3" stroke-dasharray="3,3"/>
    <line x1="60" y1="75" x2="105" y2="95" stroke="#FF6A00" stroke-width="0.8" opacity="0.3" stroke-dasharray="3,3"/>

    <!-- Data points found -->
    <circle cx="20" cy="35" r="4" fill="#FF6A00" opacity="0.5"/>
    <circle cx="100" cy="35" r="4" fill="#FF6A00" opacity="0.5"/>
    <circle cx="15" cy="95" r="4" fill="#FF6A00" opacity="0.4"/>
    <circle cx="105" cy="95" r="4" fill="#FF6A00" opacity="0.4"/>

    <!-- Glow center -->
    <circle cx="60" cy="75" r="8" fill="#FF6A00" opacity="0.15" filter="url(#bigGlow2)"/>

    <!-- Label -->
    <text x="60" y="150" text-anchor="middle" fill="#FF6A00" font-family="system-ui, sans-serif" font-size="11" font-weight="600" opacity="0.7">SCANS THE WEB</text>
  </g>

  <!-- FLOW ARROW 3 -->
  <g opacity="0.5">
    <line x1="780" y1="245" x2="890" y2="245" stroke="url(#beam)" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="890,245 880,240 880,250" fill="#FF6A00" opacity="0.6"/>
    <circle cx="835" cy="245" r="3" fill="#FF6A00" opacity="0.5"/>
  </g>

  <!-- STEP 4: Results / Citation (right) -->
  <g transform="translate(900, 170)">
    <!-- Results card -->
    <rect x="10" y="15" width="140" height="110" rx="10" fill="#0a1628" stroke="#FF6A00" stroke-width="1.5" opacity="0.7"/>
    <!-- Header bar -->
    <rect x="10" y="15" width="140" height="25" rx="10" fill="#FF6A00" opacity="0.15"/>
    <rect x="140" y="15" width="10" height="15" rx="0" fill="#FF6A00" opacity="0.15"/>
    <!-- Result lines -->
    <rect x="25" y="52" width="110" height="8" rx="3" fill="#FF6A00" opacity="0.25"/>
    <rect x="25" y="68" width="80" height="8" rx="3" fill="#FF6A00" opacity="0.15"/>
    <rect x="25" y="84" width="100" height="8" rx="3" fill="#FF6A00" opacity="0.2"/>
    <rect x="25" y="100" width="60" height="8" rx="3" fill="#FF6A00" opacity="0.12"/>

    <!-- Checkmark / citation badge -->
    <circle cx="140" cy="30" r="8" fill="#FF6A00" opacity="0.7"/>
    <path d="M135,30 L139,34 L146,26" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Star ratings -->
    <g transform="translate(25, 26)">
      <polygon points="5,0 6.5,3.5 10,4 7.5,6.5 8,10 5,8.5 2,10 2.5,6.5 0,4 3.5,3.5" fill="#FF6A00" opacity="0.6" transform="scale(0.7)"/>
      <polygon points="5,0 6.5,3.5 10,4 7.5,6.5 8,10 5,8.5 2,10 2.5,6.5 0,4 3.5,3.5" fill="#FF6A00" opacity="0.6" transform="translate(10,0) scale(0.7)"/>
      <polygon points="5,0 6.5,3.5 10,4 7.5,6.5 8,10 5,8.5 2,10 2.5,6.5 0,4 3.5,3.5" fill="#FF6A00" opacity="0.6" transform="translate(20,0) scale(0.7)"/>
      <polygon points="5,0 6.5,3.5 10,4 7.5,6.5 8,10 5,8.5 2,10 2.5,6.5 0,4 3.5,3.5" fill="#FF6A00" opacity="0.6" transform="translate(30,0) scale(0.7)"/>
      <polygon points="5,0 6.5,3.5 10,4 7.5,6.5 8,10 5,8.5 2,10 2.5,6.5 0,4 3.5,3.5" fill="#FF6A00" opacity="0.6" transform="translate(40,0) scale(0.7)"/>
    </g>

    <!-- Label -->
    <text x="80" y="155" text-anchor="middle" fill="#FF6A00" font-family="system-ui, sans-serif" font-size="11" font-weight="600" opacity="0.7">RECOMMENDS YOU</text>
  </g>

  <!-- Floating particles -->
  <circle cx="320" cy="150" r="1.5" fill="#FF6A00" opacity="0.3"/>
  <circle cx="560" cy="130" r="2" fill="#FF6A00" opacity="0.25"/>
  <circle cx="820" cy="160" r="1.5" fill="#FF6A00" opacity="0.3"/>
  <circle cx="180" cy="400" r="2" fill="#FF6A00" opacity="0.2"/>
  <circle cx="1080" cy="380" r="1.5" fill="#FF6A00" opacity="0.25"/>
  <circle cx="600" cy="420" r="2" fill="#FF6A00" opacity="0.2"/>

  <!-- Category pill -->
  <rect x="50" y="30" width="130" height="32" rx="16" fill="#FF6A00" opacity="0.9"/>
  <text x="115" y="51" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600">AEO Education</text>

  <!-- Title -->
  <text x="600" y="500" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="30" font-weight="700">What Happens When a Customer Asks AI</text>
  <text x="600" y="540" text-anchor="middle" fill="#FF6A00" font-family="system-ui, sans-serif" font-size="30" font-weight="700">to Find a Business Like Yours</text>

  <!-- Watermark -->
  <text x="600" y="615" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="11" font-weight="500" opacity="0.3">THE ANSWER ENGINE</text>

  <!-- AE badge -->
  <circle cx="1155" cy="590" r="22" fill="#FF6A00" opacity="0.3" stroke="#FF6A00" stroke-width="1"/>
  <text x="1155" y="596" text-anchor="middle" fill="#FF6A00" font-family="system-ui, sans-serif" font-size="14" font-weight="700" opacity="0.5">AE</text>
</svg>