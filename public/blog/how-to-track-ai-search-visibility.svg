<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow12">
      <feGaussianBlur stdDeviation="6" result="blur12"/>
      <feMerge>
        <feMergeNode in="blur12"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft12">
      <feGaussianBlur stdDeviation="10" result="blur12s"/>
      <feMerge>
        <feMergeNode in="blur12s"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="chartLine12" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FF6A00;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg12)"/>
  <!-- Subtle background pattern lines -->
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="200" y1="0" x2="200" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="1000" y1="0" x2="1000" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>

  <!-- Dashboard panel (right side) -->
  <g transform="translate(640, 55)">
    <!-- Main dashboard frame -->
    <rect x="0" y="0" width="480" height="440" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Top metrics row -->
    <!-- Metric card 1 -->
    <rect x="20" y="20" width="135" height="70" rx="6" fill="rgba(255,106,0,0.08)" stroke="rgba(255,106,0,0.2)" stroke-width="1"/>
    <text x="35" y="45" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" font-weight="500">AI CITATIONS</text>
    <text x="35" y="72" font-family="system-ui, sans-serif" font-size="24" fill="#FF6A00" font-weight="700" filter="url(#glow12)">247</text>
    <text x="105" y="72" font-family="system-ui, sans-serif" font-size="11" fill="rgba(100,220,100,0.7)">+34%</text>

    <!-- Metric card 2 -->
    <rect x="170" y="20" width="135" height="70" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="185" y="45" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" font-weight="500">VISIBILITY</text>
    <text x="185" y="72" font-family="system-ui, sans-serif" font-size="24" fill="white" font-weight="700">8.4</text>
    <text x="225" y="72" font-family="system-ui, sans-serif" font-size="11" fill="rgba(100,220,100,0.7)">+1.2</text>

    <!-- Metric card 3 -->
    <rect x="320" y="20" width="135" height="70" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="335" y="45" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" font-weight="500">QUERIES</text>
    <text x="335" y="72" font-family="system-ui, sans-serif" font-size="24" fill="white" font-weight="700">1.2K</text>
    <text x="390" y="72" font-family="system-ui, sans-serif" font-size="11" fill="rgba(100,220,100,0.7)">+18%</text>

    <!-- Line chart area -->
    <rect x="20" y="110" width="440" height="180" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="35" y="132" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" font-weight="500">AI SEARCH VISIBILITY OVER TIME</text>

    <!-- Chart grid lines -->
    <line x1="40" y1="150" x2="440" y2="150" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
    <line x1="40" y1="180" x2="440" y2="180" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
    <line x1="40" y1="210" x2="440" y2="210" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
    <line x1="40" y1="240" x2="440" y2="240" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
    <line x1="40" y1="270" x2="440" y2="270" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>

    <!-- Chart line (upward trend) -->
    <polyline points="50,265 90,260 130,250 170,255 210,235 250,220 290,210 330,195 370,175 410,160 440,148" stroke="url(#chartLine12)" stroke-width="2.5" fill="none" filter="url(#glow12)"/>
    <!-- Area fill under chart -->
    <polygon points="50,265 90,260 130,250 170,255 210,235 250,220 290,210 330,195 370,175 410,160 440,148 440,275 50,275" fill="rgba(255,106,0,0.06)"/>
    <!-- Data point dots -->
    <circle cx="210" cy="235" r="3" fill="#FF6A00"/>
    <circle cx="330" cy="195" r="3" fill="#FF6A00"/>
    <circle cx="440" cy="148" r="4" fill="#FF6A00" filter="url(#glow12)"/>

    <!-- Bottom bar chart -->
    <rect x="20" y="305" width="210" height="120" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="35" y="327" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" font-weight="500">BY PLATFORM</text>
    <!-- Bars -->
    <rect x="35" y="340" width="120" height="12" rx="2" fill="rgba(255,106,0,0.6)"/>
    <text x="160" y="350" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">ChatGPT</text>
    <rect x="35" y="360" width="90" height="12" rx="2" fill="rgba(255,106,0,0.45)"/>
    <text x="130" y="370" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">Perplexity</text>
    <rect x="35" y="380" width="70" height="12" rx="2" fill="rgba(255,106,0,0.3)"/>
    <text x="110" y="390" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">Claude</text>
    <rect x="35" y="400" width="55" height="12" rx="2" fill="rgba(255,106,0,0.2)"/>
    <text x="95" y="410" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">Gemini</text>

    <!-- Tracking indicators panel -->
    <rect x="245" y="305" width="215" height="120" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="260" y="327" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" font-weight="500">TRACKING STATUS</text>
    <!-- Status rows -->
    <circle cx="268" cy="348" r="4" fill="rgba(100,220,100,0.7)"/>
    <text x="280" y="352" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Schema Markup</text>
    <text x="420" y="352" font-family="system-ui, sans-serif" font-size="10" fill="rgba(100,220,100,0.7)" text-anchor="end">Active</text>

    <circle cx="268" cy="370" r="4" fill="rgba(100,220,100,0.7)"/>
    <text x="280" y="374" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Citation Monitor</text>
    <text x="420" y="374" font-family="system-ui, sans-serif" font-size="10" fill="rgba(100,220,100,0.7)" text-anchor="end">Active</text>

    <circle cx="268" cy="392" r="4" fill="rgba(255,200,50,0.7)"/>
    <text x="280" y="396" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Content Freshness</text>
    <text x="420" y="396" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,200,50,0.7)" text-anchor="end">Warning</text>

    <circle cx="268" cy="414" r="4" fill="rgba(100,220,100,0.7)"/>
    <text x="280" y="418" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Authority Score</text>
    <text x="420" y="418" font-family="system-ui, sans-serif" font-size="10" fill="rgba(100,220,100,0.7)" text-anchor="end">Active</text>
  </g>

  <!-- Decorative elements -->
  <circle cx="100" cy="150" r="60" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <circle cx="100" cy="150" r="90" stroke="rgba(255,106,0,0.04)" stroke-width="0.5" fill="none"/>

  <!-- Title text (left side) -->
  <text x="80" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Track Your</text>
  <text x="80" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glow12)">AI Search</text>
  <text x="80" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Visibility</text>

  <!-- Subtitle -->
  <text x="80" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">Tools and Metrics That Matter</text>

  <!-- Footer branding -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>