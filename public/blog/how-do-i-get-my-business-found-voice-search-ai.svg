  <circle cx="765" cy="248" r="5" fill="rgba(255,106,0,0.5)"/>
  <circle cx="795" cy="248" r="5" fill="rgba(255,106,0,0.5)"/>
  <circle cx="780" cy="275" r="4" fill="rgba(255,106,0,0.5)"/>
  <line x1="765" y1="248" x2="795" y2="248" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <line x1="765" y1="248" x2="780" y2="275" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <line x1="795" y1="248" x2="780" y2="275" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <!-- Additional nodes -->
  <circle cx="755" cy="270" r="3" fill="rgba(255,106,0,0.4)"/>
  <circle cx="805" cy="270" r="3" fill="rgba(255,106,0,0.4)"/>
  <line x1="755" y1="270" x2="780" y2="275" stroke="rgba(255,106,0,0.2)" stroke-width="1"/>
  <line x1="805" y1="270" x2="780" y2="275" stroke="rgba(255,106,0,0.2)" stroke-width="1"/>
  <!-- Grid lines background -->
  <line x1="0" y1="150" x2="1200" y2="150" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="350" x2="1200" y2="350" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="630" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="1000" y1="0" x2="1000" y2="630" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <!-- Category pill -->
