  <circle cx="400" cy="260" r="130" stroke="rgba(255,106,0,0.15)" stroke-width="1" fill="none"/>
  <!-- Microphone icon (simplified) -->
  <rect x="391" y="235" width="18" height="30" rx="9" stroke="white" stroke-width="2" fill="rgba(255,255,255,0.1)"/>
  <path d="M385 260 Q385 280 400 280 Q415 280 415 260" stroke="white" stroke-width="1.5" fill="none"/>
  <line x1="400" y1="280" x2="400" y2="290" stroke="white" stroke-width="1.5"/>
  <line x1="392" y1="290" x2="408" y2="290" stroke="white" stroke-width="1.5"/>
