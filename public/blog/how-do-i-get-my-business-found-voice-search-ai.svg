      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Sound wave rings (voice search visual) -->
  <circle cx="400" cy="260" r="40" stroke="rgba(255,106,0,0.5)" stroke-width="2" fill="rgba(255,106,0,0.08)"/>
  <circle cx="400" cy="260" r="70" stroke="rgba(255,106,0,0.35)" stroke-width="1.5" fill="none"/>
