<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1b4e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative X marks (representing being excluded/not recommended) -->
  <line x1="920" y1="80" x2="960" y2="120" stroke="rgba(255,106,0,0.12)" stroke-width="3" stroke-linecap="round"/>
  <line x1="960" y1="80" x2="920" y2="120" stroke="rgba(255,106,0,0.12)" stroke-width="3" stroke-linecap="round"/>
  <line x1="1060" y1="180" x2="1090" y2="210" stroke="rgba(255,106,0,0.08)" stroke-width="2" stroke-linecap="round"/>
  <line x1="1090" y1="180" x2="1060" y2="210" stroke="rgba(255,106,0,0.08)" stroke-width="2" stroke-linecap="round"/>
  <line x1="1100" y1="90" x2="1125" y2="115" stroke="rgba(255,106,0,0.06)" stroke-width="2" stroke-linecap="round"/>
  <line x1="1125" y1="90" x2="1100" y2="115" stroke="rgba(255,106,0,0.06)" stroke-width="2" stroke-linecap="round"/>
  <!-- Decorative dotted circle -->
  <circle cx="1000" cy="350" r="120" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="8 6"/>
  <circle cx="1000" cy="350" r="80" fill="none" stroke="rgba(255,106,0,0.06)" stroke-width="1" stroke-dasharray="5 5"/>
  <!-- Question mark decorative -->
  <text x="1000" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="100" font-weight="700" fill="rgba(255,106,0,0.05)" text-anchor="middle">?</text>
  <!-- Category badge -->
  <rect x="40" y="40" width="190" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="135" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">ChatGPT Citation Series</text>
  <!-- Title lines -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">Why ChatGPT Isn't</text>
  <text x="80" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">Recommending</text>
  <text x="80" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#FF6A00">Your Business</text>
  <!-- Brand footer -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>