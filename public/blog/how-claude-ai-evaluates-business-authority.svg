    <text x="235" y="68" font-family="system-ui, sans-serif" font-size="9" fill="#FF6A00" text-anchor="middle" font-weight="600">AUTHORITY SCORE</text>
    <text x="235" y="105" font-family="system-ui, sans-serif" font-size="28" fill="#FF6A00" text-anchor="middle" font-weight="700" filter="url(#glowHCEA)">8.6/10</text>
    <!-- Signal breakdown bars -->
    <text x="20" y="150" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">SIGNAL WEIGHTS</text>
    <!-- Bar 1 -->
    <text x="20" y="175" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)">Content Depth</text>
    <rect x="130" y="164" width="300" height="16" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="130" y="164" width="270" height="16" rx="3" fill="rgba(255,106,0,0.5)"/>
    <text x="410" y="176" font-family="system-ui, sans-serif" font-size="9" fill="#FF6A00" font-weight="700">9.0</text>
    <!-- Bar 2 -->
    <text x="20" y="200" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)">Source Citations</text>
    <rect x="130" y="189" width="300" height="16" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="130" y="189" width="255" height="16" rx="3" fill="rgba(100,220,100,0.5)"/>
    <text x="395" y="201" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)" font-weight="700">8.5</text>
    <!-- Bar 3 -->
    <text x="20" y="225" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)">Domain Trust</text>
    <rect x="130" y="214" width="300" height="16" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="130" y="214" width="240" height="16" rx="3" fill="rgba(100,150,255,0.5)"/>
    <text x="380" y="226" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,150,255,0.9)" font-weight="700">8.0</text>
    <!-- Bar 4 -->
    <text x="20" y="250" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)">Schema Data</text>
    <rect x="130" y="239" width="300" height="16" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="130" y="239" width="285" height="16" rx="3" fill="rgba(255,200,50,0.5)"/>
    <text x="425" y="251" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,200,50,0.9)" font-weight="700">9.5</text>
    <!-- Bar 5 -->
    <text x="20" y="275" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)">Recency</text>
    <rect x="130" y="264" width="300" height="16" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="130" y="264" width="225" height="16" rx="3" fill="rgba(200,150,255,0.5)"/>
    <text x="365" y="276" font-family="system-ui, sans-serif" font-size="9" fill="rgba(200,150,255,0.9)" font-weight="700">7.5</text>
    <!-- What Claude looks for -->
    <line x1="20" y1="295" x2="450" y2="295" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <text x="20" y="320" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">WHAT CLAUDE PRIORITIZES</text>
    <text x="30" y="345" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; Factual accuracy over marketing claims</text>
    <text x="30" y="363" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; Primary sources and original research</text>
    <text x="30" y="381" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; Expert credentials and E-E-A-T signals</text>
    <text x="30" y="399" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; Structured data that confirms expertise</text>
    <!-- Key insight -->
    <rect x="20" y="415" width="430" height="38" rx="6" fill="rgba(255,106,0,0.08)" stroke="#FF6A00" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="235" y="439" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" text-anchor="middle" font-weight="600">Claude values depth + accuracy over keyword density</text>
  </g>
  <circle cx="100" cy="130" r="60" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <rect x="40" y="40" width="180" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="130" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">Platform Deep Dive</text>
  <text x="80" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">How Claude AI</text>
  <text x="80" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Evaluates</text>
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glowHCEA)">Business Authority</text>
  <text x="80" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">The 5-Signal Scoring System</text>
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>