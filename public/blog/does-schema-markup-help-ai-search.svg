    <text x="246" y="401" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,150,255,0.9)" text-anchor="middle" font-weight="600">Review</text>
    <rect x="294" y="382" width="75" height="30" rx="6" fill="rgba(255,200,50,0.08)" stroke="rgba(255,200,50,0.4)" stroke-width="1"/>
    <text x="331" y="401" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,200,50,0.9)" text-anchor="middle" font-weight="600">Service</text>
    <rect x="377" y="382" width="73" height="30" rx="6" fill="rgba(200,150,255,0.08)" stroke="rgba(200,150,255,0.4)" stroke-width="1"/>
