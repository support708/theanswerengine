    <text x="70" y="401" font-family="system-ui, sans-serif" font-size="9" fill="#FF6A00" text-anchor="middle" font-weight="600">LocalBusiness</text>
    <rect x="128" y="382" width="70" height="30" rx="6" fill="rgba(100,220,100,0.08)" stroke="rgba(100,220,100,0.4)" stroke-width="1"/>
    <text x="163" y="401" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)" text-anchor="middle" font-weight="600">FAQ</text>
