<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131313"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F27D24"/>
      <stop offset="1" stop-color="#cc5500"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- terminal label -->
  <text x="80" y="150" font-family="Courier New, monospace" font-size="22" letter-spacing="6" fill="#F27D24">AEO OPERATOR SERIES</text>

  <!-- headline -->
  <text x="78" y="262" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="92" letter-spacing="-3" fill="#ffffff">HOW TO RANK IN</text>
  <text x="78" y="360" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="92" letter-spacing="-3" fill="#ffffff">MICROSOFT COPILOT</text>
  <text x="78" y="458" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="92" letter-spacing="-3" fill="url(#accent)">SEARCH</text>

  <!-- footnote motif -->
  <g font-family="Courier New, monospace" font-size="20" fill="#e5e2e1" opacity="0.75">
    <circle cx="700" cy="448" r="16" fill="none" stroke="#F27D24" stroke-width="2"/>
    <text x="694" y="455" fill="#F27D24">1</text>
    <circle cx="748" cy="448" r="16" fill="none" stroke="#F27D24" stroke-width="2"/>
    <text x="742" y="455" fill="#F27D24">2</text>
    <circle cx="796" cy="448" r="16" fill="none" stroke="#F27D24" stroke-width="2"/>
    <text x="790" y="455" fill="#F27D24">3</text>
    <text x="828" y="455">bing index citation</text>
  </g>

  <!-- footer brand -->
  <text x="80" y="560" font-family="Courier New, monospace" font-size="24" letter-spacing="2" fill="#e5e2e1">THE ANSWER ENGINE</text>
  <text x="80" y="592" font-family="Courier New, monospace" font-size="18" letter-spacing="1" fill="#e5e2e1" opacity="0.55">theanswerengine.ai</text>
</svg>
