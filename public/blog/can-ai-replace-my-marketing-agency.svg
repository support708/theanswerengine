<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Orange geometric patterns -->
  <circle cx="180" cy="315" r="140" stroke="#FF6A00" stroke-width="0.8" fill="none" opacity="0.25"/>
  <circle cx="180" cy="315" r="90" stroke="#FF6A00" stroke-width="0.6" fill="none" opacity="0.2"/>
  <circle cx="180" cy="315" r="45" stroke="#FF6A00" stroke-width="1" fill="none" opacity="0.3"/>
  <circle cx="1020" cy="315" r="140" stroke="#FF6A00" stroke-width="0.8" fill="none" opacity="0.25"/>
  <circle cx="1020" cy="315" r="90" stroke="#FF6A00" stroke-width="0.6" fill="none" opacity="0.2"/>
  <circle cx="1020" cy="315" r="45" stroke="#FF6A00" stroke-width="1" fill="none" opacity="0.3"/>
  <!-- Connecting line -->
  <line x1="320" y1="315" x2="880" y2="315" stroke="#FF6A00" stroke-width="0.6" stroke-dasharray="12 6" opacity="0.2"/>
  <!-- Corner accents -->
  <rect x="40" y="40" width="16" height="16" fill="#FF6A00" opacity="0.15"/>
  <rect x="1144" y="40" width="16" height="16" fill="#FF6A00" opacity="0.15"/>
  <rect x="40" y="574" width="16" height="16" fill="#FF6A00" opacity="0.15"/>
  <rect x="1144" y="574" width="16" height="16" fill="#FF6A00" opacity="0.15"/>
  <!-- Diamond shapes -->
  <path d="M180 175 L220 315 L180 455 L140 315 Z" stroke="#FF6A00" stroke-width="0.5" fill="none" opacity="0.15"/>
  <path d="M1020 175 L1060 315 L1020 455 L980 315 Z" stroke="#FF6A00" stroke-width="0.5" fill="none" opacity="0.15"/>
  <!-- Category pill -->
  <rect x="440" y="120" width="120" height="32" rx="16" fill="rgba(255,106,0,0.2)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="500" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">Myth Busters</text>
  <!-- Title text -->
  <text x="600" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="white" text-anchor="middle">Can AI Replace My</text>
  <text x="600" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#FF6A00" text-anchor="middle">Marketing Agency?</text>
  <!-- Watermark -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <!-- AE logo circle -->
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>
