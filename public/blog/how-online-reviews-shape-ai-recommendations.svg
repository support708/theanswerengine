<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16213e"/>
      <stop offset="50%" stop-color="#0F1117"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="bigGlow5">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg5)"/>

  <!-- Dot matrix background -->
  <g opacity="0.04">
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#FF6A00"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dots)"/>
  </g>

  <!-- Central glow -->
  <circle cx="600" cy="250" r="150" fill="#FF6A00" opacity="0.03" filter="url(#bigGlow5)"/>

  <!-- Star constellation (large, left-center) -->
  <g transform="translate(120, 120)">
    <!-- Large 5-star rating -->
    <g transform="scale(2.5)">
      <polygon points="20,2 25,15 39,15 27,24 31,37 20,29 9,37 13,24 1,15 15,15" fill="#FF6A00" opacity="0.6"/>
    </g>
    <g transform="translate(80, 0) scale(2.5)">
      <polygon points="20,2 25,15 39,15 27,24 31,37 20,29 9,37 13,24 1,15 15,15" fill="#FF6A00" opacity="0.5"/>
    </g>
    <g transform="translate(160, 0) scale(2.5)">
      <polygon points="20,2 25,15 39,15 27,24 31,37 20,29 9,37 13,24 1,15 15,15" fill="#FF6A00" opacity="0.4"/>
    </g>
    <g transform="translate(240, 0) scale(2.5)">
      <polygon points="20,2 25,15 39,15 27,24 31,37 20,29 9,37 13,24 1,15 15,15" fill="#FF6A00" opacity="0.3"/>
    </g>
    <g transform="translate(320, 0) scale(2.5)">
      <polygon points="20,2 25,15 39,15 27,24 31,37 20,29 9,37 13,24 1,15 15,15" fill="#FF6A00" opacity="0.15"/>
    </g>

    <!-- Review text snippets flowing down from stars -->
    <!-- Review card 1 -->
    <rect x="30" y="110" width="160" height="50" rx="8" fill="#0a1628" stroke="#FF6A00" stroke-width="0.8" opacity="0.5"/>
    <rect x="45" y="120" width="100" height="5" rx="2" fill="#FF6A00" opacity="0.2"/>
    <rect x="45" y="130" width="120" height="5" rx="2" fill="#FF6A00" opacity="0.15"/>
    <rect x="45" y="140" width="80" height="5" rx="2" fill="#FF6A00" opacity="0.1"/>
    <!-- Mini stars -->
    <g transform="translate(145, 118) scale(0.4)">
      <polygon points="5,0 6.5,4 10,4 7.5,7 8,10 5,8.5 2,10 2.5,7 0,4 3.5,4" fill="#FF6A00" opacity="0.8"/>
    </g>

    <!-- Review card 2 -->
    <rect x="200" y="120" width="160" height="50" rx="8" fill="#0a1628" stroke="#FF6A00" stroke-width="0.8" opacity="0.4"/>
    <rect x="215" y="130" width="110" height="5" rx="2" fill="#FF6A00" opacity="0.15"/>
    <rect x="215" y="140" width="130" height="5" rx="2" fill="#FF6A00" opacity="0.12"/>
    <rect x="215" y="150" width="70" height="5" rx="2" fill="#FF6A00" opacity="0.08"/>
  </g>

  <!-- AI Neural Funnel (center-right) -->
  <g transform="translate(700, 100)">
    <!-- Funnel shape -->
    <path d="M0,0 L250,0 L180,120 L70,120 Z" fill="none" stroke="#FF6A00" stroke-width="1.2" opacity="0.3"/>
    <path d="M70,120 L180,120 L160,200 L90,200 Z" fill="none" stroke="#FF6A00" stroke-width="1.2" opacity="0.35"/>
    <path d="M90,200 L160,200 L145,260 L105,260 Z" fill="none" stroke="#FF6A00" stroke-width="1.2" opacity="0.4"/>

    <!-- Neural nodes inside funnel -->
    <circle cx="80" cy="40" r="4" fill="#FF6A00" opacity="0.4"/>
    <circle cx="125" cy="30" r="5" fill="#FF6A00" opacity="0.5"/>
    <circle cx="170" cy="45" r="4" fill="#FF6A00" opacity="0.4"/>
    <circle cx="100" cy="80" r="4" fill="#FF6A00" opacity="0.45"/>
    <circle cx="150" cy="75" r="4" fill="#FF6A00" opacity="0.45"/>
    <circle cx="125" cy="60" r="6" fill="#FF6A00" opacity="0.5"/>

    <!-- Connections -->
    <line x1="80" y1="40" x2="125" y2="60" stroke="#FF6A00" stroke-width="0.8" opacity="0.2"/>
    <line x1="170" y1="45" x2="125" y2="60" stroke="#FF6A00" stroke-width="0.8" opacity="0.2"/>
    <line x1="125" y1="30" x2="125" y2="60" stroke="#FF6A00" stroke-width="0.8" opacity="0.2"/>
    <line x1="100" y1="80" x2="125" y2="60" stroke="#FF6A00" stroke-width="0.8" opacity="0.2"/>
    <line x1="150" y1="75" x2="125" y2="60" stroke="#FF6A00" stroke-width="0.8" opacity="0.2"/>

    <!-- Processing indicators in middle section -->
    <circle cx="110" cy="150" r="3" fill="#FF6A00" opacity="0.5"/>
    <circle cx="140" cy="155" r="3" fill="#FF6A00" opacity="0.5"/>
    <circle cx="125" cy="140" r="4" fill="#FF6A00" opacity="0.6"/>
    <line x1="110" y1="150" x2="125" y2="140" stroke="#FF6A00" stroke-width="0.8" opacity="0.3"/>
    <line x1="140" y1="155" x2="125" y2="140" stroke="#FF6A00" stroke-width="0.8" opacity="0.3"/>

    <!-- Output at bottom -->
    <circle cx="125" cy="230" r="8" fill="#FF6A00" opacity="0.15" filter="url(#glow5)"/>
    <circle cx="125" cy="230" r="5" fill="#FF6A00" opacity="0.5"/>

    <!-- Output arrow -->
    <line x1="125" y1="260" x2="125" y2="300" stroke="#FF6A00" stroke-width="2" opacity="0.4"/>
    <polygon points="125,300 120,290 130,290" fill="#FF6A00" opacity="0.5"/>

    <!-- Output: Recommendation badge -->
    <rect x="80" y="310" width="90" height="30" rx="8" fill="#FF6A00" opacity="0.2" stroke="#FF6A00" stroke-width="1"/>
    <text x="125" y="330" text-anchor="middle" fill="#FF6A00" font-family="system-ui, sans-serif" font-size="10" font-weight="700" opacity="0.7">CITED</text>
  </g>

  <!-- Flow arrows from reviews to funnel -->
  <g opacity="0.3">
    <path d="M530,230 Q615,180 700,150" stroke="#FF6A00" stroke-width="1.5" fill="none" stroke-dasharray="5,5"/>
    <path d="M530,280 Q615,250 700,220" stroke="#FF6A00" stroke-width="1.5" fill="none" stroke-dasharray="5,5"/>
    <!-- Pulse dots -->
    <circle cx="580" cy="215" r="2" fill="#FF6A00" opacity="0.5"/>
    <circle cx="620" cy="240" r="2" fill="#FF6A00" opacity="0.5"/>
    <circle cx="660" cy="195" r="2" fill="#FF6A00" opacity="0.4"/>
  </g>

  <!-- Platform icons (scattered) -->
  <!-- Google "G" outline -->
  <g transform="translate(100, 380)" opacity="0.3">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#FF6A00" stroke-width="1.5"/>
    <text x="20" y="27" text-anchor="middle" fill="#FF6A00" font-family="system-ui, sans-serif" font-size="18" font-weight="700">G</text>
  </g>

  <!-- Yelp "Y" outline -->
  <g transform="translate(200, 410)" opacity="0.25">
    <circle cx="18" cy="18" r="16" fill="none" stroke="#FF6A00" stroke-width="1.5"/>
    <text x="18" y="25" text-anchor="middle" fill="#FF6A00" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Y</text>
  </g>

  <!-- BBB "B" outline -->
  <g transform="translate(300, 380)" opacity="0.2">
    <circle cx="18" cy="18" r="16" fill="none" stroke="#FF6A00" stroke-width="1.5"/>
    <text x="18" y="25" text-anchor="middle" fill="#FF6A00" font-family="system-ui, sans-serif" font-size="16" font-weight="700">B</text>
  </g>

  <!-- Floating particles -->
  <circle cx="500" cy="100" r="2" fill="#FF6A00" opacity="0.25"/>
  <circle cx="650" cy="430" r="1.5" fill="#FF6A00" opacity="0.2"/>
  <circle cx="1050" cy="150" r="2" fill="#FF6A00" opacity="0.3"/>
  <circle cx="1100" cy="450" r="1.5" fill="#FF6A00" opacity="0.2"/>
  <circle cx="50" cy="500" r="2" fill="#FF6A00" opacity="0.25"/>

  <!-- Category pill -->
  <rect x="50" y="30" width="120" height="32" rx="16" fill="#FF6A00" opacity="0.9"/>
  <text x="110" y="51" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600">AI Visibility</text>

  <!-- Title -->
  <text x="600" y="510" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="30" font-weight="700">How Online Reviews Shape AI Recommendations</text>
  <text x="600" y="550" text-anchor="middle" fill="#FF6A00" font-family="system-ui, sans-serif" font-size="30" font-weight="700">(Beyond Star Ratings)</text>

  <!-- Watermark -->
  <text x="600" y="615" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="11" font-weight="500" opacity="0.3">THE ANSWER ENGINE</text>

  <circle cx="1155" cy="590" r="22" fill="#FF6A00" opacity="0.15" stroke="#FF6A00" stroke-width="1" opacity="0.3"/>
  <text x="1155" y="596" text-anchor="middle" fill="#FF6A00" font-family="system-ui, sans-serif" font-size="14" font-weight="700" opacity="0.5">AE</text>
</svg>