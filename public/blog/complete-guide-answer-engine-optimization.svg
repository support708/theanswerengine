<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#172554;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative concentric rings (comprehensive/complete motif) -->
  <circle cx="1020" cy="280" r="180" fill="none" stroke="rgba(255,106,0,0.04)" stroke-width="1"/>
  <circle cx="1020" cy="280" r="140" fill="none" stroke="rgba(255,106,0,0.06)" stroke-width="1"/>
  <circle cx="1020" cy="280" r="100" fill="none" stroke="rgba(255,106,0,0.08)" stroke-width="1.5"/>
  <circle cx="1020" cy="280" r="60" fill="none" stroke="rgba(255,106,0,0.1)" stroke-width="1.5"/>
  <circle cx="1020" cy="280" r="20" fill="rgba(255,106,0,0.12)"/>
  <!-- Radiating lines from center -->
  <line x1="1020" y1="280" x2="1020" y2="80" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="1020" y1="280" x2="1200" y2="280" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="1020" y1="280" x2="1150" y2="150" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="1020" y1="280" x2="1150" y2="410" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="1020" y1="280" x2="890" y2="150" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="1020" y1="280" x2="890" y2="410" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <!-- Small accent dots at intersections -->
  <circle cx="1020" cy="100" r="3" fill="rgba(255,106,0,0.15)"/>
  <circle cx="1150" cy="150" r="3" fill="rgba(255,106,0,0.12)"/>
  <circle cx="1150" cy="410" r="3" fill="rgba(255,106,0,0.12)"/>
  <circle cx="890" cy="150" r="3" fill="rgba(255,106,0,0.12)"/>
  <!-- Category badge -->
  <rect x="40" y="40" width="170" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="125" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">AEO Fundamentals</text>
  <!-- Title lines -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">The Complete Guide to</text>
  <text x="80" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">Answer Engine</text>
  <text x="80" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#FF6A00">Optimization</text>
  <!-- Brand footer -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>