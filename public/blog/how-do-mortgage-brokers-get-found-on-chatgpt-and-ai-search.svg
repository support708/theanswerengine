<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgMortgage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#131313;stop-opacity:1" />
    </linearGradient>
    <filter id="glowMortgage"><feGaussianBlur stdDeviation="6" result="blurMortgage"/><feMerge><feMergeNode in="blurMortgage"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="nodeGlowMortgage" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#FF6A00;stop-opacity:0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgMortgage)"/>

  <!-- Grid lines -->
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>

  <!-- LEFT: Title + Label -->
  <g transform="translate(60, 80)">
    <text x="0" y="0" font-family="Courier New, monospace" font-size="12" fill="#FF6A00" font-weight="700" letter-spacing="3">MORTGAGE AEO · 7-SIGNAL NMLS STACK</text>
    <text x="0" y="60" font-family="system-ui, sans-serif" font-size="42" fill="white" font-weight="900" letter-spacing="-1.5">HOW MORTGAGE BROKERS</text>
    <text x="0" y="103" font-family="system-ui, sans-serif" font-size="42" fill="white" font-weight="900" letter-spacing="-1.5">GET FOUND ON</text>
    <text x="0" y="146" font-family="system-ui, sans-serif" font-size="42" fill="#FF6A00" font-weight="900" letter-spacing="-1.5">CHATGPT &amp; AI SEARCH</text>

    <line x1="0" y1="180" x2="80" y2="180" stroke="#FF6A00" stroke-width="3"/>

    <text x="0" y="220" font-family="system-ui, sans-serif" font-size="16" fill="#9ca3af" font-weight="400">The seven-signal stack the AI ranker reads</text>
    <text x="0" y="244" font-family="system-ui, sans-serif" font-size="16" fill="#9ca3af" font-weight="400">on every regulated-lending query.</text>

    <!-- Stat row -->
    <g transform="translate(0, 310)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="44" fill="#FF6A00" font-weight="900" letter-spacing="-1">3.4x</text>
      <text x="0" y="22" font-family="Courier New, monospace" font-size="11" fill="#9ca3af" letter-spacing="2">CITATION LIFT · NMLS BOUND</text>
    </g>
    <g transform="translate(180, 310)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="44" fill="#FF6A00" font-weight="900" letter-spacing="-1">7-Day</text>
      <text x="0" y="22" font-family="Courier New, monospace" font-size="11" fill="#9ca3af" letter-spacing="2">RATE FRESHNESS CEILING</text>
    </g>
    <g transform="translate(360, 310)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="44" fill="#FF6A00" font-weight="900" letter-spacing="-1">YMYL</text>
      <text x="0" y="22" font-family="Courier New, monospace" font-size="11" fill="#9ca3af" letter-spacing="2">REGULATED-FINANCE FILTER</text>
    </g>

    <!-- Bottom branding -->
    <g transform="translate(0, 430)">
      <rect x="0" y="0" width="6" height="40" fill="#FF6A00"/>
      <text x="20" y="18" font-family="system-ui, sans-serif" font-size="18" fill="white" font-weight="700">THE ANSWER ENGINE</text>
      <text x="20" y="36" font-family="Courier New, monospace" font-size="11" fill="#9ca3af" letter-spacing="2">THEANSWERENGINE.AI · MORTGAGE AEO SERIES</text>
    </g>
  </g>

  <!-- RIGHT: Seven-Signal Stack Diagram -->
  <g transform="translate(720, 90)">
    <text x="0" y="0" font-family="Courier New, monospace" font-size="11" fill="#FF6A00" font-weight="700" letter-spacing="3">SEVEN-SIGNAL COMPOSITE</text>

    <!-- Center node: Mortgage Citation -->
    <g transform="translate(200, 230)">
      <circle r="80" fill="url(#nodeGlowMortgage)"/>
      <circle r="56" fill="#131313" stroke="#FF6A00" stroke-width="2"/>
      <text x="0" y="-6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="900">MORTGAGE</text>
      <text x="0" y="12" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="900">CITATION</text>
    </g>

    <!-- Signal nodes around the center -->
    <!-- Signal 1: NMLS Binding (top) -->
    <g transform="translate(200, 50)">
      <circle r="34" fill="#0f0f10" stroke="#FF6A00" stroke-width="1.5"/>
      <text x="0" y="-3" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white" font-weight="700">NMLS</text>
      <text x="0" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white" font-weight="700">BIND</text>
    </g>
    <line x1="200" y1="84" x2="200" y2="174" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4,4"/>

    <!-- Signal 2: sameAs Chain (top right) -->
    <g transform="translate(360, 110)">
      <circle r="34" fill="#0f0f10" stroke="#FF6A00" stroke-width="1.5"/>
      <text x="0" y="-3" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white" font-weight="700">sameAs</text>
      <text x="0" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white" font-weight="700">CHAIN</text>
    </g>
    <line x1="334" y1="135" x2="251" y2="210" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4,4"/>

    <!-- Signal 3: Rate Freshness (right) -->
    <g transform="translate(395, 230)">
      <circle r="34" fill="#0f0f10" stroke="#FF6A00" stroke-width="1.5"/>
      <text x="0" y="-3" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white" font-weight="700">RATE</text>
      <text x="0" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white" font-weight="700">FRESH</text>
    </g>
    <line x1="361" y1="230" x2="256" y2="230" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4,4"/>

    <!-- Signal 4: Scenario Chunks (bottom right) -->
    <g transform="translate(360, 350)">
      <circle r="34" fill="#0f0f10" stroke="#FF6A00" stroke-width="1.5"/>
      <text x="0" y="-3" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white" font-weight="700">CHUNK</text>
      <text x="0" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white" font-weight="700">PATTERN</text>
    </g>
    <line x1="334" y1="325" x2="251" y2="250" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4,4"/>

    <!-- Signal 5: Disclosures (bottom) -->
    <g transform="translate(200, 410)">
      <circle r="34" fill="#0f0f10" stroke="#FF6A00" stroke-width="1.5"/>
      <text x="0" y="-3" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white" font-weight="700">INLINE</text>
      <text x="0" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white" font-weight="700">DISCL</text>
    </g>
    <line x1="200" y1="376" x2="200" y2="286" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4,4"/>

    <!-- Signal 6: Named Bylines (bottom left) -->
    <g transform="translate(40, 350)">
      <circle r="34" fill="#0f0f10" stroke="#FF6A00" stroke-width="1.5"/>
      <text x="0" y="-3" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white" font-weight="700">NAMED</text>
      <text x="0" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white" font-weight="700">BYLINE</text>
    </g>
    <line x1="66" y1="325" x2="149" y2="250" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4,4"/>

    <!-- Signal 7: FAQ Schema (left) -->
    <g transform="translate(5, 230)">
      <circle r="34" fill="#0f0f10" stroke="#FF6A00" stroke-width="1.5"/>
      <text x="0" y="-3" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white" font-weight="700">FAQ</text>
      <text x="0" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white" font-weight="700">SCHEMA</text>
    </g>
    <line x1="39" y1="230" x2="144" y2="230" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4,4"/>

    <!-- Bottom diagonal: NMLS extension -->
    <g transform="translate(40, 110)">
      <circle r="34" fill="#0f0f10" stroke="#FF6A00" stroke-width="1.5"/>
      <text x="0" y="-3" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white" font-weight="700">YMYL</text>
      <text x="0" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white" font-weight="700">TRUST</text>
    </g>
    <line x1="66" y1="135" x2="149" y2="210" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4,4"/>
  </g>
</svg>
