<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="60%" stop-color="#131313"/>
      <stop offset="100%" stop-color="#1a0d05"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FF6A00" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FF6A00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orangeLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF6A00" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF6A00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chunkFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF6A00" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="950" cy="180" r="320" fill="url(#glow)"/>

  <!-- Grid -->
  <g opacity="0.14" stroke="#FF6A00" stroke-width="1" fill="none">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Stacked "cited page chunks" visualization on the right -->
  <g>
    <!-- Chunk 1 -->
    <rect x="700" y="80" width="380" height="60" fill="url(#chunkFill)" stroke="#FF6A00" stroke-width="1.5" opacity="0.9"/>
    <line x1="720" y1="100" x2="900" y2="100" stroke="#FF6A00" stroke-width="2" opacity="0.85"/>
    <line x1="720" y1="115" x2="1040" y2="115" stroke="#FFFFFF" stroke-width="1" opacity="0.25"/>
    <line x1="720" y1="125" x2="980" y2="125" stroke="#FFFFFF" stroke-width="1" opacity="0.25"/>
    <text x="720" y="74" font-family="Courier New, monospace" font-size="10" fill="#FF6A00" letter-spacing="2">CHUNK 01 · 142 WORDS</text>

    <!-- Chunk 2 (cited - brighter) -->
    <rect x="700" y="170" width="380" height="60" fill="url(#chunkFill)" stroke="#FF6A00" stroke-width="2" opacity="1"/>
    <rect x="700" y="170" width="380" height="60" fill="#FF6A00" opacity="0.08"/>
    <line x1="720" y1="190" x2="920" y2="190" stroke="#FF6A00" stroke-width="2" opacity="1"/>
    <line x1="720" y1="205" x2="1040" y2="205" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
    <line x1="720" y1="215" x2="990" y2="215" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
    <text x="720" y="164" font-family="Courier New, monospace" font-size="10" fill="#FF6A00" letter-spacing="2">CHUNK 02 · CITED ✓</text>
    <circle cx="1090" cy="200" r="6" fill="#FF6A00"/>

    <!-- Chunk 3 -->
    <rect x="700" y="260" width="380" height="60" fill="url(#chunkFill)" stroke="#FF6A00" stroke-width="1.5" opacity="0.9"/>
    <line x1="720" y1="280" x2="880" y2="280" stroke="#FF6A00" stroke-width="2" opacity="0.85"/>
    <line x1="720" y1="295" x2="1040" y2="295" stroke="#FFFFFF" stroke-width="1" opacity="0.25"/>
    <line x1="720" y1="305" x2="970" y2="305" stroke="#FFFFFF" stroke-width="1" opacity="0.25"/>
    <text x="720" y="254" font-family="Courier New, monospace" font-size="10" fill="#FF6A00" letter-spacing="2">CHUNK 03 · 96 WORDS</text>

    <!-- Chunk 4 (cited) -->
    <rect x="700" y="350" width="380" height="60" fill="url(#chunkFill)" stroke="#FF6A00" stroke-width="2" opacity="1"/>
    <rect x="700" y="350" width="380" height="60" fill="#FF6A00" opacity="0.08"/>
    <line x1="720" y1="370" x2="930" y2="370" stroke="#FF6A00" stroke-width="2" opacity="1"/>
    <line x1="720" y1="385" x2="1040" y2="385" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
    <line x1="720" y1="395" x2="985" y2="395" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
    <text x="720" y="344" font-family="Courier New, monospace" font-size="10" fill="#FF6A00" letter-spacing="2">CHUNK 04 · CITED ✓</text>
    <circle cx="1090" cy="380" r="6" fill="#FF6A00"/>
  </g>

  <!-- Orange separator -->
  <line x1="120" y1="450" x2="1080" y2="450" stroke="url(#orangeLine)" stroke-width="2"/>

  <!-- Title block -->
  <text x="120" y="180" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#FF6A00" letter-spacing="3">
    AEO PATTERN LIBRARY · 2026
  </text>
  <text x="120" y="260" font-family="Space Grotesk, Arial, sans-serif" font-size="62" font-weight="900" fill="#FFFFFF" letter-spacing="-3">
    AEO EXAMPLES
  </text>
  <text x="120" y="330" font-family="Space Grotesk, Arial, sans-serif" font-size="40" font-weight="700" fill="#FF6A00" letter-spacing="-1">
    REAL PAGES THAT GET CITED
  </text>

  <!-- Bottom labels -->
  <text x="120" y="510" font-family="Space Grotesk, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">
    THE CITATION FINGERPRINT
  </text>
  <text x="120" y="540" font-family="Courier New, monospace" font-size="13" fill="#888888" letter-spacing="1">
    5 STRUCTURAL SIGNALS · 4 ENGINES · 16 MONTHS OF MEASUREMENT
  </text>
  <text x="120" y="585" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#666666" letter-spacing="2">
    THE ANSWER ENGINE · THEANSWERENGINE.AI
  </text>
</svg>
