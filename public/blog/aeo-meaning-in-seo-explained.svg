<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1207;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#131313;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="orangeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#FF6A00;stop-opacity:0" />
    </radialGradient>
    <filter id="glowM"><feGaussianBlur stdDeviation="6" result="blurM"/><feMerge><feMergeNode in="blurM"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoftM"><feGaussianBlur stdDeviation="14" result="blurMs"/><feMerge><feMergeNode in="blurMs"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgM)"/>
  <circle cx="600" cy="315" r="380" fill="url(#orangeGlow)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,106,0,0.05)" stroke-width="0.5">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Top label -->
  <rect x="60" y="60" width="220" height="32" fill="rgba(255,106,0,0.08)" stroke="rgba(255,106,0,0.4)" stroke-width="1"/>
  <text x="170" y="81" font-family="Courier New, monospace" font-size="12" fill="#FF6A00" text-anchor="middle" font-weight="700" letter-spacing="2.5">AEO FOUNDATIONS</text>

  <!-- Main heading -->
  <text x="60" y="200" font-family="Space Grotesk, system-ui, sans-serif" font-size="76" fill="#ffffff" font-weight="900" letter-spacing="-2">AEO MEANING</text>
  <text x="60" y="280" font-family="Space Grotesk, system-ui, sans-serif" font-size="76" fill="#ffffff" font-weight="900" letter-spacing="-2">IN SEO</text>
  <text x="60" y="360" font-family="Space Grotesk, system-ui, sans-serif" font-size="76" fill="#FF6A00" font-weight="900" letter-spacing="-2" filter="url(#glowM)">EXPLAINED</text>

  <!-- Definition line -->
  <line x1="60" y1="400" x2="320" y2="400" stroke="#FF6A00" stroke-width="2"/>
  <text x="60" y="438" font-family="system-ui, sans-serif" font-size="22" fill="rgba(255,255,255,0.78)" font-weight="500">
    <tspan font-weight="700">Answer Engine Optimization</tspan>
  </text>
  <text x="60" y="468" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,255,255,0.55)">
    The SEO discipline that wins citations from
  </text>
  <text x="60" y="494" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,255,255,0.55)">
    ChatGPT, Perplexity, Claude, and Gemini.
  </text>

  <!-- Engine badges -->
  <g transform="translate(60, 528)">
    <rect x="0" y="0" width="86" height="34" rx="0" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="43" y="22" font-family="Courier New, monospace" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle" font-weight="700">CHATGPT</text>

    <rect x="96" y="0" width="106" height="34" rx="0" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="149" y="22" font-family="Courier New, monospace" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle" font-weight="700">PERPLEXITY</text>

    <rect x="212" y="0" width="76" height="34" rx="0" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="250" y="22" font-family="Courier New, monospace" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle" font-weight="700">CLAUDE</text>

    <rect x="298" y="0" width="76" height="34" rx="0" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="336" y="22" font-family="Courier New, monospace" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle" font-weight="700">GEMINI</text>
  </g>

  <!-- Right side — Acronym breakdown card -->
  <g transform="translate(740, 110)">
    <rect x="0" y="0" width="400" height="430" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <!-- Header -->
    <rect x="0" y="0" width="400" height="46" fill="rgba(255,106,0,0.08)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
    <text x="20" y="30" font-family="Courier New, monospace" font-size="11" fill="#FF6A00" font-weight="700" letter-spacing="2">ACRONYM // BREAKDOWN</text>

    <!-- A -->
    <text x="30" y="110" font-family="Space Grotesk, system-ui, sans-serif" font-size="56" fill="#FF6A00" font-weight="900">A</text>
    <text x="100" y="92" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)" font-weight="600" letter-spacing="1.5">ANSWER</text>
    <text x="100" y="116" font-family="system-ui, sans-serif" font-size="15" fill="rgba(255,255,255,0.85)">The output the user receives</text>
    <line x1="20" y1="138" x2="380" y2="138" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- E -->
    <text x="30" y="200" font-family="Space Grotesk, system-ui, sans-serif" font-size="56" fill="#FF6A00" font-weight="900">E</text>
    <text x="100" y="182" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)" font-weight="600" letter-spacing="1.5">ENGINE</text>
    <text x="100" y="206" font-family="system-ui, sans-serif" font-size="15" fill="rgba(255,255,255,0.85)">The LLM doing the answering</text>
    <line x1="20" y1="228" x2="380" y2="228" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- O -->
    <text x="30" y="290" font-family="Space Grotesk, system-ui, sans-serif" font-size="56" fill="#FF6A00" font-weight="900">O</text>
    <text x="100" y="272" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)" font-weight="600" letter-spacing="1.5">OPTIMIZATION</text>
    <text x="100" y="296" font-family="system-ui, sans-serif" font-size="15" fill="rgba(255,255,255,0.85)">Structuring content to win citations</text>
    <line x1="20" y1="318" x2="380" y2="318" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Bottom stat -->
    <text x="20" y="350" font-family="Courier New, monospace" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600" letter-spacing="1.5">CITATION PREMIUM</text>
    <text x="20" y="395" font-family="Space Grotesk, system-ui, sans-serif" font-size="44" fill="#FF6A00" font-weight="900" filter="url(#glowM)">+57%</text>
    <text x="170" y="392" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.6)">Definition-first content</text>
    <text x="170" y="410" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">(Zhang et al., 2026)</text>
  </g>

  <!-- Brand mark bottom right -->
  <g transform="translate(940, 588)">
    <circle cx="10" cy="0" r="6" fill="#FF6A00" filter="url(#glowM)"/>
    <text x="26" y="5" font-family="Space Grotesk, system-ui, sans-serif" font-size="16" fill="#ffffff" font-weight="700">THE ANSWER ENGINE</text>
  </g>
</svg>
