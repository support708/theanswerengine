<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgAAR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#131313;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#0f0f10;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a0d05;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="orangeGradAAR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F27D24;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#cc5500;stop-opacity:1"/>
    </linearGradient>
    <filter id="glowAAR"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="gridAAR" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(242,125,36,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgAAR)"/>
  <rect width="1200" height="630" fill="url(#gridAAR)"/>

  <!-- Voice waves emanating from left -->
  <g opacity="0.5" filter="url(#glowAAR)">
    <circle cx="180" cy="315" r="40" fill="none" stroke="#F27D24" stroke-width="2"/>
    <circle cx="180" cy="315" r="85" fill="none" stroke="#F27D24" stroke-width="1.5" opacity="0.6"/>
    <circle cx="180" cy="315" r="135" fill="none" stroke="#F27D24" stroke-width="1" opacity="0.4"/>
    <circle cx="180" cy="315" r="190" fill="none" stroke="#F27D24" stroke-width="1" opacity="0.25"/>
  </g>

  <!-- Microphone/voice center icon -->
  <g transform="translate(180,315)">
    <rect x="-12" y="-30" width="24" height="40" rx="12" fill="#F27D24"/>
    <path d="M -20 5 Q -20 25 0 25 Q 20 25 20 5" fill="none" stroke="#F27D24" stroke-width="3"/>
    <line x1="0" y1="25" x2="0" y2="40" stroke="#F27D24" stroke-width="3"/>
    <line x1="-12" y1="40" x2="12" y2="40" stroke="#F27D24" stroke-width="3"/>
  </g>

  <!-- House icons on right side - representing real estate agent pool -->
  <g opacity="0.85" filter="url(#glowAAR)">
    <!-- House 1 -->
    <g transform="translate(820,180)">
      <polygon points="0,30 40,0 80,30 80,75 0,75" fill="none" stroke="#F27D24" stroke-width="2"/>
      <rect x="32" y="50" width="16" height="25" fill="#F27D24" opacity="0.3"/>
    </g>
    <!-- House 2 (highlighted/named) -->
    <g transform="translate(940,260)">
      <polygon points="0,40 55,0 110,40 110,100 0,100" fill="rgba(242,125,36,0.15)" stroke="#F27D24" stroke-width="3"/>
      <rect x="42" y="65" width="26" height="35" fill="#F27D24"/>
      <circle cx="55" cy="-15" r="8" fill="#F27D24"/>
      <text x="55" y="-10" font-family="Courier New, monospace" font-size="11" fill="#131313" text-anchor="middle" font-weight="900">★</text>
    </g>
    <!-- House 3 -->
    <g transform="translate(1080,180)">
      <polygon points="0,30 40,0 80,30 80,75 0,75" fill="none" stroke="#F27D24" stroke-width="2" opacity="0.6"/>
      <rect x="32" y="50" width="16" height="25" fill="#F27D24" opacity="0.2"/>
    </g>
    <!-- House 4 -->
    <g transform="translate(820,400)">
      <polygon points="0,30 40,0 80,30 80,75 0,75" fill="none" stroke="#F27D24" stroke-width="2" opacity="0.5"/>
    </g>
    <!-- House 5 -->
    <g transform="translate(1080,400)">
      <polygon points="0,30 40,0 80,30 80,75 0,75" fill="none" stroke="#F27D24" stroke-width="2" opacity="0.5"/>
    </g>
  </g>

  <!-- Connection lines voice -> agent pool -->
  <g opacity="0.3">
    <line x1="280" y1="315" x2="820" y2="220" stroke="#F27D24" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="280" y1="315" x2="940" y2="310" stroke="#F27D24" stroke-width="2"/>
    <line x1="280" y1="315" x2="1080" y2="220" stroke="#F27D24" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="280" y1="315" x2="820" y2="440" stroke="#F27D24" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="280" y1="315" x2="1080" y2="440" stroke="#F27D24" stroke-width="1" stroke-dasharray="4,4"/>
  </g>

  <!-- Terminal label top-left -->
  <g font-family="Courier New, monospace" font-size="14" fill="#F27D24" opacity="0.7">
    <text x="60" y="80">&gt; voice_ai/alexa_plus :: real_estate_agent_resolver</text>
  </g>

  <!-- Main title -->
  <g font-family="Space Grotesk, Helvetica, sans-serif" font-weight="900" fill="#e5e2e1">
    <text x="60" y="540" font-size="50" letter-spacing="-2">HOW ALEXA+ FINDS</text>
    <text x="60" y="595" font-size="50" letter-spacing="-2" fill="#F27D24">REAL ESTATE AGENTS</text>
  </g>

  <!-- Bottom badge -->
  <g font-family="Courier New, monospace" font-size="11" fill="rgba(229,226,225,0.55)">
    <text x="1140" y="600" text-anchor="end">THEANSWERENGINE.AI</text>
  </g>

  <!-- Partner stack labels -->
  <g font-family="Courier New, monospace" font-size="10" fill="#F27D24" opacity="0.8">
    <text x="860" y="170">REALTOR.COM</text>
    <text x="1100" y="170" text-anchor="end">YELP</text>
    <text x="860" y="495">ZILLOW</text>
    <text x="1100" y="495" text-anchor="end">SQUARE</text>
  </g>

</svg>
