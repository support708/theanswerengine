<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Personal Injury Law Firm Content Strategy for AI Search — The Answer Engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131313"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F27D24"/>
      <stop offset="100%" stop-color="#cc5500"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F27D24" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#F27D24" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#F27D24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient glows -->
  <ellipse cx="950" cy="180" rx="520" ry="320" fill="url(#glow)"/>
  <ellipse cx="200" cy="500" rx="380" ry="240" fill="url(#glow)" opacity="0.6"/>

  <!-- Right-side content pyramid visualization -->
  <g transform="translate(880,150)" opacity="0.95">
    <!-- Pyramid - 5 layers narrowing upward -->
    <!-- Layer 5 (apex) -->
    <rect x="-40" y="0" width="80" height="36" fill="#0a0a0a" stroke="#F27D24" stroke-width="2.5"/>
    <text x="0" y="22" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#F27D24" text-anchor="middle" letter-spacing="1.5">APEX</text>

    <!-- Layer 4 -->
    <rect x="-80" y="46" width="160" height="40" fill="#0a0a0a" stroke="#F27D24" stroke-width="2" stroke-opacity="0.85"/>
    <text x="0" y="71" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#e5e2e1" text-anchor="middle" letter-spacing="1">COMPARE</text>

    <!-- Layer 3 -->
    <rect x="-120" y="96" width="240" height="44" fill="#0a0a0a" stroke="#F27D24" stroke-width="2" stroke-opacity="0.75"/>
    <text x="0" y="123" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#e5e2e1" text-anchor="middle" letter-spacing="1">JURISDICTION</text>

    <!-- Layer 2 -->
    <rect x="-160" y="150" width="320" height="48" fill="#0a0a0a" stroke="#F27D24" stroke-width="2" stroke-opacity="0.65"/>
    <text x="0" y="180" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#e5e2e1" text-anchor="middle" letter-spacing="1">QUESTION CLUSTER</text>

    <!-- Layer 1 (base) -->
    <rect x="-200" y="208" width="400" height="52" fill="#0a0a0a" stroke="#F27D24" stroke-width="2" stroke-opacity="0.55"/>
    <text x="0" y="240" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#e5e2e1" text-anchor="middle" letter-spacing="1">FOUNDATION HUB</text>

    <!-- Citation arrows -->
    <g stroke="#F27D24" stroke-width="2" fill="none" opacity="0.5">
      <path d="M -240 234 L -290 234" marker-end="url(#arrow)"/>
      <path d="M -200 178 L -250 178" marker-end="url(#arrow)"/>
      <path d="M -160 122 L -210 122" marker-end="url(#arrow)"/>
      <path d="M -120 68 L -170 68" marker-end="url(#arrow)"/>
      <path d="M -80 18 L -130 18" marker-end="url(#arrow)"/>
    </g>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F27D24"/>
    </marker>
  </defs>

  <!-- TAE wordmark top-left -->
  <g transform="translate(60,60)">
    <rect x="0" y="0" width="6" height="36" fill="url(#orange)"/>
    <text x="18" y="18" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="900" fill="#F27D24" letter-spacing="2">THE ANSWER ENGINE</text>
    <text x="18" y="34" font-family="Courier New, monospace" font-size="11" fill="#e5e2e1" opacity="0.6" letter-spacing="1">theanswerengine.ai</text>
  </g>

  <!-- Category tag -->
  <g transform="translate(60,140)">
    <rect x="0" y="0" width="200" height="28" fill="#F27D24" fill-opacity="0.1" stroke="#F27D24" stroke-opacity="0.4" stroke-width="1"/>
    <text x="14" y="19" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#F27D24" letter-spacing="2">INDUSTRY STRATEGY</text>
  </g>

  <!-- Main title -->
  <g transform="translate(60,200)">
    <text font-family="Space Grotesk, sans-serif" font-size="52" font-weight="900" fill="#e5e2e1" letter-spacing="-2">
      <tspan x="0" y="0">PERSONAL INJURY</tspan>
      <tspan x="0" y="58">LAW FIRM</tspan>
      <tspan x="0" y="116" fill="#F27D24">CONTENT STRATEGY</tspan>
      <tspan x="0" y="174">FOR AI SEARCH</tspan>
    </text>
  </g>

  <!-- Subtitle / proof bar -->
  <g transform="translate(60,540)">
    <text font-family="Courier New, monospace" font-size="14" fill="#e5e2e1" opacity="0.7" letter-spacing="1">
      <tspan x="0" y="0">CITATIONS · CHATGPT · PERPLEXITY · CLAUDE · GOOGLE AI</tspan>
    </text>
    <line x1="0" y1="14" x2="640" y2="14" stroke="#F27D24" stroke-width="2" stroke-opacity="0.6"/>
    <text x="0" y="42" font-family="Courier New, monospace" font-size="12" fill="#F27D24" letter-spacing="2" font-weight="700">ONE PI FIRM PER MARKET · TERRITORY LOCK</text>
  </g>
</svg>
