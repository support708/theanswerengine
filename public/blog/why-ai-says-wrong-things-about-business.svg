<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgWAIS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b0d0d"/>
      <stop offset="50%" stop-color="#0F1117"/>
      <stop offset="100%" stop-color="#0F1117"/>
    </linearGradient>
    <linearGradient id="glowWAIS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF6A00" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="panelWAIS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#12121c"/>
    </linearGradient>
    <linearGradient id="chatBgWAIS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e2f"/>
      <stop offset="100%" stop-color="#15151f"/>
    </linearGradient>
    <linearGradient id="redGlowWAIS" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3333" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff3333" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="textGlowWAIS" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlowWAIS" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
    <filter id="warnGlowWAIS" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="panelClipWAIS">
      <rect x="0" y="0" width="470" height="470" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgWAIS)"/>

  <!-- Grid lines -->
  <line x1="0" y1="90" x2="1200" y2="90" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="0" y1="180" x2="1200" y2="180" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="0" y1="270" x2="1200" y2="270" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="0" y1="360" x2="1200" y2="360" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="0" y1="540" x2="1200" y2="540" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-opacity="0.05" stroke-width="1"/>

  <!-- LEFT SIDE: Text Content -->
  <!-- Category pill -->
  <rect x="40" y="80" width="230" height="32" rx="16" fill="#FF6A00" fill-opacity="0.12" stroke="#FF6A00" stroke-opacity="0.35" stroke-width="1"/>
  <text x="155" y="101" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="1.5">BUSINESS PAIN POINTS</text>

  <!-- Title: 3 lines -->
  <text x="40" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="white">Why AI Says</text>
  <text x="40" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="white">Wrong Things</text>
  <text x="40" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="url(#glowWAIS)" filter="url(#textGlowWAIS)">About Your Business</text>

  <!-- Subtitle -->
  <text x="40" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#9CA3AF" opacity="0.9">AI models give incorrect phone numbers 36% of</text>
  <text x="40" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#9CA3AF" opacity="0.9">the time. Wrong hours. Wrong addresses. Here is why.</text>

  <!-- Stats row -->
  <rect x="40" y="385" width="120" height="60" rx="8" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.08"/>
  <text x="100" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#FF6A00" text-anchor="middle">36%</text>
  <text x="100" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle">Wrong Phone #s</text>

  <rect x="175" y="385" width="120" height="60" rx="8" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.08"/>
  <text x="235" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#FF6A00" text-anchor="middle">$67.4B</text>
  <text x="235" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle">Global AI Error Cost</text>

  <rect x="310" y="385" width="120" height="60" rx="8" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.08"/>
  <text x="370" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#FF6A00" text-anchor="middle">93%</text>
  <text x="370" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle">Frustrated Users</text>

  <rect x="445" y="385" width="120" height="60" rx="8" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.08"/>
  <text x="505" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#FF6A00" text-anchor="middle">9.2%</text>
  <text x="505" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle">Hallucination Rate</text>

  <!-- RIGHT PANEL: Browser Mockup with AI Chat -->
  <g transform="translate(660,45)">
    <!-- Panel background -->
    <rect width="470" height="470" rx="16" fill="url(#panelWAIS)" stroke="white" stroke-opacity="0.1" stroke-width="1"/>

    <!-- Browser chrome bar -->
    <rect width="470" height="40" rx="16" fill="#1a1a28"/>
    <rect y="16" width="470" height="24" fill="#1a1a28"/>
    <!-- Traffic lights -->
    <circle cx="20" cy="20" r="5" fill="#ff5f57"/>
    <circle cx="38" cy="20" r="5" fill="#febc2e"/>
    <circle cx="56" cy="20" r="5" fill="#28c840"/>
    <!-- URL bar -->
    <rect x="80" y="10" width="310" height="20" rx="4" fill="white" fill-opacity="0.06"/>
    <text x="95" y="24" font-family="monospace" font-size="10" fill="#666">ai-assistant.chat/search</text>

    <!-- Chat area background -->
    <rect x="12" y="48" width="446" height="410" rx="10" fill="url(#chatBgWAIS)"/>

    <!-- AI assistant header -->
    <rect x="24" y="60" width="422" height="36" rx="6" fill="white" fill-opacity="0.03"/>
    <circle cx="44" cy="78" r="10" fill="#6366f1"/>
    <text x="42" y="82" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">AI</text>
    <text x="62" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="white">AI Search Assistant</text>
    <circle cx="420" cy="78" r="4" fill="#28c840"/>

    <!-- User question bubble -->
    <rect x="140" y="110" width="300" height="36" rx="12" fill="#FF6A00" fill-opacity="0.15" stroke="#FF6A00" stroke-opacity="0.3"/>
    <text x="160" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="white" font-weight="500">Best plumber near me?</text>

    <!-- AI response bubble -->
    <rect x="24" y="160" width="380" height="270" rx="12" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.08"/>

    <!-- AI avatar in response -->
    <circle cx="44" cy="180" r="8" fill="#6366f1" opacity="0.7"/>
    <text x="44" y="184" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="white" text-anchor="middle">AI</text>
    <text x="58" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9CA3AF">AI Search Assistant</text>

    <!-- Response text: Business name -->
    <text x="40" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="white">Acme Plumbing Services</text>
    <text x="40" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9CA3AF">Highly rated local plumber. Here are the details:</text>

    <!-- Wrong phone - red highlight -->
    <rect x="36" y="242" width="356" height="30" rx="6" fill="url(#redGlowWAIS)" stroke="#ff3333" stroke-opacity="0.4" stroke-width="1"/>
    <text x="48" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9CA3AF">Phone:</text>
    <text x="88" y="260" font-family="monospace" font-size="12" fill="#ff6666" font-weight="600">(555) 867-5309</text>
    <!-- Warning icon -->
    <g transform="translate(350, 249)" filter="url(#warnGlowWAIS)">
      <polygon points="10,0 20,18 0,18" fill="none" stroke="#ff3333" stroke-width="1.5"/>
      <text x="10" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ff3333" text-anchor="middle">!</text>
    </g>
    <text x="268" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#ff3333" font-weight="600">WRONG NUMBER</text>

    <!-- Wrong hours - red highlight -->
    <rect x="36" y="280" width="356" height="30" rx="6" fill="url(#redGlowWAIS)" stroke="#ff3333" stroke-opacity="0.4" stroke-width="1"/>
    <text x="48" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9CA3AF">Hours:</text>
    <text x="88" y="298" font-family="monospace" font-size="12" fill="#ff6666" font-weight="600">Mon-Fri 9am-5pm</text>
    <g transform="translate(350, 287)" filter="url(#warnGlowWAIS)">
      <polygon points="10,0 20,18 0,18" fill="none" stroke="#ff3333" stroke-width="1.5"/>
      <text x="10" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ff3333" text-anchor="middle">!</text>
    </g>
    <text x="268" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#ff3333" font-weight="600">WRONG HOURS</text>

    <!-- Wrong address - red highlight -->
    <rect x="36" y="318" width="356" height="30" rx="6" fill="url(#redGlowWAIS)" stroke="#ff3333" stroke-opacity="0.4" stroke-width="1"/>
    <text x="48" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9CA3AF">Address:</text>
    <text x="100" y="336" font-family="monospace" font-size="12" fill="#ff6666" font-weight="600">742 Evergreen Terrace</text>
    <g transform="translate(350, 325)" filter="url(#warnGlowWAIS)">
      <polygon points="10,0 20,18 0,18" fill="none" stroke="#ff3333" stroke-width="1.5"/>
      <text x="10" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ff3333" text-anchor="middle">!</text>
    </g>
    <text x="262" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#ff3333" font-weight="600">WRONG ADDRESS</text>

    <!-- Confidence indicator (ironic) -->
    <rect x="36" y="360" width="356" height="24" rx="4" fill="white" fill-opacity="0.03"/>
    <text x="48" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4ade80">Confidence: 94%</text>
    <rect x="140" y="368" width="100" height="6" rx="3" fill="white" fill-opacity="0.08"/>
    <rect x="140" y="368" width="94" height="6" rx="3" fill="#4ade80" opacity="0.7"/>

    <!-- Hallucinated badge -->
    <rect x="36" y="395" width="130" height="22" rx="6" fill="#ff3333" fill-opacity="0.12" stroke="#ff3333" stroke-opacity="0.4"/>
    <text x="50" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ff6666" letter-spacing="0.5">3 OF 3 DETAILS WRONG</text>
  </g>

  <!-- Footer -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="white" fill-opacity="0.25" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>

  <!-- AE circle bottom-right -->
  <circle cx="1155" cy="585" r="22" fill="#FF6A00" fill-opacity="0.12" stroke="#FF6A00" stroke-opacity="0.3"/>
  <text x="1155" y="591" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FF6A00" text-anchor="middle">AE</text>
</svg>
