<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgWTAH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b1a0d;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1b4e;stop-opacity:0.4" />
    </linearGradient>
    <filter id="glowWTAH"><feGaussianBlur stdDeviation="6" result="blurWTAH"/><feMerge><feMergeNode in="blurWTAH"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="cardBorderWTAH1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF6A00;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="cardBorderWTAH2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6488ff;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#6488ff;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="cardBorderWTAH3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="cardBorderWTAH4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="cardBorderWTAH5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgWTAH)"/>
  <!-- Grid lines -->
  <line x1="0" y1="90" x2="1200" y2="90" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="180" x2="1200" y2="180" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="315" x2="1200" y2="315" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="540" x2="1200" y2="540" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="650" y1="0" x2="650" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <!-- Decorative circles -->
  <circle cx="120" cy="480" r="60" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <circle cx="120" cy="480" r="35" stroke="rgba(255,106,0,0.04)" stroke-width="0.5" fill="none"/>
  <!-- Category pill -->
  <rect x="40" y="40" width="150" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="115" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">COMPARISONS</text>
  <!-- Title lines -->
  <text x="80" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white">What to Ask Before</text>
  <text x="80" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white">Hiring an AI</text>
  <text x="80" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#FF6A00" filter="url(#glowWTAH)">Marketing Agency</text>
  <!-- Subtitle -->
  <text x="80" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="rgba(255,255,255,0.45)">7 Questions That Separate Real Partners from Scams</text>
  <!-- Stats row -->
  <text x="80" y="390" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#FF6A00" filter="url(#glowWTAH)">74%</text>
  <text x="150" y="390" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">failure rate</text>
  <text x="260" y="390" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#FF6A00" filter="url(#glowWTAH)">$2.1B</text>
  <text x="345" y="390" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">wasted annually</text>
  <!-- Right panel: Question Checklist -->
  <g transform="translate(660, 45)">
    <rect x="0" y="0" width="470" height="470" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="235" y="28" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600">AGENCY VETTING CHECKLIST</text>
    <!-- CRITICAL badge -->
    <rect x="170" y="36" width="130" height="20" rx="10" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.5)" stroke-width="1"/>
    <text x="235" y="50" font-family="system-ui, sans-serif" font-size="9" fill="rgba(239,68,68,0.9)" text-anchor="middle" font-weight="700">CRITICAL QUESTIONS</text>
    <!-- Card 1 -->
    <rect x="15" y="68" width="440" height="70" rx="8" fill="rgba(255,255,255,0.03)" stroke="url(#cardBorderWTAH1)" stroke-width="1.5"/>
    <text x="55" y="93" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#FF6A00" filter="url(#glowWTAH)">01</text>
    <text x="90" y="93" font-family="system-ui, sans-serif" font-size="10" fill="white" font-weight="600">AI Search Tracking</text>
    <text x="90" y="108" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">Do they have dedicated AI visibility tools?</text>
    <rect x="90" y="118" width="100" height="10" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="90" y="118" width="37" height="10" rx="3" fill="rgba(255,106,0,0.5)"/>
    <text x="200" y="127" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.4)">37% of agencies pass</text>
    <!-- Card 2 -->
    <rect x="15" y="148" width="440" height="70" rx="8" fill="rgba(255,255,255,0.03)" stroke="url(#cardBorderWTAH2)" stroke-width="1.5"/>
    <text x="55" y="173" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#FF6A00" filter="url(#glowWTAH)">02</text>
    <text x="90" y="173" font-family="system-ui, sans-serif" font-size="10" fill="white" font-weight="600">Verified Case Studies</text>
    <text x="90" y="188" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">Can they show AI citation before/after?</text>
    <rect x="90" y="198" width="100" height="10" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="90" y="198" width="22" height="10" rx="3" fill="rgba(100,136,255,0.5)"/>
    <text x="200" y="207" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.4)">22% of agencies pass</text>
    <!-- Card 3 -->
    <rect x="15" y="228" width="440" height="70" rx="8" fill="rgba(255,255,255,0.03)" stroke="url(#cardBorderWTAH3)" stroke-width="1.5"/>
    <text x="55" y="253" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#FF6A00" filter="url(#glowWTAH)">03</text>
    <text x="90" y="253" font-family="system-ui, sans-serif" font-size="10" fill="white" font-weight="600">Entity Optimization</text>
    <text x="90" y="268" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">Do they build entity authority, not just links?</text>
    <rect x="350" y="243" width="90" height="20" rx="10" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.4)" stroke-width="0.8"/>
    <text x="395" y="257" font-family="system-ui, sans-serif" font-size="8" fill="rgba(34,197,94,0.9)" text-anchor="middle" font-weight="600">MUST-HAVE</text>
    <!-- Card 4 -->
    <rect x="15" y="308" width="440" height="70" rx="8" fill="rgba(255,255,255,0.03)" stroke="url(#cardBorderWTAH4)" stroke-width="1.5"/>
    <text x="55" y="333" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#FF6A00" filter="url(#glowWTAH)">04</text>
    <text x="90" y="333" font-family="system-ui, sans-serif" font-size="10" fill="white" font-weight="600">Multi-Platform Strategy</text>
    <text x="90" y="348" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">ChatGPT + Perplexity + Google AI + Claude</text>
    <rect x="350" y="323" width="90" height="20" rx="10" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.4)" stroke-width="0.8"/>
    <text x="395" y="337" font-family="system-ui, sans-serif" font-size="8" fill="rgba(245,158,11,0.9)" text-anchor="middle" font-weight="600">HIGH PRIORITY</text>
    <!-- Card 5 -->
    <rect x="15" y="388" width="440" height="70" rx="8" fill="rgba(255,255,255,0.03)" stroke="url(#cardBorderWTAH5)" stroke-width="1.5"/>
    <text x="55" y="413" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#FF6A00" filter="url(#glowWTAH)">05</text>
    <text x="90" y="413" font-family="system-ui, sans-serif" font-size="10" fill="white" font-weight="600">Transparent Reporting</text>
    <text x="90" y="428" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">AI citation metrics, not just traffic charts</text>
    <rect x="350" y="403" width="90" height="20" rx="10" fill="rgba(239,68,68,0.1)" stroke="rgba(239,68,68,0.4)" stroke-width="0.8"/>
    <text x="395" y="417" font-family="system-ui, sans-serif" font-size="8" fill="rgba(239,68,68,0.9)" text-anchor="middle" font-weight="600">DEAL BREAKER</text>
  </g>
  <!-- Footer -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <!-- AE circle -->
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>
