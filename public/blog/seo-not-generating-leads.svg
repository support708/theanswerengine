<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgSNGL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b1a0d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e0d1a;stop-opacity:1" />
    </linearGradient>
    <filter id="glowSNGL"><feGaussianBlur stdDeviation="6" result="blurSNGL"/><feMerge><feMergeNode in="blurSNGL"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgSNGL)"/>
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <!-- SEO vs AEO comparison -->
  <g transform="translate(660, 45)">
    <rect x="0" y="0" width="470" height="470" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="235" y="28" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600">LEAD SOURCE BREAKDOWN</text>
    <!-- SEO metrics (declining) -->
    <rect x="20" y="42" width="210" height="120" rx="8" fill="rgba(255,80,80,0.06)" stroke="rgba(255,80,80,0.4)" stroke-width="1.5"/>
    <text x="125" y="62" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,80,80,0.9)" text-anchor="middle" font-weight="600">SEO LEADS (TRADITIONAL)</text>
    <text x="125" y="100" font-family="system-ui, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="700">12/mo</text>
    <text x="125" y="120" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.85)" text-anchor="middle">&#x2193; Down 45% from last year</text>
    <text x="125" y="150" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">Cost per lead: $180</text>
    <!-- AI leads (growing) -->
    <rect x="240" y="42" width="210" height="120" rx="8" fill="rgba(255,106,0,0.08)" stroke="#FF6A00" stroke-width="1.5" filter="url(#glowSNGL)" stroke-opacity="0.7"/>
    <text x="345" y="62" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" text-anchor="middle" font-weight="600">AI CITATION LEADS</text>
    <text x="345" y="100" font-family="system-ui, sans-serif" font-size="24" fill="#FF6A00" text-anchor="middle" font-weight="700" filter="url(#glowSNGL)">38/mo</text>
    <text x="345" y="120" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.85)" text-anchor="middle">&#x2191; Growing 28% monthly</text>
    <text x="345" y="150" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">Cost per lead: $42</text>
    <!-- Where search traffic is going -->
    <text x="20" y="195" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">WHERE SEARCH TRAFFIC IS GOING</text>
    <!-- Bar chart -->
    <text x="20" y="225" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">Google Click</text>
    <rect x="130" y="214" width="300" height="16" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="130" y="214" width="120" height="16" rx="3" fill="rgba(255,80,80,0.5)"/>
    <text x="260" y="226" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,80,80,0.9)">&#x2193; 40%</text>
    <text x="20" y="250" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">AI Answer</text>
    <rect x="130" y="239" width="300" height="16" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="130" y="239" width="210" height="16" rx="3" fill="rgba(255,106,0,0.5)"/>
    <text x="350" y="251" font-family="system-ui, sans-serif" font-size="8" fill="#FF6A00">&#x2191; 70%</text>
    <text x="20" y="275" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">Zero-Click</text>
    <rect x="130" y="264" width="300" height="16" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="130" y="264" width="180" height="16" rx="3" fill="rgba(255,200,50,0.5)"/>
    <text x="320" y="276" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,200,50,0.9)">&#x2191; 60%</text>
    <!-- Why SEO alone fails -->
    <line x1="20" y1="295" x2="450" y2="295" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <text x="20" y="320" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">WHY SEO ALONE IS FAILING</text>
    <text x="30" y="345" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.85)">&#x2717; AI answers bypass your rankings entirely</text>
    <text x="30" y="363" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.85)">&#x2717; 65% of searches now end without a click</text>
    <text x="30" y="381" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.85)">&#x2717; Competitors getting AI citations steal your leads</text>
    <!-- Solution -->
    <rect x="20" y="400" width="430" height="55" rx="8" fill="rgba(255,106,0,0.08)" stroke="#FF6A00" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="235" y="422" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-weight="600">THE SOLUTION</text>
    <text x="235" y="442" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" text-anchor="middle" font-weight="600">SEO + AEO = Complete visibility across all channels</text>
  </g>
  <circle cx="100" cy="130" r="60" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <rect x="40" y="40" width="120" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="100" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">SEO &amp; AI</text>
  <text x="80" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Why Am I Paying</text>
  <text x="80" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">for SEO But Not</text>
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glowSNGL)">Getting Leads?</text>
  <text x="80" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">The AI Disruption Explained</text>
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>