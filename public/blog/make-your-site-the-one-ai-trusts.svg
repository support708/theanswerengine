<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgMYST" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0d3b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0d3b;stop-opacity:1" />
    </linearGradient>
    <filter id="glowMYST"><feGaussianBlur stdDeviation="6" result="blurMYST"/><feMerge><feMergeNode in="blurMYST"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoftMYST"><feGaussianBlur stdDeviation="12" result="blurSoftMYST"/><feMerge><feMergeNode in="blurSoftMYST"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="barFillMYST" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF6A00;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="panelBgMYST" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.06);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.02);stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgMYST)"/>

  <!-- Grid lines -->
  <line x1="0" y1="90" x2="1200" y2="90" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="180" x2="1200" y2="180" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="270" x2="1200" y2="270" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="360" x2="1200" y2="360" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="540" x2="1200" y2="540" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>

  <!-- Left side: Category pill -->
  <rect x="40" y="80" width="150" height="28" rx="14" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.4)" stroke-width="1"/>
  <text x="115" y="99" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="1.5">HOW-TO GUIDES</text>

  <!-- Decorative circles -->
  <circle cx="120" cy="200" r="90" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <circle cx="120" cy="200" r="55" stroke="rgba(255,106,0,0.04)" stroke-width="0.5" fill="none"/>

  <!-- Title: 3 lines -->
  <text x="40" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">Make Your Site</text>
  <text x="40" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">the One AI</text>
  <text x="40" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#FF6A00" filter="url(#glowMYST)">Trusts Most</text>

  <!-- Subtitle -->
  <text x="40" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="rgba(255,255,255,0.45)">Trust signals, authority factors, and E-E-A-T</text>
  <text x="40" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="rgba(255,255,255,0.45)">strategies for AI citation dominance</text>

  <!-- Right panel: Scoring Dashboard -->
  <g transform="translate(660,45)">
    <!-- Panel background -->
    <rect x="0" y="0" width="470" height="470" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <!-- Panel header -->
    <rect x="0" y="0" width="470" height="42" rx="16" fill="rgba(255,255,255,0.06)"/>
    <rect x="0" y="26" width="470" height="16" fill="rgba(255,255,255,0.06)"/>
    <circle cx="22" cy="20" r="5" fill="rgba(255,80,80,0.5)"/>
    <circle cx="40" cy="20" r="5" fill="rgba(255,200,50,0.5)"/>
    <circle cx="58" cy="20" r="5" fill="rgba(80,200,80,0.5)"/>
    <text x="235" y="25" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-weight="600">AI TRUST SCORE DASHBOARD</text>

    <!-- Central trust score -->
    <circle cx="235" cy="115" r="48" stroke="#FF6A00" stroke-width="3" fill="rgba(255,106,0,0.08)" filter="url(#glowMYST)"/>
    <text x="235" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#FF6A00" text-anchor="middle" filter="url(#glowMYST)">94</text>
    <text x="235" y="132" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">/100</text>

    <!-- Score arc decoration -->
    <circle cx="235" cy="115" r="56" stroke="rgba(255,106,0,0.15)" stroke-width="1" fill="none" stroke-dasharray="4,8"/>

    <!-- Label: TRUST SCORE -->
    <text x="235" y="155" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.35)" text-anchor="middle" letter-spacing="2" font-weight="600">OVERALL TRUST SCORE</text>

    <!-- Divider -->
    <line x1="30" y1="175" x2="440" y2="175" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Signal bars -->
    <!-- Bar 1: Content Quality -->
    <text x="30" y="200" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" font-weight="500">Content Quality</text>
    <text x="440" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="end" font-weight="700">96%</text>
    <rect x="30" y="208" width="410" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="30" y="208" width="394" height="6" rx="3" fill="url(#barFillMYST)"/>

    <!-- Bar 2: Schema Coverage -->
    <text x="30" y="238" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" font-weight="500">Schema Coverage</text>
    <text x="440" y="238" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="end" font-weight="700">91%</text>
    <rect x="30" y="246" width="410" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="30" y="246" width="373" height="6" rx="3" fill="url(#barFillMYST)"/>

    <!-- Bar 3: E-E-A-T Signals -->
    <text x="30" y="276" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" font-weight="500">E-E-A-T Signals</text>
    <text x="440" y="276" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="end" font-weight="700">94%</text>
    <rect x="30" y="284" width="410" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="30" y="284" width="386" height="6" rx="3" fill="url(#barFillMYST)"/>

    <!-- Bar 4: Page Speed -->
    <text x="30" y="314" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" font-weight="500">Page Speed</text>
    <text x="440" y="314" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="end" font-weight="700">88%</text>
    <rect x="30" y="322" width="410" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="30" y="322" width="361" height="6" rx="3" fill="url(#barFillMYST)"/>

    <!-- Bar 5: Crawl Access -->
    <text x="30" y="352" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" font-weight="500">Crawl Access</text>
    <text x="440" y="352" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="end" font-weight="700">97%</text>
    <rect x="30" y="360" width="410" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="30" y="360" width="398" height="6" rx="3" fill="url(#barFillMYST)"/>

    <!-- Divider -->
    <line x1="30" y1="382" x2="440" y2="382" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Trust factor checklist -->
    <text x="30" y="405" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.35)" letter-spacing="1.5" font-weight="600">TRUST FACTORS</text>
    <!-- Check 1 -->
    <circle cx="42" cy="425" r="7" fill="rgba(80,200,80,0.2)" stroke="rgba(80,200,80,0.5)" stroke-width="1"/>
    <text x="42" y="429" font-family="system-ui, sans-serif" font-size="10" fill="rgba(80,200,80,0.8)" text-anchor="middle">&#x2713;</text>
    <text x="58" y="429" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Domain Authority</text>
    <!-- Check 2 -->
    <circle cx="170" cy="425" r="7" fill="rgba(80,200,80,0.2)" stroke="rgba(80,200,80,0.5)" stroke-width="1"/>
    <text x="170" y="429" font-family="system-ui, sans-serif" font-size="10" fill="rgba(80,200,80,0.8)" text-anchor="middle">&#x2713;</text>
    <text x="186" y="429" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Backlink Diversity</text>
    <!-- Check 3 -->
    <circle cx="310" cy="425" r="7" fill="rgba(80,200,80,0.2)" stroke="rgba(80,200,80,0.5)" stroke-width="1"/>
    <text x="310" y="429" font-family="system-ui, sans-serif" font-size="10" fill="rgba(80,200,80,0.8)" text-anchor="middle">&#x2713;</text>
    <text x="326" y="429" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Fresh Content</text>
    <!-- Check 4 -->
    <circle cx="42" cy="450" r="7" fill="rgba(80,200,80,0.2)" stroke="rgba(80,200,80,0.5)" stroke-width="1"/>
    <text x="42" y="454" font-family="system-ui, sans-serif" font-size="10" fill="rgba(80,200,80,0.8)" text-anchor="middle">&#x2713;</text>
    <text x="58" y="454" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Review Signals</text>
    <!-- Check 5 -->
    <circle cx="170" cy="450" r="7" fill="rgba(80,200,80,0.2)" stroke="rgba(80,200,80,0.5)" stroke-width="1"/>
    <text x="170" y="454" font-family="system-ui, sans-serif" font-size="10" fill="rgba(80,200,80,0.8)" text-anchor="middle">&#x2713;</text>
    <text x="186" y="454" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Entity Identity</text>
    <!-- Check 6 -->
    <circle cx="310" cy="450" r="7" fill="rgba(80,200,80,0.2)" stroke="rgba(80,200,80,0.5)" stroke-width="1"/>
    <text x="310" y="454" font-family="system-ui, sans-serif" font-size="10" fill="rgba(80,200,80,0.8)" text-anchor="middle">&#x2713;</text>
    <text x="326" y="454" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">HTTPS + Speed</text>
  </g>

  <!-- Footer: THE ANSWER ENGINE -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>

  <!-- AE circle bottom-right -->
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>