<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgAIO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1424;stop-opacity:1"/>
      <stop offset="55%" style="stop-color:#0F1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2a1a08;stop-opacity:1"/>
    </linearGradient>
    <filter id="glowAIO"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoftAIO"><feGaussianBlur stdDeviation="14" result="bs"/><feMerge><feMergeNode in="bs"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowOrangeAIO"><feGaussianBlur stdDeviation="8" result="bo"/><feMerge><feMergeNode in="bo"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgAIO)"/>
  <!-- Subtle grid -->
  <g opacity="0.025" stroke="white" stroke-width="0.5">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Title block -->
  <text x="600" y="72" font-family="system-ui, sans-serif" font-size="42" font-weight="800" fill="white" text-anchor="middle">Google AI Overviews</text>
  <text x="600" y="110" font-family="system-ui, sans-serif" font-size="19" font-weight="500" fill="#FF6A00" text-anchor="middle" letter-spacing="1">How to be the cited source in 2026</text>

  <!-- AIO Box (center top) -->
  <g transform="translate(180, 148)">
    <!-- AIO container -->
    <rect x="0" y="0" width="840" height="120" rx="10" fill="rgba(255,106,0,0.08)" stroke="rgba(255,106,0,0.45)" stroke-width="1.5"/>
    <!-- AIO label badge -->
    <rect x="14" y="12" width="130" height="24" rx="12" fill="rgba(255,106,0,0.2)" stroke="#FF6A00" stroke-width="1"/>
    <text x="79" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="2">AI OVERVIEW</text>
    <!-- AIO body lines -->
    <rect x="14" y="46" width="620" height="10" rx="5" fill="rgba(255,255,255,0.14)"/>
    <rect x="14" y="62" width="530" height="10" rx="5" fill="rgba(255,255,255,0.10)"/>
    <rect x="14" y="78" width="580" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
    <rect x="14" y="94" width="440" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
    <!-- Citation bubbles on the right inside AIO -->
    <g filter="url(#glowSoftAIO)">
      <rect x="658" y="14" width="88" height="28" rx="14" fill="rgba(255,106,0,0.25)" stroke="#FF6A00" stroke-width="1.5"/>
      <text x="702" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FF6A00" text-anchor="middle">Source A</text>
      <rect x="660" y="52" width="88" height="28" rx="14" fill="rgba(255,106,0,0.18)" stroke="#FF6A00" stroke-width="1"/>
      <text x="704" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FF6A00" text-anchor="middle">Source B</text>
      <rect x="658" y="90" width="88" height="28" rx="14" fill="rgba(255,106,0,0.12)" stroke="#FF6A00" stroke-width="1"/>
      <text x="702" y="108" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FF6A00" text-anchor="middle">Source C</text>
    </g>
  </g>

  <!-- Arrow from AIO down to results -->
  <line x1="600" y1="282" x2="600" y2="320" stroke="rgba(255,106,0,0.4)" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="600,326 594,314 606,314" fill="rgba(255,106,0,0.5)"/>

  <!-- Organic results below (grayed out = bypassed) -->
  <g transform="translate(180, 336)">
    <rect x="0" y="0" width="840" height="40" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="14" y="13" width="320" height="9" rx="4" fill="rgba(255,255,255,0.08)"/>
    <rect x="14" y="26" width="200" height="7" rx="3" fill="rgba(255,255,255,0.05)"/>
    <text x="826" y="24" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.2)" text-anchor="end" font-weight="500">bypassed</text>

    <rect x="0" y="48" width="840" height="40" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect x="14" y="61" width="290" height="9" rx="4" fill="rgba(255,255,255,0.06)"/>
    <rect x="14" y="74" width="180" height="7" rx="3" fill="rgba(255,255,255,0.04)"/>
    <text x="826" y="72" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.15)" text-anchor="end" font-weight="500">bypassed</text>

    <rect x="0" y="96" width="840" height="40" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <rect x="14" y="109" width="260" height="9" rx="4" fill="rgba(255,255,255,0.05)"/>
    <rect x="14" y="122" width="160" height="7" rx="3" fill="rgba(255,255,255,0.03)"/>
    <text x="826" y="120" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.12)" text-anchor="end" font-weight="500">bypassed</text>
  </g>

  <!-- Stats strip (bottom bar) -->
  <g transform="translate(130, 520)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="200" height="64" rx="10" fill="rgba(255,106,0,0.08)" stroke="rgba(255,106,0,0.25)" stroke-width="1"/>
    <text x="100" y="26" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#FF6A00" text-anchor="middle">47%</text>
    <text x="100" y="44" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="500">of US queries trigger AIO</text>
    <text x="100" y="57" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.5)" text-anchor="middle">BrightEdge Q1 2026</text>
    <!-- Stat 2 -->
    <rect x="220" y="0" width="200" height="64" rx="10" fill="rgba(255,106,0,0.08)" stroke="rgba(255,106,0,0.25)" stroke-width="1"/>
    <text x="320" y="26" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#FF6A00" text-anchor="middle">34%</text>
    <text x="320" y="44" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="500">CTR drop — position 1</text>
    <text x="320" y="57" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.5)" text-anchor="middle">Ahrefs 2025</text>
    <!-- Stat 3 -->
    <rect x="440" y="0" width="200" height="64" rx="10" fill="rgba(255,106,0,0.08)" stroke="rgba(255,106,0,0.25)" stroke-width="1"/>
    <text x="540" y="26" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#FF6A00" text-anchor="middle">73%</text>
    <text x="540" y="44" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="500">AIO sources from top 10</text>
    <text x="540" y="57" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.5)" text-anchor="middle">SearchEngineLand</text>
    <!-- Stat 4 -->
    <rect x="660" y="0" width="200" height="64" rx="10" fill="rgba(255,106,0,0.08)" stroke="rgba(255,106,0,0.25)" stroke-width="1"/>
    <text x="760" y="26" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#FF6A00" text-anchor="middle">8.6%</text>
    <text x="760" y="44" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="500">AIO citations from Reddit</text>
    <text x="760" y="57" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.5)" text-anchor="middle">Originality.AI 2025</text>
  </g>

  <!-- Bottom strip -->
  <rect x="0" y="600" width="1200" height="30" fill="#FF6A00" opacity="0.08"/>
  <text x="600" y="620" font-family="system-ui, sans-serif" font-size="14" fill="#FF6A00" text-anchor="middle" font-weight="700" letter-spacing="3">THE ANSWER ENGINE — theanswerengine.ai</text>
</svg>
