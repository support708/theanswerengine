<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="How to Measure AEO Performance — The Answer Engine measurement protocol cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0c"/>
      <stop offset="1" stop-color="#1a1a1d"/>
    </linearGradient>
    <linearGradient id="orangeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F27D24" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F27D24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F27D24" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#F27D24" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#F27D24" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#F27D24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F27D24"/>
      <stop offset="1" stop-color="#cc5500"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#orangeFade)"/>

  <!-- Top metadata row -->
  <g font-family="Courier New, ui-monospace, monospace" font-size="14" fill="#F27D24" letter-spacing="3">
    <text x="64" y="64">AEO // MEASUREMENT PROTOCOL</text>
  </g>
  <g font-family="Courier New, ui-monospace, monospace" font-size="14" fill="rgba(229,226,225,0.45)" letter-spacing="3" text-anchor="end">
    <text x="1136" y="64">THEANSWERENGINE.AI</text>
  </g>

  <!-- Section number -->
  <g font-family="Courier New, ui-monospace, monospace" font-size="13" fill="rgba(242,125,36,0.65)" letter-spacing="4">
    <text x="64" y="190">FIELD GUIDE 11 // ELEVEN-METRIC STACK</text>
  </g>

  <!-- Title -->
  <g font-family="Inter, system-ui, sans-serif" font-weight="900" fill="#FFFFFF">
    <text x="64" y="278" font-size="86" letter-spacing="-3">HOW TO MEASURE</text>
    <text x="64" y="368" font-size="86" letter-spacing="-3" fill="#F27D24">AEO PERFORMANCE</text>
    <text x="64" y="448" font-size="38" fill="rgba(229,226,225,0.55)" letter-spacing="-1">CITATION SHARE · AERO SCORE · RETRIEVAL DEPTH</text>
    <text x="64" y="490" font-size="38" fill="rgba(229,226,225,0.55)" letter-spacing="-1">CITATION VELOCITY · COMPOUND AUTHORITY</text>
  </g>

  <!-- Mini bar-chart visual lower-left -->
  <g transform="translate(64, 530)">
    <rect x="0" y="20" width="40" height="40" fill="rgba(242,125,36,0.25)"/>
    <rect x="48" y="10" width="40" height="50" fill="rgba(242,125,36,0.45)"/>
    <rect x="96" y="0" width="40" height="60" fill="url(#barFill)"/>
    <rect x="144" y="-10" width="40" height="70" fill="#F27D24"/>
  </g>

  <!-- Bottom stat strip -->
  <g font-family="Courier New, ui-monospace, monospace" font-size="13" letter-spacing="2" fill="rgba(229,226,225,0.6)">
    <text x="280" y="600">2.1X RE-CITATION LIFT</text>
    <text x="525" y="600">·</text>
    <text x="543" y="600">7 / 30 / 90 CADENCE</text>
    <text x="780" y="600">·</text>
    <text x="798" y="600" fill="#F27D24">AERO 65+ THRESHOLD</text>
  </g>

  <!-- Right accent column -->
  <g opacity="0.85">
    <rect x="1100" y="120" width="3" height="380" fill="#F27D24"/>
    <rect x="1110" y="120" width="3" height="260" fill="rgba(242,125,36,0.4)"/>
    <rect x="1120" y="120" width="3" height="140" fill="rgba(242,125,36,0.2)"/>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#orangeFade)"/>
</svg>
