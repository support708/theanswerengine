<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131313"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F27D24"/>
      <stop offset="100%" stop-color="#cc5500"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="#F27D24"/>

  <!-- Series label -->
  <rect x="80" y="80" width="280" height="36" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="104" font-family="Courier New, monospace" font-size="14" letter-spacing="3" fill="#F27D24" font-weight="bold">AEO OPERATOR SERIES</text>

  <!-- Main title -->
  <text x="80" y="220" font-family="Space Grotesk, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-2">HOW TO OPTIMIZE</text>
  <text x="80" y="300" font-family="Space Grotesk, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-2">CONTENT FOR</text>
  <text x="80" y="380" font-family="Space Grotesk, sans-serif" font-size="76" font-weight="900" fill="url(#orangeGrad)" letter-spacing="-2">CHATGPT</text>

  <!-- Subtitle -->
  <line x1="80" y1="420" x2="200" y2="420" stroke="#F27D24" stroke-width="3"/>
  <text x="80" y="468" font-family="Inter, sans-serif" font-size="22" fill="rgba(229,226,225,0.75)" letter-spacing="0.5">The structural method for clearing the ChatGPT retrieval</text>
  <text x="80" y="498" font-family="Inter, sans-serif" font-size="22" fill="rgba(229,226,225,0.75)" letter-spacing="0.5">embedding step on customer-intent queries.</text>

  <!-- Footer signature -->
  <line x1="80" y1="556" x2="1120" y2="556" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="80" y="588" font-family="Courier New, monospace" font-size="14" fill="rgba(229,226,225,0.55)" letter-spacing="2">BY JUSTIN BORGES</text>
  <text x="80" y="610" font-family="Courier New, monospace" font-size="12" fill="rgba(229,226,225,0.4)" letter-spacing="2">THE ANSWER ENGINE · THEANSWERENGINE.AI</text>

  <!-- Right-side accent -->
  <rect x="1080" y="80" width="40" height="40" fill="none" stroke="#F27D24" stroke-width="2"/>
  <rect x="1090" y="90" width="20" height="20" fill="#F27D24"/>
  <text x="980" y="588" font-family="Courier New, monospace" font-size="12" fill="rgba(229,226,225,0.5)" text-anchor="start" letter-spacing="2">2026 · AEO</text>
</svg>
