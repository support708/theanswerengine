<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c2d12;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#431407;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative arrow/rank elements (competitors overtaking) -->
  <polygon points="950,200 970,160 990,200" fill="none" stroke="rgba(255,106,0,0.15)" stroke-width="2"/>
  <polygon points="1030,160 1050,120 1070,160" fill="none" stroke="rgba(255,106,0,0.1)" stroke-width="2"/>
  <polygon points="1100,130 1120,90 1140,130" fill="none" stroke="rgba(255,106,0,0.07)" stroke-width="2"/>
  <!-- Bar chart motif -->
  <rect x="920" y="320" width="30" height="120" rx="4" fill="rgba(255,255,255,0.04)"/>
  <rect x="960" y="280" width="30" height="160" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="1000" y="240" width="30" height="200" rx="4" fill="rgba(255,106,0,0.08)"/>
  <rect x="1040" y="300" width="30" height="140" rx="4" fill="rgba(255,255,255,0.04)"/>
  <rect x="1080" y="340" width="30" height="100" rx="4" fill="rgba(255,255,255,0.03)"/>
  <!-- Subtle horizontal lines -->
  <line x1="900" y1="440" x2="1130" y2="440" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="900" y1="360" x2="1130" y2="360" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="900" y1="280" x2="1130" y2="280" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <!-- Category badge -->
  <rect x="40" y="40" width="190" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="135" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">ChatGPT Citation Series</text>
  <!-- Title lines -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">Why ChatGPT Recommends</text>
  <text x="80" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#FF6A00">Your Competitors</text>
  <!-- Brand footer -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>