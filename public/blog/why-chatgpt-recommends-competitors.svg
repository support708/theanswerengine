<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c2d12;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#431407;stop-opacity:1" />
    </linearGradient>
    <filter id="glow4"><feGaussianBlur stdDeviation="6" result="blur4"/><feMerge><feMergeNode in="blur4"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoft4"><feGaussianBlur stdDeviation="12" result="blur4s"/><feMerge><feMergeNode in="blur4s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg4)"/>
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <!-- Split comparison: Your business vs Competitor -->
  <g transform="translate(660, 65)">
    <!-- Your business card (faded) -->
    <rect x="0" y="0" width="210" height="200" rx="10" fill="rgba(255,80,80,0.06)" stroke="rgba(255,80,80,0.4)" stroke-width="1.5"/>
    <text x="105" y="28" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,80,80,0.9)" text-anchor="middle" font-weight="600">YOUR BUSINESS</text>
    <line x1="15" y1="40" x2="195" y2="40" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <rect x="15" y="55" width="180" height="8" rx="2" fill="rgba(255,255,255,0.08)"/>
    <rect x="15" y="72" width="140" height="6" rx="2" fill="rgba(255,255,255,0.06)"/>
    <text x="15" y="105" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.85)">&#x2717; No schema markup</text>
    <text x="15" y="122" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.85)">&#x2717; Inconsistent NAP</text>
    <text x="15" y="139" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.85)">&#x2717; Generic content</text>
    <text x="15" y="156" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.85)">&#x2717; No citations</text>
    <rect x="15" y="170" width="80" height="20" rx="4" fill="rgba(255,80,80,0.15)" stroke="rgba(255,80,80,0.5)" stroke-width="1.5"/>
    <text x="55" y="184" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.9)" text-anchor="middle" font-weight="700">INVISIBLE</text>
    <!-- VS divider -->
    <text x="230" y="110" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,255,255,0.3)" text-anchor="middle" font-weight="700">VS</text>
    <!-- Competitor card (glowing) -->
    <rect x="250" y="0" width="210" height="200" rx="10" fill="rgba(255,106,0,0.08)" stroke="#FF6A00" stroke-width="2" filter="url(#glow4)" stroke-opacity="0.7"/>
    <text x="355" y="28" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" text-anchor="middle" font-weight="600">COMPETITOR</text>
    <line x1="265" y1="40" x2="445" y2="40" stroke="rgba(255,106,0,0.2)" stroke-width="0.5"/>
    <rect x="265" y="55" width="180" height="8" rx="2" fill="rgba(255,106,0,0.2)"/>
    <rect x="265" y="72" width="140" height="6" rx="2" fill="rgba(255,106,0,0.15)"/>
    <text x="265" y="105" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; Full schema markup</text>
    <text x="265" y="122" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; Consistent NAP</text>
    <text x="265" y="139" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; Expert content</text>
    <text x="265" y="156" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; 12 AI citations</text>
    <rect x="265" y="170" width="80" height="20" rx="4" fill="rgba(255,106,0,0.2)" stroke="#FF6A00" stroke-width="1.5"/>
    <text x="305" y="184" font-family="system-ui, sans-serif" font-size="9" fill="#FF6A00" text-anchor="middle" font-weight="700">CITED</text>
    <!-- Authority score comparison -->
    <rect x="0" y="220" width="460" height="75" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="230" y="245" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-weight="600">AUTHORITY SCORE</text>
    <rect x="20" y="258" width="80" height="20" rx="4" fill="rgba(255,80,80,0.2)"/>
    <text x="60" y="272" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,80,80,0.9)" text-anchor="middle" font-weight="700">2.1 / 10</text>
    <rect x="270" y="258" width="170" height="20" rx="4" fill="rgba(255,106,0,0.25)"/>
    <text x="355" y="272" font-family="system-ui, sans-serif" font-size="12" fill="#FF6A00" text-anchor="middle" font-weight="700">8.7 / 10</text>
  </g>
  <circle cx="130" cy="480" r="60" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <rect x="40" y="40" width="190" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="135" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">ChatGPT Citation Series</text>
  <text x="80" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Why ChatGPT</text>
  <text x="80" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Recommends Your</text>
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glow4)">Competitors</text>
  <text x="80" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">And Not You</text>
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>