<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg19" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b1a0d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b0d0d;stop-opacity:1" />
    </linearGradient>
    <filter id="glow19"><feGaussianBlur stdDeviation="6" result="blur19"/><feMerge><feMergeNode in="blur19"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg19)"/>
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <!-- Business card with wrong info highlighted -->
  <g transform="translate(660, 45)">
    <rect x="0" y="0" width="470" height="470" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="235" y="28" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-weight="600">AI-GENERATED BUSINESS INFO</text>
    <!-- Business card mockup -->
    <rect x="30" y="45" width="410" height="200" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="50" y="72" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" font-weight="700">Acme Plumbing Services</text>
    <text x="50" y="92" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,200,50,0.5)">&#x2605;&#x2605;&#x2605;&#x2605;&#x2606; 4.3 (52 reviews)</text>
    <!-- Wrong address - highlighted red -->
    <rect x="40" y="102" width="390" height="25" rx="4" fill="rgba(255,80,80,0.08)" stroke="rgba(255,80,80,0.3)" stroke-width="1"/>
    <text x="50" y="119" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,80,80,0.7)">&#x26A0; 456 Oak Ave (WRONG - moved 2 years ago)</text>
    <text x="420" y="119" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,80,80,0.6)" text-anchor="end">&#x2717;</text>
    <!-- Wrong phone -->
    <rect x="40" y="132" width="390" height="25" rx="4" fill="rgba(255,80,80,0.08)" stroke="rgba(255,80,80,0.3)" stroke-width="1"/>
    <text x="50" y="149" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,80,80,0.7)">&#x26A0; (555) 123-4567 (DISCONNECTED)</text>
    <text x="420" y="149" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,80,80,0.6)" text-anchor="end">&#x2717;</text>
    <!-- Wrong hours -->
    <rect x="40" y="162" width="390" height="25" rx="4" fill="rgba(255,200,50,0.06)" stroke="rgba(255,200,50,0.2)" stroke-width="1"/>
    <text x="50" y="179" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,200,50,0.6)">&#x25CB; Mon-Fri 9-5 (ACTUALLY open 7-7, inc. weekends)</text>
    <text x="420" y="179" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,200,50,0.5)" text-anchor="end">&#x25CB;</text>
    <!-- Wrong service -->
    <rect x="40" y="192" width="390" height="25" rx="4" fill="rgba(255,200,50,0.06)" stroke="rgba(255,200,50,0.2)" stroke-width="1"/>
    <text x="50" y="209" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,200,50,0.6)">&#x25CB; "Residential only" (ALSO does commercial)</text>
    <text x="420" y="209" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,200,50,0.5)" text-anchor="end">&#x25CB;</text>
    <!-- Correct info -->
    <text x="50" y="235" font-family="system-ui, sans-serif" font-size="10" fill="rgba(100,220,100,0.5)">&#x2713; Website URL: Correct</text>
    <!-- Impact section -->
    <line x1="20" y1="255" x2="450" y2="255" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
    <text x="235" y="280" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600">BUSINESS IMPACT</text>
    <!-- Impact metrics -->
    <rect x="20" y="295" width="135" height="70" rx="6" fill="rgba(255,80,80,0.06)" stroke="rgba(255,80,80,0.15)" stroke-width="1"/>
    <text x="87" y="315" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.3)" text-anchor="middle">LOST CALLS</text>
    <text x="87" y="340" font-family="system-ui, sans-serif" font-size="22" fill="rgba(255,80,80,0.7)" text-anchor="middle" font-weight="700">73%</text>
    <text x="87" y="358" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,80,80,0.5)" text-anchor="middle">wrong number</text>
    <rect x="165" y="295" width="140" height="70" rx="6" fill="rgba(255,200,50,0.06)" stroke="rgba(255,200,50,0.15)" stroke-width="1"/>
    <text x="235" y="315" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.3)" text-anchor="middle">LOST VISITS</text>
    <text x="235" y="340" font-family="system-ui, sans-serif" font-size="22" fill="rgba(255,200,50,0.7)" text-anchor="middle" font-weight="700">58%</text>
    <text x="235" y="358" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,200,50,0.5)" text-anchor="middle">wrong address</text>
    <rect x="315" y="295" width="135" height="70" rx="6" fill="rgba(255,106,0,0.06)" stroke="rgba(255,106,0,0.15)" stroke-width="1"/>
    <text x="382" y="315" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.3)" text-anchor="middle">TRUST DAMAGE</text>
    <text x="382" y="340" font-family="system-ui, sans-serif" font-size="22" fill="#FF6A00" text-anchor="middle" font-weight="700">89%</text>
    <text x="382" y="358" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,106,0,0.5)" text-anchor="middle">won't try again</text>
    <!-- Fix it CTA -->
    <rect x="60" y="385" width="350" height="70" rx="8" fill="rgba(255,106,0,0.08)" stroke="rgba(255,106,0,0.25)" stroke-width="1"/>
    <text x="235" y="410" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600">THE FIX</text>
    <text x="235" y="430" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.6)" text-anchor="middle">Claim Bing Places + deploy schema + fix NAP consistency</text>
    <text x="235" y="448" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.3)" text-anchor="middle">AI will self-correct within 2-4 weeks of data updates.</text>
  </g>
  <circle cx="100" cy="130" r="60" stroke="rgba(255,106,0,0.05)" stroke-width="0.5" fill="none"/>
  <rect x="40" y="40" width="180" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="130" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">AI Accuracy Series</text>
  <text x="80" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">When AI Search</text>
  <text x="80" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Gets Your Biz</text>
  <text x="80" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glow19)">Wrong</text>
  <text x="80" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">The Cost of Bad AI Data</text>
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
