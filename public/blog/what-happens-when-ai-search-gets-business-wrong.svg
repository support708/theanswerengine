    <text x="40" y="385" font-family="system-ui, sans-serif" font-size="11" fill="rgba(100,220,100,0.8)">&#x2713; Deploy schema markup with correct NAP</text>
    <text x="40" y="405" font-family="system-ui, sans-serif" font-size="11" fill="rgba(100,220,100,0.8)">&#x2713; Fix directory inconsistencies</text>
    <text x="40" y="420" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.35)">AI self-corrects within 2-4 weeks of data updates</text>
