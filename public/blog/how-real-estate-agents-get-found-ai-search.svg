<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgREAK" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d3b1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="panelREAK" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.06);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.02);stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barFillREAK" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF6A00;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="scoreRingREAK" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc5500;stop-opacity:0.6" />
    </linearGradient>
    <filter id="glowREAK" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blurREAK"/>
      <feMerge><feMergeNode in="blurREAK"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlowREAK" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="bigBlurREAK"/>
      <feMerge><feMergeNode in="bigBlurREAK"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlowREAK" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="tgREAK"/>
      <feMerge><feMergeNode in="tgREAK"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgREAK)"/>

  <!-- Grid lines at 0.05 opacity -->
  <g opacity="0.05">
    <line x1="0" y1="90" x2="1200" y2="90" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="0" y1="450" x2="1200" y2="450" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="170" y1="0" x2="170" y2="630" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="340" y1="0" x2="340" y2="630" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="510" y1="0" x2="510" y2="630" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="680" y1="0" x2="680" y2="630" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="850" y1="0" x2="850" y2="630" stroke="#FF6A00" stroke-width="0.5"/>
    <line x1="1020" y1="0" x2="1020" y2="630" stroke="#FF6A00" stroke-width="0.5"/>
  </g>

  <!-- Corner tint glow -->
  <circle cx="0" cy="0" r="300" fill="#0d3b1a" opacity="0.3" filter="url(#bigGlowREAK)"/>

  <!-- LEFT SIDE: Category + Title + Subtitle -->
  <!-- Category pill -->
  <rect x="40" y="55" width="155" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.35)" stroke-width="1"/>
  <text x="117" y="77" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#FF6A00" text-anchor="middle" letter-spacing="1.5">INDUSTRY GUIDES</text>

  <!-- Title: 3 lines, last line orange with glow -->
  <text x="50" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">How Real Estate</text>
  <text x="50" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Agents Get Found on</text>
  <text x="50" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#textGlowREAK)">AI Search</text>

  <!-- Subtitle -->
  <text x="50" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="rgba(255,255,255,0.45)">82% of homebuyers now use AI for housing research.</text>
  <text x="50" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="rgba(255,255,255,0.35)">Is AI recommending you, or your competitors?</text>

  <!-- Decorative house silhouette -->
  <g opacity="0.04" transform="translate(120, 420)">
    <polygon points="100,0 0,60 20,60 20,100 80,100 80,60 100,60 200,60 180,100 200,100 200,60" stroke="white" stroke-width="2.5" fill="none"/>
    <rect x="40" y="70" width="25" height="30" stroke="white" stroke-width="2" fill="none"/>
    <rect x="135" y="70" width="25" height="30" stroke="white" stroke-width="2" fill="none"/>
    <rect x="80" y="65" width="40" height="35" stroke="white" stroke-width="2" fill="none"/>
  </g>

  <!-- RIGHT PANEL: Scoring Dashboard -->
  <g transform="translate(660,45)">
    <!-- Panel background -->
    <rect x="0" y="0" width="470" height="470" rx="16" fill="url(#panelREAK)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <!-- Panel header -->
    <rect x="0" y="0" width="470" height="44" rx="16" fill="rgba(255,255,255,0.04)"/>
    <rect x="0" y="28" width="470" height="16" fill="rgba(255,255,255,0.04)"/>
    <circle cx="20" cy="22" r="5" fill="rgba(255,80,80,0.5)"/>
    <circle cx="38" cy="22" r="5" fill="rgba(255,200,50,0.5)"/>
    <circle cx="56" cy="22" r="5" fill="rgba(80,200,80,0.5)"/>
    <text x="235" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)" text-anchor="middle" letter-spacing="1">AGENT AI READINESS</text>

    <!-- Central score circle -->
    <circle cx="115" cy="115" r="50" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="6" transform="translate(0,50)"/>
    <circle cx="115" cy="115" r="50" fill="none" stroke="url(#scoreRingREAK)" stroke-width="6" stroke-dasharray="210 314" stroke-linecap="round" transform="translate(0,50) rotate(-90 115 115)"/>
    <text x="115" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="white" text-anchor="middle">67</text>
    <text x="115" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="0.5">AI READINESS</text>
    <text x="115" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#FF6A00" text-anchor="middle">NEEDS WORK</text>

    <!-- 5 Signal bars -->
    <g transform="translate(240, 62)">
      <!-- Local Content Depth -->
      <text x="0" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.55)">Local Content Depth</text>
      <rect x="0" y="18" width="190" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
      <rect x="0" y="18" width="76" height="6" rx="3" fill="url(#barFillREAK)" opacity="0.5"/>
      <text x="196" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#FF6A00">40%</text>

      <!-- Review Visibility -->
      <text x="0" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.55)">Review Visibility</text>
      <rect x="0" y="52" width="190" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
      <rect x="0" y="52" width="105" height="6" rx="3" fill="url(#barFillREAK)" opacity="0.5"/>
      <text x="196" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#FF6A00">55%</text>

      <!-- Schema Coverage -->
      <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.55)">Schema Coverage</text>
      <rect x="0" y="86" width="190" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
      <rect x="0" y="86" width="57" height="6" rx="3" fill="url(#barFillREAK)" opacity="0.5"/>
      <text x="196" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#FF6A00">30%</text>

      <!-- Credential Signals -->
      <text x="0" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.55)">Credential Signals</text>
      <rect x="0" y="120" width="190" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
      <rect x="0" y="120" width="143" height="6" rx="3" fill="url(#barFillREAK)" opacity="0.5"/>
      <text x="196" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#FF6A00">75%</text>

      <!-- Directory Presence -->
      <text x="0" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.55)">Directory Presence</text>
      <rect x="0" y="154" width="190" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
      <rect x="0" y="154" width="124" height="6" rx="3" fill="url(#barFillREAK)" opacity="0.5"/>
      <text x="196" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#FF6A00">65%</text>
    </g>

    <!-- Divider -->
    <line x1="20" y1="240" x2="450" y2="240" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Checklist: Real estate-specific items -->
    <g transform="translate(28, 255)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.35)" letter-spacing="1" font-weight="600">OPTIMIZATION CHECKLIST</text>

      <!-- Item 1: Check -->
      <rect x="0" y="14" width="16" height="16" rx="3" fill="rgba(255,106,0,0.2)" stroke="#FF6A00" stroke-width="0.8"/>
      <text x="8" y="27" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle">&#x2713;</text>
      <text x="24" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Agent bio with credentials + years</text>

      <!-- Item 2: Check -->
      <rect x="0" y="38" width="16" height="16" rx="3" fill="rgba(255,106,0,0.2)" stroke="#FF6A00" stroke-width="0.8"/>
      <text x="8" y="51" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle">&#x2713;</text>
      <text x="24" y="51" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Neighborhood pages with market data</text>

      <!-- Item 3: Check -->
      <rect x="0" y="62" width="16" height="16" rx="3" fill="rgba(255,106,0,0.2)" stroke="#FF6A00" stroke-width="0.8"/>
      <text x="8" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle">&#x2713;</text>
      <text x="24" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Monthly market reports on own site</text>

      <!-- Item 4: Empty -->
      <rect x="0" y="86" width="16" height="16" rx="3" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
      <text x="24" y="99" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)">Client testimonials (plain HTML on site)</text>

      <!-- Item 5: Empty -->
      <rect x="0" y="110" width="16" height="16" rx="3" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
      <text x="24" y="123" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)">RealEstateAgent schema on all pages</text>

      <!-- Item 6: Empty -->
      <rect x="0" y="134" width="16" height="16" rx="3" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
      <text x="24" y="147" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)">AI-crawlable directory profiles</text>

      <!-- Item 7: Empty -->
      <rect x="0" y="158" width="16" height="16" rx="3" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
      <text x="24" y="171" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)">Content refresh cadence (monthly+)</text>
    </g>

    <!-- Score breakdown labels -->
    <g transform="translate(255, 255)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.35)" letter-spacing="1" font-weight="600">MARKET SIGNALS</text>

      <!-- Mini stat boxes -->
      <rect x="0" y="14" width="90" height="50" rx="6" fill="rgba(255,106,0,0.06)" stroke="rgba(255,106,0,0.15)" stroke-width="0.8"/>
      <text x="45" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#FF6A00" text-anchor="middle" filter="url(#glowREAK)">82%</text>
      <text x="45" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="rgba(255,255,255,0.35)" text-anchor="middle">Use AI for RE</text>

      <rect x="100" y="14" width="90" height="50" rx="6" fill="rgba(255,106,0,0.06)" stroke="rgba(255,106,0,0.15)" stroke-width="0.8"/>
      <text x="145" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#FF6A00" text-anchor="middle" filter="url(#glowREAK)">67%</text>
      <text x="145" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="rgba(255,255,255,0.35)" text-anchor="middle">ChatGPT Users</text>

      <rect x="0" y="74" width="90" height="50" rx="6" fill="rgba(255,106,0,0.06)" stroke="rgba(255,106,0,0.15)" stroke-width="0.8"/>
      <text x="45" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#FF6A00" text-anchor="middle" filter="url(#glowREAK)">87%</text>
      <text x="45" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="rgba(255,255,255,0.35)" text-anchor="middle">Agents Use AI</text>

      <rect x="100" y="74" width="90" height="50" rx="6" fill="rgba(255,106,0,0.06)" stroke="rgba(255,106,0,0.15)" stroke-width="0.8"/>
      <text x="145" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#FF6A00" text-anchor="middle" filter="url(#glowREAK)">46%</text>
      <text x="145" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="rgba(255,255,255,0.35)" text-anchor="middle">Start Online</text>
    </g>
  </g>

  <!-- Footer branding -->
  <text x="600" y="585" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>

  <!-- AE circle bottom-right -->
  <circle cx="1130" cy="590" r="28" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="1130" y="597" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>
