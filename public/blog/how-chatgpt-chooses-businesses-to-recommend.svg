<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d3b3b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#134e4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative branching lines (algorithm/decision tree motif) -->
  <line x1="900" y1="80" x2="1000" y2="160" stroke="rgba(255,106,0,0.1)" stroke-width="2"/>
  <line x1="1000" y1="160" x2="1100" y2="120" stroke="rgba(255,106,0,0.08)" stroke-width="2"/>
  <line x1="1000" y1="160" x2="1080" y2="260" stroke="rgba(255,106,0,0.08)" stroke-width="2"/>
  <line x1="1080" y1="260" x2="1140" y2="220" stroke="rgba(255,106,0,0.06)" stroke-width="1.5"/>
  <line x1="1080" y1="260" x2="1150" y2="340" stroke="rgba(255,106,0,0.06)" stroke-width="1.5"/>
  <circle cx="900" cy="80" r="6" fill="rgba(255,106,0,0.15)"/>
  <circle cx="1000" cy="160" r="6" fill="rgba(255,106,0,0.12)"/>
  <circle cx="1100" cy="120" r="5" fill="rgba(255,106,0,0.1)"/>
  <circle cx="1080" cy="260" r="5" fill="rgba(255,106,0,0.1)"/>
  <circle cx="1140" cy="220" r="4" fill="rgba(255,106,0,0.08)"/>
  <circle cx="1150" cy="340" r="4" fill="rgba(255,106,0,0.08)"/>
  <!-- Large decorative circle -->
  <circle cx="1050" cy="450" r="140" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <circle cx="1050" cy="450" r="100" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <!-- Category badge -->
  <rect x="40" y="40" width="170" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="125" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">AI Algorithm Series</text>
  <!-- Title lines -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">How ChatGPT Chooses</text>
  <text x="80" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">Which Businesses</text>
  <text x="80" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#FF6A00">To Recommend</text>
  <!-- Brand footer -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>