<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="60%" stop-color="#131313"/>
      <stop offset="100%" stop-color="#1a0d05"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FF6A00" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FF6A00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orangeLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF6A00" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF6A00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF6A00" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="900" cy="200" r="320" fill="url(#glow)"/>

  <!-- Grid -->
  <g opacity="0.16" stroke="#FF6A00" stroke-width="1" fill="none">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>

  <!-- Four dashboard panels — the four AEO tool categories -->
  <g stroke="#FF6A00" stroke-width="1.5" fill="url(#panelGrad)" opacity="0.85">
    <rect x="180" y="140" width="180" height="120" rx="2"/>
    <rect x="400" y="140" width="180" height="120" rx="2"/>
    <rect x="620" y="140" width="180" height="120" rx="2"/>
    <rect x="840" y="140" width="180" height="120" rx="2"/>
  </g>

  <!-- Panel inner lines (mock data) -->
  <g stroke="#FF6A00" stroke-width="1" opacity="0.45" fill="none">
    <line x1="200" y1="170" x2="340" y2="170"/>
    <line x1="200" y1="190" x2="300" y2="190"/>
    <line x1="200" y1="210" x2="320" y2="210"/>
    <polyline points="200,240 230,225 260,235 290,215 320,228 340,210"/>

    <line x1="420" y1="170" x2="560" y2="170"/>
    <line x1="420" y1="190" x2="500" y2="190"/>
    <rect x="420" y="205" width="30" height="35" fill="#FF6A00" fill-opacity="0.3"/>
    <rect x="460" y="195" width="30" height="45" fill="#FF6A00" fill-opacity="0.5"/>
    <rect x="500" y="215" width="30" height="25" fill="#FF6A00" fill-opacity="0.35"/>
    <rect x="540" y="200" width="30" height="40" fill="#FF6A00" fill-opacity="0.45"/>

    <line x1="640" y1="170" x2="780" y2="170"/>
    <line x1="640" y1="190" x2="730" y2="190"/>
    <circle cx="710" cy="215" r="22" fill="none"/>
    <path d="M 710 193 A 22 22 0 0 1 730 215" stroke-width="3"/>

    <line x1="860" y1="170" x2="1000" y2="170"/>
    <line x1="860" y1="190" x2="950" y2="190"/>
    <line x1="860" y1="215" x2="1000" y2="215"/>
    <line x1="860" y1="230" x2="1000" y2="230"/>
    <line x1="860" y1="245" x2="980" y2="245"/>
  </g>

  <!-- Connecting nodes between panels -->
  <g fill="#FF6A00">
    <circle cx="270" cy="290" r="3"/>
    <circle cx="490" cy="290" r="3"/>
    <circle cx="710" cy="290" r="3"/>
    <circle cx="930" cy="290" r="3"/>
  </g>
  <g stroke="#FF6A00" stroke-width="1" opacity="0.5" fill="none">
    <path d="M 270 290 L 490 290 L 710 290 L 930 290"/>
  </g>

  <line x1="120" y1="430" x2="1080" y2="430" stroke="url(#orangeLine)" stroke-width="2"/>

  <text x="120" y="495" font-family="Space Grotesk, Arial, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="-2">
    BEST AEO TOOLS 2026
  </text>
  <text x="120" y="540" font-family="Space Grotesk, Arial, sans-serif" font-size="28" font-weight="700" fill="#FF6A00" letter-spacing="-1">
    THE FOUR-CATEGORY OPERATOR STACK
  </text>
  <text x="120" y="585" font-family="Courier New, monospace" font-size="14" font-weight="400" fill="#888888" letter-spacing="2">
    THE ANSWER ENGINE · THEANSWERENGINE.AI
  </text>
</svg>
