<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgAVS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2e1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0d3b;stop-opacity:1" />
    </linearGradient>
    <filter id="glowAVS"><feGaussianBlur stdDeviation="6" result="blurAVS"/><feMerge><feMergeNode in="blurAVS"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgAVS)"/>
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <!-- AEO vs SEO Comparison Table -->
  <g transform="translate(660, 45)">
    <rect x="0" y="0" width="470" height="470" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="235" y="28" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600">LOCAL BUSINESS COMPARISON</text>
    <!-- Column headers -->
    <rect x="20" y="42" width="135" height="35" rx="6" fill="rgba(255,255,255,0.04)"/>
    <text x="87" y="65" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600">FACTOR</text>
    <rect x="163" y="42" width="135" height="35" rx="6" fill="rgba(255,80,80,0.08)" stroke="rgba(255,80,80,0.3)" stroke-width="1"/>
    <text x="230" y="65" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,80,80,0.9)" text-anchor="middle" font-weight="600">SEO ONLY</text>
    <rect x="306" y="42" width="144" height="35" rx="6" fill="rgba(255,106,0,0.08)" stroke="#FF6A00" stroke-width="1.5" stroke-opacity="0.6" filter="url(#glowAVS)"/>
    <text x="378" y="65" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" text-anchor="middle" font-weight="700">SEO + AEO</text>
    <!-- Row 1 -->
    <text x="87" y="105" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)" text-anchor="middle">AI Citations</text>
    <text x="230" y="105" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,80,80,0.85)" text-anchor="middle" font-weight="700">0</text>
    <text x="378" y="105" font-family="system-ui, sans-serif" font-size="11" fill="rgba(100,220,100,0.9)" text-anchor="middle" font-weight="700">12+/month</text>
    <line x1="20" y1="115" x2="450" y2="115" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
    <!-- Row 2 -->
    <text x="87" y="140" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)" text-anchor="middle">Lead Cost</text>
    <text x="230" y="140" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,80,80,0.85)" text-anchor="middle" font-weight="700">$180</text>
    <text x="378" y="140" font-family="system-ui, sans-serif" font-size="11" fill="rgba(100,220,100,0.9)" text-anchor="middle" font-weight="700">$42</text>
    <line x1="20" y1="150" x2="450" y2="150" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
    <!-- Row 3 -->
    <text x="87" y="175" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)" text-anchor="middle">Voice Search</text>
    <text x="230" y="175" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,80,80,0.85)" text-anchor="middle" font-weight="700">Invisible</text>
    <text x="378" y="175" font-family="system-ui, sans-serif" font-size="11" fill="rgba(100,220,100,0.9)" text-anchor="middle" font-weight="700">Cited</text>
    <line x1="20" y1="185" x2="450" y2="185" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
    <!-- Row 4 -->
    <text x="87" y="210" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)" text-anchor="middle">Zero-Click Ready</text>
    <text x="230" y="210" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,80,80,0.85)" text-anchor="middle" font-weight="700">&#x2717;</text>
    <text x="378" y="210" font-family="system-ui, sans-serif" font-size="11" fill="rgba(100,220,100,0.9)" text-anchor="middle" font-weight="700">&#x2713;</text>
    <line x1="20" y1="220" x2="450" y2="220" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
    <!-- Row 5 -->
    <text x="87" y="245" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)" text-anchor="middle">Future-Proof</text>
    <text x="230" y="245" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,80,80,0.85)" text-anchor="middle" font-weight="700">Declining</text>
    <text x="378" y="245" font-family="system-ui, sans-serif" font-size="11" fill="rgba(100,220,100,0.9)" text-anchor="middle" font-weight="700">Growing</text>
    <!-- Lead gen comparison -->
    <line x1="20" y1="265" x2="450" y2="265" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <text x="20" y="290" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">MONTHLY LEADS (LOCAL BUSINESS AVG)</text>
    <text x="20" y="318" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.85)">SEO Only</text>
    <rect x="100" y="307" width="330" height="16" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="100" y="307" width="80" height="16" rx="3" fill="rgba(255,80,80,0.5)"/>
    <text x="190" y="319" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.9)" font-weight="700">8</text>
    <text x="20" y="343" font-family="system-ui, sans-serif" font-size="9" fill="#FF6A00">SEO + AEO</text>
    <rect x="100" y="332" width="330" height="16" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="100" y="332" width="290" height="16" rx="3" fill="rgba(255,106,0,0.5)"/>
    <text x="400" y="344" font-family="system-ui, sans-serif" font-size="9" fill="#FF6A00" font-weight="700">32</text>
    <!-- Lift badge -->
    <rect x="300" y="355" width="130" height="22" rx="6" fill="rgba(255,106,0,0.2)" stroke="#FF6A00" stroke-width="1.5"/>
    <text x="365" y="370" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" text-anchor="middle" font-weight="700">+300% MORE LEADS</text>
    <!-- Bottom verdict -->
    <rect x="20" y="390" width="430" height="65" rx="8" fill="rgba(255,106,0,0.08)" stroke="#FF6A00" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="235" y="415" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-weight="600">VERDICT FOR LOCAL BUSINESSES</text>
    <text x="235" y="440" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle" font-weight="700">SEO alone is leaving 75% of leads on the table</text>
  </g>
  <circle cx="100" cy="130" r="60" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <rect x="40" y="40" width="200" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="140" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">Competitive Intel</text>
  <text x="80" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">AEO vs SEO:</text>
  <text x="80" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">What Local</text>
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glowAVS)">Businesses Need</text>
  <text x="80" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">The Data-Driven Comparison</text>
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>