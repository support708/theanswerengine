<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgWSGC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b0d2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0d3b;stop-opacity:1" />
    </linearGradient>
    <filter id="glowWSGC"><feGaussianBlur stdDeviation="6" result="blurWSGC"/><feMerge><feMergeNode in="blurWSGC"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoftWSGC"><feGaussianBlur stdDeviation="12" result="blurWSGCs"/><feMerge><feMergeNode in="blurWSGCs"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgWSGC)"/>
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <!-- Call volume chart declining -->
  <g transform="translate(660, 45)">
    <rect x="0" y="0" width="470" height="470" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="235" y="28" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600">CALL VOLUME ANALYTICS</text>
    <!-- Top metric cards -->
    <rect x="20" y="42" width="135" height="65" rx="8" fill="rgba(255,80,80,0.08)" stroke="rgba(255,80,80,0.4)" stroke-width="1.5"/>
    <text x="87" y="62" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.9)" text-anchor="middle" font-weight="600">CALLS THIS MONTH</text>
    <text x="87" y="93" font-family="system-ui, sans-serif" font-size="24" fill="rgba(255,80,80,0.9)" text-anchor="middle" font-weight="700">-67%</text>
    <rect x="167" y="42" width="135" height="65" rx="8" fill="rgba(255,200,50,0.08)" stroke="rgba(255,200,50,0.4)" stroke-width="1.5"/>
    <text x="234" y="62" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,200,50,0.9)" text-anchor="middle" font-weight="600">AI VISIBILITY</text>
    <text x="234" y="93" font-family="system-ui, sans-serif" font-size="24" fill="#FF6A00" text-anchor="middle" font-weight="700" filter="url(#glowWSGC)">0%</text>
    <rect x="314" y="42" width="135" height="65" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="381" y="62" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-weight="600">COMPETITOR CITED</text>
    <text x="381" y="93" font-family="system-ui, sans-serif" font-size="24" fill="rgba(100,220,100,0.9)" text-anchor="middle" font-weight="700">3x</text>
    <!-- Declining chart -->
    <text x="20" y="135" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">INBOUND CALLS (12 MONTHS)</text>
    <rect x="20" y="145" width="430" height="180" rx="6" fill="rgba(255,255,255,0.03)"/>
    <!-- Y axis labels -->
    <text x="15" y="162" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.3)" text-anchor="end">40</text>
    <text x="15" y="202" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.3)" text-anchor="end">30</text>
    <text x="15" y="242" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.3)" text-anchor="end">20</text>
    <text x="15" y="282" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.3)" text-anchor="end">10</text>
    <text x="15" y="322" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.3)" text-anchor="end">0</text>
    <!-- Declining line -->
    <polyline points="40,165 76,168 112,172 148,180 184,195 220,210 256,230 292,255 328,275 364,290 400,305 436,315" fill="none" stroke="rgba(255,80,80,0.7)" stroke-width="2.5"/>
    <!-- AI launch marker -->
    <line x1="220" y1="150" x2="220" y2="325" stroke="#FF6A00" stroke-width="2" stroke-dasharray="6,4" filter="url(#glowWSGC)"/>
    <rect x="185" y="150" width="70" height="16" rx="3" fill="rgba(255,106,0,0.25)"/>
    <text x="220" y="162" font-family="system-ui, sans-serif" font-size="8" fill="#FF6A00" text-anchor="middle" font-weight="700">AI LAUNCHED</text>
    <!-- Diagnosis section -->
    <line x1="20" y1="340" x2="450" y2="340" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <text x="20" y="365" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">ROOT CAUSE ANALYSIS</text>
    <text x="30" y="390" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.9)">&#x2717; Not cited by ChatGPT, Gemini, or Perplexity</text>
    <text x="30" y="408" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.9)">&#x2717; No schema markup deployed</text>
    <text x="30" y="426" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.9)">&#x2717; Competitors optimized for AI 6 months ago</text>
    <!-- Fix CTA -->
    <rect x="20" y="440" width="430" height="20" rx="4" fill="rgba(255,106,0,0.1)" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="235" y="455" font-family="system-ui, sans-serif" font-size="9" fill="#FF6A00" text-anchor="middle" font-weight="600">THE FIX: Answer Engine Optimization (AEO)</text>
  </g>
  <circle cx="100" cy="130" r="60" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <rect x="40" y="40" width="140" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="110" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">AI Visibility</text>
  <text x="80" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Why Your Website</text>
  <text x="80" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Stopped Getting</text>
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glowWSGC)">Calls</text>
  <text x="80" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">The AI Visibility Gap Explained</text>
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>