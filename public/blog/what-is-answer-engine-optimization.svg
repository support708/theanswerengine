<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2b3b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2e45;stop-opacity:1" />
    </linearGradient>
    <filter id="glow5"><feGaussianBlur stdDeviation="6" result="blur5"/><feMerge><feMergeNode in="blur5"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoft5"><feGaussianBlur stdDeviation="12" result="blur5s"/><feMerge><feMergeNode in="blur5s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg5)"/>
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <!-- Venn diagram: Content, Structure, Authority -->
  <g transform="translate(700, 60)">
    <!-- Content circle -->
    <circle cx="180" cy="150" r="110" fill="rgba(255,106,0,0.08)" stroke="rgba(255,106,0,0.4)" stroke-width="2"/>
    <text x="130" y="100" font-family="system-ui, sans-serif" font-size="13" fill="#FF6A00" font-weight="700">CONTENT</text>
    <text x="105" y="118" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Expert answers</text>
    <text x="105" y="134" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">FAQ coverage</text>
    <text x="105" y="150" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Topical depth</text>
    <!-- Structure circle -->
    <circle cx="300" cy="150" r="110" fill="rgba(100,150,255,0.08)" stroke="rgba(100,150,255,0.4)" stroke-width="2"/>
    <text x="320" y="100" font-family="system-ui, sans-serif" font-size="13" fill="rgba(100,150,255,0.9)" font-weight="700">STRUCTURE</text>
    <text x="320" y="118" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Schema markup</text>
    <text x="320" y="134" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Clean HTML</text>
    <text x="320" y="150" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Fast loading</text>
    <!-- Authority circle -->
    <circle cx="240" cy="260" r="110" fill="rgba(100,220,100,0.08)" stroke="rgba(100,220,100,0.4)" stroke-width="2"/>
    <text x="195" y="320" font-family="system-ui, sans-serif" font-size="13" fill="rgba(100,220,100,0.9)" font-weight="700">AUTHORITY</text>
    <text x="195" y="338" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Citations &amp; links</text>
    <text x="195" y="354" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Reviews &amp; trust</text>
    <text x="195" y="370" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">NAP consistency</text>
    <!-- Center intersection - AEO -->
    <circle cx="240" cy="180" r="40" fill="rgba(255,106,0,0.2)" stroke="#FF6A00" stroke-width="2.5" filter="url(#glow5)"/>
    <text x="240" y="176" font-family="system-ui, sans-serif" font-size="18" fill="#FF6A00" text-anchor="middle" font-weight="700">AEO</text>
    <text x="240" y="196" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)" text-anchor="middle">Sweet Spot</text>
    <!-- Bottom label -->
    <rect x="120" y="400" width="240" height="45" rx="8" fill="rgba(255,106,0,0.1)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
    <text x="240" y="420" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-weight="600">THE THREE PILLARS</text>
    <text x="240" y="438" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" text-anchor="middle">All three must align for AI citation</text>
  </g>
  <circle cx="100" cy="130" r="60" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <rect x="40" y="40" width="190" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="135" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">AEO Fundamentals</text>
  <text x="80" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">What Is Answer</text>
  <text x="80" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Engine</text>
  <text x="80" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glow5)">Optimization?</text>
  <text x="80" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">The New Rules of Digital Visibility</text>
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>