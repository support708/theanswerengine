<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="WNWIbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b0d0d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a0a;stop-opacity:1" />
    </linearGradient>
    <filter id="WNWIglow"><feGaussianBlur stdDeviation="6" result="WNWIblur"/><feMerge><feMergeNode in="WNWIblur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="WNWIglowSoft"><feGaussianBlur stdDeviation="12" result="WNWIblurS"/><feMerge><feMergeNode in="WNWIblurS"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#WNWIbg)"/>
  <!-- Grid lines -->
  <line x1="0" y1="90" x2="1200" y2="90" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="180" x2="1200" y2="180" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="315" x2="1200" y2="315" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="540" x2="1200" y2="540" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <!-- Decorative circles -->
  <circle cx="90" cy="140" r="50" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <circle cx="90" cy="140" r="80" stroke="rgba(255,106,0,0.04)" stroke-width="0.5" fill="none"/>
  <!-- Category pill -->
  <rect x="80" y="130" width="230" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="195" y="151" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#FF6A00" text-anchor="middle" letter-spacing="2">BUSINESS PAIN POINTS</text>
  <!-- Title -->
  <text x="80" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Why Your New</text>
  <text x="80" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Website Is</text>
  <text x="80" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#WNWIglow)">Invisible to AI</text>
  <!-- Subtitle -->
  <text x="80" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="rgba(255,255,255,0.45)">New sites need more than good content</text>
  <text x="80" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="rgba(255,255,255,0.45)">to earn AI trust and citations.</text>
  <!-- Right panel: Browser mockup -->
  <g transform="translate(660, 45)">
    <rect x="0" y="0" width="470" height="470" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Chrome bar -->
    <rect x="0" y="0" width="470" height="40" rx="12" fill="rgba(255,255,255,0.06)"/>
    <rect x="0" y="20" width="470" height="20" fill="rgba(255,255,255,0.06)"/>
    <!-- Chrome dots -->
    <circle cx="22" cy="20" r="5" fill="rgba(255,80,80,0.7)"/>
    <circle cx="42" cy="20" r="5" fill="rgba(255,200,50,0.7)"/>
    <circle cx="62" cy="20" r="5" fill="rgba(100,200,100,0.7)"/>
    <!-- URL bar -->
    <rect x="85" y="10" width="300" height="20" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <text x="100" y="24" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">yoursite.com</text>
    <!-- Content area -->
    <!-- Section 1: NOT INDEXED -->
    <rect x="20" y="55" width="430" height="75" rx="6" fill="rgba(255,80,80,0.08)" stroke="rgba(255,80,80,0.2)" stroke-width="1"/>
    <circle cx="42" cy="92" r="12" fill="rgba(255,80,80,0.2)" stroke="rgba(255,80,80,0.5)" stroke-width="1.5"/>
    <text x="42" y="97" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,80,80,0.9)" text-anchor="middle" font-weight="700">&#x2717;</text>
    <text x="65" y="82" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.8)" font-weight="600">NOT INDEXED BY AI</text>
    <text x="65" y="102" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.35)">No AI crawler has successfully ingested your content</text>
    <rect x="350" y="75" width="85" height="22" rx="11" fill="rgba(255,80,80,0.15)"/>
    <text x="392" y="90" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,80,80,0.9)" text-anchor="middle" font-weight="600">BLOCKED</text>
    <!-- Section 2: MISSING SCHEMA -->
    <rect x="20" y="145" width="430" height="75" rx="6" fill="rgba(255,200,50,0.06)" stroke="rgba(255,200,50,0.15)" stroke-width="1"/>
    <circle cx="42" cy="182" r="12" fill="rgba(255,200,50,0.15)" stroke="rgba(255,200,50,0.5)" stroke-width="1.5"/>
    <text x="42" y="187" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,200,50,0.9)" text-anchor="middle" font-weight="700">&#x2717;</text>
    <text x="65" y="172" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.8)" font-weight="600">MISSING SCHEMA</text>
    <text x="65" y="192" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.35)">No structured data found for Organization or LocalBusiness</text>
    <rect x="350" y="165" width="85" height="22" rx="11" fill="rgba(255,200,50,0.12)"/>
    <text x="392" y="180" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,200,50,0.9)" text-anchor="middle" font-weight="600">MISSING</text>
    <!-- Section 3: NO BRAND MENTIONS -->
    <rect x="20" y="235" width="430" height="75" rx="6" fill="rgba(255,80,80,0.08)" stroke="rgba(255,80,80,0.2)" stroke-width="1"/>
    <circle cx="42" cy="272" r="12" fill="rgba(255,80,80,0.2)" stroke="rgba(255,80,80,0.5)" stroke-width="1.5"/>
    <text x="42" y="277" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,80,80,0.9)" text-anchor="middle" font-weight="700">&#x2717;</text>
    <text x="65" y="262" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.8)" font-weight="600">NO BRAND MENTIONS</text>
    <text x="65" y="282" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.35)">Zero third-party citations or reviews found across the web</text>
    <rect x="350" y="255" width="85" height="22" rx="11" fill="rgba(255,80,80,0.15)"/>
    <text x="392" y="270" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,80,80,0.9)" text-anchor="middle" font-weight="600">ZERO</text>
    <!-- Section 4: JS RENDERING -->
    <rect x="20" y="325" width="430" height="55" rx="6" fill="rgba(255,200,50,0.06)" stroke="rgba(255,200,50,0.15)" stroke-width="1"/>
    <circle cx="42" cy="352" r="12" fill="rgba(255,200,50,0.15)" stroke="rgba(255,200,50,0.5)" stroke-width="1.5"/>
    <text x="42" y="357" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,200,50,0.9)" text-anchor="middle" font-weight="700">!</text>
    <text x="65" y="347" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.8)" font-weight="600">JS-ONLY RENDERING</text>
    <text x="65" y="365" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.35)">87% of JS-heavy sites invisible to AI crawlers</text>
    <!-- Bottom insight box -->
    <rect x="20" y="400" width="430" height="55" rx="8" fill="rgba(255,80,80,0.12)" stroke="rgba(255,80,80,0.35)" stroke-width="1.5"/>
    <text x="40" y="422" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" font-weight="500">AI VISIBILITY SCORE</text>
    <text x="40" y="444" font-family="system-ui, sans-serif" font-size="24" fill="#FF6A00" font-weight="700" filter="url(#WNWIglow)">0%</text>
    <text x="85" y="444" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,80,80,0.8)" font-weight="600">INVISIBLE</text>
    <!-- Progress bar (empty) -->
    <rect x="200" y="420" width="235" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
    <rect x="200" y="420" width="4" height="8" rx="4" fill="rgba(255,80,80,0.6)"/>
    <text x="200" y="444" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.3)">No signals detected by ChatGPT, Perplexity, or Google AI</text>
  </g>
  <!-- Footer -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <!-- AE circle -->
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>
