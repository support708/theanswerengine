<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="AEO Best Practices 2026 — The Answer Engine field guide cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0c"/>
      <stop offset="1" stop-color="#1a1a1d"/>
    </linearGradient>
    <linearGradient id="orangeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F27D24" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F27D24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F27D24" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#F27D24" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#F27D24" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#F27D24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#orangeFade)"/>

  <!-- Top metadata row -->
  <g font-family="Courier New, ui-monospace, monospace" font-size="14" fill="#F27D24" letter-spacing="3">
    <text x="64" y="64">AEO // 2026 AUTHORITY FIELD GUIDE</text>
  </g>
  <g font-family="Courier New, ui-monospace, monospace" font-size="14" fill="rgba(229,226,225,0.45)" letter-spacing="3" text-anchor="end">
    <text x="1136" y="64">THEANSWERENGINE.AI</text>
  </g>

  <!-- Section number -->
  <g font-family="Courier New, ui-monospace, monospace" font-size="13" fill="rgba(242,125,36,0.65)" letter-spacing="4">
    <text x="64" y="190">FIELD GUIDE 08 // EIGHT-PRACTICE STACK</text>
  </g>

  <!-- Title -->
  <g font-family="Inter, system-ui, sans-serif" font-weight="900" fill="#FFFFFF">
    <text x="64" y="278" font-size="86" letter-spacing="-3">ANSWER ENGINE</text>
    <text x="64" y="368" font-size="86" letter-spacing="-3">OPTIMIZATION</text>
    <text x="64" y="458" font-size="86" letter-spacing="-3">BEST PRACTICES</text>
    <text x="64" y="548" font-size="86" letter-spacing="-3" fill="#F27D24">2026<tspan fill="rgba(229,226,225,0.35)" font-size="40" dx="22">FIELD GUIDE</tspan></text>
  </g>

  <!-- Bottom stat strip -->
  <g font-family="Courier New, ui-monospace, monospace" font-size="13" letter-spacing="2" fill="rgba(229,226,225,0.6)">
    <text x="64" y="600">+57% DEFINITION-FIRST</text>
    <text x="340" y="600">·</text>
    <text x="358" y="600">-31% CHUNK CEILING</text>
    <text x="600" y="600">·</text>
    <text x="618" y="600">+43% STRUCTURED FORMATS</text>
    <text x="900" y="600">·</text>
    <text x="918" y="600" fill="#F27D24">2.1X COMPOUND AUTHORITY</text>
  </g>

  <!-- Right accent column -->
  <g opacity="0.85">
    <rect x="1100" y="120" width="3" height="380" fill="#F27D24"/>
    <rect x="1110" y="120" width="3" height="200" fill="rgba(242,125,36,0.4)"/>
    <rect x="1120" y="120" width="3" height="90" fill="rgba(242,125,36,0.2)"/>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#orangeFade)"/>
</svg>
