<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgLSA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b1a0d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d3b1a;stop-opacity:1" />
    </linearGradient>
    <filter id="glowLSA">
      <feGaussianBlur stdDeviation="6" result="blurLSA"/>
      <feMerge><feMergeNode in="blurLSA"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgLSA)"/>
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="200" y1="0" x2="200" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="1000" y1="0" x2="1000" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>

  <!-- Dashboard: Comparison Table -->
  <g transform="translate(640, 55)">
    <rect x="0" y="0" width="480" height="440" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Column headers -->
    <rect x="20" y="20" width="440" height="40" rx="6" fill="rgba(255,255,255,0.03)"/>
    <text x="160" y="45" font-family="system-ui, sans-serif" font-size="12" fill="rgba(100,150,255,0.9)" font-weight="600" text-anchor="middle">LOCAL SEO</text>
    <text x="240" y="45" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.3)" text-anchor="middle">vs</text>
    <text x="340" y="45" font-family="system-ui, sans-serif" font-size="12" fill="#FF6A00" font-weight="600" text-anchor="middle">AI SEARCH</text>

    <!-- Comparison rows -->
    <line x1="240" y1="70" x2="240" y2="300" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Row 1 -->
    <text x="35" y="85" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">GOAL</text>
    <text x="160" y="85" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">Page 1 ranking</text>
    <text x="340" y="85" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">THE answer</text>

    <line x1="35" y1="95" x2="445" y2="95" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>

    <!-- Row 2 -->
    <text x="35" y="115" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">LEAD INTENT</text>
    <text x="160" y="115" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">Browsing</text>
    <text x="340" y="115" font-family="system-ui, sans-serif" font-size="10" fill="rgba(100,220,100,0.8)" text-anchor="middle">Ready to hire</text>

    <line x1="35" y1="125" x2="445" y2="125" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>

    <!-- Row 3 -->
    <text x="35" y="145" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">CONVERSION</text>
    <text x="160" y="145" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">2-5%</text>
    <text x="340" y="145" font-family="system-ui, sans-serif" font-size="10" fill="rgba(100,220,100,0.8)" text-anchor="middle">15-30%</text>

    <line x1="35" y1="155" x2="445" y2="155" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>

    <!-- Row 4 -->
    <text x="35" y="175" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">COMPETITION</text>
    <text x="160" y="175" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,80,80,0.7)" text-anchor="middle">10 results</text>
    <text x="340" y="175" font-family="system-ui, sans-serif" font-size="10" fill="rgba(100,220,100,0.8)" text-anchor="middle">1-3 cited</text>

    <line x1="35" y1="185" x2="445" y2="185" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>

    <!-- Row 5 -->
    <text x="35" y="205" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">COST/LEAD</text>
    <text x="160" y="205" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">$50-150</text>
    <text x="340" y="205" font-family="system-ui, sans-serif" font-size="10" fill="rgba(100,220,100,0.8)" text-anchor="middle">$8-25</text>

    <line x1="35" y1="215" x2="445" y2="215" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>

    <!-- Row 6 -->
    <text x="35" y="235" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">TREND 2026</text>
    <text x="160" y="235" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,200,50,0.7)" text-anchor="middle">Declining reach</text>
    <text x="340" y="235" font-family="system-ui, sans-serif" font-size="10" fill="rgba(100,220,100,0.8)" text-anchor="middle">Explosive growth</text>

    <!-- Bar comparison -->
    <rect x="20" y="260" width="440" height="70" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="35" y="282" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" font-weight="500">ROI TRAJECTORY (2024-2026)</text>
    <text x="35" y="305" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,150,255,0.6)">Local SEO</text>
    <rect x="110" y="296" width="180" height="12" rx="3" fill="rgba(100,150,255,0.3)"/>
    <rect x="110" y="296" width="120" height="12" rx="3" fill="rgba(100,150,255,0.5)"/>
    <text x="300" y="306" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.7)">-33%</text>

    <text x="35" y="322" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.6)">AI Search</text>
    <rect x="110" y="313" width="120" height="12" rx="3" fill="rgba(255,106,0,0.3)"/>
    <rect x="110" y="313" width="320" height="12" rx="3" fill="rgba(255,106,0,0.5)"/>
    <text x="440" y="323" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.8)">+167%</text>

    <!-- Verdict -->
    <rect x="20" y="345" width="440" height="80" rx="6" fill="rgba(255,106,0,0.08)" stroke="#FF6A00" stroke-opacity="0.5" stroke-width="1"/>
    <text x="35" y="367" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" font-weight="600">VERDICT</text>
    <text x="35" y="392" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.8)" font-weight="500">Local SEO = table stakes. AI Search = growth.</text>
    <text x="35" y="412" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Businesses winning in 2026 invest in both.</text>
  </g>

  <circle cx="100" cy="150" r="60" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <circle cx="100" cy="150" r="90" stroke="rgba(255,106,0,0.04)" stroke-width="0.5" fill="none"/>

  <rect x="80" y="180" width="120" height="26" rx="13" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="140" y="197" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" font-weight="600" text-anchor="middle">COMPARISON</text>

  <text x="80" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="white">Local SEO vs</text>
  <text x="80" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#FF6A00" filter="url(#glowLSA)">AI Search</text>
  <text x="80" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="white">in 2026</text>

  <text x="80" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="rgba(255,255,255,0.45)">Which Channel Matters More Now?</text>

  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>