<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgClaude" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1424;stop-opacity:1"/>
      <stop offset="55%" style="stop-color:#0F1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2a1a08;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="orbitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:0.35"/>
      <stop offset="60%" style="stop-color:#FF6A00;stop-opacity:0.10"/>
      <stop offset="100%" style="stop-color:#FF6A00;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="filterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:0.28"/>
      <stop offset="100%" style="stop-color:#FF6A00;stop-opacity:0.06"/>
    </linearGradient>
    <filter id="glowClaude"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoftClaude"><feGaussianBlur stdDeviation="14" result="bs"/><feMerge><feMergeNode in="bs"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgClaude)"/>

  <!-- Grid overlay -->
  <g opacity="0.025" stroke="white" stroke-width="0.5">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Ambient glow around the central Claude node -->
  <circle cx="600" cy="310" r="240" fill="url(#orbitGlow)"/>

  <!-- Title -->
  <text x="600" y="62" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-0.5">How Claude AI Picks Businesses to Cite</text>
  <text x="600" y="92" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#FF6A00" text-anchor="middle" letter-spacing="1.5">CONSTITUTIONAL AI · THE TRUST FILTER</text>

  <!-- Central Claude AI hexagonal node -->
  <g transform="translate(600, 310)" filter="url(#glowSoftClaude)">
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="rgba(255,106,0,0.18)" stroke="#FF6A00" stroke-width="2.5"/>
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="rgba(255,106,0,0.08)" stroke="rgba(255,106,0,0.5)" stroke-width="1"/>
    <text x="0" y="-8" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="white" text-anchor="middle">CLAUDE</text>
    <text x="0" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle" font-weight="600" letter-spacing="1">WEB SEARCH</text>
  </g>

  <!-- Four filter layers orbiting Claude — Constitutional AI principles -->

  <!-- Filter 1: Harm Avoidance (left) -->
  <g transform="translate(170, 230)">
    <rect x="0" y="0" width="220" height="64" rx="10" fill="url(#filterGrad)" stroke="rgba(255,106,0,0.55)" stroke-width="1.5"/>
    <text x="110" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#FF6A00" text-anchor="middle" letter-spacing="2">FILTER 01</text>
    <text x="110" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">HARM AVOIDANCE</text>
    <text x="110" y="56" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)" text-anchor="middle">Excludes risky &amp; deceptive sources</text>
  </g>
  <!-- Connector -->
  <line x1="390" y1="262" x2="520" y2="290" stroke="rgba(255,106,0,0.4)" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Filter 2: Source Diversity (right) -->
  <g transform="translate(810, 230)">
    <rect x="0" y="0" width="220" height="64" rx="10" fill="url(#filterGrad)" stroke="rgba(255,106,0,0.55)" stroke-width="1.5"/>
    <text x="110" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#FF6A00" text-anchor="middle" letter-spacing="2">FILTER 02</text>
    <text x="110" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">SOURCE DIVERSITY</text>
    <text x="110" y="56" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)" text-anchor="middle">Balances competing viewpoints</text>
  </g>
  <line x1="810" y1="262" x2="680" y2="290" stroke="rgba(255,106,0,0.4)" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Filter 3: Expertise + Authority (bottom-left) -->
  <g transform="translate(170, 380)">
    <rect x="0" y="0" width="220" height="64" rx="10" fill="url(#filterGrad)" stroke="rgba(255,106,0,0.45)" stroke-width="1.5"/>
    <text x="110" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#FF6A00" text-anchor="middle" letter-spacing="2">FILTER 03</text>
    <text x="110" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">NAMED EXPERTISE</text>
    <text x="110" y="56" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)" text-anchor="middle">Credentialed authors &amp; institutions</text>
  </g>
  <line x1="390" y1="395" x2="520" y2="350" stroke="rgba(255,106,0,0.4)" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Filter 4: Recency + Accuracy (bottom-right) -->
  <g transform="translate(810, 380)">
    <rect x="0" y="0" width="220" height="64" rx="10" fill="url(#filterGrad)" stroke="rgba(255,106,0,0.45)" stroke-width="1.5"/>
    <text x="110" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#FF6A00" text-anchor="middle" letter-spacing="2">FILTER 04</text>
    <text x="110" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">RECENCY &amp; PROOF</text>
    <text x="110" y="56" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)" text-anchor="middle">Fresh data, primary sources, dates</text>
  </g>
  <line x1="810" y1="395" x2="680" y2="350" stroke="rgba(255,106,0,0.4)" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Citation output chip below Claude -->
  <g filter="url(#glowClaude)" transform="translate(600, 460)">
    <rect x="-104" y="-18" width="208" height="36" rx="18" fill="#FF6A00" opacity="0.92"/>
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="white" text-anchor="middle" letter-spacing="1">BUSINESS CITED BY CLAUDE</text>
  </g>
  <line x1="600" y1="410" x2="600" y2="442" stroke="rgba(255,106,0,0.55)" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="600,444 595,434 605,434" fill="rgba(255,106,0,0.7)"/>

  <!-- Stats strip bottom -->
  <g transform="translate(100, 506)">
    <rect x="0" y="0" width="220" height="68" rx="10" fill="rgba(255,106,0,0.08)" stroke="rgba(255,106,0,0.25)" stroke-width="1"/>
    <text x="110" y="28" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#FF6A00" text-anchor="middle">2025</text>
    <text x="110" y="47" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="500">Claude web search launched</text>
    <text x="110" y="60" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.5)" text-anchor="middle">Anthropic, March 2025</text>

    <rect x="240" y="0" width="220" height="68" rx="10" fill="rgba(255,106,0,0.08)" stroke="rgba(255,106,0,0.25)" stroke-width="1"/>
    <text x="350" y="28" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#FF6A00" text-anchor="middle">~30%</text>
    <text x="350" y="47" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="500">fewer citations vs. ChatGPT</text>
    <text x="350" y="60" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.5)" text-anchor="middle">AE measurement, 2026</text>

    <rect x="480" y="0" width="220" height="68" rx="10" fill="rgba(255,106,0,0.08)" stroke="rgba(255,106,0,0.25)" stroke-width="1"/>
    <text x="590" y="28" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#FF6A00" text-anchor="middle">3-4</text>
    <text x="590" y="47" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="500">avg sources per Claude answer</text>
    <text x="590" y="60" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.5)" text-anchor="middle">AE citation lab</text>

    <rect x="720" y="0" width="220" height="68" rx="10" fill="rgba(255,106,0,0.08)" stroke="rgba(255,106,0,0.25)" stroke-width="1"/>
    <text x="830" y="28" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#FF6A00" text-anchor="middle">2.1x</text>
    <text x="830" y="47" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="500">edu/gov bias vs. ChatGPT</text>
    <text x="830" y="60" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.5)" text-anchor="middle">AE measurement, 2026</text>
  </g>

  <!-- Bottom strip -->
  <rect x="0" y="600" width="1200" height="30" fill="#FF6A00" opacity="0.08"/>
  <text x="600" y="620" font-family="system-ui, sans-serif" font-size="14" fill="#FF6A00" text-anchor="middle" font-weight="700" letter-spacing="3">THE ANSWER ENGINE — theanswerengine.ai</text>
</svg>
