<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Schema Markup for Personal Injury Law Firms — The Answer Engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131313"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F27D24"/>
      <stop offset="100%" stop-color="#cc5500"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F27D24" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#F27D24" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#F27D24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <pattern id="codedots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="1" fill="#F27D24" fill-opacity="0.20"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient glow -->
  <ellipse cx="950" cy="200" rx="500" ry="320" fill="url(#glow)"/>
  <ellipse cx="200" cy="500" rx="380" ry="240" fill="url(#glow)" opacity="0.6"/>

  <!-- Right-side schema entity graph visualization -->
  <g transform="translate(880,200)" opacity="0.92">
    <!-- Central node: LegalService -->
    <circle cx="0" cy="0" r="46" fill="#0a0a0a" stroke="#F27D24" stroke-width="3"/>
    <text x="0" y="-4" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#F27D24" text-anchor="middle" letter-spacing="1">LEGAL</text>
    <text x="0" y="10" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#F27D24" text-anchor="middle" letter-spacing="1">SERVICE</text>

    <!-- Edges -->
    <line x1="-32" y1="-32" x2="-92" y2="-92" stroke="#F27D24" stroke-width="2" stroke-opacity="0.55"/>
    <line x1="32" y1="-32" x2="92" y2="-92" stroke="#F27D24" stroke-width="2" stroke-opacity="0.55"/>
    <line x1="46" y1="0" x2="120" y2="0" stroke="#F27D24" stroke-width="2" stroke-opacity="0.55"/>
    <line x1="32" y1="32" x2="92" y2="92" stroke="#F27D24" stroke-width="2" stroke-opacity="0.55"/>
    <line x1="-32" y1="32" x2="-92" y2="92" stroke="#F27D24" stroke-width="2" stroke-opacity="0.55"/>
    <line x1="-46" y1="0" x2="-120" y2="0" stroke="#F27D24" stroke-width="2" stroke-opacity="0.55"/>

    <!-- Satellite nodes -->
    <g>
      <circle cx="-110" cy="-110" r="28" fill="#0a0a0a" stroke="#F27D24" stroke-width="2" stroke-opacity="0.75"/>
      <text x="-110" y="-106" font-family="Courier New, monospace" font-size="9" font-weight="700" fill="#e5e2e1" text-anchor="middle">ATTY</text>
    </g>
    <g>
      <circle cx="110" cy="-110" r="28" fill="#0a0a0a" stroke="#F27D24" stroke-width="2" stroke-opacity="0.75"/>
      <text x="110" y="-106" font-family="Courier New, monospace" font-size="9" font-weight="700" fill="#e5e2e1" text-anchor="middle">FAQ</text>
    </g>
    <g>
      <circle cx="140" cy="0" r="28" fill="#0a0a0a" stroke="#F27D24" stroke-width="2" stroke-opacity="0.75"/>
      <text x="140" y="4" font-family="Courier New, monospace" font-size="9" font-weight="700" fill="#e5e2e1" text-anchor="middle">REVIEW</text>
    </g>
    <g>
      <circle cx="110" cy="110" r="28" fill="#0a0a0a" stroke="#F27D24" stroke-width="2" stroke-opacity="0.75"/>
      <text x="110" y="114" font-family="Courier New, monospace" font-size="9" font-weight="700" fill="#e5e2e1" text-anchor="middle">BREAD</text>
    </g>
    <g>
      <circle cx="-110" cy="110" r="28" fill="#0a0a0a" stroke="#F27D24" stroke-width="2" stroke-opacity="0.75"/>
      <text x="-110" y="114" font-family="Courier New, monospace" font-size="9" font-weight="700" fill="#e5e2e1" text-anchor="middle">SPEAK</text>
    </g>
    <g>
      <circle cx="-140" cy="0" r="28" fill="#0a0a0a" stroke="#F27D24" stroke-width="2" stroke-opacity="0.75"/>
      <text x="-140" y="4" font-family="Courier New, monospace" font-size="9" font-weight="700" fill="#e5e2e1" text-anchor="middle">ORG</text>
    </g>
  </g>

  <!-- Subtle vertical scanlines -->
  <g opacity="0.10" stroke="#ffffff" stroke-width="1" fill="none">
    <line x1="400" y1="0" x2="500" y2="630"/>
    <line x1="430" y1="0" x2="530" y2="630"/>
    <line x1="460" y1="0" x2="560" y2="630"/>
  </g>

  <!-- Top label bar -->
  <g transform="translate(80,80)">
    <rect x="0" y="0" width="200" height="28" fill="#F27D24"/>
    <text x="100" y="20" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#0a0a0a" text-anchor="middle" letter-spacing="2">TECHNICAL AEO</text>
  </g>

  <!-- Main title -->
  <g transform="translate(80,160)" font-family="Space Grotesk, Inter, sans-serif" font-weight="900" fill="#e5e2e1">
    <text x="0" y="0" font-size="64" letter-spacing="-3">SCHEMA MARKUP</text>
    <text x="0" y="74" font-size="64" letter-spacing="-3">FOR PERSONAL</text>
    <text x="0" y="148" font-size="64" letter-spacing="-3" fill="url(#orange)">INJURY LAW FIRMS</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(80,380)" font-family="Inter, sans-serif" fill="#e5e2e1" fill-opacity="0.65">
    <text x="0" y="0" font-size="22" font-weight="400">The structured data playbook PI firms use to get cited by</text>
    <text x="0" y="32" font-size="22" font-weight="600" fill="#e5e2e1">ChatGPT · Perplexity · Google AI Overviews</text>
  </g>

  <!-- JSON-LD code-stub accent -->
  <g transform="translate(80,450)" font-family="Courier New, monospace" font-size="13" fill="#F27D24" fill-opacity="0.55">
    <text x="0" y="0">&quot;@type&quot;: &quot;LegalService&quot;,</text>
    <text x="0" y="20">&quot;serviceType&quot;: &quot;PersonalInjuryRepresentation&quot;,</text>
    <text x="0" y="40">&quot;sameAs&quot;: [ &quot;calbar.ca.gov/...&quot; ]</text>
  </g>

  <!-- Bottom-left brand mark -->
  <g transform="translate(80,580)">
    <rect x="0" y="-22" width="6" height="28" fill="#F27D24"/>
    <text x="18" y="0" font-family="Space Grotesk, Inter, sans-serif" font-size="20" font-weight="900" fill="#e5e2e1" letter-spacing="-1">THE ANSWER ENGINE</text>
    <text x="18" y="22" font-family="Courier New, monospace" font-size="12" fill="#e5e2e1" fill-opacity="0.55" letter-spacing="2">theanswerengine.ai</text>
  </g>

  <!-- Bottom-right meta -->
  <g transform="translate(1120,580)" text-anchor="end">
    <text x="0" y="0" font-family="Courier New, monospace" font-size="12" fill="#F27D24" letter-spacing="2">AEO PLAYBOOK</text>
    <text x="0" y="22" font-family="Courier New, monospace" font-size="12" fill="#e5e2e1" fill-opacity="0.55" letter-spacing="2">structured data discipline</text>
  </g>
</svg>
