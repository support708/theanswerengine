<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgHPDC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d3b3b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a0d;stop-opacity:1" />
    </linearGradient>
    <filter id="glowHPDC"><feGaussianBlur stdDeviation="6" result="blurHPDC"/><feMerge><feMergeNode in="blurHPDC"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgHPDC)"/>
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <!-- Perplexity Source Selection -->
  <g transform="translate(660, 45)">
    <rect x="0" y="0" width="470" height="470" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="235" y="28" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600">PERPLEXITY SOURCE SELECTION</text>
    <!-- Perplexity answer mockup -->
    <rect x="20" y="42" width="430" height="120" rx="8" fill="rgba(0,0,0,0.4)" stroke="rgba(100,150,255,0.3)" stroke-width="1.5"/>
    <circle cx="40" cy="58" r="6" fill="rgba(100,150,255,0.7)"/>
    <text x="52" y="62" font-family="system-ui, sans-serif" font-size="10" fill="rgba(100,150,255,0.9)" font-weight="600">Perplexity AI</text>
    <text x="30" y="82" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.6)">Based on my research, the top-rated plumber in</text>
    <text x="30" y="95" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.6)">your area is Palmer Plumbing, known for...</text>
    <!-- Source citations -->
    <text x="30" y="118" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.4)">Sources:</text>
    <rect x="70" y="108" width="55" height="16" rx="3" fill="rgba(100,220,100,0.15)"/>
    <text x="97" y="120" font-family="system-ui, sans-serif" font-size="7" fill="rgba(100,220,100,0.9)" text-anchor="middle" font-weight="600">[1] Yelp</text>
    <rect x="130" y="108" width="55" height="16" rx="3" fill="rgba(100,220,100,0.15)"/>
    <text x="157" y="120" font-family="system-ui, sans-serif" font-size="7" fill="rgba(100,220,100,0.9)" text-anchor="middle" font-weight="600">[2] BBB</text>
    <rect x="190" y="108" width="75" height="16" rx="3" fill="rgba(255,106,0,0.2)"/>
    <text x="227" y="120" font-family="system-ui, sans-serif" font-size="7" fill="#FF6A00" text-anchor="middle" font-weight="600">[3] Your Site</text>
    <rect x="270" y="108" width="75" height="16" rx="3" fill="rgba(100,220,100,0.15)"/>
    <text x="307" y="120" font-family="system-ui, sans-serif" font-size="7" fill="rgba(100,220,100,0.9)" text-anchor="middle" font-weight="600">[4] Angi</text>
    <rect x="350" y="108" width="80" height="16" rx="3" fill="rgba(100,220,100,0.15)"/>
    <text x="390" y="120" font-family="system-ui, sans-serif" font-size="7" fill="rgba(100,220,100,0.9)" text-anchor="middle" font-weight="600">[5] Reddit</text>
    <!-- Ranking factors -->
    <text x="20" y="190" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">CITATION RANKING FACTORS</text>
    <!-- Factor 1 -->
    <rect x="20" y="200" width="430" height="35" rx="6" fill="rgba(255,106,0,0.06)" stroke="rgba(255,106,0,0.4)" stroke-width="1"/>
    <circle cx="45" cy="218" r="10" fill="rgba(255,106,0,0.25)" stroke="#FF6A00" stroke-width="1"/>
    <text x="45" y="222" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" text-anchor="middle" font-weight="700">1</text>
    <text x="65" y="214" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.85)" font-weight="600">Recency of Content</text>
    <text x="65" y="228" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.4)">Perplexity heavily favors recently updated pages</text>
    <rect x="370" y="206" width="70" height="18" rx="9" fill="rgba(255,106,0,0.25)"/>
    <text x="405" y="219" font-family="system-ui, sans-serif" font-size="8" fill="#FF6A00" text-anchor="middle" font-weight="700">WEIGHT: 9</text>
    <!-- Factor 2 -->
    <rect x="20" y="240" width="430" height="35" rx="6" fill="rgba(100,220,100,0.04)" stroke="rgba(100,220,100,0.3)" stroke-width="1"/>
    <circle cx="45" cy="258" r="10" fill="rgba(100,220,100,0.2)" stroke="rgba(100,220,100,0.6)" stroke-width="1"/>
    <text x="45" y="262" font-family="system-ui, sans-serif" font-size="10" fill="rgba(100,220,100,0.9)" text-anchor="middle" font-weight="700">2</text>
    <text x="65" y="254" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.85)" font-weight="600">Domain Authority</text>
    <text x="65" y="268" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.4)">Established sites with backlink profiles</text>
    <rect x="370" y="246" width="70" height="18" rx="9" fill="rgba(100,220,100,0.2)"/>
    <text x="405" y="259" font-family="system-ui, sans-serif" font-size="8" fill="rgba(100,220,100,0.9)" text-anchor="middle" font-weight="700">WEIGHT: 8</text>
    <!-- Factor 3 -->
    <rect x="20" y="280" width="430" height="35" rx="6" fill="rgba(100,150,255,0.04)" stroke="rgba(100,150,255,0.3)" stroke-width="1"/>
    <circle cx="45" cy="298" r="10" fill="rgba(100,150,255,0.2)" stroke="rgba(100,150,255,0.6)" stroke-width="1"/>
    <text x="45" y="302" font-family="system-ui, sans-serif" font-size="10" fill="rgba(100,150,255,0.9)" text-anchor="middle" font-weight="700">3</text>
    <text x="65" y="294" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.85)" font-weight="600">Structured Data</text>
    <text x="65" y="308" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.4)">Schema markup makes content machine-readable</text>
    <rect x="370" y="286" width="70" height="18" rx="9" fill="rgba(100,150,255,0.2)"/>
    <text x="405" y="299" font-family="system-ui, sans-serif" font-size="8" fill="rgba(100,150,255,0.9)" text-anchor="middle" font-weight="700">WEIGHT: 7</text>
    <!-- Factor 4 -->
    <rect x="20" y="320" width="430" height="35" rx="6" fill="rgba(255,200,50,0.04)" stroke="rgba(255,200,50,0.3)" stroke-width="1"/>
    <circle cx="45" cy="338" r="10" fill="rgba(255,200,50,0.2)" stroke="rgba(255,200,50,0.6)" stroke-width="1"/>
    <text x="45" y="342" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,200,50,0.9)" text-anchor="middle" font-weight="700">4</text>
    <text x="65" y="334" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.85)" font-weight="600">Cross-Reference Match</text>
    <text x="65" y="348" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.4)">Info confirmed across multiple independent sources</text>
    <rect x="370" y="326" width="70" height="18" rx="9" fill="rgba(255,200,50,0.2)"/>
    <text x="405" y="339" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,200,50,0.9)" text-anchor="middle" font-weight="700">WEIGHT: 7</text>
    <!-- Key difference -->
    <rect x="20" y="370" width="430" height="85" rx="8" fill="rgba(255,106,0,0.08)" stroke="#FF6A00" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="235" y="392" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-weight="600">KEY DIFFERENCE FROM CHATGPT</text>
    <text x="30" y="415" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.7)">Perplexity searches the live web in real-time,</text>
    <text x="30" y="430" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.7)">not a training dataset. Fresh content wins.</text>
    <text x="30" y="448" font-family="system-ui, sans-serif" font-size="9" fill="#FF6A00" font-weight="600">Update frequency matters more than domain age.</text>
  </g>
  <circle cx="100" cy="130" r="60" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <rect x="40" y="40" width="170" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="125" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">Platform Deep Dive</text>
  <text x="80" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">How Perplexity AI</text>
  <text x="80" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Decides What</text>
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glowHPDC)">to Cite</text>
  <text x="80" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">The Real-Time Search Algorithm</text>
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>