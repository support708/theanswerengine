<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1923"/>
      <stop offset="50%" style="stop-color:#1a2744"/>
      <stop offset="100%" style="stop-color:#0d2137"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric patterns -->
  <!-- Browser window icon -->
  <rect x="80" y="100" width="200" height="140" rx="10" stroke="#FF6A00" stroke-width="2" fill="none" opacity="0.2"/>
  <line x1="80" y1="130" x2="280" y2="130" stroke="#FF6A00" stroke-width="1.5" opacity="0.2"/>
  <circle cx="100" cy="115" r="5" fill="#FF6A00" opacity="0.15"/>
  <circle cx="118" cy="115" r="5" fill="#FF6A00" opacity="0.15"/>
  <circle cx="136" cy="115" r="5" fill="#FF6A00" opacity="0.15"/>
  <rect x="100" y="150" width="140" height="8" rx="4" fill="#FF6A00" opacity="0.1"/>
  <rect x="100" y="170" width="100" height="8" rx="4" fill="#FF6A00" opacity="0.1"/>
  <rect x="100" y="190" width="120" height="8" rx="4" fill="#FF6A00" opacity="0.1"/>

  <!-- Schema/code brackets -->
  <text x="950" y="150" font-family="monospace" font-size="60" fill="#FF6A00" opacity="0.12">{</text>
  <text x="980" y="200" font-family="monospace" font-size="28" fill="#FF6A00" opacity="0.1">"@type"</text>
  <text x="980" y="240" font-family="monospace" font-size="28" fill="#FF6A00" opacity="0.1">"name"</text>
  <text x="950" y="290" font-family="monospace" font-size="60" fill="#FF6A00" opacity="0.12">}</text>

  <!-- Connection dots/nodes -->
  <circle cx="500" cy="80" r="8" fill="#FF6A00" opacity="0.15"/>
  <circle cx="620" cy="60" r="5" fill="#FF6A00" opacity="0.1"/>
  <circle cx="700" cy="100" r="6" fill="#FF6A00" opacity="0.12"/>
  <line x1="500" y1="80" x2="620" y2="60" stroke="#FF6A00" stroke-width="1" opacity="0.08"/>
  <line x1="620" y1="60" x2="700" y2="100" stroke="#FF6A00" stroke-width="1" opacity="0.08"/>

  <!-- AI circuit pattern bottom -->
  <circle cx="200" cy="520" r="40" stroke="#FF6A00" stroke-width="1" fill="none" opacity="0.08"/>
  <circle cx="200" cy="520" r="25" stroke="#FF6A00" stroke-width="0.8" fill="none" opacity="0.06"/>
  <line x1="240" y1="520" x2="350" y2="520" stroke="#FF6A00" stroke-width="0.8" opacity="0.06"/>
  <circle cx="350" cy="520" r="4" fill="#FF6A00" opacity="0.08"/>

  <!-- Question mark subtle -->
  <text x="850" y="500" font-family="sans-serif" font-size="120" fill="#FF6A00" opacity="0.04" font-weight="bold">?</text>

  <!-- Category pill -->
  <rect x="80" y="320" width="170" height="32" rx="16" fill="#FF6A00" opacity="0.15"/>
  <text x="165" y="342" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#FF6A00" font-weight="600">AI Search Strategy</text>

  <!-- Title -->
  <text x="80" y="400" font-family="system-ui, sans-serif" font-size="42" fill="white" font-weight="bold">Does Your Business Need</text>
  <text x="80" y="455" font-family="system-ui, sans-serif" font-size="42" fill="white" font-weight="bold">a Website for AI Search</text>
  <text x="80" y="510" font-family="system-ui, sans-serif" font-size="42" fill="#FF6A00" font-weight="bold">in 2026?</text>

  <!-- Watermark -->
  <text x="600" y="600" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="white" opacity="0.3" letter-spacing="4">THE ANSWER ENGINE</text>

  <!-- AE circle -->
  <circle cx="1130" cy="560" r="30" fill="none" stroke="#FF6A00" stroke-width="1.5" opacity="0.3"/>
  <text x="1130" y="568" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#FF6A00" opacity="0.4" font-weight="bold">AE</text>
</svg>
