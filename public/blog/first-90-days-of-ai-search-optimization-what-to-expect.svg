<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1525"/>
      <stop offset="50%" style="stop-color:#1a2845"/>
      <stop offset="100%" style="stop-color:#0b1a32"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Timeline visualization -->
  <line x1="100" y1="150" x2="1100" y2="150" stroke="#FF6A00" stroke-width="1.5" opacity="0.15"/>

  <!-- Day 1 marker -->
  <circle cx="150" cy="150" r="8" fill="#FF6A00" opacity="0.2"/>
  <text x="150" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" opacity="0.15">Day 1</text>

  <!-- Day 30 marker -->
  <circle cx="400" cy="150" r="8" fill="#FF6A00" opacity="0.2"/>
  <text x="400" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" opacity="0.15">Day 30</text>
  <rect x="340" y="90" width="120" height="40" rx="6" stroke="#FF6A00" stroke-width="0.8" fill="none" opacity="0.08"/>
  <text x="400" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" opacity="0.1">Foundation</text>

  <!-- Day 60 marker -->
  <circle cx="650" cy="150" r="8" fill="#FF6A00" opacity="0.2"/>
  <text x="650" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" opacity="0.15">Day 60</text>
  <rect x="590" y="90" width="120" height="40" rx="6" stroke="#FF6A00" stroke-width="0.8" fill="none" opacity="0.08"/>
  <text x="650" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" opacity="0.1">Signals</text>

  <!-- Day 90 marker -->
  <circle cx="900" cy="150" r="10" fill="#FF6A00" opacity="0.25"/>
  <text x="900" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" opacity="0.15">Day 90</text>
  <rect x="840" y="90" width="120" height="40" rx="6" stroke="#FF6A00" stroke-width="0.8" fill="none" opacity="0.08"/>
  <text x="900" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" opacity="0.1">Results</text>

  <!-- Growth curve -->
  <path d="M150 250 Q300 248 400 240 Q500 230 650 200 Q750 175 900 130 Q1000 100 1100 70" stroke="#FF6A00" stroke-width="1.2" fill="none" opacity="0.1"/>

  <!-- Subtle chart bars at bottom -->
  <rect x="200" y="510" width="30" height="20" rx="2" fill="#FF6A00" opacity="0.05"/>
  <rect x="250" y="500" width="30" height="30" rx="2" fill="#FF6A00" opacity="0.06"/>
  <rect x="300" y="485" width="30" height="45" rx="2" fill="#FF6A00" opacity="0.07"/>
  <rect x="350" y="470" width="30" height="60" rx="2" fill="#FF6A00" opacity="0.08"/>
  <rect x="400" y="450" width="30" height="80" rx="2" fill="#FF6A00" opacity="0.09"/>

  <!-- Category pill -->
  <rect x="80" y="320" width="150" height="32" rx="16" fill="#FF6A00" opacity="0.15"/>
  <text x="155" y="342" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#FF6A00" font-weight="600">Getting Started</text>

  <!-- Title -->
  <text x="80" y="400" font-family="system-ui, sans-serif" font-size="40" fill="white" font-weight="bold">The First 90 Days of AI</text>
  <text x="80" y="450" font-family="system-ui, sans-serif" font-size="40" fill="white" font-weight="bold">Search Optimization:</text>
  <text x="80" y="500" font-family="system-ui, sans-serif" font-size="40" fill="#FF6A00" font-weight="bold">What to Actually Expect</text>

  <!-- Watermark -->
  <text x="600" y="600" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="white" opacity="0.3" letter-spacing="4">THE ANSWER ENGINE</text>

  <!-- AE circle -->
  <circle cx="1130" cy="560" r="30" fill="none" stroke="#FF6A00" stroke-width="1.5" opacity="0.3"/>
  <text x="1130" y="568" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#FF6A00" opacity="0.4" font-weight="bold">AE</text>
</svg>
