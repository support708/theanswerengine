<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgBing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1220;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1008;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="centerGlowBing" cx="50%" cy="52%" r="26%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#FF6A00;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="bingNodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#008373;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#008373;stop-opacity:0"/>
    </radialGradient>
    <filter id="glowHard"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="14" result="bs"/><feMerge><feMergeNode in="bs"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="nodeShadowBing"><feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#FF6A00" flood-opacity="0.45"/></filter>
    <filter id="bingShadow"><feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#008373" flood-opacity="0.5"/></filter>
    <pattern id="gridBing" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgBing)"/>
  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#gridBing)"/>
  <!-- Center glow -->
  <rect width="1200" height="630" fill="url(#centerGlowBing)"/>

  <!-- ── TITLE BLOCK ── -->
  <text x="600" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="rgba(255,106,0,0.9)" text-anchor="middle" letter-spacing="4">AI ALGORITHM SERIES</text>
  <text x="600" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="white" text-anchor="middle">How Bing Generative Search</text>
  <text x="600" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#FF6A00" text-anchor="middle">Picks Businesses to Recommend</text>
  <text x="600" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="rgba(255,255,255,0.45)" text-anchor="middle">Copilot · DuckDuckGo · ChatGPT &mdash; all powered by one index</text>

  <!-- ── CENTRAL BING NODE ── -->
  <!-- Bing blue glow behind central node -->
  <circle cx="600" cy="370" r="90" fill="url(#bingNodeGlow)" opacity="0.7"/>
  <!-- Outer dashed ring -->
  <circle cx="600" cy="370" r="76" fill="none" stroke="#FF6A00" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.35"/>
  <!-- Middle ring -->
  <circle cx="600" cy="370" r="58" fill="none" stroke="#FF6A00" stroke-width="1" opacity="0.2"/>
  <!-- Core circle -->
  <circle cx="600" cy="370" r="50" fill="#0d1a20" stroke="#008373" stroke-width="2.5" filter="url(#bingShadow)"/>
  <text x="600" y="362" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#008373" text-anchor="middle" letter-spacing="2">BING</text>
  <text x="600" y="376" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="rgba(0,131,115,0.75)" text-anchor="middle" letter-spacing="1.5">INDEX</text>
  <text x="600" y="389" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="rgba(255,106,0,0.7)" text-anchor="middle" letter-spacing="1">+ ENTITY MODEL</text>

  <!-- ── PLATFORM NODES (Copilot, DuckDuckGo, ChatGPT) feeding INTO Bing ── -->

  <!-- Copilot — upper left (280, 250) -->
  <circle cx="280" cy="258" r="52" fill="#0d1220" stroke="#FF6A00" stroke-width="2" filter="url(#nodeShadowBing)" opacity="0.95"/>
  <text x="280" y="250" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="1">MICROSOFT</text>
  <text x="280" y="264" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="1">COPILOT</text>
  <text x="280" y="278" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="rgba(255,255,255,0.4)" text-anchor="middle">100M+ users</text>
  <text x="280" y="218" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.4)" text-anchor="middle">Platform 1</text>

  <!-- DuckDuckGo — upper right (920, 258) -->
  <circle cx="920" cy="258" r="52" fill="#0d1220" stroke="#FF6A00" stroke-width="2" filter="url(#nodeShadowBing)" opacity="0.9"/>
  <text x="920" y="250" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="0.5">DUCKDUCKGO</text>
  <text x="920" y="265" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="rgba(255,106,0,0.75)" text-anchor="middle">~60% Bing results</text>
  <text x="920" y="278" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="rgba(255,255,255,0.4)" text-anchor="middle">privacy-first</text>
  <text x="920" y="218" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.4)" text-anchor="middle">Platform 2</text>

  <!-- ChatGPT — bottom center (600, 530) -->
  <circle cx="600" cy="528" r="52" fill="#0d1220" stroke="#FF6A00" stroke-width="2" filter="url(#nodeShadowBing)" opacity="0.9"/>
  <text x="600" y="520" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="0.5">CHATGPT</text>
  <text x="600" y="534" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="rgba(255,106,0,0.75)" text-anchor="middle">web search layer</text>
  <text x="600" y="547" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="rgba(255,255,255,0.4)" text-anchor="middle">OpenAI, 2024</text>

  <!-- ── CONNECTOR LINES (platforms → Bing central node) ── -->
  <!-- Copilot → Bing -->
  <line x1="328" y1="278" x2="558" y2="340" stroke="#FF6A00" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.5"/>
  <!-- DuckDuckGo → Bing -->
  <line x1="872" y1="278" x2="642" y2="340" stroke="#FF6A00" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.5"/>
  <!-- ChatGPT → Bing -->
  <line x1="600" y1="476" x2="600" y2="420" stroke="#FF6A00" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.5"/>

  <!-- Arrow tips on lines -->
  <!-- Copilot arrow -->
  <polygon points="558,340 546,330 550,343" fill="#FF6A00" opacity="0.6"/>
  <!-- DuckDuckGo arrow -->
  <polygon points="642,340 650,330 646,343" fill="#FF6A00" opacity="0.6"/>
  <!-- ChatGPT arrow -->
  <polygon points="600,420 593,408 607,408" fill="#FF6A00" opacity="0.6"/>

  <!-- ── KEY SIGNALS (right side mini-nodes) ── -->
  <!-- Bing Places verification -->
  <rect x="990" y="310" width="160" height="38" rx="6" fill="#0d1a14" stroke="rgba(255,106,0,0.4)" stroke-width="1"/>
  <text x="1070" y="325" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="0.5">BING PLACES</text>
  <text x="1070" y="339" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle">3-5x citation lift</text>

  <!-- Reputability -->
  <rect x="990" y="360" width="160" height="38" rx="6" fill="#0d1a14" stroke="rgba(255,106,0,0.4)" stroke-width="1"/>
  <text x="1070" y="375" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="0.5">REPUTABILITY</text>
  <text x="1070" y="389" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle">discrete Bing factor</text>

  <!-- Index Gap -->
  <rect x="990" y="410" width="160" height="38" rx="6" fill="#0d1a14" stroke="rgba(255,106,0,0.4)" stroke-width="1"/>
  <text x="1070" y="425" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="0.5">INDEX GAP</text>
  <text x="1070" y="439" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle">~40% vs Google</text>

  <!-- Connector from Bing to signals panel -->
  <line x1="650" y1="370" x2="985" y2="370" stroke="#FF6A00" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>

  <!-- ── STAT CALLOUTS (left side) ── -->
  <rect x="50" y="310" width="160" height="38" rx="6" fill="#0d1a14" stroke="rgba(255,106,0,0.4)" stroke-width="1"/>
  <text x="130" y="325" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="0.5">83% CHATGPT</text>
  <text x="130" y="339" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle">matches Bing Shopping top 40</text>

  <rect x="50" y="360" width="160" height="38" rx="6" fill="#0d1a14" stroke="rgba(255,106,0,0.4)" stroke-width="1"/>
  <text x="130" y="375" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="0.5">+57% CITATIONS</text>
  <text x="130" y="389" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle">definition-first content</text>

  <rect x="50" y="410" width="160" height="38" rx="6" fill="#0d1a14" stroke="rgba(255,106,0,0.4)" stroke-width="1"/>
  <text x="130" y="425" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="0.5">INDEXNOW</text>
  <text x="130" y="439" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle">real-time Bing notification</text>

  <!-- Connector from signals panel to Bing -->
  <line x1="215" y1="370" x2="548" y2="370" stroke="#FF6A00" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>

  <!-- ── BOTTOM STRIP ── -->
  <rect x="0" y="600" width="1200" height="30" fill="#FF6A00" opacity="0.07"/>
  <text x="600" y="620" font-family="system-ui, sans-serif" font-size="13" fill="#FF6A00" text-anchor="middle" font-weight="700" letter-spacing="3">THE ANSWER ENGINE &mdash; theanswerengine.ai</text>
</svg>
