<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Competitive gap visual: two business columns -->
  <rect x="850" y="120" width="100" height="200" rx="8" stroke="rgba(255,106,0,0.2)" stroke-width="1" fill="rgba(255,106,0,0.06)"/>
  <circle cx="900" cy="170" r="16" fill="rgba(255,106,0,0.15)"/>
  <circle cx="900" cy="210" r="12" fill="rgba(255,106,0,0.1)"/>
  <circle cx="900" cy="245" r="9" fill="rgba(255,106,0,0.08)"/>
  <text x="880" y="300" font-family="monospace" font-size="11" fill="rgba(255,106,0,0.4)">CITED</text>
  <rect x="1020" y="120" width="100" height="200" rx="8" stroke="rgba(255,106,0,0.1)" stroke-width="0.5" fill="none" stroke-dasharray="4 4"/>
  <text x="1040" y="300" font-family="monospace" font-size="11" fill="rgba(255,106,0,0.15)">INVISIBLE</text>
  <!-- Connection lines -->
  <line x1="960" y1="170" x2="1010" y2="170" stroke="rgba(255,106,0,0.12)" stroke-width="0.5"/>
  <line x1="960" y1="220" x2="1010" y2="220" stroke="rgba(255,106,0,0.08)" stroke-width="0.5"/>
  <!-- Decorative circles -->
  <circle cx="1100" cy="500" r="80" stroke="rgba(255,106,0,0.05)" stroke-width="0.5" fill="none"/>
  <circle cx="1100" cy="500" r="50" stroke="rgba(255,106,0,0.04)" stroke-width="0.5" fill="none"/>
  <!-- Category pill -->
  <rect x="40" y="40" width="170" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="125" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">Business Pain Points</text>
  <!-- Title -->
  <text x="80" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Why Is My Competitor</text>
  <text x="80" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">on AI Search</text>
  <text x="80" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00">but Not Me?</text>
  <!-- Footer -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>
