<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgWIMC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b0d0d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1a3b;stop-opacity:1" />
    </linearGradient>
    <filter id="glowWIMC"><feGaussianBlur stdDeviation="6" result="blurWIMC"/><feMerge><feMergeNode in="blurWIMC"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgWIMC)"/>
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <!-- Competitor Gap Analysis -->
  <g transform="translate(660, 45)">
    <rect x="0" y="0" width="470" height="470" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="235" y="28" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600">COMPETITOR GAP ANALYSIS</text>
    <!-- Split comparison -->
    <rect x="20" y="42" width="205" height="200" rx="8" fill="rgba(255,80,80,0.06)" stroke="rgba(255,80,80,0.4)" stroke-width="1.5"/>
    <text x="122" y="62" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,80,80,0.9)" text-anchor="middle" font-weight="600">YOUR BUSINESS</text>
    <text x="32" y="88" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.85)">&#x2717; Schema Markup</text>
    <text x="32" y="106" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.85)">&#x2717; Bing Places</text>
    <text x="32" y="124" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.85)">&#x2717; Authority Content</text>
    <text x="32" y="142" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.85)">&#x2717; NAP Consistency</text>
    <text x="32" y="160" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.85)">&#x2717; Directory Citations</text>
    <text x="122" y="195" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">AI VISIBILITY</text>
    <text x="122" y="225" font-family="system-ui, sans-serif" font-size="24" fill="rgba(255,80,80,0.9)" text-anchor="middle" font-weight="700">0%</text>
    <rect x="245" y="42" width="205" height="200" rx="8" fill="rgba(100,220,100,0.06)" stroke="rgba(100,220,100,0.5)" stroke-width="1.5"/>
    <text x="347" y="62" font-family="system-ui, sans-serif" font-size="10" fill="rgba(100,220,100,0.9)" text-anchor="middle" font-weight="600">COMPETITOR</text>
    <text x="257" y="88" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; Schema Markup</text>
    <text x="257" y="106" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; Bing Places</text>
    <text x="257" y="124" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; Authority Content</text>
    <text x="257" y="142" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; NAP Consistency</text>
    <text x="257" y="160" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)">&#x2713; Directory Citations</text>
    <text x="347" y="195" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">AI VISIBILITY</text>
    <text x="347" y="225" font-family="system-ui, sans-serif" font-size="24" fill="#FF6A00" text-anchor="middle" font-weight="700" filter="url(#glowWIMC)">94%</text>
    <!-- VS badge -->
    <rect x="200" y="125" width="70" height="30" rx="15" fill="rgba(255,106,0,0.2)" stroke="#FF6A00" stroke-width="1.5"/>
    <text x="235" y="145" font-family="system-ui, sans-serif" font-size="14" fill="#FF6A00" text-anchor="middle" font-weight="700">VS</text>
    <!-- Citation counts -->
    <text x="20" y="270" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">AI CITATIONS PER MONTH</text>
    <text x="20" y="298" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.85)">You</text>
    <rect x="80" y="287" width="370" height="16" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="80" y="287" width="10" height="16" rx="3" fill="rgba(255,80,80,0.5)"/>
    <text x="100" y="299" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,80,80,0.9)" font-weight="700">0</text>
    <text x="20" y="323" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.85)">Competitor</text>
    <rect x="80" y="312" width="370" height="16" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="80" y="312" width="310" height="16" rx="3" fill="rgba(100,220,100,0.5)"/>
    <text x="400" y="324" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.9)" font-weight="700">47</text>
    <!-- What they did that you didn't -->
    <line x1="20" y1="345" x2="450" y2="345" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <text x="20" y="370" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="600">WHAT THEY DID 6 MONTHS AGO</text>
    <text x="30" y="395" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.7)">1. Deployed LocalBusiness + FAQ schema</text>
    <text x="30" y="413" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.7)">2. Claimed and optimized Bing Places</text>
    <text x="30" y="431" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.7)">3. Published Q&amp;A authority content weekly</text>
    <!-- Bottom CTA -->
    <rect x="260" y="440" width="190" height="20" rx="4" fill="rgba(255,106,0,0.15)" stroke="#FF6A00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="355" y="455" font-family="system-ui, sans-serif" font-size="9" fill="#FF6A00" text-anchor="middle" font-weight="600">Close the gap in 4-8 weeks</text>
  </g>
  <circle cx="100" cy="130" r="60" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <rect x="40" y="40" width="170" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="125" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">Business Pain Point</text>
  <text x="80" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Why Is My Competitor</text>
  <text x="80" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">on AI Search</text>
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glowWIMC)">but Not Me?</text>
  <text x="80" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">The 5-Point Gap Analysis</text>
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
