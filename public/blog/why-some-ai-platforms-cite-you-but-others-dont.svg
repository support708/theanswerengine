<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgCP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1424;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2a1a08;stop-opacity:1"/>
    </linearGradient>
    <filter id="glowCP"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoftCP"><feGaussianBlur stdDeviation="14" result="bs"/><feMerge><feMergeNode in="bs"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowOrange"><feGaussianBlur stdDeviation="8" result="bo"/><feMerge><feMergeNode in="bo"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgCP)"/>

  <!-- Subtle grid -->
  <pattern id="gridCP" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#gridCP)"/>

  <!-- Title block -->
  <text x="600" y="68" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#FF6A00" text-anchor="middle" letter-spacing="4">DIAGNOSTIC GUIDE</text>
  <text x="600" y="112" font-family="system-ui, sans-serif" font-size="40" font-weight="800" fill="white" text-anchor="middle">The Cross-Platform Citation Gap</text>
  <text x="600" y="148" font-family="system-ui, sans-serif" font-size="17" fill="rgba(255,255,255,0.5)" text-anchor="middle">Why ChatGPT recommends you but Perplexity doesn&#8217;t</text>

  <!-- Platform windows row -->
  <!-- ChatGPT window: CITED (glowing) -->
  <g transform="translate(60, 195)">
    <rect x="0" y="0" width="230" height="140" rx="12" fill="rgba(255,106,0,0.08)" stroke="#FF6A00" stroke-width="1.5" filter="url(#glowOrange)"/>
    <rect x="0" y="0" width="230" height="32" rx="12" fill="rgba(255,106,0,0.18)"/>
    <rect x="0" y="20" width="230" height="12" fill="rgba(255,106,0,0.18)"/>
    <text x="115" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">ChatGPT</text>
    <!-- Cited badge -->
    <rect x="55" y="50" width="120" height="30" rx="8" fill="rgba(255,106,0,0.25)" stroke="#FF6A00" stroke-width="1"/>
    <text x="115" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FF6A00" text-anchor="middle">&#10003; CITED</text>
    <!-- Data source label -->
    <text x="115" y="105" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.45)" text-anchor="middle">Reddit + Web Crawl</text>
    <text x="115" y="120" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.6)" text-anchor="middle">Training data heavy</text>
  </g>

  <!-- Perplexity window: EMPTY -->
  <g transform="translate(315, 195)">
    <rect x="0" y="0" width="230" height="140" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="32" rx="12" fill="rgba(255,255,255,0.06)"/>
    <rect x="0" y="20" width="230" height="12" fill="rgba(255,255,255,0.06)"/>
    <text x="115" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="rgba(255,255,255,0.6)" text-anchor="middle">Perplexity</text>
    <!-- Empty / question mark -->
    <text x="115" y="78" font-family="system-ui, sans-serif" font-size="32" fill="rgba(255,255,255,0.12)" text-anchor="middle">?</text>
    <text x="115" y="105" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.3)" text-anchor="middle">Top-10 SERP results</text>
    <text x="115" y="120" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.2)" text-anchor="middle">Live search heavy</text>
  </g>

  <!-- Gemini window: PARTIAL (warning) -->
  <g transform="translate(570, 195)">
    <rect x="0" y="0" width="230" height="140" rx="12" fill="rgba(255,200,0,0.04)" stroke="rgba(255,200,0,0.3)" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="32" rx="12" fill="rgba(255,200,0,0.08)"/>
    <rect x="0" y="20" width="230" height="12" fill="rgba(255,200,0,0.08)"/>
    <text x="115" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="rgba(255,200,0,0.7)" text-anchor="middle">Gemini</text>
    <rect x="40" y="50" width="150" height="30" rx="8" fill="rgba(255,200,0,0.1)" stroke="rgba(255,200,0,0.4)" stroke-width="1"/>
    <text x="115" y="70" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="rgba(255,200,0,0.8)" text-anchor="middle">&#9888; PARTIAL / WRONG DATA</text>
    <text x="115" y="105" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.3)" text-anchor="middle">Google Index + Maps</text>
    <text x="115" y="120" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,200,0,0.4)" text-anchor="middle">Knowledge Graph dependent</text>
  </g>

  <!-- Claude window: CITED -->
  <g transform="translate(825, 195)">
    <rect x="0" y="0" width="230" height="140" rx="12" fill="rgba(255,106,0,0.06)" stroke="rgba(255,106,0,0.4)" stroke-width="1.5" filter="url(#glowSoftCP)"/>
    <rect x="0" y="0" width="230" height="32" rx="12" fill="rgba(255,106,0,0.12)"/>
    <rect x="0" y="20" width="230" height="12" fill="rgba(255,106,0,0.12)"/>
    <text x="115" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="middle">Claude</text>
    <rect x="55" y="50" width="120" height="30" rx="8" fill="rgba(255,106,0,0.18)" stroke="rgba(255,106,0,0.5)" stroke-width="1"/>
    <text x="115" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FF6A00" text-anchor="middle">&#10003; CITED</text>
    <text x="115" y="105" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.3)" text-anchor="middle">Brave Search + Training</text>
    <text x="115" y="120" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.5)" text-anchor="middle">Constitutional + live web</text>
  </g>

  <!-- Connector lines from data sources to platform windows -->
  <!-- Reddit icon to ChatGPT -->
  <line x1="175" y1="335" x2="175" y2="380" stroke="rgba(255,106,0,0.4)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- SERP icon to Perplexity -->
  <line x1="430" y1="335" x2="430" y2="380" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- KG icon to Gemini -->
  <line x1="685" y1="335" x2="685" y2="380" stroke="rgba(255,200,0,0.25)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- Web icon to Claude -->
  <line x1="940" y1="335" x2="940" y2="380" stroke="rgba(255,106,0,0.3)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Data source labels row -->
  <g transform="translate(60, 390)">
    <!-- Reddit -->
    <rect x="45" y="0" width="120" height="36" rx="8" fill="rgba(255,106,0,0.12)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
    <text x="105" y="23" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle" font-weight="600">Reddit / Training</text>
  </g>
  <g transform="translate(315, 390)">
    <rect x="45" y="0" width="120" height="36" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="105" y="23" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-weight="600">Search Index</text>
  </g>
  <g transform="translate(570, 390)">
    <rect x="45" y="0" width="120" height="36" rx="8" fill="rgba(255,200,0,0.06)" stroke="rgba(255,200,0,0.2)" stroke-width="1"/>
    <text x="105" y="23" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,200,0,0.6)" text-anchor="middle" font-weight="600">Knowledge Graph</text>
  </g>
  <g transform="translate(825, 390)">
    <rect x="45" y="0" width="120" height="36" rx="8" fill="rgba(255,106,0,0.08)" stroke="rgba(255,106,0,0.25)" stroke-width="1"/>
    <text x="105" y="23" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,106,0,0.7)" text-anchor="middle" font-weight="600">Brave Search</text>
  </g>

  <!-- Stat strip -->
  <rect x="100" y="456" width="1000" height="56" rx="10" fill="rgba(255,106,0,0.06)" stroke="rgba(255,106,0,0.15)" stroke-width="1"/>
  <text x="250" y="480" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">Only 14% of businesses</text>
  <text x="250" y="497" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle" font-weight="700">appear on ALL 4 platforms</text>
  <line x1="400" y1="466" x2="400" y2="502" stroke="rgba(255,106,0,0.2)" stroke-width="1"/>
  <text x="600" y="480" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">ChatGPT cites Reddit 40% of the time</text>
  <text x="600" y="497" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle" font-weight="700">vs Perplexity only 12%</text>
  <line x1="800" y1="466" x2="800" y2="502" stroke="rgba(255,106,0,0.2)" stroke-width="1"/>
  <text x="950" y="480" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">73% of Perplexity citations</text>
  <text x="950" y="497" font-family="system-ui, sans-serif" font-size="11" fill="#FF6A00" text-anchor="middle" font-weight="700">from top-10 Google results</text>

  <!-- Bottom strip -->
  <rect x="0" y="600" width="1200" height="30" fill="#FF6A00" opacity="0.08"/>
  <text x="600" y="620" font-family="system-ui, sans-serif" font-size="14" fill="#FF6A00" text-anchor="middle" font-weight="700" letter-spacing="3">THE ANSWER ENGINE</text>
</svg>
