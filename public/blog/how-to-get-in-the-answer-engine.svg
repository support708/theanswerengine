    <!-- Step 1 -->
    <rect x="20" y="45" width="400" height="65" rx="8" fill="rgba(255,106,0,0.08)" stroke="#FF6A00" stroke-width="1.5" filter="url(#glow11)"/>
    <circle cx="50" cy="77" r="16" fill="rgba(255,106,0,0.2)" stroke="#FF6A00" stroke-width="1.5"/>
    <text x="50" y="82" font-family="system-ui, sans-serif" font-size="14" fill="#FF6A00" text-anchor="middle" font-weight="700">1</text>
    <text x="80" y="72" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" font-weight="600">Audit Your AI Visibility</text>
    <text x="80" y="90" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.35)">Search your business on ChatGPT, Gemini, Perplexity</text>
    <text x="80" y="104" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.5)">&#x2192; Baseline your current citation status</text>
    <!-- Connector -->
    <line x1="220" y1="110" x2="220" y2="125" stroke="rgba(255,106,0,0.3)" stroke-width="1.5"/>
    <polygon points="215,123 220,133 225,123" fill="rgba(255,106,0,0.3)"/>
    <!-- Step 2 -->
    <rect x="20" y="135" width="400" height="65" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="50" cy="167" r="16" fill="rgba(100,220,100,0.12)" stroke="rgba(100,220,100,0.4)" stroke-width="1.5"/>
    <text x="50" y="172" font-family="system-ui, sans-serif" font-size="14" fill="rgba(100,220,100,0.7)" text-anchor="middle" font-weight="700">2</text>
    <text x="80" y="162" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" font-weight="600">Deploy Schema Markup</text>
    <text x="80" y="180" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.3)">LocalBusiness, FAQ, Review, Service schemas</text>
    <text x="80" y="194" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,220,100,0.5)">&#x2192; Make your data machine-readable</text>
    <!-- Connector -->
