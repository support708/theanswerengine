    <circle cx="50" cy="257" r="16" fill="rgba(100,150,255,0.12)" stroke="rgba(100,150,255,0.4)" stroke-width="1.5"/>
    <text x="50" y="262" font-family="system-ui, sans-serif" font-size="14" fill="rgba(100,150,255,0.7)" text-anchor="middle" font-weight="700">3</text>
    <text x="80" y="252" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" font-weight="600">Build Authority Content</text>
    <text x="80" y="270" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.3)">Expert Q&amp;A pages, detailed service descriptions</text>
    <text x="80" y="284" font-family="system-ui, sans-serif" font-size="9" fill="rgba(100,150,255,0.5)">&#x2192; Create content AI wants to cite</text>
    <!-- Connector -->
    <line x1="220" y1="290" x2="220" y2="305" stroke="rgba(255,106,0,0.2)" stroke-width="1.5"/>
    <polygon points="215,303 220,313 225,303" fill="rgba(255,106,0,0.2)"/>
    <!-- Step 4 -->
    <rect x="20" y="315" width="400" height="65" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="50" cy="347" r="16" fill="rgba(255,200,50,0.12)" stroke="rgba(255,200,50,0.4)" stroke-width="1.5"/>
    <text x="50" y="352" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,200,50,0.7)" text-anchor="middle" font-weight="700">4</text>
    <text x="80" y="342" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" font-weight="600">Fix NAP &amp; Citations</text>
    <text x="80" y="360" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.3)">Consistent info across all directories and platforms</text>
    <text x="80" y="374" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,200,50,0.5)">&#x2192; Eliminate conflicting signals</text>
    <!-- Connector -->
    <line x1="220" y1="380" x2="220" y2="395" stroke="rgba(255,106,0,0.15)" stroke-width="1.5"/>
    <polygon points="215,393 220,403 225,393" fill="rgba(255,106,0,0.15)"/>
    <!-- Step 5 -->
    <rect x="20" y="405" width="400" height="65" rx="8" fill="rgba(255,106,0,0.06)" stroke="rgba(255,106,0,0.2)" stroke-width="1"/>
    <circle cx="50" cy="437" r="16" fill="rgba(200,150,255,0.12)" stroke="rgba(200,150,255,0.4)" stroke-width="1.5"/>
    <text x="50" y="442" font-family="system-ui, sans-serif" font-size="14" fill="rgba(200,150,255,0.7)" text-anchor="middle" font-weight="700">5</text>
    <text x="80" y="432" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" font-weight="600">Monitor &amp; Optimize</text>
    <text x="80" y="450" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.3)">Track AI citations, adjust strategy, expand coverage</text>
    <text x="80" y="464" font-family="system-ui, sans-serif" font-size="9" fill="rgba(200,150,255,0.5)">&#x2192; Continuous improvement cycle</text>
  </g>
  <circle cx="100" cy="130" r="60" stroke="rgba(255,106,0,0.05)" stroke-width="0.5" fill="none"/>
  <rect x="40" y="40" width="160" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="120" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">Getting Started</text>
  <text x="80" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">How to Get In</text>
  <text x="80" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">the Answer</text>
  <text x="80" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glow11)">Engine</text>
  <text x="80" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">Your 5-Step Roadmap</text>
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>