      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d3b2b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow7"><feGaussianBlur stdDeviation="6" result="blur7"/><feMerge><feMergeNode in="blur7"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoft7"><feGaussianBlur stdDeviation="12" result="blur7s"/><feMerge><feMergeNode in="blur7s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg7)"/>
