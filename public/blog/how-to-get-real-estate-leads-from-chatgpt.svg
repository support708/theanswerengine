<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="How to Get Real Estate Leads from ChatGPT — The Answer Engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131313"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#FF6A00" stop-opacity="0.25"/>
      <stop offset="0.6" stop-color="#FF6A00" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FF6A00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8C3A"/>
      <stop offset="1" stop-color="#FF6A00"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid (subtle terminal pattern) -->
  <g stroke="#FF6A00" stroke-opacity="0.05">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- House silhouette glow -->
  <g transform="translate(820 200)" filter="url(#soft)" opacity="0.55">
    <polygon points="0,140 130,30 260,140 260,300 0,300" fill="#FF6A00"/>
  </g>

  <!-- House silhouette crisp -->
  <g transform="translate(820 200)">
    <polygon points="0,140 130,30 260,140 260,300 0,300" fill="none" stroke="url(#orange)" stroke-width="3"/>
    <rect x="105" y="200" width="50" height="100" fill="none" stroke="url(#orange)" stroke-width="2.5"/>
    <rect x="30" y="170" width="50" height="50" fill="none" stroke="url(#orange)" stroke-width="2"/>
    <rect x="180" y="170" width="50" height="50" fill="none" stroke="url(#orange)" stroke-width="2"/>
  </g>

  <!-- Left side text block -->
  <g font-family="Courier New, monospace" fill="#FF6A00" font-size="14" letter-spacing="2">
    <text x="80" y="100">[ THE ANSWER ENGINE / AEO ]</text>
  </g>

  <g font-family="'Space Grotesk', 'Helvetica Neue', sans-serif" font-weight="900" fill="#e5e2e1">
    <text x="80" y="190" font-size="56" letter-spacing="-1.5">REAL ESTATE</text>
    <text x="80" y="250" font-size="56" letter-spacing="-1.5">LEADS FROM</text>
    <text x="80" y="310" font-size="56" letter-spacing="-1.5" fill="#FF6A00">CHATGPT</text>
  </g>

  <!-- Subhead -->
  <g font-family="Inter, 'Helvetica Neue', sans-serif" fill="#e5e2e1" fill-opacity="0.65" font-size="20">
    <text x="80" y="370">The Complete AEO Guide for Residential Agents</text>
  </g>

  <!-- Stat row -->
  <g font-family="Courier New, monospace" font-size="13" fill="#e5e2e1" fill-opacity="0.55" letter-spacing="1.5">
    <text x="80" y="510">3–5 AGENTS CITED  ·  2.8x SCHEMA LIFT  ·  60–90 DAY CAPTURE</text>
  </g>

  <!-- Footer URL -->
  <g font-family="Courier New, monospace" font-size="13" fill="#FF6A00" letter-spacing="2">
    <text x="80" y="570">THEANSWERENGINE.AI / BLOG</text>
  </g>

  <!-- Orange accent rule -->
  <rect x="80" y="135" width="48" height="3" fill="#FF6A00"/>
</svg>
