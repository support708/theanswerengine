<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Personal Injury Law Firm AI Visibility Audit — The Answer Engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131313"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F27D24"/>
      <stop offset="100%" stop-color="#cc5500"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F27D24" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#F27D24" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#F27D24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient glow -->
  <ellipse cx="980" cy="180" rx="520" ry="340" fill="url(#glow)"/>
  <ellipse cx="180" cy="520" rx="380" ry="240" fill="url(#glow)" opacity="0.6"/>

  <!-- Diagnostic scan rings -->
  <g opacity="0.25" stroke="#F27D24" stroke-width="1" fill="none">
    <circle cx="980" cy="280" r="60"/>
    <circle cx="980" cy="280" r="110"/>
    <circle cx="980" cy="280" r="160"/>
    <circle cx="980" cy="280" r="210"/>
  </g>

  <!-- Citation node graph (4 platforms) -->
  <g transform="translate(980 280)">
    <line x1="0" y1="0" x2="-160" y2="-90" stroke="#F27D24" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="0" x2="170" y2="-60" stroke="#F27D24" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="0" x2="180" y2="80" stroke="#F27D24" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="0" x2="-150" y2="120" stroke="#F27D24" stroke-width="1" opacity="0.6"/>
    <circle cx="0" cy="0" r="10" fill="#F27D24"/>
    <circle cx="-160" cy="-90" r="6" fill="#F27D24" opacity="0.85"/>
    <circle cx="170" cy="-60" r="6" fill="#F27D24" opacity="0.85"/>
    <circle cx="180" cy="80" r="6" fill="#F27D24" opacity="0.85"/>
    <circle cx="-150" cy="120" r="6" fill="#F27D24" opacity="0.85"/>
    <text x="-180" y="-100" font-family="Courier New, monospace" font-size="11" fill="#F27D24" opacity="0.8" text-anchor="end">CHATGPT</text>
    <text x="190" y="-70" font-family="Courier New, monospace" font-size="11" fill="#F27D24" opacity="0.8">PERPLEXITY</text>
    <text x="200" y="92" font-family="Courier New, monospace" font-size="11" fill="#F27D24" opacity="0.8">AI OVERVIEWS</text>
    <text x="-170" y="132" font-family="Courier New, monospace" font-size="11" fill="#F27D24" opacity="0.8" text-anchor="end">CLAUDE</text>
  </g>

  <!-- Scan progress bar -->
  <g opacity="0.65">
    <rect x="0" y="455" width="1200" height="3" fill="url(#orange)"/>
    <rect x="120" y="465" width="900" height="2" fill="#F27D24" opacity="0.4"/>
    <rect x="320" y="475" width="640" height="2" fill="#F27D24" opacity="0.25"/>
  </g>

  <!-- Category tag -->
  <g transform="translate(80 90)">
    <rect x="0" y="0" width="200" height="32" rx="0" fill="#F27D24" fill-opacity="0.1" stroke="#F27D24" stroke-opacity="0.35" stroke-width="1"/>
    <text x="14" y="22" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#F27D24" letter-spacing="2">AI VISIBILITY AUDIT</text>
  </g>

  <!-- Main headline -->
  <g transform="translate(80 180)">
    <text font-family="Space Grotesk, Inter, sans-serif" font-weight="900" font-size="64" fill="#e5e2e1" letter-spacing="-3">
      <tspan x="0" y="0">PERSONAL INJURY</tspan>
      <tspan x="0" y="72">LAW FIRM AI</tspan>
      <tspan x="0" y="144" fill="#F27D24">VISIBILITY AUDIT</tspan>
    </text>
  </g>

  <!-- Subline -->
  <g transform="translate(80 510)">
    <text font-family="Inter, sans-serif" font-size="20" fill="#e5e2e1" fill-opacity="0.6" letter-spacing="0">
      <tspan x="0" y="0">The 90-day citation share diagnostic for PI firms that intend</tspan>
      <tspan x="0" y="28">to be named when ChatGPT and Perplexity answer.</tspan>
    </text>
  </g>

  <!-- Brand mark -->
  <g transform="translate(1080 580)">
    <text font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#F27D24" letter-spacing="2" text-anchor="end">THEANSWERENGINE.AI</text>
  </g>

  <!-- Corner accent ticks -->
  <g stroke="#F27D24" stroke-width="2" fill="none" opacity="0.5">
    <path d="M 60 60 L 60 80 L 80 80"/>
    <path d="M 1140 60 L 1140 80 L 1120 80"/>
    <path d="M 60 570 L 60 550 L 80 550"/>
    <path d="M 1140 570 L 1140 550 L 1120 550"/>
  </g>
</svg>
