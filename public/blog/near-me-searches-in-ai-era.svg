<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgNM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1410;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1f2e;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="pinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#FF6A00;stop-opacity:0"/>
    </radialGradient>
    <filter id="glowNM"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoftNM"><feGaussianBlur stdDeviation="14" result="bs"/><feMerge><feMergeNode in="bs"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgNM)"/>
  <!-- Geo grid -->
  <g opacity="0.08" stroke="#FF6A00" stroke-width="0.5" fill="none">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <!-- Left: Old map pin (faded) -->
  <g transform="translate(220, 290)" opacity="0.35">
    <ellipse cx="0" cy="120" rx="42" ry="9" fill="rgba(255,255,255,0.15)"/>
    <path d="M 0 -50 C -36 -50 -60 -22 -60 12 C -60 50 0 110 0 110 C 0 110 60 50 60 12 C 60 -22 36 -50 0 -50 Z" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
    <circle cx="0" cy="0" r="22" fill="#0F1117" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-weight="700">NEAR ME</text>
  </g>
  <text x="220" y="475" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-weight="600" letter-spacing="2">2015-2024</text>
  <!-- Arrow center -->
  <g transform="translate(600, 320)">
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#FF6A00" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
    <polygon points="80,-10 100,0 80,10" fill="#FF6A00"/>
  </g>
  <!-- Right: New AI search bubble -->
  <g transform="translate(960, 290)">
    <circle cx="0" cy="0" r="120" fill="url(#pinGlow)" filter="url(#glowSoftNM)"/>
    <rect x="-110" y="-46" width="220" height="92" rx="46" fill="rgba(255,106,0,0.12)" stroke="#FF6A00" stroke-width="1.5" filter="url(#glowNM)"/>
    <text x="0" y="-12" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.55)" text-anchor="middle" font-weight="500">"Find me a..."</text>
    <text x="0" y="14" font-family="system-ui, sans-serif" font-size="16" fill="#FF6A00" text-anchor="middle" font-weight="700">AI Local Intent</text>
    <text x="0" y="34" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">conversational + multi-constraint</text>
  </g>
  <text x="960" y="475" font-family="system-ui, sans-serif" font-size="14" fill="#FF6A00" text-anchor="middle" font-weight="700" letter-spacing="2">2026 AND BEYOND</text>
  <!-- Title -->
  <text x="600" y="80" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="white" text-anchor="middle">The "Near Me" Era Is Ending</text>
  <text x="600" y="125" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="rgba(255,255,255,0.55)" text-anchor="middle">68% of local queries now trigger AI Overviews</text>
  <!-- Bottom brand strip -->
  <rect x="0" y="600" width="1200" height="30" fill="#FF6A00" opacity="0.08"/>
  <text x="600" y="620" font-family="system-ui, sans-serif" font-size="14" fill="#FF6A00" text-anchor="middle" font-weight="700" letter-spacing="3">THE ANSWER ENGINE</text>
</svg>
