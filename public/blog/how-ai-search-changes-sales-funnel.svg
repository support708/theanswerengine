<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg22" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e0d4e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2e3b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow22"><feGaussianBlur stdDeviation="6" result="blur22"/><feMerge><feMergeNode in="blur22"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg22)"/>
  <line x1="0" y1="126" x2="1200" y2="126" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,106,0,0.05)" stroke-width="0.5"/>
  <!-- Funnel diagram comparison: Traditional vs AI -->
  <g transform="translate(660, 45)">
    <rect x="0" y="0" width="470" height="470" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Traditional funnel (left, faded) -->
    <text x="115" y="28" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.3)" text-anchor="middle" font-weight="600">TRADITIONAL</text>
    <!-- Funnel trapezoids -->
    <polygon points="30,45 200,45 185,100 45,100" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="115" y="78" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.3)" text-anchor="middle">AWARENESS</text>
    <text x="115" y="92" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.15)" text-anchor="middle">Google search, ads</text>
    <polygon points="45,105 185,105 170,160 60,160" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="115" y="138" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.25)" text-anchor="middle">CONSIDERATION</text>
    <text x="115" y="152" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.12)" text-anchor="middle">Visit website, compare</text>
    <polygon points="60,165 170,165 155,220 75,220" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <text x="115" y="198" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.2)" text-anchor="middle">DECISION</text>
    <text x="115" y="212" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.1)" text-anchor="middle">Read reviews, get quotes</text>
    <polygon points="75,225 155,225 140,275 90,275" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <text x="115" y="255" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.15)" text-anchor="middle">ACTION</text>
    <!-- VS divider -->
    <line x1="230" y1="40" x2="230" y2="280" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="230" y="160" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.15)" text-anchor="middle" font-weight="700">VS</text>
    <!-- AI funnel (right, glowing) -->
    <text x="355" y="28" font-family="system-ui, sans-serif" font-size="10" fill="#FF6A00" text-anchor="middle" font-weight="600">AI-POWERED</text>
    <!-- Compressed funnel -->
    <polygon points="270,45 440,45 425,120 285,120" fill="rgba(255,106,0,0.06)" stroke="rgba(255,106,0,0.2)" stroke-width="1.5"/>
    <text x="355" y="72" font-family="system-ui, sans-serif" font-size="9" fill="#FF6A00" text-anchor="middle" font-weight="600">ASK AI</text>
    <text x="355" y="88" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.3)" text-anchor="middle">"Best plumber near me?"</text>
    <text x="355" y="112" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,106,0,0.5)" text-anchor="middle">Awareness + Consideration</text>
    <!-- Arrow skip -->
    <line x1="355" y1="125" x2="355" y2="140" stroke="#FF6A00" stroke-width="2"/>
    <polygon points="348,138 355,148 362,138" fill="#FF6A00"/>
    <rect x="315" y="130" width="80" height="14" rx="3" fill="rgba(255,106,0,0.15)"/>
    <text x="355" y="140" font-family="system-ui, sans-serif" font-size="7" fill="#FF6A00" text-anchor="middle" font-weight="600">SKIP 70%</text>
    <polygon points="285,155 425,155 400,230 310,230" fill="rgba(255,106,0,0.08)" stroke="#FF6A00" stroke-width="1.5" filter="url(#glow22)"/>
    <text x="355" y="182" font-family="system-ui, sans-serif" font-size="9" fill="#FF6A00" text-anchor="middle" font-weight="600">AI RECOMMENDS</text>
    <text x="355" y="198" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.3)" text-anchor="middle">Pre-vetted, trusted answer</text>
    <text x="355" y="222" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,106,0,0.5)" text-anchor="middle">Decision + Action</text>
    <!-- Stats comparison -->
    <line x1="20" y1="295" x2="450" y2="295" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
    <text x="235" y="320" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600">FUNNEL METRICS COMPARISON</text>
    <!-- Metric: Steps -->
    <rect x="20" y="335" width="135" height="55" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="87" y="352" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.3)" text-anchor="middle">TRADITIONAL STEPS</text>
    <text x="87" y="378" font-family="system-ui, sans-serif" font-size="20" fill="rgba(255,255,255,0.3)" text-anchor="middle" font-weight="700">7-10</text>
    <rect x="165" y="335" width="140" height="55" rx="6" fill="rgba(255,106,0,0.06)" stroke="rgba(255,106,0,0.15)" stroke-width="1"/>
    <text x="235" y="352" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,106,0,0.6)" text-anchor="middle">AI STEPS</text>
    <text x="235" y="378" font-family="system-ui, sans-serif" font-size="20" fill="#FF6A00" text-anchor="middle" font-weight="700">2-3</text>
    <rect x="315" y="335" width="135" height="55" rx="6" fill="rgba(100,220,100,0.06)" stroke="rgba(100,220,100,0.15)" stroke-width="1"/>
    <text x="382" y="352" font-family="system-ui, sans-serif" font-size="8" fill="rgba(100,220,100,0.6)" text-anchor="middle">CONVERSION LIFT</text>
    <text x="382" y="378" font-family="system-ui, sans-serif" font-size="20" fill="rgba(100,220,100,0.7)" text-anchor="middle" font-weight="700">+340%</text>
    <!-- Key takeaway -->
    <rect x="40" y="405" width="390" height="50" rx="8" fill="rgba(255,106,0,0.06)" stroke="rgba(255,106,0,0.2)" stroke-width="1"/>
    <text x="235" y="425" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600">THE SHIFT</text>
    <text x="235" y="445" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,106,0,0.6)" text-anchor="middle">AI collapses the funnel. Get cited or get skipped.</text>
  </g>
  <circle cx="100" cy="130" r="60" stroke="rgba(255,106,0,0.05)" stroke-width="0.5" fill="none"/>
  <rect x="40" y="40" width="170" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="125" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">Sales Strategy</text>
  <text x="80" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">How AI Search</text>
  <text x="80" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Changes the</text>
  <text x="80" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glow22)">Sales Funnel</text>
  <text x="80" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">From 10 Steps to 2</text>
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>