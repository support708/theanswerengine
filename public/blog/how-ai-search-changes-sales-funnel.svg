<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d1b4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative funnel shape -->
  <polygon points="950,100 1120,100 1080,200 990,200" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <polygon points="990,210 1080,210 1060,300 1010,300" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <polygon points="1010,310 1060,310 1050,380 1020,380" fill="none" stroke="rgba(255,106,0,0.1)" stroke-width="1.5"/>
  <!-- Arrow pointing down through funnel -->
  <line x1="1035" y1="390" x2="1035" y2="450" stroke="rgba(255,106,0,0.15)" stroke-width="2"/>
  <polygon points="1025,445 1035,460 1045,445" fill="rgba(255,106,0,0.15)"/>
  <!-- Scatter dots representing data -->
  <circle cx="960" cy="140" r="4" fill="rgba(255,255,255,0.06)"/>
  <circle cx="1000" cy="155" r="3" fill="rgba(255,255,255,0.06)"/>
  <circle cx="1050" cy="130" r="5" fill="rgba(255,255,255,0.06)"/>
  <circle cx="1090" cy="160" r="3" fill="rgba(255,255,255,0.06)"/>
  <circle cx="1030" cy="250" r="4" fill="rgba(255,255,255,0.06)"/>
  <circle cx="1050" cy="270" r="3" fill="rgba(255,255,255,0.06)"/>
  <!-- Category badge -->
  <rect x="40" y="40" width="150" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="115" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">Market Analysis</text>
  <!-- Title -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">How AI Search Changes</text>
  <text x="80" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">the</text>
  <text x="80" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#FF6A00">Sales Funnel</text>
  <!-- Footer -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>