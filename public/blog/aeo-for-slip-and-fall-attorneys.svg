<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="AEO for Slip and Fall Attorneys — The Answer Engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131313"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F27D24"/>
      <stop offset="100%" stop-color="#cc5500"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F27D24" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#F27D24" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#F27D24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <pattern id="tile" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="none"/>
      <line x1="0" y1="0" x2="80" y2="0" stroke="#F27D24" stroke-opacity="0.06" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="80" stroke="#F27D24" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient glow -->
  <ellipse cx="950" cy="200" rx="500" ry="320" fill="url(#glow)"/>
  <ellipse cx="200" cy="500" rx="380" ry="240" fill="url(#glow)" opacity="0.6"/>

  <!-- Floor tile perspective grid (slip surface visual metaphor) -->
  <g transform="translate(0,440) skewX(-20)" opacity="0.5">
    <rect width="1200" height="190" fill="url(#tile)"/>
  </g>

  <!-- Hazard caution stripe -->
  <g opacity="0.22">
    <line x1="0" y1="540" x2="1200" y2="540" stroke="#F27D24" stroke-width="3"/>
    <line x1="0" y1="555" x2="1200" y2="555" stroke="#F27D24" stroke-width="1" stroke-dasharray="12 8"/>
  </g>

  <!-- Hazard diamond -->
  <g transform="translate(960,180)" opacity="0.85">
    <polygon points="0,-90 90,0 0,90 -90,0" fill="none" stroke="#F27D24" stroke-width="3"/>
    <polygon points="0,-70 70,0 0,70 -70,0" fill="#F27D24" fill-opacity="0.08"/>
    <text x="0" y="14" font-family="Space Grotesk, Inter, sans-serif" font-size="64" font-weight="900" fill="#F27D24" text-anchor="middle">!</text>
  </g>

  <!-- Subtle vertical scanlines -->
  <g opacity="0.10" stroke="#ffffff" stroke-width="1" fill="none">
    <line x1="400" y1="0" x2="500" y2="630"/>
    <line x1="430" y1="0" x2="530" y2="630"/>
    <line x1="460" y1="0" x2="560" y2="630"/>
  </g>

  <!-- Top label bar -->
  <g transform="translate(80,80)">
    <rect x="0" y="0" width="200" height="28" fill="#F27D24"/>
    <text x="100" y="20" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#0a0a0a" text-anchor="middle" letter-spacing="2">INDUSTRY VERTICAL</text>
  </g>

  <!-- Main title -->
  <g transform="translate(80,160)" font-family="Space Grotesk, Inter, sans-serif" font-weight="900" fill="#e5e2e1">
    <text x="0" y="0" font-size="74" letter-spacing="-3">AEO FOR</text>
    <text x="0" y="86" font-size="74" letter-spacing="-3">SLIP AND FALL</text>
    <text x="0" y="172" font-size="74" letter-spacing="-3" fill="url(#orange)">ATTORNEYS</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(80,400)" font-family="Inter, sans-serif" fill="#e5e2e1" fill-opacity="0.65">
    <text x="0" y="0" font-size="22" font-weight="400">How premises liability firms get cited by</text>
    <text x="0" y="32" font-size="22" font-weight="600" fill="#e5e2e1">ChatGPT · Perplexity · Google AI Overviews</text>
  </g>

  <!-- Bottom-left brand mark -->
  <g transform="translate(80,560)">
    <rect x="0" y="-22" width="6" height="28" fill="#F27D24"/>
    <text x="18" y="0" font-family="Space Grotesk, Inter, sans-serif" font-size="20" font-weight="900" fill="#e5e2e1" letter-spacing="-1">THE ANSWER ENGINE</text>
    <text x="18" y="22" font-family="Courier New, monospace" font-size="12" fill="#e5e2e1" fill-opacity="0.55" letter-spacing="2">theanswerengine.ai</text>
  </g>

  <!-- Bottom-right meta -->
  <g transform="translate(1120,560)" text-anchor="end">
    <text x="0" y="0" font-family="Courier New, monospace" font-size="12" fill="#F27D24" letter-spacing="2">AEO PLAYBOOK</text>
    <text x="0" y="22" font-family="Courier New, monospace" font-size="12" fill="#e5e2e1" fill-opacity="0.55" letter-spacing="2">premises liability vertical</text>
  </g>
</svg>
