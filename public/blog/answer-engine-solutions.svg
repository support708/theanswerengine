    <text x="235" y="28" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="600">AEO SOLUTION STACK</text>
    <!-- Solution 1: Schema - highlighted -->
    <rect x="20" y="42" width="430" height="95" rx="8" fill="rgba(255,106,0,0.08)" stroke="#FF6A00" stroke-width="1.5" filter="url(#glow12)" stroke-opacity="0.6"/>
    <rect x="30" y="52" width="40" height="40" rx="8" fill="rgba(255,106,0,0.2)"/>
    <text x="50" y="78" font-family="system-ui, sans-serif" font-size="20" fill="#FF6A00" text-anchor="middle">{}</text>
    <text x="85" y="68" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)" font-weight="700">Schema Implementation</text>
    <text x="85" y="85" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">LocalBusiness, FAQ, Review, Service, HowTo schemas</text>
    <text x="85" y="100" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">deployed across all key pages with validation</text>
    <rect x="85" y="110" width="100" height="18" rx="9" fill="rgba(255,106,0,0.25)"/>
    <text x="135" y="123" font-family="system-ui, sans-serif" font-size="8" fill="#FF6A00" text-anchor="middle" font-weight="700">FOUNDATION</text>
    <!-- Solution 2: Content -->
    <rect x="20" y="147" width="430" height="95" rx="8" fill="rgba(100,150,255,0.06)" stroke="rgba(100,150,255,0.3)" stroke-width="1.5"/>
    <rect x="30" y="157" width="40" height="40" rx="8" fill="rgba(100,150,255,0.15)"/>
    <text x="50" y="183" font-family="system-ui, sans-serif" font-size="18" fill="rgba(100,150,255,0.9)" text-anchor="middle">&#x270E;</text>
    <text x="85" y="173" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)" font-weight="700">Authority Content</text>
    <text x="85" y="190" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">Expert-level Q&amp;A pages, detailed service descriptions,</text>
    <text x="85" y="205" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">industry-specific knowledge that AI models cite</text>
    <rect x="85" y="215" width="100" height="18" rx="9" fill="rgba(100,150,255,0.2)"/>
    <text x="135" y="228" font-family="system-ui, sans-serif" font-size="8" fill="rgba(100,150,255,0.9)" text-anchor="middle" font-weight="700">VISIBILITY</text>
    <!-- Solution 3: Citations -->
    <rect x="20" y="252" width="430" height="95" rx="8" fill="rgba(100,220,100,0.06)" stroke="rgba(100,220,100,0.3)" stroke-width="1.5"/>
    <rect x="30" y="262" width="40" height="40" rx="8" fill="rgba(100,220,100,0.15)"/>
    <text x="50" y="288" font-family="system-ui, sans-serif" font-size="18" fill="rgba(100,220,100,0.9)" text-anchor="middle">&#x2606;</text>
    <text x="85" y="278" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)" font-weight="700">Citation Building</text>
    <text x="85" y="295" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">Directory optimization, NAP consistency, review</text>
    <text x="85" y="310" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">management, and cross-platform authority signals</text>
    <rect x="85" y="320" width="100" height="18" rx="9" fill="rgba(100,220,100,0.2)"/>
    <text x="135" y="333" font-family="system-ui, sans-serif" font-size="8" fill="rgba(100,220,100,0.9)" text-anchor="middle" font-weight="700">TRUST</text>
    <!-- Solution 4: Monitoring -->
    <rect x="20" y="357" width="430" height="95" rx="8" fill="rgba(200,150,255,0.06)" stroke="rgba(200,150,255,0.3)" stroke-width="1.5"/>
    <rect x="30" y="367" width="40" height="40" rx="8" fill="rgba(200,150,255,0.15)"/>
    <text x="50" y="393" font-family="system-ui, sans-serif" font-size="18" fill="rgba(200,150,255,0.9)" text-anchor="middle">&#x25CE;</text>
    <text x="85" y="383" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)" font-weight="700">AI Monitoring</text>
    <text x="85" y="400" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">Track citations across ChatGPT, Gemini, Perplexity.</text>
    <text x="85" y="415" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">Weekly reports, competitor tracking, alert system</text>
    <rect x="85" y="425" width="100" height="18" rx="9" fill="rgba(200,150,255,0.2)"/>
    <text x="135" y="438" font-family="system-ui, sans-serif" font-size="8" fill="rgba(200,150,255,0.9)" text-anchor="middle" font-weight="700">INTELLIGENCE</text>
  </g>
  <circle cx="100" cy="130" r="60" stroke="rgba(255,106,0,0.06)" stroke-width="0.5" fill="none"/>
  <rect x="40" y="40" width="180" height="32" rx="16" fill="rgba(255,106,0,0.15)" stroke="rgba(255,106,0,0.3)" stroke-width="1"/>
  <text x="130" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#FF6A00" text-anchor="middle">Service Overview</text>
  <text x="80" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white">Answer Engine</text>
  <text x="80" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FF6A00" filter="url(#glow12)">Solutions</text>
  <text x="80" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)">The Complete AEO Toolkit</text>
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">THE ANSWER ENGINE</text>
  <circle cx="1120" cy="590" r="30" fill="rgba(255,255,255,0.1)"/>
  <text x="1120" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle">AE</text>
</svg>